# BROUILLON À VÉRIFIER : rédigé par IA le 26/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/013-chomage.md
numero: 13
date: 2026-10-12
theme: travail-retraites
question: "Faut-il réduire la durée d'indemnisation du chômage ?"
titreCourt: "La durée du chômage"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/013-chomage-85Lu3ScNQtbhIzblo5I4hAMblxRr2Q.mp4", duree: "2 min" }
contexte:
  - "Depuis février 2023, un chômeur de moins de 53 ans (55 ans depuis la convention de novembre 2024) est indemnisé 18 mois au maximum, contre 24 mois auparavant, et cette durée tombe à 15 mois après une rupture conventionnelle depuis le 1er septembre 2026."
  - "Le chômage atteint 8,3 % de la population active au deuxième trimestre 2026, soit 2,7 millions de personnes, son plus haut niveau depuis 2020."
  - "L'assurance chômage est déficitaire (2,3 milliards d'euros prévus en 2026) et sa dette atteindra 61,5 milliards d'euros fin 2026."
chiffres:
  - valeur: "18"
    unite: mois
    legende: "d'indemnisation maximale avant 55 ans (22,5 mois de 55 à 56 ans, 27 mois à partir de 57 ans)"
    source: { organisme: Unédic, document: "Principales règles de l'indemnisation", annee: 2026 }
  - valeur: "15"
    unite: mois
    legende: "d'indemnisation maximale après une rupture conventionnelle avant 55 ans, depuis le 1er septembre 2026"
    source: { organisme: Unédic, annee: 2026 }
  - valeur: "8,3 %"
    legende: "de chômage au deuxième trimestre 2026, soit 2,7 millions de personnes"
    source: { organisme: Insee, document: "Informations rapides, chômage", annee: 2026 }
  - valeur: "61,5"
    unite: "milliards d'euros"
    legende: "de dette de l'assurance chômage prévue fin 2026"
    source: { organisme: Unédic, document: "Prévisions financières de juin 2026", annee: 2026 }
options:
  - id: A
    libelle: "Annuler les réformes et revenir à des droits plus longs"
    implique: "On abroge les réformes de l'assurance chômage des dernières années, dont la baisse de 25 % de la durée décidée en 2023 (jusqu'à 24 mois avant 53 ans à l'époque)."
    defenseurs: "Perdre son emploi n'est pas un choix : des droits plus longs laissent le temps de retrouver un travail qui correspond à sa qualification, au lieu de pousser vers un poste précaire ou vers le RSA."
    critiques: "Le coût s'ajoute à une dette de 61,5 milliards d'euros, et des travaux d'économie du travail montrent qu'une durée plus longue peut retarder un peu la reprise d'emploi."
    axes: { economie: -2 }
  - id: B
    libelle: "Garder 18 mois, sans baisse pour les départs négociés"
    implique: "18 mois avant 55 ans, 22,5 mois de 55 à 56 ans, 27 mois ensuite, pour tous : on revient sur la baisse de septembre 2026 après une rupture conventionnelle, avec un complément de fin de droits si la conjoncture se dégrade."
    defenseurs: "Un salarié qui signe une rupture conventionnelle perd son emploi comme un autre : il doit avoir les mêmes droits, et la durée peut s'allonger si la conjoncture se dégrade."
    critiques: "Pour ses détracteurs, beaucoup de ruptures conventionnelles remplacent des démissions, et revenir sur la baisse coûterait jusqu'à 1 milliard d'euros par an à un régime endetté de 61,5 milliards."
    axes: { economie: -1 }
  - id: C
    libelle: "Garder les règles actuelles, dont la baisse pour les départs négociés"
    implique: "Depuis le 1er septembre 2026 : 15 mois avant 55 ans et 20,5 mois ensuite après une rupture conventionnelle ; le gouvernement attend jusqu'à 1 milliard d'euros d'économies par an et jusqu'à 15 000 retours à l'emploi."
    defenseurs: "Beaucoup de ruptures conventionnelles remplacent des démissions, qui n'ouvrent aucun droit : réduire leur indemnisation limite l'effet d'aubaine, dans un accord signé par six organisations patronales et syndicales."
    critiques: "Les salariés de 55 ans et plus risquent d'arriver en fin de droits sans emploi, et la CGT et la CFE-CGC n'ont pas signé l'accord."
    axes: { economie: 0 }
  - id: D
    libelle: "La réduire pour tous : 12 mois avant 50 ans"
    implique: "Un plafond de 12 mois pour les moins de 50 ans, contre 18 aujourd'hui ; aucune économie chiffrée à ce jour."
    defenseurs: "Plus la fin des droits approche, plus la recherche d'emploi s'intensifie : douze mois, comme l'Allemagne selon ses partisans, incitent à reprendre plus vite et allègent le régime."
    critiques: "Ceux qui arrivent en fin de droits sans emploi pourraient basculer vers le RSA : la charge serait transférée aux minima sociaux, et les parcours fragiles sont les plus touchés."
    axes: { economie: 2 }
pourAllerPlusLoin:
