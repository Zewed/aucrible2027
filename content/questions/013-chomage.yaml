    url: https://www.insee.fr/fr/statistiques/9032359
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour réduire la durée"
    argument: "Plus la fin des droits approche, plus la recherche d'emploi s'intensifie : douze mois, comme l'Allemagne selon ses partisans, incitent à reprendre plus vite et allègent le régime."
  - titre: "Pour ne pas la réduire"
    argument: "Perdre son emploi n'est pas un choix : des droits plus longs laissent le temps de retrouver un travail qui correspond à sa qualification, au lieu de pousser vers un poste précaire ou vers le RSA."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Réduire"
    precision: "la durée"
  - choix: "Ne pas"
    precision: "la réduire"
