# BROUILLON À VÉRIFIER : rédigé par IA le 26/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/012-deficit.md
numero: 12
date: 2026-10-11
theme: economie-impots
question: "Comment réduire le déficit public : baisser les dépenses, augmenter les impôts, ou ni l'un ni l'autre ?"
titreCourt: "Le déficit public"
contexte:
  - "En 2025, le déficit public a atteint 5,1 % du PIB, au-dessus de la limite européenne de 3 %, et la dette publique 115,7 % du PIB."
  - "Les dépenses publiques représentent 57,3 % du PIB et les prélèvements obligatoires 43,6 %."
  - "Selon la Cour des comptes, la baisse du déficit en 2025 est due exclusivement à des hausses d'impôts et de cotisations, et il faudrait encore le réduire de 3 points de PIB pour stabiliser la dette."
chiffres:
  - valeur: "5,1 %"
    legende: "du PIB : le déficit public en 2025, soit 152,5 milliards d'euros"
    source: { organisme: Insee, document: "Comptes des administrations publiques", annee: 2025 }
  - valeur: "115,7 %"
    legende: "du PIB : la dette publique fin 2025"
    source: { organisme: Insee, document: "Comptes des administrations publiques", annee: 2025 }
  - valeur: "57,3 %"
    legende: "du PIB : les dépenses publiques en 2025, pour 43,6 % de prélèvements obligatoires"
    source: { organisme: Insee, document: "Comptes des administrations publiques", annee: 2025 }
  - valeur: "89,6"
    unite: "milliards d'euros"
    legende: "d'effort encore nécessaire, soit 3 points de PIB, pour stabiliser la dette"
    source: { organisme: "Cour des comptes", document: "La situation et les perspectives des finances publiques", annee: 2026 }
options:
  - id: A
    libelle: "Baisser fortement les dépenses et alléger les impôts"
    implique: "Des plans d'économies de 140 à 200 milliards d'euros d'ici 2032 (État, agences, fonction publique, protection sociale), dont une partie est rendue aux ménages et aux entreprises en baisses d'impôts."
    defenseurs: "Les prélèvements sont déjà à 43,6 % du PIB : c'est la dépense, à 57,3 %, qu'il faut réduire, et chaque euro d'intérêts de la dette (77,4 milliards d'euros prévus en 2026) ne finance plus un service."
    critiques: "Un effort de cette ampleur touche les services publics et la protection sociale, et pèse sur une croissance déjà faible."
    axes: { economie: 2 }
  - id: B
    libelle: "Mêler économies ciblées et nouvelles recettes sur les plus aisés"
    implique: "Revoir l'utilité des plus de 200 milliards d'euros d'aides aux entreprises, réduire certaines dépenses, et taxer davantage les plus hauts patrimoines, les héritages ou les multinationales."
    defenseurs: "L'effort doit reposer sur ceux qui peuvent le plus : on n'équilibre pas les comptes en rognant les services publics, mais en triant les aides et en faisant contribuer les plus aisés."
    critiques: "Le rendement des impôts sur les plus hauts patrimoines est incertain et ils peuvent inciter à l'exil fiscal ; trier plus de 200 milliards d'euros d'aides ne se fait pas d'un trait."
    axes: { economie: -1 }
  - id: C
    libelle: "Augmenter les impôts des plus riches et des grandes entreprises, sans baisser les dépenses"
    implique: "Un peu plus de 100 milliards d'euros de recettes en plus dès 2027 selon le plan le plus chiffré (impôt sur la fortune rétabli, flat tax supprimée, niches rabotées), dont une partie finance des dépenses nouvelles ; le reste réduit le déficit."
    defenseurs: "Les baisses d'impôts des dernières années ont coûté plus de 60 milliards d'euros de recettes et ont surtout profité aux plus riches et aux grandes entreprises : les corriger réduit le déficit sans toucher aux services publics."
    critiques: "Une hausse massive de la fiscalité sur le capital et les entreprises risque de freiner l'investissement, alors que les prélèvements sont déjà à 43,6 % du PIB."
    axes: { economie: -2 }
  - id: D
    libelle: "Ni baisser les dépenses ni augmenter les impôts : miser sur la croissance"
    implique: "Relancer l'activité et l'emploi pour que les recettes progressent d'elles-mêmes, sans plan d'économies ni hausse de taux."
    defenseurs: "Une économie qui produit plus de richesses fait rentrer plus de recettes sans coupe ni hausse de taux, et évite l'austérité."
    critiques: "La croissance prévue est faible (entre 0,5 % et 0,9 % en 2026) et la Cour des comptes juge qu'il faut encore 3 points de PIB d'effort : elle ne suffirait pas seule."
    # Ne se range pas entre « baisser les dépenses » et « augmenter les impôts » : c'est un troisième levier.
    horsEchelle: true
pourAllerPlusLoin:
