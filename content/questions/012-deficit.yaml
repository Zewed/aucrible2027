# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour baisser d'abord les dépenses"
    argument: "Les prélèvements sont déjà à 43,6 % du PIB : c'est la dépense, à 57,3 %, qu'il faut réduire, et chaque euro d'intérêts de la dette (77,4 milliards d'euros prévus en 2026) ne finance plus un service."
  - titre: "Pour augmenter d'abord les impôts"
    argument: "Les baisses d'impôts des dernières années ont coûté plus de 60 milliards d'euros de recettes et ont surtout profité aux plus riches et aux grandes entreprises : les corriger réduit le déficit sans toucher aux services publics."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Dépenses"
    precision: "à baisser d'abord"
  - choix: "Impôts"
    precision: "à augmenter d'abord"
positions:
  # https://www.moneyvox.fr/impot/actualites/110673/140-milliards-economies-ce-quil-faut-retenir-de-intervention-de-marine-le-pen
