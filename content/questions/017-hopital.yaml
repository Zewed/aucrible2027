# BROUILLON À VÉRIFIER : rédigé par IA le 26/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/017-hopital.md
# Sujet choisi à la place de « obliger les jeunes médecins à exercer en zone sous-dotée », trop proche de la fiche n° 26 (installation des médecins).
numero: 17
date: 2026-10-16
theme: sante
question: "Faut-il en finir avec la tarification à l'activité à l'hôpital public ?"
titreCourt: "Le financement de l'hôpital"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/017-hopital-constat-EaoB8TuOL99aA0ThqbZgvr50InXNar.mp4", duree: "3 min 04", ecrans: [0, 8.04, 19.77, 27.8, 41.7, 56.34, 68.77, 82.67, 96.6, 109.77, 123.67, 137.57, 150.74, 160.97, 176.34], images: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/ecrans/017-hopital-constat-EaoB8TuOL99aA0ThqbZgvr50InXNar/" }
contexte:
  - "Depuis 2004, la plupart des soins de médecine, de chirurgie et d'obstétrique sont payés à l'hôpital à l'activité (T2A), selon le nombre et la nature des séjours, alors que les hôpitaux publics étaient financés auparavant par une dotation globale."
  - "Depuis 2022, les urgences et la psychiatrie reçoivent des dotations selon la population, et une refonte de 2025 mêle T2A et dotations, avec pour cible la moitié des ressources hors T2A."
  - "Les hôpitaux publics ont affiché un déficit de 2,9 milliards d'euros en 2024, le plus élevé depuis 2005, et d'environ 2,1 % de leurs recettes en 2025 selon une première estimation."
chiffres:
  - valeur: "124,1"
    unite: "milliards d'euros"
    legende: "de soins hospitaliers en 2025, financés à 94 % par des fonds publics"
    source: { organisme: DREES, document: "Comptes de la santé, édition 2026", annee: 2025 }
  - valeur: "2,9"
    unite: "milliards d'euros"
    legende: "de déficit des hôpitaux publics en 2024, soit 2,7 % de leurs recettes"
    source: { organisme: DREES, document: "Les établissements de santé en 2024", annee: 2024 }
  - valeur: "2,1 %"
    legende: "des recettes : le déficit estimé des hôpitaux publics en 2025"
    source: { organisme: DREES, document: "Études et résultats, juillet 2026", annee: 2025 }
  - valeur: "50 %"
    legende: "des ressources des établissements à financer hors tarification à l'activité, cible de la réforme"
    source: { organisme: DREES, document: "Les établissements de santé en 2024, annexe 2", annee: 2026 }
options:
  - id: A
    libelle: "Garder la T2A et la simplifier"
    implique: "On conserve le paiement à l'activité pour la médecine, la chirurgie et l'obstétrique, en allégeant ses tâches administratives."
    defenseurs: "Payer à l'activité rémunère le travail réellement produit et rend les coûts visibles, à condition d'en simplifier les rouages."
    critiques: "Elle est jugée mal adaptée aux établissements et aux activités indispensables mais peu rentables , comme les urgences, qui reçoivent depuis 2022 une dotation selon la population."
    axes: { economie: 1 }
    detail:
      chiffrage:
        texte: "La T2A simplifiée garderait le paiement au séjour, qui faisait 54 % de ce que l'Assurance maladie versait aux hôpitaux publics en 2019, dernière année de pleine application."
        source: { organisme: "Cour des comptes", annee: 2023 }
      defenseurs:
        - texte: "Le paiement au séjour n'a pas fait exploser l'activité : 5,6 % de séjours en plus seulement de 2014 à 2019."
          source: { organisme: "Cour des comptes", annee: 2023 }
        - texte: "La hausse des réadmissions après une opération ne vient pas du paiement au séjour, mais du vieillissement des patients et des changements de prise en charge."
        - texte: "Payer chaque séjour rémunère le travail réellement fait et montre ce que coûte chaque soin."
      critiques:
        - texte: "Les tarifs s'écartent des coûts réels : plus de 1,5 milliard d'euros d'écarts dans le public en 2019, certains soins étant trop payés, d'autres pas assez."
          source: { organisme: "Cour des comptes", annee: 2023 }
        - texte: "Les urgences, la psychiatrie et les hôpitaux isolés ne vivent pas de leur seule activité : il a fallu leur créer des dotations."
        - texte: "Les tarifs servaient à tenir le budget national : ceux du public ont baissé chaque année de 2009 à 2018, creusant le déficit de certains hôpitaux."
  - id: B
    libelle: "Poursuivre la réforme en cours : un mélange d'activité et de dotations"
    implique: "T2A pour les actes courants et dotations pour les missions de service public et les besoins du territoire, avec pour cible la moitié des ressources hors T2A."
    defenseurs: "Garder une incitation à l'activité tout en finançant ce qui ne se paie pas à l'acte (urgences, territoires isolés, missions de santé publique) : la réforme de 2025 ajoute deux dotations aux tarifs."
    critiques: "Pour ses détracteurs, elle ne va pas assez loin (les tarifs restent la principale source de revenus) ou rend le système plus complexe, alors que le déficit persiste (2,9 milliards d'euros en 2024)."
    axes: { economie: 0 }
    detail:
      chiffrage:
        texte: "La réforme engagée vise à financer la moitié des ressources des établissements autrement qu'à l'activité."
        source: { organisme: "Drees", annee: 2026 }
      defenseurs:
        - texte: "La réforme en cours garde une incitation à soigner, tout en finançant à part ce qui ne se paie pas au séjour : urgences, psychiatrie, santé publique."
        - texte: "Les hôpitaux peuvent avoir de la visibilité sans budget global : de 2020 à 2022, un accord garantissait au moins 2,4 % de hausse par an de leur enveloppe nationale."
          source: { organisme: "Cour des comptes", annee: 2023 }
        - texte: "Les hôpitaux de proximité, souvent ruraux, ont déjà une garantie de financement qui tient compte des besoins du territoire."
      critiques:
        - texte: "Le déficit reste élevé malgré les dotations ajoutées : environ 2,1 % des recettes des hôpitaux publics en 2025."
          source: { organisme: "Drees", annee: 2026 }
        - texte: "La réforme en cours ne va pas assez loin : le paiement au séjour reste la principale source de revenus des hôpitaux."
        - texte: "La réforme en cours empile les règles, entre tarifs, dotations de santé publique et dotations de missions, et rend le système encore plus complexe."
  - id: C
    libelle: "En finir avec la tarification à l'activité : une dotation globale selon les besoins du territoire"
    implique: "L'hôpital public reçoit un budget annuel global fixé selon la population et les besoins de son territoire, comme avant 2004, sans paiement à chaque séjour (ou seulement pour certains actes techniques programmés)."
    defenseurs: "Un budget global et pluriannuel, fixé selon les besoins du territoire, permet de planifier, de maintenir des services peu rentables et met fin à la course à l'acte."
    critiques: "Sans lien direct avec l'activité, un budget global peut figer les inégalités entre hôpitaux et réduire l'incitation à soigner plus de patients."
    axes: { economie: -2 }
    detail:
      chiffrage:
        texte: "Une dotation globale changerait la façon de verser ce que l'Assurance maladie donne aux hôpitaux publics : 78,1 milliards d'euros en 2024, 76,8 % de leurs recettes."
        source: { organisme: "Drees", annee: 2026 }
      defenseurs:
        - texte: "Payer à l'acte pousse à multiplier certains soins : les opérations de la cataracte ont augmenté de 23 % de 2002 à 2009, quand les prothèses de hanche stagnaient."
          source: { organisme: "Irdes", annee: 2013 }
        - texte: "Quand les recettes ont de nouveau suivi l'activité, le déficit s'est creusé : la garantie de recettes est passée de 1,8 milliard d'euros en 2022 à 637 millions en 2024."
          source: { organisme: "Drees", annee: 2026 }
        - texte: "Avec des tarifs fixés en mars, un hôpital qui doit arrêter son budget dès la fin de l'année d'avant ne peut rien prévoir."
      critiques:
        - texte: "Le budget global d'avant 2004 figeait les inégalités : à la fin des années 1990, le prix d'un même séjour variait de 1 à 3,6 d'un hôpital à l'autre."
          source: { organisme: "Cour des comptes", annee: 2023 }
        - texte: "Le déficit vient surtout des salaires, pas du mode de paiement : les dépenses de personnel ont augmenté de 4,1 % en 2024, plus vite que les recettes."
          source: { organisme: "Drees", annee: 2026 }
        - texte: "Sans lien avec le nombre de patients soignés, un hôpital n'a plus intérêt à en accueillir davantage."
