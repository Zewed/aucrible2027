  melenchon: { option: D, source: "Vote de son groupe : suppression de l'article 37 du budget de la Sécurité sociale 2027 en commission, 16/10/2026 (rapport n° 3345, t. III)", statut: deduite, lien: "https://www.assemblee-nationale.fr/dyn/docs/RAPPANR5L17B3345-tIII.raw" }
