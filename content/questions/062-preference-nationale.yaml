    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F2787
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour durcir les règles"
    argument: "Il y a un équilibre entre les devoirs et les droits : les aides viennent après une installation durable."
  - titre: "Pour ne pas les durcir"
    argument: "La solidarité répond à des situations, pas à des nationalités."
# Les deux choix de l'autocollant « Et toi ? » de la story : A, B et C d'un côté, D et E de l'autre.
story:
  - choix: "Durcir les règles"
    precision: "les réserver aux Français, ou faire attendre"
  - choix: "Ne pas les durcir"
    precision: "règles actuelles, ou mêmes droits"
# Positions sourcées (étude, § 4.2) : 4 officielles, 6 déduites, 3 estimées. Inconnues : aucune.
# Le Pen : l'étude ne donne de son discours du 13/09/2026 que des fragments (« réserver » les APL, « donner la priorité
# d'accès au logement social aux Français ») ; pas de citation tant que la phrase entière n'a pas été lue.
