  philippe: { option: C, source: "Programme « Pour une France plus sûre »", statut: deduite, citation: "Aligner les aides sociales versées aux étrangers sur la moyenne européenne, pour qu'ils choisissent la France pour y travailler et s'y intégrer, pas pour ses aides", lien: "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-sure" }
