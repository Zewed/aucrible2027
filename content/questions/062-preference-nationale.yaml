  # Discours d'Hénin-Beaumont, 13/09/2026 (AFP, Sud Radio) ; LCP, 14/09/2026 ; PPL constitutionnelle n° 2120, 25/01/2024 ; « 22 mesures pour 2022 », mesure 1 : https://www.sudradio.fr/societe/le-pen-veut-mettre-la-priorite-nationale-au-centre-dun-grand-chantier-sur-le-logement
