  attal: { option: C, source: "Article 37 du budget de la Sécurité sociale 2027 (un an d'attente), proposé par le gouvernement de S. Lecornu, 01/10/2026", statut: estimee, lien: "https://www.assemblee-nationale.fr/dyn/17/textes/l17b3211_projet-loi.pdf" }
