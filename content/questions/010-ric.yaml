# Étude des enjeux : docs/etudes/010-ric.md (tout ce qui suit y est sourcé).
numero: 10
date: 2026-10-09
theme: institutions-democratie
question: Faut-il créer un référendum d'initiative citoyenne (RIC) ?
titreCourt: "Le référendum citoyen"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/010-ric-Wp1loHjBLUmwJH6fHbQcdqR08vSOlq.mp4", duree: "1 min 50" }
contexte:
  - Aujourd'hui, seul le référendum d'initiative partagée (RIP) permet aux citoyens de s'en saisir, avec le soutien d'un cinquième des parlementaires et de 10 % des électeurs.
  - "Sur sept demandes déposées depuis 2019, une seule a été validée, sur Aéroports de Paris : 1,09 million de soutiens recueillis pour 4,72 millions requis."
  - Le dernier référendum national date de 2005.
chiffres:
  - valeur: "4,7"
    unite: millions
    legende: de signatures d'électeurs, en plus de 185 parlementaires, pour demander un référendum d'initiative partagée
    source: { organisme: Conseil constitutionnel, document: déclaration sur la proposition de loi Aéroports de Paris, annee: 2020 }
  - valeur: "1,09"
    unite: million
    legende: de soutiens recueillis pour la seule demande validée, sur Aéroports de Paris (2019-2020)
    source: { organisme: Conseil constitutionnel, document: déclaration sur la proposition de loi Aéroports de Paris, annee: 2020 }
  - valeur: 26 %
    legende: des Français déclarent avoir confiance dans la politique
    source: { organisme: CEVIPOF, document: enquête sur la confiance politique, annee: 2025 }
options:
  - id: A
    libelle: Non, garder les règles actuelles
    implique: Le référendum reste décidé par le Président ou le Parlement ; le RIP actuel est maintenu, avec les mêmes seuils.
    defenseurs: "Le RIP et ses contrôles suffisent : un RIC irait trop loin dans la remise en cause de la démocratie représentative."
    critiques: "Selon ses critiques, le RIP ne fonctionne pas : sur sept demandes, une seule a été validée, et elle a recueilli moins du quart des signatures requises."
  - id: B
    libelle: Alléger le référendum d'initiative partagée
    implique: Moins de signatures (2,5 millions au lieu de 5 millions dans l'un des projets) et des sujets élargis ; les parlementaires gardent un rôle.
    defenseurs: Il faut alléger les contraintes du RIP et élargir ses sujets pour qu'il soit enfin praticable.
    critiques: "Le RIP reste « partagé » : sans l'accord d'un cinquième des parlementaires, les citoyens ne peuvent pas déclencher un référendum."
  - id: C
    libelle: Créer un RIC
    implique: À partir d'un seuil de signatures (de 500 000 à 1 million selon les projets), des citoyens peuvent faire voter une loi ou en abroger une ; certains projets y ajoutent la révision de la Constitution ou la révocation d'élus.
    defenseurs: "« On ne veut pas participer, on veut décider » : le RIC complète le Parlement et rend la parole au peuple."
    critiques: Un RIC pourrait servir à revenir systématiquement sur les décisions de la démocratie représentative.
