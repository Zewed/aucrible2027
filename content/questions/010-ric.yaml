# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour créer un RIC"
    argument: "« On ne veut pas participer, on veut décider » : le RIC complète le Parlement."
  - titre: "Pour ne pas en créer"
    argument: "Un RIC irait trop loin dans la remise en cause de la démocratie représentative."
