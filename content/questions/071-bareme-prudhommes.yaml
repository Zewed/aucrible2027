# (rien dans ses programmes 2022 et 2027), puis Dupont-Aignan, décision de l'auteur du 12/11/2026 (un seul vote de 2017
# sur l'ensemble des ordonnances). Plus fragile : Glucksmann (texte d'un autre parti).
