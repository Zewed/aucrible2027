# BROUILLON À VÉRIFIER : rédigé par IA le 11/11/2026 à partir de sources publiques.
# Chaque chiffre et chaque position doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/071-bareme-prudhommes.md (tout ce qui suit y est sourcé ; positions vérifiées le
# 11/11/2026, § 4.4).
# Le plafond ne vise que l'indemnité que le juge accorde pour un licenciement sans cause réelle et sérieuse, pas
# l'indemnité légale de licenciement ni les licenciements nuls (harcèlement, discrimination…).
# Mots disputés, attribués ou évités (étude, « Règles de lecture ») : « barème Macron » (presse, syndicats, députés
# qui veulent le supprimer ; la fiche dit « le barème »), « licenciement abusif » (mot courant ; la fiche dit
# « licenciement injustifié »), « prévisibilité » et « sécurisation » (mots du gouvernement, gardés seulement dans la
# voix de ses défenseurs), « permis de licencier » et « prix » du licenciement (mots des opposants, évités).
# « Plafond » : mot de la question et du Conseil constitutionnel, gardé.
numero: 71
date: 2026-08-19
theme: travail-retraites
question: "Faut-il garder le plafond des indemnités accordées par les prud'hommes après un licenciement injustifié ?"
titreCourt: "Le barème des prud'hommes"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/071-bareme-prudhommes-constat-onyfHUezOYq0UFayOWa7HD1vOPKYf1.mp4", duree: "3 min 58", ecrans: [0, 12.5, 23.14, 35, 48.14, 60, 72.5, 86.87, 100, 111.27, 124.37, 136.87, 150.64, 163.14, 178.14, 192.5, 205, 218.14, 230] }
contexte:
  - "Depuis 2017, quand le juge estime un licenciement injustifié, l'indemnité qu'il accorde au salarié est comprise entre un minimum et un maximum fixés selon son ancienneté, de 1 à 20 mois de salaire brut au plus."
  - "Ce plafond ne s'applique pas aux licenciements interdits par la loi, comme ceux liés à un harcèlement ou à une discrimination, qui donnent droit à au moins six mois de salaire."
  - "Validé par le Conseil constitutionnel en 2018 et par la Cour de cassation en 2022, mais jugé trop bas par un comité du Conseil de l'Europe, ce barème divise : certains veulent le supprimer ou le relever, d'autres le garder ou raccourcir le délai pour contester un licenciement."
chiffres:
  - valeur: "20"
    unite: mois
    legende: "de salaire brut au plus pour un licenciement injustifié, après 29 ans d'ancienneté"
    source: { organisme: Code du travail, document: article L. 1235-3, annee: 2018 }
  - valeur: "6,6"
    unite: mois
    # Étude § 2b, [23] : 192 arrêts avant le barème, 94 après ; les auteurs signalent un échantillon faible.
    legende: "de salaire accordés en moyenne en appel avec le barème, contre 7,9 avant, sur un petit échantillon"
    source: { organisme: IRES, document: "R. Dalmasso et C. Signoretto", annee: 2023 }
  - valeur: "131 536"
    unite: affaires
    legende: "nouvelles devant les prud'hommes en 2025, 11 % de plus qu'en 2024"
    source: { organisme: Ministère de la Justice, document: Références statistiques Justice, annee: 2026 }
options:
  - id: A
    libelle: "Supprimer le plafond, comme avant 2017"
    implique: "On revient à la règle d'avant 2017 : au moins six mois de salaire pour un salarié de deux ans d'ancienneté ou plus dans une entreprise de 11 salariés ou plus, sans maximum. Le juge fixe le reste selon le préjudice. Certains proposent aussi d'allonger le délai pour contester."
    defenseurs: "Un licenciement injustifié doit être réparé en entier : c'est au juge de mesurer le préjudice, pas à un tableau fixé d'avance."
    critiques: "Sans maximum, un employeur, surtout une petite entreprise, ne sait pas ce que lui coûterait une erreur, et deux salariés dans la même situation peuvent obtenir des sommes très différentes."
    detail:
      chiffrage:
        texte: "Aucun coût n'a été chiffré. Avant le barème, les salariés qui gagnaient en appel obtenaient en moyenne 7,9 mois de salaire, et jusqu'à 37,8 mois ; appliqué à ces mêmes arrêts, le barème aurait réduit 55 % des indemnités."
        source: { organisme: IRES, document: "R. Dalmasso et C. Signoretto", annee: 2023 }
      defenseurs:
        - texte: "Le barème ne tient compte que de l'ancienneté, pas de l'âge ni de la qualification : il peut donner des indemnités très faibles aux salariés peu anciens."
        - texte: "Si l'employeur connaît d'avance le coût maximal d'un licenciement injustifié, la sanction ne dissuade plus."
        - texte: "La France a ratifié la Charte sociale européenne et doit la respecter : ses plafonds sont trop bas pour réparer le préjudice et dissuader l'employeur."
      critiques:
        - texte: "Un employeur, surtout dans une petite entreprise, doit savoir ce que lui coûterait une erreur : une condamnation lourde peut ruiner une PME."
        - texte: "Deux salariés dans la même situation doivent être traités de la même façon, quel que soit le tribunal qui les juge."
        - texte: "Les licenciements les plus graves, pour harcèlement ou discrimination, échappent déjà au plafond."
  - id: B
    libelle: "Relever le barème et laisser le juge le dépasser"
    implique: "Des plafonds plus hauts, surtout pour les salariés peu anciens, et le droit pour le juge de les écarter quand ils ne réparent pas le préjudice. Une proposition rejetée en 2017 fixait par exemple des maximums de 6 à 30 mois selon l'ancienneté."
    defenseurs: "Un repère reste utile, mais des plafonds trop bas ne réparent pas tout le préjudice et ne dissuadent pas l'employeur de licencier sans motif sérieux."
    critiques: "Les uns jugent qu'un plafond que le juge peut dépasser n'apporte plus aucune garantie à l'employeur, les autres qu'il laisse encore des salariés sans réparation complète."
    detail:
      chiffrage:
        texte: "Aucun coût n'a été chiffré. Avant mai 2022, quand certaines cours d'appel écartaient le barème, 10 % des indemnités accordées en appel dépassaient le plafond."
        source: { organisme: IRES, document: "R. Dalmasso et C. Signoretto", annee: 2023 }
      defenseurs:
        - texte: "Les plafonds actuels sont trop bas pour réparer tout le préjudice et pour dissuader un employeur de licencier sans motif sérieux."
        - texte: "Le juge doit pouvoir tenir compte de chaque cas : l'âge, une carrière hachée ou la difficulté à retrouver un emploi, que l'ancienneté seule ne dit pas."
        - texte: "Garder un barème, mais plus haut, conserve un repère pour les deux parties sans laisser les salariés peu anciens avec des indemnités trop faibles."
      critiques:
        - texte: "Un plafond que le juge peut dépasser n'en est plus un : l'employeur ne sait plus à quoi s'attendre."
        - texte: "Le barème actuel respecte la Constitution et les engagements internationaux de la France : rien n'oblige à le changer."
        - texte: "Relever les plafonds garde le principe d'un maximum fixé d'avance, qui empêche de réparer tout le préjudice dans les cas les plus lourds."
  - id: C
    libelle: "Garder le barème actuel, de 1 à 20 mois"
    implique: "L'indemnité reste comprise entre un minimum et un maximum selon l'ancienneté, de 1 à 20 mois de salaire au plus. Les licenciements interdits par la loi restent sans plafond, avec au moins six mois, et le salarié garde 12 mois pour contester."
    defenseurs: "Chacun sait d'avance à quoi s'attendre, deux salariés dans la même situation obtiennent des sommes proches, et les cas les plus graves restent sans plafond."
    critiques: "Le plafond ne répare pas tout le préjudice, surtout pour les salariés peu anciens, et un employeur qui connaît d'avance le coût maximal est moins dissuadé de licencier sans motif sérieux."
    detail:
      chiffrage:
        texte: "Rien ne change. Après le barème, 87 % des indemnités accordées en appel sont dans la fourchette, dont 21 % exactement au plafond."
        source: { organisme: IRES, document: "R. Dalmasso et C. Signoretto", annee: 2023 }
      defenseurs:
        # § 2a et 2c, [12] [20].
        - texte: "Le barème apporte de la prévisibilité aux deux parties et de l'équité entre salariés, sans avoir tari les recours : 131 536 affaires nouvelles en 2025, 11 % de plus en un an."
          source: { organisme: Ministère de la Justice, document: Références statistiques Justice, annee: 2026 }
        - texte: "Les plafonds ont été fixés d'après les montants que les juges accordaient en pratique, et le juge garde une marge à l'intérieur de la fourchette."
        # § 2d (argument patronal, non chiffré).
        - texte: "Un employeur qui sait ce que lui coûterait au plus un licenciement contesté hésite moins à embaucher en CDI."
      critiques:
        - texte: "Les salariés de 2 à 5 ans d'ancienneté perdent le plus : leur indemnité moyenne en appel est passée de 6,5 à 3,5 mois de salaire."
          source: { organisme: IRES, document: "R. Dalmasso et C. Signoretto", annee: 2023 }
        - texte: "Une carrière hachée, plus fréquente chez les femmes ou après un changement d'employeur vers 50 ans, donne peu d'ancienneté, donc un plafond bas."
        - texte: "Un salarié peu ancien a peu d'intérêt à engager un procès pour un ou deux mois de salaire, alors qu'une affaire dure en moyenne 13,5 mois."
          source: { organisme: Ministère de la Justice, document: Références statistiques Justice, annee: 2026 }
  - id: D
    libelle: "Garder le plafond et raccourcir le délai pour contester"
    implique: "Le barème reste le même, mais le salarié a moins de 12 mois pour saisir les prud'hommes : 6 ou 4 mois selon une piste du gouvernement en 2025, 2 mois selon le ministre de l'Économie en 2023."
    defenseurs: "Un an d'incertitude après chaque licenciement est trop long pour une entreprise, et la France laisse plus de temps pour contester que la plupart des pays développés."
    critiques: "Un salarié licencié doit d'abord chercher un emploi et un avocat : un délai trop court lui retirerait, dans les faits, le droit de contester."
    detail:
      chiffrage:
        texte: "Aucun coût n'a été chiffré. Le délai pour contester un licenciement est aujourd'hui de 12 mois après sa notification ; aucune proposition de le raccourcir n'a été adoptée."
        source: { organisme: Code du travail, document: article L. 1471-1, annee: 2017 }
      defenseurs:
        - texte: "Un an d'incertitude après chaque licenciement est trop long pour une entreprise."
        - texte: "Le délai français reste plus long que dans la plupart des autres pays de l'OCDE."
        - texte: "Des recours plus rapides désengorgeraient des tribunaux où une affaire dure en moyenne 13,5 mois."
          source: { organisme: Ministère de la Justice, document: Références statistiques Justice, annee: 2026 }
      critiques:
        - texte: "Un salarié licencié doit d'abord chercher un emploi et un avocat : deux mois reviendraient à supprimer la voie de recours."
        - texte: "Un délai trop court pousserait à saisir le juge par précaution, avant d'avoir tenté un accord, et multiplierait les procès."
        - texte: "Le délai a déjà été raccourci en 2017 : le réduire encore affaiblirait le droit de contester un licenciement."
