# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour garder un plafond"
    argument: "Chacun sait d'avance à quoi s'attendre, et deux salariés dans la même situation obtiennent des sommes proches."
  - titre: "Pour le supprimer ou le relever"
    argument: "Un licenciement injustifié doit être réparé en entier : c'est au juge de mesurer le préjudice."
# Les deux choix de l'autocollant « Et toi ? » de la story : A et B d'un côté, C et D de l'autre.
story:
  - choix: "Le supprimer ou le relever"
    precision: "le juge mesure le préjudice"
  - choix: "Le garder"
    precision: "voire raccourcir le délai pour contester"
