# Ni mécanisme ni écart : aucun rapport « X pour 1 » ni aucune grandeur à deux dates ne sont sourcés pour ce sujet.
reportage:
  accroche:
    # § 1.1 et 1.2, [1] [2] [8] [9].
    etapes:
      - { quand: Depuis 1994, valeur: Interdite en France }
      - { quand: Le 3 juillet 2026, valeur: Deux pères reconnus }
    chute: … pour des enfants nés d'une GPA au Canada.
  leviers:
    # § 1.1, 2d et 2e, [2] [3] [4] [32].
    titre: Trois choix possibles
    choix:
      - { texte: L'interdire aussi à l'étranger, detail: punir ceux qui y ont recours hors de France }
      - { texte: Garder la loi actuelle, detail: "interdite en France, les enfants nés ailleurs reconnus par le juge" }
      - { texte: L'autoriser, detail: "sans paiement, ou même payée" }
    chute: "Aujourd'hui, la France applique le deuxième."
    source: "Ministère de la Justice, 2024"
  camps: { pour: POUR, contre: CONTRE, objet: la GPA en France }
  # Chaque réponse compare ce qui se compare ; questions 1 et 2 : la même étude des deux côtés.
  questions:
    # § 2b, [26].
    - question: Porter un enfant pour d'autres est-il dangereux ?
      pour: { affirmation: Pas pour la plupart., chiffre: 92 sur 100, texte: "Au Canada, 92 femmes sur 100 ayant porté un enfant pour d'autres n'ont eu aucune complication grave.", source: "Annals of Internal Medicine, 2024" }
      contre: { affirmation: Plus qu'une grossesse ordinaire., chiffre: 3 fois plus, texte: "Au Canada, les grossesses pour autrui ont connu trois fois plus de complications graves que les grossesses sans aide médicale.", source: "Annals of Internal Medicine, 2024" }
    # § 2c, [27] : 22 familles nées de GPA, résultats non détaillés pour la GPA seule.
    - question: Les enfants nés de GPA vont-ils bien ?
      pour: { affirmation: "Oui, comme les autres.", chiffre: 20 ans, texte: "Suivis jusqu'à 20 ans par une étude anglaise, des enfants nés de GPA ou de dons vont aussi bien que les autres.", source: "Université de Cambridge, 2023" }
      contre: { affirmation: Pas prouvé pour la GPA seule., chiffre: 22 familles, texte: "Une étude anglaise les a suivis jusqu'à 20 ans : 22 familles nées de GPA, sans résultat publié pour elles seules.", source: "Université de Cambridge, 2023" }
    # § 2d, [31] [2] : le décompte de la justice à Nantes plutôt que l'estimation non attribuée de 200 à 300 par an.
    - question: La loi française empêche-t-elle la GPA ?
      pour: { affirmation: "Non, elle se fait à l'étranger.", chiffre: Une centaine par an, texte: "Chaque année, la justice traite une centaine de dossiers d'état civil d'enfants nés de GPA à l'étranger.", source: "Europe 1, 2018" }
      contre: { affirmation: "En France, oui.", chiffre: 1 an de prison, texte: "Servir d'intermédiaire pour une GPA y est puni jusqu'à un an de prison et 15 000 € d'amende.", source: "Ministère de la Justice, 2024" }
    # § 2e et 2d, [4] [32].
    - question: D'autres pays l'autorisent-ils ?
      pour: { affirmation: "Oui, sans paiement.", chiffre: Depuis 1985, texte: "Le Royaume-Uni autorise la GPA depuis 1985, si la femme qui porte l'enfant n'est pas payée. Le Canada aussi, depuis 2004.", source: "Sénat, 2023" }
      contre: { affirmation: "L'Italie, elle, durcit l'interdiction.", chiffre: 2 ans de prison, texte: "Depuis 2024, l'Italie punit jusqu'à deux ans de prison ceux qui y ont recours, même dans un pays où elle est légale.", source: "Loi italienne, 2024" }
