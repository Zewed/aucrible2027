# BROUILLON À VÉRIFIER : rédigé par IA le 27/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/027-gpa.md (tout ce qui suit y est sourcé).
# Mots disputés (étude, « Règles de lecture ») : ni « femme porteuse » (mot des partisans) ni « mère porteuse » (mot des
# opposants) ; la fiche écrit « la femme qui porte l'enfant » ou « grossesse pour autrui ».
numero: 27
date: 2026-10-26
theme: societe
question: "Faut-il autoriser la gestation pour autrui (GPA) en France ?"
titreCourt: "La GPA"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/027-gpa-gER4PPVEf3WmHidaxqGQk2B3AmtMlr.mp4", duree: "1 min 40" }
contexte:
  - "Depuis 1994, la loi interdit la gestation pour autrui (GPA) : un contrat par lequel une femme porte un enfant pour le remettre à d'autres est nul, et l'intermédiaire est puni."
  - "Recourir à la GPA dans un pays où elle est légale n'est pas puni. Le 3 juillet 2026, la Cour de cassation a reconnu deux pères d'enfants nés ainsi au Canada, tout en confirmant l'interdiction en France."
  - "Depuis 2025, la proposition d'autoriser une GPA dite « éthique », sans paiement, a relancé le débat. Ses partisans y voient une réponse à l'infertilité et une question d'égalité entre couples ; ses opposants, à droite comme à gauche, une marchandisation du corps des femmes."
chiffres:
  - valeur: "1"
    unite: an de prison
    legende: "et 15 000 € d'amende au plus pour l'intermédiaire ; recourir à la GPA dans un pays où elle est légale n'est pas puni"
    source: { organisme: Ministère de la Justice, document: réponse à la question écrite n° 11042, annee: 2024 }
  - valeur: "5"
    unite: affaires
    legende: "dans lesquelles la Cour européenne des droits de l'homme a condamné la France, de 2014 à 2017, pour avoir refusé à des enfants nés de GPA tout lien légal avec leur père, sans condamner l'interdiction elle-même"
    source: { organisme: Sénat, document: étude de législation comparée n° 327, annee: 2023 }
  - valeur: "7,8 %"
    legende: "des grossesses pour autrui ont connu une complication grave en Ontario (Canada), contre 2,3 % des grossesses sans aide médicale et 4,3 % après une fécondation in vitro"
    source: { organisme: Annals of Internal Medicine, document: "Velez et al.", annee: 2024 }
options:
  - id: A
    libelle: L'interdire aussi à l'étranger
    implique: "La GPA reste interdite en France, et y recourir devient un délit même dans un pays où elle est légale, comme en Italie depuis 2024 ; les peines contre les intermédiaires sont alourdies."
    defenseurs: "Interdire en France sans punir le recours à l'étranger revient à laisser faire : la GPA porte atteinte à la dignité des femmes et des enfants, il faut la combattre partout."
    critiques: "Des juristes jugent difficile de punir un acte légal là où il a lieu, et ce sont les enfants déjà nés qui en subiraient les conséquences."
    axes: { societe: 1 }
  - id: B
    libelle: Garder l'interdiction actuelle
    implique: "La GPA reste interdite en France et l'intermédiaire est puni ; le recours à l'étranger n'est pas puni, et le juge reconnaît au cas par cas les parents des enfants qui en sont nés."
    defenseurs: "L'enfant n'est pas un droit et le corps des femmes n'est pas une marchandise ; mais l'enfant né à l'étranger n'a pas à payer le choix de ses parents."
    critiques: "Les uns y voient une interdiction contournée sans risque à l'étranger, les autres un refus d'encadrer en France une pratique qui existe déjà."
    axes: { societe: 0 }
  - id: C
    libelle: L'autoriser sans paiement
    implique: "Une femme peut porter un enfant pour d'autres sans être payée, ses frais étant remboursés, dans un cadre strict fixé par la loi, comme au Royaume-Uni ou au Canada."
    defenseurs: "Des couples infertiles et des couples d'hommes partent déjà à l'étranger : mieux vaut une GPA encadrée et non lucrative en France, qui protège la femme et l'enfant."
    critiques: "« Il n'y a pas de GPA éthique » : la femme engage son corps, l'enfant est séparé d'elle à la naissance, et le remboursement des frais peut cacher un paiement."
    axes: { societe: -1 }
  - id: D
    libelle: "L'autoriser, même payée"
    implique: "La femme qui porte l'enfant peut être payée, dans un contrat encadré par la loi, comme en Californie."
    defenseurs: "Porter un enfant pour d'autres demande du temps et comporte des risques : le rémunérer le reconnaît, dans un cadre qui protège les droits de chacun."
    critiques: "Payer une grossesse fait du corps des femmes et de l'enfant un objet de marché, et attire d'abord les femmes les plus pauvres."
    axes: { societe: -2 }
