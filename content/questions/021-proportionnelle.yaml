numero: 21
date: 2026-10-20
theme: institutions-democratie
question: "Faut-il élire les députés à la proportionnelle ?"
titreCourt: "La proportionnelle"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/021-proportionnelle-mwa6ggrLZ7JwTMnfWDZ8GPBG97IvTv.mp4", duree: "1 min 50" }
contexte:
  - "Les 577 députés sont élus au scrutin majoritaire à deux tours, dans autant de circonscriptions ; seules les élections de 1986 se sont faites à la proportionnelle sous la Ve République."
  - "En 2024, le bloc arrivé en tête avec 33,2 % des voix au premier tour a eu 24,6 % des sièges, alors que les deux suivants en ont eu davantage que de voix, et aucun n'a atteint la majorité de 289 sièges."
  - "En 2025, le Premier ministre a consulté les partis sur une proportionnelle intégrale par département, comme en 1986 ; les partis restent divisés sur le sujet."
chiffres:
  - valeur: 33,2 %
    legende: "des voix au premier tour pour le bloc arrivé en tête en 2024"
    source: { organisme: Ministère de l'Intérieur, document: législatives 2024, annee: 2024 }
  - valeur: 24,6 %
    legende: "des sièges pour les mêmes candidats : 142 sur 577"
    source: { organisme: Ministère de l'Intérieur, document: législatives 2024, annee: 2024 }
  - valeur: "289"
    unite: "sièges"
    legende: "pour la majorité absolue : aucun bloc ne l'a atteinte en 2024"
    source: { organisme: Ministère de l'Intérieur, document: législatives 2024, annee: 2024 }
options:
  - id: A
    libelle: "Oui, la proportionnelle intégrale"
    implique: "Tous les députés sont élus à la proportionnelle, sans prime majoritaire : chaque liste obtient des sièges à proportion de ses voix."
    defenseurs: "Chaque voix pèse autant et toutes les sensibilités sont représentées : l'Assemblée reflète le pays, et les majorités se construisent par le compromis."
    critiques: "Sans prime, il devient plus difficile de dégager une majorité, et le lien entre l'électeur et son député se distend."
  - id: B
    libelle: "Oui, avec une prime majoritaire"
    implique: "Les députés sont élus à la proportionnelle, avec un bonus de sièges pour la liste arrivée en tête afin de lui donner une majorité."
    defenseurs: "L'Assemblée est plus représentative qu'aujourd'hui et le pays garde une majorité claire pour gouverner."
    critiques: "La prime donne à la liste arrivée en tête plus de sièges que de voix, ce qui réduit la représentation des autres."
  - id: C
    libelle: "Oui, mais seulement pour une partie des députés"
    implique: "Une partie de l'Assemblée est élue à la proportionnelle (par exemple 15 % des sièges), le reste étant élu comme aujourd'hui."
    defenseurs: "On corrige une partie de l'écart entre les voix et les sièges sans perdre le lien avec un député local ni la majorité."
    critiques: "Une simple dose ne change l'équilibre qu'à la marge : les courants minoritaires restent sous-représentés."
  - id: D
    libelle: "Non, garder le scrutin actuel"
    implique: "Les députés restent élus dans leur circonscription, au scrutin majoritaire à deux tours."
    defenseurs: "Chaque territoire a son député et le vote tranche : le scrutin majoritaire favorise une majorité claire, que la proportionnelle risque d'empêcher."
    critiques: "Il écarte de l'Assemblée des courants qui rassemblent des millions de voix et donne des sièges éloignés des voix, comme en 2024."
