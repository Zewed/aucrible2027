    argument: "Soigner tôt coûte moins cher que d'attendre l'urgence, c'est la position des hôpitaux publics ; la dépense moyenne par bénéficiaire (2 699 euros) est inférieure à celle de la population générale (3 659 euros)."
  - titre: "Pour la supprimer"
    argument: "L'argent public doit d'abord soigner les assurés : on garde les soins vitaux, mais plus de prise en charge complète des personnes en situation irrégulière, ce qui économise une partie des 1,3 milliard d'euros actuels."
