# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour aider dès le premier enfant"
    argument: "Une famille sur trois n'a qu'un enfant, et l'arrivée du premier fait déjà baisser le niveau de vie."
  - titre: "Pour garder le deuxième enfant"
    argument: "Les familles modestes ont déjà des aides dès le premier enfant, et le pays n'a pas les moyens de cette dépense."
# Les deux choix de l'autocollant « Et toi ? » de la story : A, B et C d'un côté, D et E de l'autre.
story:
  - choix: "Dès le premier enfant"
    precision: "avec ou sans montant selon les revenus"
  - choix: "À partir du deuxième"
    precision: "avec ou sans montant selon les revenus"
# Positions sourcées seulement (étude, § 4.2). Inconnues : Lisnard, Arthaud (aucune déclaration trouvée).
