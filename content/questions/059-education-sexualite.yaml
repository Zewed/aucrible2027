# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour plus de place aux parents"
    argument: "L'éducation des enfants revient d'abord aux parents : ils doivent savoir ce que l'école leur dit."
  - titre: "Pour garder ou renforcer les séances"
    argument: "Nommer son corps, dire non et savoir à qui parler aident les enfants à se protéger des violences."
# Les deux choix de l'autocollant « Et toi ? » de la story : A et B d'un côté, C et D de l'autre (étude, § 4 : ce qui
# départage le plus les candidats est le contenu et les moyens, B contre D).
story:
  - choix: "Les supprimer ou les recentrer"
    precision: "les parents d'abord"
  - choix: "Les garder ou les renforcer"
    precision: "le programme de 2025, ou plus de moyens"
