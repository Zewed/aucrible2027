# BROUILLON À VÉRIFIER : rédigé par IA le 10/11/2026 à partir de sources publiques.
# Chaque chiffre et chaque position doivent être vérifiés par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/059-education-sexualite.md (tout ce qui suit y est sourcé).
# La question dit « séances », le mot de la loi (ce ne sont pas des cours notés), et « de la maternelle au lycée » : l'étude
# disait « dès la maternelle », accroche des opposants, remplacée après relecture ; « garder », parce que l'obligation existe
# depuis 2001. En maternelle et en élémentaire, le programme exclut la sexualité : le contexte le dit (étude, « Règles de
# lecture »).
# Mots disputés, attribués ou évités (étude, « Règles de lecture ») : « éducation sexuelle » (mot courant et mot des
# opposants ; la fiche écrit « éducation à la vie affective et sexuelle », et « éducation à la sexualité » pour la loi) ;
# « théorie du genre » (mot des opposants ; la fiche écrit « identité de genre ») ; « endoctrinement », « idéologie »,
# « dérives », « réactionnaires » (jamais employés) ; « primauté éducative des parents » (AFC, non employé) ;
# « adulte de confiance » (notion du programme, entre guillemets).
numero: 59
date: 2026-08-30
theme: education-jeunesse
question: "Faut-il garder les séances obligatoires d'éducation à la vie affective et sexuelle à l'école, de la maternelle au lycée ?"
titreCourt: "L'éducation affective et sexuelle"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/059-education-sexualite-constat-dbFGWYEGZgyR29NRCTNSHClJLoZRRb.mp4", duree: "3 min 50", ecrans: [0, 13.97, 26.5, 41.17, 55.8, 68.37, 82.34, 96.27, 109.54, 122.8, 137.44, 150.7, 165.34, 180, 193.97, 207.9, 222.57], images: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/ecrans/059-education-sexualite-constat-dbFGWYEGZgyR29NRCTNSHClJLoZRRb/" }
contexte:
  - "Depuis une loi de 2001, chaque école, collège et lycée doit organiser au moins trois séances d'éducation à la sexualité par an, sans dispense possible, mais cette loi a été peu appliquée jusqu'en 2025, et la justice a condamné l'État pour cette carence en décembre 2025."
  - "Le programme entré en vigueur en septembre 2025 commence avant 4 ans ; en maternelle et en élémentaire, il exclut la sexualité et parle du corps, de l'intimité, du consentement, des violences, des « différentes structures familiales » et des stéréotypes, « notamment de genre »."
  - "Le débat porte sur l'obligation elle-même, sur ce que les parents doivent savoir, sur la place de l'identité de genre et des associations, et sur les moyens."
chiffres:
  # § 1.4, [9] [10] : l'enquête ne dit ni combien d'établissements ont répondu, ni combien d'élèves ont eu les trois séances.
  - valeur: "66 %"
    legende: "des écoliers ont eu au moins une séance à l'automne 2025, dans les écoles qui ont répondu"
    source: { organisme: "Ministère de l'Éducation nationale", document: "réponse à la question écrite n° 11476", annee: 2026 }
  # § 1.4 et 2g, [9] : le chiffre du ministère, pas celui des associations (620 M€), donné dans l'option D.
  - valeur: "119"
    unite: "millions d'euros"
    legende: "annoncés par le ministre pour ce programme, surtout en temps de travail des personnels"
    source: { organisme: "Ministère de l'Éducation nationale", document: "réponse à la question écrite n° 11476", annee: 2026 }
options:
  - id: A
    libelle: "Supprimer l'obligation et s'en remettre aux familles"
    implique: "La loi de 2001 est abrogée : il n'y a plus de séance obligatoire, et l'éducation affective et sexuelle revient aux familles. Les cours de sciences sur la puberté et la reproduction restent."
    defenseurs: "L'éducation des enfants revient d'abord aux parents : l'école doit instruire et se concentrer sur les savoirs fondamentaux, pas entrer dans des sujets aussi intimes."
    critiques: "Sans ces séances, les enfants qui n'en parlent pas chez eux n'apprendraient plus à nommer leur corps, à dire non et à signaler des violences, parfois subies dans leur propre famille."
    detail:
      chiffrage:
        texte: "Aucun chiffrage n'a été trouvé. Avant 2001, ces séances étaient facultatives, en dehors de l'emploi du temps, et demandaient l'accord des parents."
        source: { organisme: "Inspection générale de l'éducation", document: "rapport n° 2021-149", annee: 2021 }
      defenseurs:
        - texte: "L'éducation des enfants revient avant tout aux parents : l'école est là pour instruire, pas pour éduquer à leur place."
        - texte: "Sur un sujet aussi personnel que la sexualité, l'école empiète sur la vie des familles, parfois sans dialogue ni transparence."
        - texte: "L'école doit concentrer ses efforts sur les savoirs fondamentaux : lire, écrire, compter, raisonner."
      critiques:
        - texte: "Chaque année, 160 000 enfants sont victimes d'inceste ou de violences sexuelles : l'école est le premier lieu où les aider à se protéger et à en parler."
          source: { organisme: "CIIVISE, commission qui soutient le programme", annee: 2024 }
        - texte: "Un enfant victime de violences dans sa propre famille n'a parfois que l'école pour apprendre qu'il peut en parler, et à qui."
        - texte: "Le programme ne remplace pas les parents : il est public, et les parents sont représentés dans les instances de l'école."
  - id: B
    libelle: "Garder les séances, mais recentrées et annoncées aux parents"
    implique: "Les trois séances restent obligatoires, mais elles sont assurées par les enseignants plutôt que par des associations, sans la notion d'identité de genre, et les parents sont informés à l'avance de chaque séance."
    defenseurs: "Les parents doivent savoir à l'avance ce qui est dit à leur enfant, et l'école doit rester à l'abri de tout militantisme : des séances par les professeurs, sans identité de genre."
    critiques: "Annoncer chaque séance exposerait les enseignants aux pressions, et l'identité de genre sert, dans le programme, à combattre des discriminations que la loi interdit."
    detail:
      chiffrage:
        texte: "Aucun chiffrage n'a été trouvé. En 2018-2019, au collège et au lycée, près de 30 % des séances étaient animées par des intervenants extérieurs, et près de 40 % par des infirmiers."
        source: { organisme: "Inspection générale de l'éducation", document: "rapport n° 2021-149", annee: 2021 }
      defenseurs:
        - texte: "Les parents doivent savoir à l'avance ce qui sera dit à leur enfant, et pouvoir exprimer leurs réserves."
        - texte: "Ces séances relèvent des professeurs, plutôt que d'intervenants extérieurs dont on peut craindre qu'ils y mettent leurs propres convictions."
        - texte: "En seconde, le programme fait « prendre conscience que l'identité de genre peut ne pas correspondre au sexe biologique » : présenté ainsi, le genre peut troubler des adolescents qui cherchent des repères."
      critiques:
        - texte: "Annoncer chaque séance exposerait les enseignants à des pressions, et des parents retireraient leurs enfants de l'école ces jours-là."
        - texte: "L'identité de genre est une notion de la loi : le programme l'emploie pour combattre des discriminations interdites, sans inciter personne à en changer."
        - texte: "Des enseignants sans formation ni créneau, souvent volontaires, ne peuvent pas assurer seuls toutes ces séances."
  - id: C
    libelle: "Garder le programme de 2025 tel quel"
    implique: "Trois séances par an, de la maternelle au lycée. En maternelle et en élémentaire, elles portent sur la vie affective et relationnelle, sans sexualité. Les parents sont informés des objectifs de l'année, et des associations agréées peuvent intervenir, en primaire à titre exceptionnel."
    defenseurs: "Le programme suit l'âge des élèves et complète le rôle des parents sans le remplacer : en primaire, il parle du corps, du consentement et des violences, pas de sexualité."
    critiques: "Les uns le jugent trop précoce et trop éloigné des familles, les autres trop peu appliqué, faute d'un budget propre."
    detail:
      chiffrage:
        texte: "Garder le programme de 2025 ne change rien : le ministère valorise son effort à 119 millions d'euros, surtout en temps de travail des personnels, sans budget affecté."
        source: { organisme: "Ministère de l'Éducation nationale", annee: 2026 }
      defenseurs:
        - texte: "Le programme suit l'âge des élèves : en primaire, il parle du corps, des émotions, du consentement et des violences, pas de sexualité."
        - texte: "Le programme ne remplace pas les familles, il les complète : il est public, et les parents connaissent les objectifs de chaque année."
        - texte: "Les programmes scolaires de prévention des abus sexuels donnent aux enfants des connaissances et des réflexes pour se protéger, sans les rendre plus anxieux : c'est le bilan de 24 essais menés auprès de 5 802 enfants."
          source: { organisme: "Revue Cochrane", annee: 2015 }
      critiques:
        - texte: "Dès la maternelle, le programme apprend aux enfants à repérer des « adultes de confiance », mis sur le même plan que leurs parents."
        - texte: "Les parents ne sont plus prévenus de la date ni du contenu de chaque séance, seulement des objectifs de l'année."
        - texte: "Sans budget propre, le programme n'a pas lieu partout : fin 2025, 35 % des lycéens avaient eu au moins une séance depuis la rentrée."
          source: { organisme: "Ministère de l'Éducation nationale", annee: 2026 }
  - id: D
    libelle: "Appliquer le programme partout, avec un budget dédié"
    implique: "Un budget propre, des heures réservées dans l'emploi du temps, des personnels formés, des associations agréées aussi en primaire et des contrôles dans le privé sous contrat. Des associations demandent jusqu'à 620 millions d'euros par an, contre 119 millions valorisés aujourd'hui par le ministère."
    defenseurs: "Une loi votée en 2001 doit s'appliquer : sans budget, sans heures réservées ni personnes formées, des élèves traversent toute leur scolarité sans une seule séance."
    critiques: "L'effort existe déjà, avec un plan national de formation, et faire parler de ces sujets à de jeunes enfants par des intervenants extérieurs ne devrait pas se généraliser."
    detail:
      chiffrage:
        # § 1.4 et 2g, [9] [18] : chiffre d'un collectif d'associations, partie au débat (622 M€ dans une autre citation).
        texte: "Des associations estiment le besoin à 620 millions d'euros par an, soit 52 euros par élève. Aucun chiffrage public indépendant n'a été trouvé."
        source: { organisme: "Collectif pour une véritable éducation à la sexualité", document: "cité par l'Assemblée nationale", annee: 2024 }
      defenseurs:
        - texte: "Avant le programme de 2025, moins de 15 % des élèves avaient leurs trois séances dans l'année, à l'école comme au lycée, dans l'académie étudiée."
          source: { organisme: "Inspection générale de l'éducation", annee: 2021 }
        - texte: "Un programme sans moyens reste inefficace : les 119 millions d'euros annoncés valorisent surtout le temps des personnels, sans budget affecté."
          source: { organisme: "Ministère de l'Éducation nationale", annee: 2026 }
        - texte: "Pendant que l'école se tait, les algorithmes parlent de sexualité aux adolescents."
      critiques:
        - texte: "L'effort existe déjà : il passe par trois programmes du budget de l'État et par un plan national de formation des personnels."
        - texte: "Plus d'associations en primaire, c'est faire parler de ces sujets à de jeunes enfants par des intervenants extérieurs, alors qu'ils relèvent d'abord de leurs professeurs."
        - texte: "Aucune étude ne mesure encore si ces programmes réduisent vraiment les violences : il faut évaluer avant de dépenser plus."
