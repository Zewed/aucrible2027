# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/051-logements-vacants.md (chaque chiffre y a sa source
# numérotée, voir l'annexe de l'étude). Le fil : il y a beaucoup de logements vides, mais tous ne sont pas utiles ni
# disponibles ; quatre façons de les remettre en usage.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1, [1] : Insee, même série, 1982 et 2026 (+54,4 % ; part de 7,9 % à 7,6 %).
    etapes:
      - { quand: En 1982, valeur: "1,9 million" }
      - { quand: En 2026, valeur: "2,9 millions" }
    chute: "… de logements vides en France. Leur nombre a augmenté de 54 % ; leur part parmi tous les logements est restée proche de 8 %."
  # Pas de « mécanisme » : aucun rapport « X pour 1 » ne résume le sujet. Pas d'« écart » : la seule grandeur à deux
  # dates qui éclaire le débat (ce que rapporte la taxe) est traitée dans les questions, avec la réponse d'en face.
  leviers:
    # § 1.3, [2] [6] [7] : les quatre options de la fiche, à égalité ; la chute dit qui paierait.
    titre: "Les logements vides : quatre choix"
    choix:
      - { texte: Réquisitionner, detail: "les occuper quelques années, contre un loyer garanti par l'État" }
      - { texte: Taxer plus fort, detail: les propriétaires de logements vides paient plus }
      - { texte: Aider à louer, detail: "financer les travaux, garantir les loyers" }
      - { texte: Alléger les règles, detail: lever les interdictions de louer ceux qui sont mal isolés }
    chute: "La taxe est payée par les propriétaires de logements vides ; les aides, par l'argent public."
    source: "Cour des comptes, 2025"
  camps: { pour: POUR, contre: CONTRE, objet: taxer ou réquisitionner }
  # Chaque question oppose deux faits de la même source ou de même périmètre ; quand une réponse s'appuie sur une
  # étude ou une estimation, son texte le dit.
  questions:
    # § 2a, [2] : la même source, la même année (Lovac 2022), le même champ (logements privés vides depuis plus de
    # deux ans) ; 118 330 sur 1,1 million ≈ 1 sur 10.
    - question: "Les logements vides peuvent-ils loger ceux qui cherchent ?"
      pour: { affirmation: "Oui, il y en a plus d'un million.", chiffre: "1 100 000", texte: "En 2022, 1,1 million de logements privés étaient vides depuis plus de deux ans, d'après les impôts.", source: "Cour des comptes, 2025" }
      contre: { affirmation: "Peu sont là où l'on en manque.", chiffre: 1 sur 10, texte: "Sur dix logements vides depuis plus de deux ans, un se trouve dans une commune où le logement manque.", source: "Cour des comptes, 2025" }
    # § 1.1, 1.3 et 2c, [2] [3] [14] : l'étude mesure l'effet de la création de la taxe (loi de 1998, appliquée en 1999,
    # mesure 1997–2001) ; la Cour constate que la taxe « n'a en rien endigué » la vacance longue, et la série Lovac des
    # logements privés vides depuis plus de deux ans reste autour de 1,1 à 1,2 million (millésimes 2020–2026, hors saut
    # de 2025 dû à une rupture de série). Chaque texte dit ce qu'il est : une étude, un constat. Limite : série nationale,
    # alors que la taxe ne couvre pas toutes les communes ; l'étude n'a pas de série propre aux communes taxées.
    - question: "Taxer les logements vides, est-ce que ça marche ?"
      pour: { affirmation: "Oui, à sa création.", chiffre: "−13 %", texte: "Selon une étude, la taxe appliquée dès 1999 a fait baisser de 13 % la part de logements vides des villes taxées.", source: "M. Segú, étude, 2019" }
      contre: { affirmation: "Non, selon la Cour des comptes.", chiffre: "1,1 à 1,2 million", texte: "La Cour constate que la taxe n'a pas fait reculer les logements vides de longue durée : 1,1 à 1,2 million depuis 2020.", source: "Cour des comptes, 2025 ; Cerema, 2026" }
    # § 2d, [7] : le même rapport, la même unité (logements réquisitionnés), deux campagnes.
    - question: "Réquisitionner, est-ce que ça marche ?"
      pour: { affirmation: "Oui, l'État l'a déjà fait.", chiffre: "800", texte: "En 1995 et 1996, l'État a réquisitionné environ 800 logements vides, propriété de grands investisseurs.", source: "Assemblée nationale, 2026" }
      contre: { affirmation: "Rarement, sur le terrain.", chiffre: "48", texte: "En 2001, 48 logements ont été réquisitionnés sur 300 annoncés. Depuis, l'outil ne sert presque plus.", source: "Assemblée nationale, 2026" }
    # § 2b et 2e, [2] : le même rapport, toute la France ; le pour est un constat (2020–2024), le contre une
    # estimation statistique du ministère, que le texte annonce. Pas de « suffit-il » : la taxe et la réquisition sont
    # jugées sur « est-ce que ça marche », l'aide ne doit pas l'être sur une barre plus haute ; et chaque chiffre prouve
    # son affirmation (le 45 % dit pourquoi ces logements sont vides, pas que l'aide marche).
    - question: "Faut-il d'abord aider les propriétaires ?"
      pour: { affirmation: "Non, peu de logements reviennent.", chiffre: "6,6 %", texte: "Quand une mairie contacte les propriétaires, 6,6 % de leurs logements vides cessent de l'être.", source: "Cour des comptes, 2025" }
      contre: { affirmation: "Oui, beaucoup sont vieux ou abîmés.", chiffre: "45 %", texte: "Selon une étude, 45 % des logements vides depuis longtemps le sont car trop vieux, trop petits ou abîmés.", source: "Cour des comptes, 2025" }
