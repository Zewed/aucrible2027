# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux dont cette fiche découle : docs/etudes/051-logements-vacants.md (tout ce qui suit y est sourcé).
numero: 51
date: 2026-09-07
theme: logement
question: "Que faire des logements vides ?"
titreCourt: "Les logements vides"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/051-logements-vacants-LiTGwx3vw3rlazPGTcc2JRkrqrFyMV.mp4", duree: "1 min 50" }
contexte:
  - "Au 1er janvier 2026, la France compte 2,9 millions de logements vides, soit 7,6 % des logements ; une partie le reste quelques mois, entre deux locataires, pendant une vente, une succession ou des travaux."
  - "Dans les communes où le logement manque, le propriétaire d'un logement vide depuis au moins un an paie une taxe de 17 % de sa valeur locative la première année, puis 34 % ; dès 2027, ces communes pourront aller jusqu'à 30 %, puis 60 %."
  - "Le préfet peut aussi réquisitionner certains logements vides, surtout ceux de sociétés, pour y loger des personnes contre un loyer versé au propriétaire ; il ne l'a presque plus fait depuis 2001."
chiffres:
  - valeur: "2,9 millions"
    legende: "de logements vides au 1er janvier 2026, soit 7,6 % des logements, contre 1,9 million (7,9 %) en 1982"
    source: { organisme: Insee, document: Insee Focus n° 388, annee: 2026 }
  - valeur: "1,1 million"
    legende: "de logements privés vides depuis plus de deux ans, dont 118 000 dans les communes où le logement manque (données 2022)"
    source: { organisme: Cour des comptes, document: rapport sur la lutte contre les logements vacants, annee: 2025 }
  - valeur: "271"
    unite: millions d'euros
    legende: "rapportés en 2023 par la taxe sur les logements vides des communes où le logement manque, contre 80 millions en 2014"
    source: { organisme: Cour des comptes, document: rapport sur la lutte contre les logements vacants, annee: 2025 }
options:
  - id: A
    libelle: "Les réquisitionner"
    implique: "En plus de la taxe, le préfet ou le maire peut occuper pour quelques années un logement vide depuis longtemps et y loger des personnes ; le propriétaire reste propriétaire et touche un loyer garanti par l'État."
    defenseurs: "Des gens dorment dehors quand des logements restent vides : la réquisition ne prive pas le propriétaire de son bien, il est payé, et sa seule menace pousse à relouer."
    critiques: "C'est une atteinte au droit de propriété, coûteuse et exposée aux recours en justice ; beaucoup de logements vides sont à rénover, et l'outil n'a presque plus servi depuis 2001."
    axes: { economie: -2 }
  - id: B
    libelle: "Les taxer plus fort"
    implique: "Sans réquisition, la taxe payée par les propriétaires de logements vides augmente, par exemple plus fort si le logement reste vide longtemps ou si son propriétaire en possède plusieurs."
    defenseurs: "Garder un logement vide là où des familles cherchent un toit doit coûter cher : une taxe plus lourde pousse à louer ou à vendre, et une étude a mesuré son effet."
    critiques: "Près de la moitié de la taxe réclamée en 2022 a été rendue à des propriétaires qui ne pouvaient pas louer, et la Cour des comptes juge son effet non démontré."
    axes: { economie: -1 }
  - id: C
    libelle: "Aider à les remettre en location"
    implique: "La taxe et les règles actuelles restent ; l'État et les communes financent des travaux, garantissent les loyers et accordent des avantages fiscaux aux propriétaires qui louent."
    defenseurs: "Beaucoup de logements vides sont vieux, petits ou en mauvais état, et leurs propriétaires âgés ou modestes : mieux vaut les aider à faire les travaux que les sanctionner."
    critiques: "Les aides se paient avec l'argent public et touchent peu de logements ; là où le logement manque, peu de propriétaires répondent quand la mairie les contacte."
  - id: D
    libelle: "Alléger les règles pour les louer"
    implique: "Les interdictions de louer les logements les plus mal isolés sont levées ou assouplies, pour que ceux qui sont vides puissent être loués, et les propriétaires qui louent paient moins d'impôts ; ni réquisition, ni taxe nouvelle."
    defenseurs: "Aucun propriétaire n'a intérêt à garder un bien vide : les logements vides sont plus souvent mal isolés que les autres, et alléger les normes et les impôts les remettrait sur le marché."
    critiques: "Des logements mal isolés seraient reloués avec de lourdes factures de chauffage, et aucune étude n'a mesuré l'effet de ces interdictions sur les logements vides."
    axes: { economie: 1 }
