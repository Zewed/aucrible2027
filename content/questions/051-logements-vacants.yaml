# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour taxer ou réquisitionner"
    argument: "Garder un logement vide là où des familles cherchent un toit doit coûter cher : une taxe plus lourde, ou la menace d'une réquisition, pousse les propriétaires à louer."
  - titre: "Pour aider ou alléger les règles"
    argument: "Beaucoup de logements vides sont vieux ou bloqués par les normes : il faut aider les propriétaires à les remettre en état et lever les freins, pas les sanctionner."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Taxer"
    precision: "ou réquisitionner"
  - choix: "Aider"
    precision: "ou alléger les règles"
