  le-pen: { option: D, source: "Amendement RN n° 1 à la PPL n° 2303 sur les logements vacants, cosigné par M. Le Pen, 05/02/2026 ; PPL RN n° 278 et scrutin n° 219, 31/10/2024", statut: deduite }
  # Entretien au Figaro repris par Nouvelle Énergie, 05/12/2025 : https://www.unenouvelleenergie.fr/david-lisnard-face-a-la-crise-du-logement-il-est-temps-de-briser-cette-spirale-infernale/
