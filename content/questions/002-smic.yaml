    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F2300
  - titre: Eurostat, statistiques sur les salaires minimaux, 2026
    url: https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Minimum_wage_statistics
  - titre: Institut Montaigne, Augmenter le SMIC à 1 600 euros net, 2024
    url: https://www.institutmontaigne.org/legislatives-2024/nouveau-front-populaire/augmenter-le-smic-a-1600-e-net
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour relever le SMIC"
    argument: "Ceux qui travaillent au minimum doivent pouvoir vivre de leur salaire : la hausse soutient leur pouvoir d'achat."
  - titre: "Pour ne pas le relever"
    argument: "Une règle connue, qui suit le coût de la vie sans alourdir le coût du travail ni fragiliser l'emploi."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Relever"
    precision: "le SMIC"
  - choix: "Pas de coup de pouce"
    precision: "au SMIC"
