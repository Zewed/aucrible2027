# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour continuer ou renforcer l'aide"
    argument: "Relâcher le soutien fragiliserait l'Ukraine dans d'éventuelles négociations."
  - titre: "Pour limiter ou arrêter l'aide"
    argument: "Les finances publiques ne le permettent plus, et le « toujours plus d'armes » n'amène pas la paix."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Continuer"
    precision: "ou renforcer"
  - choix: "Limiter"
    precision: "ou arrêter"
positions:
  # Projet de Debout la France, mesure 22 : https://www.debout-la-france.fr/projet/economie-travail/
  dupont-aignan: { option: A, source: "Projet de Debout la France, mesure 22", statut: officielle }
