numero: 9
date: 2026-10-08
theme: europe-international
question: Faut-il continuer à livrer des armes à l'Ukraine ?
titreCourt: "Les armes à l'Ukraine"
contexte:
  - Depuis 2022, la France livre à l'Ukraine des armes (canons Caesar, missiles SCALP, avions Mirage 2000) et forme ses soldats ; les quantités ne sont pas publiques.
  - "Les montants dépendent de la méthode : le ministère des Armées compte 5,9 milliards d'euros de soutien militaire direct jusqu'à fin 2024, l'institut de Kiel 6,2 milliards jusqu'en juin 2026."
  - La guerre continue, et des discussions entre la Russie, l'Ukraine et les États-Unis doivent reprendre en novembre.
chiffres:
  - valeur: "5,9"
    unite: milliards d'euros
    legende: "de soutien militaire direct à l'Ukraine, du 24 février 2022 au 31 décembre 2024"
    source: { organisme: Ministère des Armées, document: rapport au Parlement sur les exportations d'armement, annee: 2025 }
  - valeur: 0,3 %
    legende: "du PIB : ce que la France consacre à l'Ukraine, au 13e rang européen"
    source: { organisme: Institut de Kiel, document: Ukraine Support Tracker, annee: 2025 }
  - valeur: "20 000"
    unite: soldats
    legende: ukrainiens formés par la France depuis 2022
    source: { organisme: Ministère des Armées, annee: 2026 }
options:
  - id: A
    libelle: Arrêter les livraisons d'armes
    implique: La France cesse d'armer l'Ukraine et mise sur la négociation.
    defenseurs: Les finances publiques ne le permettent plus, et la logique du « toujours plus d'armes » n'amène pas la paix.
    critiques: Relâcher l'aide fragiliserait l'Ukraine dans d'éventuelles négociations.
  - id: B
    libelle: Les limiter au matériel de défense
    implique: Formation et armes de défense seulement, sans nouveau financement et sans arme permettant de frapper en territoire russe.
    defenseurs: On aide l'Ukraine à se défendre sans que la France devienne cobelligérante ni qu'elle s'endette davantage.
    critiques: Une aide plafonnée laisse l'Ukraine en position de faiblesse dans d'éventuelles négociations.
  - id: C
    libelle: Les poursuivre au niveau actuel
    implique: Les livraisons et la formation continuent, dans le cadre de l'accord de sécurité conclu en 2024 pour dix ans.
    defenseurs: "Il faut continuer de former les soldats ukrainiens et de livrer des armes : l'Ukraine est la sentinelle de la sécurité de l'Europe."
    critiques: Certains jugent l'effort trop lourd pour les finances publiques, d'autres insuffisant pour que l'Ukraine négocie en position de force.
  - id: D
    libelle: Les renforcer
    implique: Plus de livraisons, notamment de défense aérienne, plus de financement et, pour certains, des armes de longue portée.
    defenseurs: Relâcher le soutien fragiliserait l'Ukraine ; il faut l'aider à tenir et à négocier en position de force.
    critiques: Le coût pèse sur des finances publiques tendues, et la France risque d'être entraînée dans une escalade face à une puissance nucléaire.
