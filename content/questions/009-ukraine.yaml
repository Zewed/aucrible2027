  le-pen: { option: B, source: "LCI, 16/09/2026", statut: officielle }
  # Sud Radio, 07/03/2024 : https://www.sudradio.fr/linvite-politique/ukraine-je-ne-veux-pas-que-la-france-entre-en-guerre-contre-la-russie-declare-fabien-roussel
  roussel: { option: B, source: "Sud Radio, 07/03/2024", statut: deduite }
