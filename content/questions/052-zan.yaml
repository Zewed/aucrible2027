    argument: "Une règle nationale uniforme fige les communes rurales et freine les logements et les usines dont les territoires ont besoin."
  - titre: "Pour garder ou renforcer"
    argument: "Une terre bâtie l'est presque pour toujours : ces sols nourrissent, filtrent l'eau et abritent la vie."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Assouplir"
    precision: "ou supprimer"
  - choix: "Garder"
    precision: "ou renforcer"
