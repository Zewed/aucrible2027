# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/052-zan.md (chaque chiffre y a sa source numérotée ;
# tableau des renvois en annexe de l'étude). Le fil : une loi qui divise par deux les terres prises pour bâtir ;
# faut-il la garder, l'assouplir ou la supprimer ? Quatre angles : logement, campagnes, faisabilité, opinion.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1, [1] [2] : article 194 (2021-2031) et article 191 (2050). La chute explique le mot « artificialisation ».
    etapes:
      - { quand: "D'ici 2031", valeur: "moitié moins" }
      - { quand: "En 2050", valeur: "zéro" }
    chute: "C'est la loi de 2021 : prendre deux fois moins de terres agricoles et naturelles qu'entre 2011 et 2021, puis rendre à la nature autant qu'on en prend."
  # Pas de mécanisme : aucun rapport « X pour 1 » suivi à deux dates ne résume le sujet.
  ecart:
    # § 2a, [3] : même mesure (fichiers fonciers), même organisme, série révisée en 2026 ; 2024 est provisoire. La
    # chute ne prête la baisse ni à la loi ni à la conjoncture : 19 549 ha dès 2020, avant la loi ; recul des mises en
    # chantier depuis 2020 (phrase du Cerema).
    titre: "Chaque année, combien d'hectares de terres sont pris pour bâtir ?"
    etapes:
      - { quand: En 2011, valeur: "29 470 ha" }
      - { quand: En 2024, valeur: "15 119 ha" }
    chute: "Presque deux fois moins : la baisse a commencé avant la loi de 2021, et s'est poursuivie depuis 2020 avec le recul de la construction."
    source: "Cerema, 2026"
  leviers:
    # § 1.3, 1.4 et 4, [7] [8] [37] [40]. « Prises pour bâtir » plutôt que « prises à la nature » : deux tiers sont
    # des terres agricoles. La chute ne présume pas que l'Assemblée examinera le texte (aucune date au 28/10/2026).
    titre: "Les terres prises pour bâtir : quatre choix"
    choix:
      - { texte: "Supprimer l'objectif", detail: "sans plafond national, chaque commune décide des terrains à bâtir" }
      - { texte: "L'assouplir", detail: "plus de temps et des exceptions, en gardant 2050" }
      - { texte: "Garder les règles", detail: "deux fois moins d'ici 2031, zéro en 2050" }
      - { texte: "Le renforcer", detail: "aller plus vite et tout compter, carrières comprises" }
    chute: "Le Sénat a voté un assouplissement en 2025, que l'Assemblée nationale n'a pas examiné : les règles n'ont pas changé."
    source: "Sénat, 2025 ; Assemblée nationale, 2026"
  # Les mots de la question : ni « bétonisation » ni « liberté des maires », deux cadrages opposés.
  camps: { pour: POUR, contre: CONTRE, objet: des règles plus souples }
  # Chaque réponse compare ce qui se compare : même document du Cerema (Q1), communes rurales des deux côtés (Q2),
  # même série du Cerema (Q3), même sondage (Q4, deux questions différentes, ce que disent les deux textes).
  questions:
    # § 2b, [3] : les deux chiffres portent sur la consommation d'espaces depuis 2011 (synthèse du Cerema, 2026).
    - question: "Prendre moins de terres, est-ce construire moins de logements ?"
      pour: { affirmation: "Oui, c'est surtout pour se loger.", chiffre: "65 %", texte: "Depuis 2011, 65 % des terres naturelles et agricoles prises ont servi à construire des logements.", source: "Cerema, 2026" }
      contre: { affirmation: "Pas là où l'on en manque le plus.", chiffre: "58 %", texte: "Depuis 2011, 58 % de ces terres ont été prises dans des communes où le logement est le moins rare.", source: "Cerema, 2026" }
    # § 2c, [4] [5] [27] : POUR parle du sol déjà bâti (stock, 2021), CONTRE des terres prises depuis (flux, 2021-2025) ;
    # c'est le cœur du désaccord, chaque texte dit ce qu'il mesure. CONTRE donne les deux repères (88 % des communes,
    # comme le Cerema ; un tiers des habitants, Insee), pour ne pas choisir le seul qui l'arrange.
    - question: "Les communes rurales sont-elles pénalisées ?"
      pour: { affirmation: "Oui, elles sont peu bâties.", chiffre: "6 %", texte: "En 2021, 6 % du sol des communes rurales était déjà bâti, goudronné ou aménagé, contre 56 % dans les grandes villes.", source: "Insee, 2026" }
      contre: { affirmation: "Non, elles en prennent le plus.", chiffre: "68 %", texte: "Depuis 2021, 68 % des terres prises l'ont été dans les communes rurales : 88 % des communes, un tiers des habitants.", source: "Cerema, 2026 ; Insee, 2021" }
    # § 2g et 2b, [3] : le 6 800 est un calcul de l'étude (plafond 2021-2031 moins 2021-2024, divisé par six, sans les
    # exceptions), ce que disent le texte et la source ; le 7 700 est un chiffre publié par le Cerema, et le texte dit
    # ce qu'il montre : des terres prises sans foyers de plus à loger.
    - question: "L'objectif de 2031 peut-il être tenu ?"
      pour: { affirmation: "Pas au rythme actuel.", chiffre: "6 800 ha", texte: "Selon un calcul, sans compter les exceptions, il faudrait tomber à 6 800 hectares par an, moins de la moitié de 2024.", source: "Cerema, 2026 (calcul)" }
      contre: { affirmation: "Oui, il y a des terres à épargner.", chiffre: "7 700", texte: "De 2011 à 2022, 7 700 communes ont pris des terres en perdant des foyers : là, on peut en prendre moins.", source: "Cerema, 2026" }
    # § 2j, [29] : même sondage (Kantar, juin 2022), deux questions différentes, que chaque texte signale ; POUR est lu
    # en premier (ordre ABBA). Aucune des deux affirmations ne nuance plus que l'autre.
    - question: "Que veulent les Français ?"
      pour: { affirmation: "Une maison plutôt qu'un appartement.", chiffre: "79 %", texte: "À une question d'un sondage de 2022, 79 % des Français préféraient vivre dans une maison plutôt qu'en appartement.", source: "Kantar pour La Fabrique de la Cité, 2022" }
      contre: { affirmation: "Moins de terres prises pour bâtir.", chiffre: "88 %", texte: "À une autre question du même sondage, 88 % des Français jugeaient important de limiter les terres prises pour bâtir.", source: "Kantar pour La Fabrique de la Cité, 2022" }
