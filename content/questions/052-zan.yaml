# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/052-zan.md (tout ce qui suit y est sourcé).
# À vérifier en priorité : la proposition de loi « Trace » n'avait pas été examinée par l'Assemblée au 28/10/2026, et
# l'assouplissement voté en avril 2026 a été censuré le 21/05/2026 (étude, § 1.3 et 1.4).
numero: 52
date: 2026-09-06
theme: logement
question: "Faut-il garder, assouplir ou supprimer l'objectif « zéro artificialisation nette » ?"
titreCourt: "Le zéro artificialisation nette"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/052-zan-constat-E6OLvgRZjNURz4s1kJPXrDZQeKULzI.mp4", duree: "3 min 43", ecrans: [0, 14.14, 26.84, 38.14, 52.24, 65.64, 79.77, 92.47, 104.47, 116.47, 126.37, 136.94, 150.37, 163.77, 177.87, 188.47, 201.87, 216], images: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/ecrans/052-zan-constat-E6OLvgRZjNURz4s1kJPXrDZQeKULzI/" }
contexte:
  - "La loi Climat et résilience de 2021 vise le « zéro artificialisation nette » en 2050 : à partir de cette date, chaque terre naturelle, agricole ou forestière bâtie ou goudronnée devra être compensée par autant de sol rendu à la nature."
  - "D'ici 2031, elle impose de prendre deux fois moins de ces terres qu'entre 2011 et 2021 ; une loi de 2023 a garanti au moins un hectare à chaque commune et compté à part les grands projets nationaux."
  - "En 2025, l'Assemblée nationale a rejeté la suppression de l'objectif, et le Sénat a voté un texte, toujours en attente à l'Assemblée, qui supprime l'étape de 2031 ; un autre assouplissement, voté en 2026, a été censuré par le Conseil constitutionnel pour une raison de procédure."
chiffres:
  - valeur: "15 119"
    unite: hectares
    legende: "de terres naturelles, agricoles et forestières prises pour bâtir en 2024"
    source: { organisme: Cerema, document: "La consommation foncière, état des lieux et enjeux", annee: 2026 }
  - valeur: "65 %"
    legende: "des terres prises pour bâtir depuis 2011 ont servi au logement"
    source: { organisme: Cerema, document: "La consommation foncière, état des lieux et enjeux", annee: 2026 }
  - valeur: "68 %"
    legende: "des terres prises pour bâtir depuis 2021 l'ont été dans des communes rurales"
    source: { organisme: "Cerema, Insee", annee: 2026 }
options:
  - id: A
    libelle: "Supprimer l'objectif"
    implique: "Les objectifs de 2031 et de 2050 sont abrogés : chaque commune décide des terrains qu'elle ouvre à la construction, dans le respect des autres règles d'urbanisme."
    defenseurs: "Une règle nationale uniforme fige le développement des communes rurales et périurbaines au profit des grandes villes, et bloque des logements, des routes ou des usines utiles : il faut rendre aux maires la liberté de construire."
    critiques: "Sans plafond national, les terres prises pourraient repartir à la hausse avec la reprise de la construction, surtout des terres agricoles, alors que ces sols nourrissent, absorbent l'eau de pluie et abritent la vie."
    # Moins de règles, plus de place aux choix des propriétaires et des communes ; note modérée, comme pour les
    # pesticides (fiche 041), pour ne pas pousser le plateau vers les bords.
    axes: { societe: 2 }
    detail:
      chiffrage:
        texte: "Aucun chiffrage n'a été trouvé. En mai 2025, l'Assemblée nationale a rejeté la suppression de l'objectif, par 179 voix contre 127."
        source: { organisme: "Assemblée nationale", annee: 2025 }
      defenseurs:
        - texte: "Les terres prises servent d'abord à se loger : 65 % depuis 2011. Les plafonner, c'est freiner la construction en pleine crise du logement."
          source: { organisme: "Cerema", annee: 2026 }
        - texte: "Les champs restent majoritaires : ils couvrent 52,6 % du pays, et les forêts 31,5 %."
          source: { organisme: "Insee", annee: 2026 }
        - texte: "Chaque maire connaît les besoins de sa commune : compter chaque hectare de la même façon partout est technocratique."
      critiques:
        - texte: "Beaucoup de terres sont prises sans besoin : de 2011 à 2022, 7 700 communes en ont pris tout en perdant des foyers."
          source: { organisme: "Cerema", annee: 2026 }
        - texte: "Depuis 2011, plus de 299 300 hectares ont été pris pour bâtir, la surface de La Réunion, et un sol bâti l'est presque pour toujours."
          source: { organisme: "Cerema", annee: 2026 }
        - texte: "La baisse récente suit d'abord le recul de la construction : sans plafond, les terres prises pourraient repartir à la hausse avec la reprise."
  - id: B
    libelle: "Assouplir l'objectif"
    implique: "L'objectif de 2050 reste, mais l'étape de 2031 est supprimée ou repoussée, chaque région fixe sa propre trajectoire, et des projets sortent du décompte, comme les usines, l'énergie renouvelable ou les logements sociaux des communes en retard, comme le prévoit le texte voté par le Sénat en 2025."
    defenseurs: "Diviser par deux d'ici 2031 est jugé impossible sur le terrain, pénalise les communes qui ont peu construit et freine la réindustrialisation : mieux vaut un chemin fixé avec les élus locaux, en gardant le cap de 2050."
    critiques: "Supprimer l'étape de 2031 permettrait de prendre plus de 80 000 hectares supplémentaires d'ici 2031, selon la Fondation pour la nature et l'homme, et obligerait les collectivités qui ont déjà revu leurs plans à recommencer."
    axes: { societe: 1 }
    detail:
      chiffrage:
        texte: "Selon une association de défense de la nature qui s'y oppose, supprimer l'étape de 2031 laisserait prendre 82 405 hectares de plus d'ici 2031, et la repousser à 2034, 24 835. Aucun chiffrage officiel n'a été trouvé."
        source: { organisme: "Fondation pour la nature et l'homme", annee: 2026 }
      defenseurs:
        - texte: "L'étape de 2031 est hors d'atteinte : il faudrait tomber à environ 6 800 hectares par an, moins de la moitié de ce qui a été pris en 2024."
          source: { organisme: "Cerema", document: "calcul d'après ses données", annee: 2026 }
        - texte: "Les communes qui ont peu construit sont pénalisées : le sol des communes rurales n'est bâti qu'à 6 %, contre 56 % dans les grandes villes."
          source: { organisme: "Insee", annee: 2026 }
        - texte: "Une usine qui revient en France ne doit pas priver sa région de terrains pour ses logements : il faut la sortir du décompte."
      critiques:
        - texte: "Les campagnes ne sont pas les moins gourmandes : depuis 2021, les communes rurales ont pris 68 % des terres."
          source: { organisme: "Cerema", annee: 2026 }
        - texte: "Les reculs s'accumulent : depuis 2021, 17 textes et plus de 350 amendements ont cherché à affaiblir l'objectif."
          source: { organisme: "Fondation pour la nature et l'homme", annee: 2026 }
        - texte: "Sans étape avant 2050, l'effort serait remis à plus tard, et l'objectif final perdrait toute prise."
    # Pas de note : l'option garde l'objectif de 2050, elle se tient près du milieu.
  - id: C
    libelle: "Garder les règles actuelles"
    implique: "Deux fois moins de terres prises entre 2021 et 2031 qu'entre 2011 et 2021, puis zéro artificialisation nette en 2050, avec les aménagements de 2023 : au moins un hectare garanti par commune et une enveloppe nationale de 12 500 hectares pour les grands projets."
    defenseurs: "Deux régions sur trois et quatre schémas intercommunaux sur cinq ont déjà revu leurs plans : changer la loi une troisième fois en quatre ans créerait de l'incertitude, alors que les terres prises chaque année ont presque diminué de moitié depuis 2011."
    critiques: "Pour les uns, l'étape de 2031 reste hors d'atteinte et met les campagnes « sous cloche », selon les maires ruraux ; pour les autres, près de 69 000 hectares échappent déjà au décompte, selon la Fondation pour la nature et l'homme."
    axes: { societe: 0 }
    detail:
      chiffrage:
        texte: "Garder l'objectif ne change rien : en 2024, 15 119 hectares ont été pris pour bâtir, le plus bas niveau depuis 2011, selon des chiffres encore provisoires."
        source: { organisme: "Cerema", annee: 2026 }
      defenseurs:
        - texte: "Les élus ont déjà fait le travail : les deux tiers des régions ont adopté leur nouveau plan d'aménagement. Changer encore la loi les ferait recommencer."
          source: { organisme: "Ministère de l'Aménagement du territoire", annee: 2026 }
        - texte: "Les petites communes ne sont pas oubliées : chacune a droit à au moins un hectare jusqu'en 2031, et les grands projets nationaux sont comptés à part."
        - texte: "L'effort peut encore s'accélérer : les plans des communes, qui appliquent la règle sur le terrain, doivent être revus d'ici 2028."
      critiques:
        - texte: "Les maires ruraux y voient une mise sous cloche des campagnes, sous la tutelle des régions qui répartissent les terres."
        - texte: "La règle actuelle traite comme perdus des sols qui ne sont pas recouverts : 47,5 % seulement des sols artificialisés sont imperméables, le reste surtout des jardins et des pelouses."
          source: { organisme: "Insee", annee: 2026 }
        - texte: "Les exceptions laissent filer des terres : les grands projets nationaux sont comptés à part, et les bâtiments agricoles comme une partie des panneaux solaires ne le sont pas."
    # La règle en vigueur après la censure du 21/05/2026 ; pas de note.
  - id: D
    libelle: "Renforcer l'objectif"
    implique: "La France va plus vite ou plus loin : zéro artificialisation nette avant 2050, par exemple dès 2040, un plafond ferme pour 2031-2041, et un décompte qui inclut tout ce qui est pris, carrières et grands projets compris."
    defenseurs: "Une terre bâtie l'est presque pour toujours : ces sols nourrissent, filtrent l'eau et abritent la vie, et l'on peut construire autrement, sur les friches, en hauteur ou en rénovant les logements vides."
    critiques: "Les communes rurales, qui ont peu de terrains déjà bâtis, ne pourraient presque plus construire, et reconstruire la ville sur elle-même coûte cher aux communes, qui manquent selon leur association d'un « modèle économique » pour le faire."
    # Plus de règles ; laissé à −1 pour ne pas pousser le plateau vers les bords.
    axes: { societe: -1 }
    detail:
      chiffrage:
        texte: "Aucun chiffrage n'a été trouvé. Selon une association de défense de la nature qui le demande, tout compter ajouterait près de 68 700 hectares de 2021 à 2031, surtout des carrières et des mines."
        source: { organisme: "Fondation pour la nature et l'homme", annee: 2026 }
      defenseurs:
        - texte: "On peut loger plus sur moins de terre : en 2023, chaque hectare pris portait 2 291 m² de bâtiments, contre 2 058 en 2011."
          source: { organisme: "Cerema", annee: 2026 }
        - texte: "Bâtir sur les terres naturelles est la première cause de la perte de plantes et d'animaux, et un sol bâti absorbe moins l'eau de pluie."
        - texte: "L'étalement coûte cher : plus de trajets en voiture, et des routes, des réseaux d'eau et d'électricité plus longs à payer pour les communes."
      critiques:
        - texte: "La plupart des Français veulent une maison : 79 % la préféreraient à un appartement, et une maison prend plus de terre."
          source: { organisme: "Kantar pour La Fabrique de la Cité", annee: 2022 }
        - texte: "Aller plus vite figerait les villages : ils ont peu de friches ou de bâtiments à reconstruire, et devraient presque cesser de bâtir."
        - texte: "Reconstruire sur des friches coûte plus cher, entre dépollution et démolition, et les communes n'ont pas les moyens de le faire à grande échelle."
