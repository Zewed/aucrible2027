# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/043-prisons.md (tout ce qui suit y est sourcé).
# Vocabulaire : « régulation carcérale » (associations, juges de l'application des peines, gauche) et « numerus clausus »
# (Écologistes ; version graduée du garde des Sceaux en 2026) sont des termes attribués ; la fiche dit « interdire de
# dépasser les places ». Ne contredit pas la fiche 005 (peines planchers) : mêmes chiffres au 1er septembre 2026.
numero: 43
date: 2026-09-15
theme: securite-justice
question: Que faire face à des prisons pleines ?
titreCourt: "Les prisons pleines"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/043-prisons-BHGNpKEZEOi7toNtURp9sk4raTq3gP.mp4", duree: "2 min" }
contexte:
  - "Au 1er septembre 2026, les prisons comptent 90 020 détenus pour 63 348 places, et 8 347 personnes dorment sur un matelas posé au sol."
  - "Le plan de 15 000 places lancé en 2018 en avait livré 35 % en 2025, et la Cour européenne des droits de l'homme a condamné la France en 2020 pour ses prisons surpeuplées."
  - "Les candidats s'opposent sur la réponse : construire davantage, punir plus souvent hors de la prison, ou interdire par la loi de dépasser le nombre de places."
chiffres:
  - valeur: "28 241"
    unite: détenus
    legende: "de plus que de places, prison par prison, au 1er septembre 2026 : deux fois plus qu'en 2016 (14 035)"
    source: { organisme: Ministère de la Justice, document: mesure de l'incarcération, annee: 2026 }
  - valeur: 35 %
    legende: "des places du plan lancé en 2018 étaient livrées en septembre 2025 ; sa fin est repoussée à 2031-2032"
    source: { organisme: Cour des comptes, document: "Le plan 15 000 places de prison", annee: 2025 }
  # § 1.1, [2] : le chiffre de ceux qui veulent faire purger les peines en prison, face aux 35 % et aux 127 €.
  - valeur: "17 400"
    unite: condamnés
    legende: "à de la prison ferme font leur peine hors d'une prison au 1er octobre 2026, le plus souvent sous bracelet"
    source: { organisme: Ministère de la Justice, document: personnes détenues au 1er octobre 2026, annee: 2026 }
  - valeur: "127"
    unite: €
    legende: "par jour pour un détenu en prison, contre 13 € pour une personne sous bracelet électronique"
    source: { organisme: Cour des comptes, document: "chiffres de l'administration pénitentiaire", annee: 2022 }
options:
  - id: A
    libelle: Interdire de dépasser les places
    implique: "La loi fixe un plafond par prison : quand elle est pleine, chaque nouvelle entrée oblige à faire sortir, sous bracelet ou avec un suivi, un condamné proche de la fin de sa peine."
    defenseurs: "Condamnée en 2020 par la Cour européenne des droits de l'homme, la France laisse 8 347 détenus dormir au sol : seule une règle obligatoire garantit un lit à chacun, car les places ne rattrapent pas le nombre de détenus."
    critiques: "La peine dépendrait des places libres et non de la décision du juge, des condamnés sortiraient avant la fin de leur peine, et deux condamnés à la même peine ne la feraient pas de la même façon."
    axes: { societe: -2 }
  - id: B
    libelle: Punir davantage hors de la prison
    implique: "Les courtes peines se font d'abord hors de la prison : bracelet, travail d'intérêt général, sursis avec obligations et suivi. On rénove les prisons et on finit les places déjà lancées, sans plafond obligatoire."
    defenseurs: "Une journée sous bracelet coûte dix fois moins qu'une journée en prison, et ceux qui finissent leur peine sous bracelet récidivent moins, même à profil égal, selon la Cour des comptes."
    critiques: "Depuis vingt ans, ces peines ont augmenté en même temps que le nombre de détenus sans le faire baisser, et le travail d'intérêt général ne réduit pas plus la récidive que la prison."
    axes: { societe: -1 }
  - id: C
    libelle: Construire et punir aussi hors de la prison
    implique: "On construit plus vite, y compris en modules préfabriqués, et les courtes peines continuent de se faire souvent sous bracelet ou en travail d'intérêt général, sans changer leurs règles ni fixer de plafond."
    defenseurs: "Aucun levier ne suffit seul : les places manquent et se construisent lentement, et les peines hors de la prison coûtent moins cher pour ceux qui n'ont pas besoin d'être enfermés."
    critiques: "Pour les uns, construire coûte cher et n'a jamais suivi la hausse du nombre de détenus ; pour les autres, des condamnés à la prison ferme continuent de faire leur peine chez eux."
    axes: { societe: 0 }
  - id: D
    libelle: Construire et faire purger les peines en prison
    implique: "On construit bien au-delà du plan actuel, et les peines de prison ferme se font en prison : fin de l'aménagement automatique des courtes peines et des réductions de peine automatiques."
    defenseurs: "Une peine prononcée doit être exécutée : 17 400 condamnés à de la prison ferme font aujourd'hui leur peine hors de la prison, et la sanction perd son sens si elle dépend des places."
    critiques: "Le plan lancé en 2018 avait livré 35 % de ses places en 2025, pour un coût passé de 3,9 à 5,7 milliards d'euros, et enfermer plus de courtes peines remplirait encore des prisons pleines."
    axes: { societe: 2 }
