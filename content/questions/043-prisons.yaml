# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/043-prisons.md (chaque chiffre y a sa source
# numérotée). Le fil : les détenus augmentent plus vite que les places ; faut-il construire, punir hors de la prison,
# faire les deux, ou plafonner ?
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1, [1] : même source et même date (1er septembre) pour les deux valeurs.
    etapes:
      - { quand: "En septembre 2016", valeur: "68 253 détenus" }
      - { quand: "En septembre 2026", valeur: "90 020 détenus" }
    chute: "… pour 63 348 places, et 8 347 matelas posés au sol."
  # Pas de mécanisme : le rapport détenus pour une place (1,4 pour 1) existe, mais l'image du mécanisme montre
  # des payeurs et des retraités.
  ecart:
    # § 1.1 et 2a, [1] : « détenus en surnombre », compté établissement par établissement par le ministère (d'où
    # « prison par prison » : 28 241 dépasse 90 020 − 63 348, car 1 569 places sont libres ailleurs) ;
    # 27 329 des 28 241 sont en maison d'arrêt (prévenus et peines courtes).
    titre: "Combien de détenus de plus que de places, prison par prison ?"
    etapes:
      - { quand: "En septembre 2016", valeur: "14 035" }
      - { quand: "En septembre 2026", valeur: "28 241" }
    chute: "Ce nombre a doublé en dix ans. Presque tous sont dans les prisons des courtes peines et des personnes pas encore jugées."
    source: "Ministère de la Justice, 2026"
  leviers:
    # § 2b, 2c et 2f, [3] [4] [5] : les quatre options de la fiche, à égalité ; la chute dit ce que coûte chacune.
    titre: "Quatre réponses possibles"
    choix:
      - { texte: Plafonner, detail: "interdire de dépasser le nombre de places" }
      - { texte: "Punir hors de la prison", detail: "bracelet, travail d'intérêt général, sursis avec suivi" }
      - { texte: "Faire les deux", detail: "construire plus vite et punir aussi hors de la prison" }
      - { texte: "Construire davantage", detail: "et faire purger en prison les peines de prison" }
