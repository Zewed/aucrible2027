  philippe: { option: D, source: "Europe 1, meeting d'Édouard Philippe à Marseille, 17/05/2025 ; « Pour une France plus sûre », edouardphilippe.fr, 2026 ; PPL Horizons « faire exécuter les peines d'emprisonnement ferme », scrutin n° 1262, 03/04/2025 (Horizons 29 pour sur 29)", statut: deduite }
