  ruffin: { option: A, source: "Assemblée nationale, amendement n° 15 (groupe Écologiste et social, cosigné par F. Ruffin) à la proposition de loi « Faire exécuter les peines d'emprisonnement ferme » (n° 1655), 03/04/2026", statut: deduite }
# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/043-prisons.md (chaque chiffre y a sa source
# numérotée). Le fil : les détenus augmentent plus vite que les places ; faut-il construire, punir hors de la prison,
# faire les deux, ou plafonner ?
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1, [1] : même source et même date (1er septembre) pour les deux valeurs.
    etapes:
      - { quand: "En septembre 2016", valeur: "68 253 détenus" }
      - { quand: "En septembre 2026", valeur: "90 020 détenus" }
    chute: "… pour 63 348 places, et 8 347 matelas posés au sol."
  # Pas de mécanisme : le rapport détenus pour une place (1,4 pour 1) existe, mais l'image du mécanisme montre
  # des payeurs et des retraités.
  ecart:
    # § 1.1 et 2a, [1] : « détenus en surnombre », compté établissement par établissement par le ministère (d'où
    # « prison par prison » : 28 241 dépasse 90 020 − 63 348, car 1 569 places sont libres ailleurs) ;
    # 27 329 des 28 241 sont en maison d'arrêt (prévenus et peines courtes).
    titre: "Combien de détenus de plus que de places, prison par prison ?"
    etapes:
      - { quand: "En septembre 2016", valeur: "14 035" }
      - { quand: "En septembre 2026", valeur: "28 241" }
    chute: "Ce nombre a doublé en dix ans. Presque tous sont dans les prisons des courtes peines et des personnes pas encore jugées."
    source: "Ministère de la Justice, 2026"
  leviers:
    # § 2b, 2c et 2f, [3] [4] [5] : les quatre options de la fiche, à égalité ; la chute dit ce que coûte chacune.
    titre: "Quatre réponses possibles"
    choix:
      - { texte: Plafonner, detail: "interdire de dépasser le nombre de places" }
      - { texte: "Punir hors de la prison", detail: "bracelet, travail d'intérêt général, sursis avec suivi" }
      - { texte: "Faire les deux", detail: "construire plus vite et punir aussi hors de la prison" }
      - { texte: "Construire davantage", detail: "et faire purger en prison les peines de prison" }
    chute: "Chaque réponse a un coût : des places à bâtir, des agents pour suivre les peines dehors, ou des sorties avant la fin de la peine."
    source: "Cour des comptes, 2023 et 2025"
  camps: { pour: POUR, contre: CONTRE, objet: "plus de places de prison" }
  questions:
    # § 1.3 et 2b, [5] [7] : la vitesse de construction des deux côtés. Les 18 mois sont une prévision du ministère
    # (le texte le dit), contre « près de sept ans » pour une prison classique [7] ; les 35 % sont un bilan de la Cour
    # (5 411 places nettes sur 15 471 en septembre 2025).
    - question: "Peut-on construire assez vite ?"
      pour: { affirmation: "Oui, en préfabriqué.", chiffre: 18 mois, texte: "Le ministère prévoit 3 000 places en modules préfabriqués, prêtes en dix-huit mois contre près de sept ans.", source: "Ministère de la Justice, 2026" }
      contre: { affirmation: "Le plan de 2018 est en retard.", chiffre: 35 %, texte: "En 2025, le plan lancé en 2018 avait livré 35 % de ses 15 000 places. Sa fin est repoussée à 2031 ou 2032.", source: "Cour des comptes, 2025" }
    # § 2d, [4] : deux taux du même rapport, chacun avec sa comparaison à profil égal, seule à comparer des condamnés
    # semblables. Travail d'intérêt général 58,5 % en cinq ans contre 64,5 % pour une prison de moins de six mois
    # (cohorte 2010) ; à profil égal, −0,1 point (« ne semble pas plus efficace que l'emprisonnement ferme »). Bracelet
    # à la place de la prison 37,6 % en trois ans contre 56,1 % après une sortie sans aménagement (cohorte 2016-2017) ;
    # à profil égal, −13,5 points (et non les 18,5 points bruts). Les durées diffèrent et l'étude n'a pas d'autre
    # mesure : chaque texte dit la sienne en tête. Chaque camp cite la peine qui l'appuie : le texte dit laquelle.
    - question: "Punir hors de la prison, est-ce moins de récidive ?"
      pour: { affirmation: "Pas le travail d'intérêt général.", chiffre: 6 sur 10, texte: "En cinq ans, près de six sur dix récidivent après un travail d'intérêt général : à profil égal, comme après la prison.", source: "Cour des comptes, 2025" }
      contre: { affirmation: "Oui, avec le bracelet.", chiffre: 38 %, texte: "En trois ans, 38 % récidivent si un bracelet remplace la prison : à profil égal, 13,5 points de moins qu'en prison.", source: "Cour des comptes, 2025" }
    # § 1.1, 1.4 et 2f, [2] [3] [14] [16]. 17 400 : condamnés à de la prison ferme hors d'un établissement au 1er
    # octobre 2026 ; 16 729 personnes sous bracelet au 1er septembre. La condamnation de 2020 vient de la Cour européenne
    # des droits de l'homme ; l'invitation, du Comité des ministres du Conseil de l'Europe (pas de l'Union européenne) :
    # en mars 2024, « examiner sérieusement et rapidement l'idée » d'un mécanisme contraignant, redit en juin 2026 ; elle
    # ne contraint pas et n'est connue que par des sources secondaires, d'où « y invite » et « étudier ».
    - question: "Faut-il interdire de dépasser le nombre de places ?"
      pour: { affirmation: "Non, une peine doit être purgée.", chiffre: "17 400", texte: "17 400 condamnés à de la prison ferme font leur peine hors de la prison, le plus souvent sous bracelet.", source: "Ministère de la Justice, 2026" }
      contre: { affirmation: "Oui, le Conseil de l'Europe y invite.", chiffre: "32 détenus", texte: "Condamnée en 2020 pour 32 détenus en prisons surpeuplées, la France est invitée depuis 2024 à étudier un plafond obligatoire.", source: "Cour européenne des droits de l'homme, 2020 ; Conseil de l'Europe, 2024" }
    # § 2i, [17] : le même sondage pour les deux camps (1 171 personnes en ligne, juin 2018) ; le plus récent qui pose
    # les deux questions. Le sondage CSA de 2022 (86 % pour construire) n'a pas de question en face. Les deux textes
    # sont au passé pour dater le sondage. Les questions diffèrent (tous les délits ; les plus jeunes condamnés à moins
    # de cinq ans) : chaque affirmation dit son champ.
    - question: "Les Français veulent-ils plus de prison ?"
      pour: { affirmation: "Oui, même pour les délits.", chiffre: 59 %, texte: "Dans un sondage de 2018, 59 % des Français jugeaient la prison ferme pas assez fréquente pour les délits.", source: "Harris Interactive, 2018" }
      contre: { affirmation: "Pas pour les plus jeunes.", chiffre: 63 %, texte: "Dans ce sondage, 63 % voulaient un travail d'intérêt général pour les plus jeunes condamnés à moins de 5 ans.", source: "Harris Interactive, 2018" }
