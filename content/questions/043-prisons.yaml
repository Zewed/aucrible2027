    url: https://www.ccomptes.fr/sites/default/files/2025-03/20250304-Evaluation-2-peines-alternatives-a-l-incarceration.pdf
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour construire davantage"
    argument: "Une peine prononcée doit être exécutée : sans places, des condamnés à la prison ferme font leur peine chez eux."
  - titre: "Pour avoir moins de détenus"
    argument: "Une journée sous bracelet coûte dix fois moins qu'une journée en prison, et ceux qui finissent leur peine sous bracelet récidivent moins."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
