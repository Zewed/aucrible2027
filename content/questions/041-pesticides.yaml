# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/041-pesticides.md (tout ce qui suit y est sourcé).
# À vérifier en priorité : aucune exception accordée par l'Anses n'a été trouvée au 28/10/2026, et une proposition de
# loi qui veut supprimer ces exceptions est examinée à l'Assemblée le 29/10/2026 (voir l'étude, § 1.4).
numero: 41
date: 2026-09-17
theme: ecologie-energie
question: Faut-il assouplir ou durcir les règles sur les pesticides ?
titreCourt: "Les pesticides"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/041-pesticides-ewQixq8Rsfr5JBYwU21jOIaYTp4Y6V.mp4", duree: "1 min 50" }
contexte:
  - "Depuis 2018, la France interdit les néonicotinoïdes, une famille d'insecticides dont fait partie l'acétamipride, que l'Union européenne autorise jusqu'en 2033."
  - "En 2025, le Conseil constitutionnel a censuré leur retour prévu par la loi Duplomb ; en 2026, il a validé une loi qui permet des exceptions pour quatre cultures, trois ans au plus, si l'Anses, l'agence sanitaire, les accorde."
  - "Le glyphosate reste autorisé en Europe jusqu'en 2033, et l'objectif officiel est de réduire de moitié l'usage et les risques des pesticides d'ici 2030."
chiffres:
  - valeur: "4"
    unite: cultures
    legende: "noisette, betterave, pomme et cerise : celles où l'Anses peut accorder une exception depuis août 2026, pour trois ans au plus"
    source: { organisme: Conseil constitutionnel, document: décision n° 2026-914 DC, annee: 2026 }
  - valeur: "1 sur 27"
    legende: "la France est le seul pays de l'Union européenne à interdire les produits à base d'acétamipride"
    source: { organisme: Sénat, document: rapport n° 762, annee: 2026 }
  - valeur: "3 sur 10"
    legende: "Français ont reçu au moins une fois en 2024 une eau du robinet dépassant la limite de qualité fixée pour les pesticides"
    source: { organisme: Ministère de la Santé, document: bilan de la qualité de l'eau, annee: 2024 }
options:
  - id: A
    libelle: "Autoriser ce que l'Europe autorise"
    implique: "Les pesticides autorisés dans l'Union européenne, comme l'acétamipride, redeviennent utilisables en France pour toutes les cultures qui en ont besoin, sans liste de quatre cultures ni limite de trois ans."
    defenseurs: "La France est le seul pays de l'Union à interdire l'acétamipride : ses agriculteurs perdent des récoltes face à des voisins qui l'utilisent, et la France importe alors ce qu'elle ne produit plus."
    critiques: "L'agence européenne a divisé par cinq en 2024 la dose d'acétamipride jugée sans risque, et le Conseil constitutionnel a censuré en 2025 une dérogation sans limite de durée ni de cultures, au nom du droit à un environnement sain."
    # Moins de règles, plus de place au marché ; note modérée, comme pour les vols intérieurs (fiche 035).
    axes: { economie: 1 }
  - id: B
    libelle: "Garder les règles actuelles"
    implique: "L'interdiction des néonicotinoïdes reste la règle ; l'Anses peut accorder une exception d'un an, renouvelable deux fois, pour la noisette, la betterave, la pomme ou la cerise, en cas de menace grave sans autre solution. Le glyphosate reste autorisé avec des restrictions, et l'objectif de réduire de moitié l'usage et les risques d'ici 2030 est maintenu."
    defenseurs: "Un passage étroit, dont la décision revient aux scientifiques de l'Anses, pour des filières sans solution prête, comme la noisette, que l'Inrae juge « au bord de la faillite » ; le Conseil constitutionnel l'a jugé suffisamment encadré."
    critiques: "Pour les uns, c'est le retour de produits qui nuisent aux pollinisateurs, à l'eau et aux sols, ce que reconnaît le Conseil constitutionnel ; pour les autres, quatre cultures et trois ans laissent les agriculteurs français désavantagés face à leurs voisins."
    # La règle en vigueur depuis la loi du 18/08/2026 ; pas de note, elle se tient au milieu.
  - id: C
    libelle: "Revenir à l'interdiction sans exception"
    implique: "Les exceptions ouvertes en 2026 sont supprimées : l'acétamipride et le flupyradifurone redeviennent interdits sans exception, comme de 2023 à 2026 ; les autres règles, dont l'autorisation du glyphosate, restent les mêmes."
    defenseurs: "En 2018, l'Anses trouvait au moins une alternative sans produit chimique pour 78 % des usages de ces insecticides : les exceptions retardent la recherche de solutions durables et exposent les pollinisateurs, l'eau et les sols."
    critiques: "Pour la noisette, l'Inrae juge les solutions de remplacement pas encore opérationnelles, et les agriculteurs français resteraient les seuls de l'Union privés de l'acétamipride."
    # Un peu plus strict que la règle actuelle ; pas de note, pour ne pas pousser le plateau vers les bords.
  - id: D
    libelle: "Interdire davantage, glyphosate compris"
    implique: "En plus de supprimer les exceptions, la France interdit d'autres pesticides autorisés en Europe, à commencer par le glyphosate, et fixe un calendrier pour sortir des pesticides de synthèse, de tout de suite pour les plus dangereux à 2050 selon ses partisans."
    defenseurs: "Les agriculteurs sont les premiers exposés : selon l'Inserm, le lien entre les pesticides et des maladies comme Parkinson ou certains cancers est fortement présumé, et près de 3 Français sur 10 ont reçu au moins une fois en 2024 une eau dépassant la limite fixée pour les pesticides."
    critiques: "L'évaluation européenne de 2023 n'a relevé aucun risque critique pour le glyphosate, autorisé dans l'Union jusqu'en 2033 ; l'interdire en France creuserait l'écart avec les voisins, alors que les solutions de remplacement ne sont pas toutes prêtes selon l'Inrae."
    # Plus de règles ; laissé à −1 pour ne pas pousser le plateau vers les bords.
    axes: { economie: -1 }
