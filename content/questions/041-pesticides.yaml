# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour assouplir ou garder les règles"
    argument: "La France est le seul pays de l'Union à interdire l'acétamipride : ses agriculteurs perdent des récoltes face à leurs voisins."
  - titre: "Pour les durcir"
    argument: "Ces insecticides nuisent aux pollinisateurs, à l'eau et aux sols, et des alternatives sans produit chimique existent pour la plupart des usages."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Assouplir"
    precision: "ou garder les règles"
  - choix: "Durcir"
    precision: "sans exception, ou plus"
