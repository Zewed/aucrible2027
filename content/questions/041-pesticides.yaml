# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/041-pesticides.md (chaque chiffre y a sa source
# numérotée ; tableau des renvois en annexe de l'étude). Le fil : un insecticide interdit en France et permis en Europe ;
# faut-il assouplir ou durcir ? Quatre angles à poids égal : santé, environnement, revenu des agriculteurs, concurrence.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1 et 1.3, [2] [14] [16].
    etapes:
      - { quand: "Interdit en France depuis", valeur: "2018" }
      - { quand: "Autorisé en Europe jusqu'en", valeur: "2033" }
    chute: "C'est l'acétamipride, un insecticide. Depuis août 2026, la loi française permet des exceptions."
  # Pas de mécanisme : aucun rapport « X pour 1 » suivi à deux dates ne résume le sujet.
  ecart:
    # § 2a, [20] : même périmètre (ventes hors produits utilisables en bio et de biocontrôle), même unité, même organisme.
    titre: Combien de pesticides vend-on chaque année ?
    etapes:
      - { quand: En 2015-2017, valeur: "52 700 tonnes" }
      - { quand: En 2024, valeur: "42 900 tonnes" }
    chute: "Sans compter les produits utilisables en bio : près d'un cinquième de moins, avec une remontée en 2024."
    source: "Ministère de la Transition écologique, 2025"
  leviers:
    # § 1.3, 2i et 4, [2] [38] [42].
    titre: "Pour les pesticides, quatre choix"
    choix:
      - { texte: Autoriser, detail: "ce que l'Europe autorise, comme l'acétamipride" }
      - { texte: Garder les règles, detail: "des exceptions pour quatre cultures, trois ans au plus" }
      - { texte: Interdire sans exception, detail: "comme de 2023 à 2026" }
      - { texte: Interdire davantage, detail: "le glyphosate aussi, jusqu'à sortir des pesticides de synthèse" }
    chute: "Depuis août 2026, c'est l'Anses, l'agence sanitaire, qui accorde ou refuse chaque exception."
    source: "Conseil constitutionnel, 2026 ; programmes des candidats, 2026"
  # Les mots de la question : ni « pesticides interdits » ni « produits autorisés en Europe », deux cadrages opposés.
  camps: { pour: POUR, contre: CONTRE, objet: des règles plus souples }
  # Relu une fois par deux relecteurs, l'un pour assouplir, l'autre contre. Chaque réponse compare ce qui se compare :
  # même organisme européen (Q1), pesticides dans leur ensemble (Q2), mêmes insecticides (Q3), règles comparées aux
  # voisins (Q4). « Autorisé en Europe jusqu'en 2033 » n'est dit qu'une fois, dans l'accroche, et « seule à
  # l'interdire » qu'une fois, en Q4 ; Q1 et Q2 portent sur tous les pesticides, pas sur l'acétamipride seul.
  questions:
    # § 2b, [14] [37] : POUR sur tous les aliments contrôlés, CONTRE sur un produit ; même organisme.
    - question: "Ce qu'on mange contient-il des pesticides dangereux ?"
      pour: { affirmation: "Rarement au-delà des limites légales.", chiffre: "96 %", texte: "En 2023, plus de 96 % des aliments contrôlés en Europe restaient sous la limite légale de résidus de pesticides.", source: "Autorité européenne de sécurité des aliments, 2025" }
      contre: { affirmation: "Les doutes ont grandi sur certains.", chiffre: "5 fois", texte: "En 2024, l'agence européenne a divisé par cinq la dose d'acétamipride jugée sans risque chaque jour.", source: "Autorité européenne de sécurité des aliments, 2024" }
    # § 2a et 2d, [21] [23] [26] : l'indicateur a remonté en 2024 (50 → 53), d'où « moins qu'avant » ; Générations
    # futures le conteste. Le texte CONTRE ne parle pas de hausse : la limite « on cherche plus de molécules » ne joue pas.
    - question: "Les pesticides abîment-ils l'eau et la nature ?"
      pour: { affirmation: "Moins qu'avant.", chiffre: "−47 %", texte: "Selon l'indicateur officiel, que des associations contestent, les risques des pesticides ont baissé de 47 % depuis 2011-2013.", source: "Ministère de l'Agriculture, 2026" }
      contre: { affirmation: "Oui, jusqu'au robinet.", chiffre: "3 sur 10", texte: "En 2024, près de 3 Français sur 10 ont reçu au moins une fois une eau dépassant la limite en pesticides.", source: "Ministère de la Santé, 2025" }
    # § 1.1, 2f et 2h, [10] [17] [19] : les deux réponses portent sur ces insecticides, pas sur tous les pesticides.
    # 2020 est l'année de l'épidémie (pression « globalement modérée » depuis, selon l'Inrae) ; l'Anses a trouvé « au
    # moins une alternative », pas une solution aussi efficace.
    - question: "Les agriculteurs peuvent-ils se passer de ces insecticides ?"
      pour: { affirmation: "Pas pour certaines cultures.", chiffre: "30 %", texte: "En 2020, sans ces insecticides, une épidémie portée par des pucerons a fait perdre 30 % des betteraves.", source: "Sénat, 2026" }
      contre: { affirmation: "Oui, dans la plupart des cas.", chiffre: "78 %", texte: "En 2018, l'agence sanitaire a trouvé au moins une alternative sans produit chimique pour 78 % des usages de ces insecticides.", source: "Anses, 2018" }
    # § 2g et 2j, [10] [35] : CONTRE nomme aussi les voisins qui autorisent plus (Italie, Espagne), données de janvier 2024.
    - question: "La France se pénalise-t-elle face à ses voisins ?"
      pour: { affirmation: "Oui, seule à interdire l'acétamipride.", chiffre: "1 sur 27", texte: "La France est le seul pays de l'Union européenne à interdire les produits à base d'acétamipride.", source: "Sénat, 2026" }
      contre: { affirmation: "Pas dans l'ensemble.", chiffre: "283", texte: "En 2024, la France autorisait 283 substances de pesticides, plus que l'Allemagne (262) ou la Pologne (265), moins que l'Italie ou l'Espagne.", source: "Public Sénat, 2024" }
