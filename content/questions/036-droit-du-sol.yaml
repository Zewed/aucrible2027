# BROUILLON À VÉRIFIER : rédigé par IA le 27/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/036-droit-du-sol.md (tout ce qui suit y est sourcé).
numero: 36
date: 2026-09-22
theme: immigration
question: "Faut-il restreindre le droit du sol ?"
titreCourt: "Le droit du sol"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/036-droit-du-sol-w4ZaZg9GRUbBQeLFND76f5M2jMNwzy.mp4", duree: "2 min" }
contexte:
  - "Un enfant né en France de parents étrangers devient français à 18 ans s'il y a vécu au moins cinq ans depuis ses 11 ans, ou plus tôt, dès 13 ans, sur demande."
  - "À Mayotte, une loi de 2025 exige en plus que les deux parents de l'enfant aient séjourné régulièrement en France depuis plus d'un an à sa naissance ; le Conseil constitutionnel l'a validée en raison de la situation propre à l'île."
  - "Le Conseil constitutionnel a aussi jugé que la Constitution ne garantit pas un droit du sol sans condition ; plusieurs candidats veulent le restreindre ou le supprimer, d'autres le garder ou l'élargir."
chiffres:
  - valeur: "34 904"
    legende: "jeunes nés en France devenus français par le droit du sol en 2025, sur 98 139 nouveaux Français"
    source: { organisme: "Ministères de l'Intérieur et de la Justice", document: "L'accès à la nationalité française en 2025", annee: 2025 }
  - valeur: "46 %"
    legende: "des bébés nés à Mayotte en 2024 ont deux parents étrangers, contre 28 % en 2014"
    source: { organisme: Insee, document: "Bilan démographique 2024 à Mayotte", annee: 2025 }
  - valeur: "50 %"
    legende: "des personnes interrogées en février 2024 voulaient supprimer le droit du sol, 39 % le garder et 10 % l'élargir (sondage en ligne)"
    source: { organisme: Elabe, document: "sondage pour BFMTV", annee: 2024 }
options:
  - id: A
    libelle: "L'élargir, français dès la naissance"
    implique: "Tout enfant né en France, Mayotte comprise, est français dès sa naissance, quelle que soit la situation de ses parents, sans attendre 13 ou 18 ans."
    defenseurs: "Un enfant né en France est un enfant de la République : le faire français dès la naissance, comme aux États-Unis, l'aide à s'intégrer et met fin aux règles à part de Mayotte."
    critiques: "La nationalité serait donnée sans exiger d'avoir vécu en France, y compris à des enfants qui partiront ensuite ; ses opposants y voient un facteur d'attraction pour l'immigration irrégulière, en particulier à Mayotte."
    axes: { societe: -2 }
  - id: B
    libelle: "Le garder tel qu'il est"
    implique: "Les règles actuelles restent : un enfant né en France de parents étrangers devient français à 18 ans s'il y a vécu au moins cinq ans depuis ses 11 ans, ou dès 13 ans sur demande."
    defenseurs: "La règle, en place depuis 1998, demande déjà cinq ans de vie en France, et 94 % des enfants de deux parents immigrés se sentent français : rien ne justifie de la durcir."
    critiques: "La nationalité reste acquise sans démarche à 18 ans et, hors Mayotte, sans condition sur la situation des parents, ce que ses opposants jugent trop large face à l'immigration irrégulière."
    axes: { societe: -1 }
  - id: C
    libelle: "Le restreindre"
    implique: "Le droit du sol reste, avec des conditions plus strictes : une démarche obligatoire du jeune, comme de 1993 à 1998, ou un séjour régulier des parents à la naissance, comme à Mayotte."
    defenseurs: "On ne devient pas français par hasard : la nationalité doit être un choix exprimé et ne pas profiter d'un séjour irrégulier des parents ; le Conseil constitutionnel a admis la démarche en 1993 et la condition sur les parents à Mayotte."
    critiques: "De 1993 à 1998, la démarche obligatoire a laissé de côté des jeunes mal informés, et les filles la demandaient moins souvent ; hors de Mayotte, une condition sur les parents n'a jamais été jugée et ses opposants y voient une atteinte à l'égalité."
    axes: { societe: 1 }
  - id: D
    libelle: "Le supprimer"
    implique: "Naître et grandir en France ne donne plus droit à la nationalité : il faut un parent français ou une naturalisation ; ses partisans proposent de le décider par référendum."
    defenseurs: "La nationalité se demande et se mérite : elle doit couronner une assimilation vérifiée, par la naturalisation, et non découler du lieu de naissance ; la plupart des pays européens appliquent le droit du sang."
    critiques: "Des enfants nés et élevés en France resteraient étrangers s'ils ne sont pas naturalisés, ce qui rompt avec une règle appliquée depuis 1889 ; ses opposants y voient une inégalité entre enfants nés au même endroit."
    axes: { societe: 2 }
