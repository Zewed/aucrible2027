    chute: "… un enfant né en France de parents étrangers devient français, s'il y a vécu au moins cinq ans."
  leviers:
    # § 1.3 et § 4 : les quatre options de la fiche, à égalité.
    titre: "Quatre choix possibles"
    choix:
      - { texte: "L'élargir", detail: "français dès la naissance, pour tout enfant né en France" }
