  # Relu le 28/10/2026 par deux relecteurs, l'un pour restreindre, l'autre contre ; chaque réponse compare ce qui se compare.
  questions:
    # § 2c, [9] [30] : même territoire (Mayotte), années voisines. Le CONTRE compare 2024 à 2017, dernière mesure
    # avant la règle de 2018 (de 2014 à 2017, la part montait déjà de 28 à 42 %). Aucune étude causale trouvée.
    - question: "Le droit du sol fait-il venir des migrants ?"
      pour: { affirmation: "Oui, il permet aux parents de rester.", chiffre: "1 637", texte: "À Mayotte, 1 637 enfants sont devenus français par le droit du sol en 2023. Leurs parents peuvent alors obtenir des papiers.", source: "Assemblée nationale, 2025" }
      contre: { affirmation: "Non, la hausse a continué après 2018.", chiffre: "46 %", texte: "En 2024, 46 % des bébés nés à Mayotte avaient deux parents étrangers, contre 42 % en 2017, avant la règle de 2018.", source: "Insee et Assemblée nationale, 2025" }
    # § 2a et 2b, [3] [4] [27] : 32 923 déclarations sur 34 904 en 2025 (calcul de l'étude), même périmètre que la question.
    - question: "Faut-il demander à devenir français ?"
      pour: { affirmation: "Oui, comme de 1993 à 1998.", chiffre: "16 à 21 ans", texte: "De 1993 à 1998, il fallait demander la nationalité entre 16 et 21 ans. Le Conseil constitutionnel l'avait accepté.", source: "Conseil constitutionnel, 1993" }
      contre: { affirmation: "Non, presque tous le demandent déjà.", chiffre: "94 %", texte: "En 2025, 94 % des jeunes devenus français par le droit du sol l'avaient demandé, eux ou leurs parents, avant 18 ans.", source: "Ministères de l'Intérieur et de la Justice, 2026" }
    # § 2f, [40] [41] : six juges contre le décret, dont cinq sur le fondement de la Constitution.
    - question: "Que font les autres pays ?"
      pour: { affirmation: "Plusieurs exigent un séjour légal des parents.", chiffre: "3 ans sur 4", texte: "En Irlande, un enfant né sur place est irlandais si un parent y a vécu légalement trois des quatre années précédentes.", source: "Loi irlandaise, 2004" }
      contre: { affirmation: "Les États-Unis l'accordent dès la naissance.", chiffre: "6 juges sur 9", texte: "La Cour suprême a annulé, à six juges sur neuf, un décret refusant la nationalité aux enfants de parents en situation irrégulière.", source: "Cour suprême des États-Unis, 2026" }
    # § 2h, [43] : le même sondage pour les deux camps ; la question portait sur la France hors Mayotte.
    - question: "Que veulent les Français ?"
      pour: { affirmation: "La moitié veut le supprimer.", chiffre: "50 %", texte: "Dans un sondage de février 2024, la moitié des personnes interrogées voulaient supprimer le droit du sol.", source: "Elabe pour BFMTV, 2024" }
      contre: { affirmation: "L'autre moitié veut le garder ou l'élargir.", chiffre: "49 %", texte: "Dans le même sondage, 39 % voulaient le garder tel quel et 10 % l'élargir à tout enfant né en France.", source: "Elabe pour BFMTV, 2024" }
