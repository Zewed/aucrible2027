# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/049-service-national.md (chaque chiffre y a sa source
# numérotée). Le fil : on est passé de l'obligation au volontariat ; faut-il revenir à l'obligation, et sous quelle forme ?
# Pas de mécanisme : aucun rapport « X pour 1 » ne résume le sujet.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1 et 1.2, [1] [3] [12] [14] : environ 30 % d'exemptés juste avant la fin, d'où « la plupart ». Toutes les formes
    # de service sont volontaires depuis 1997 (pas depuis 2026) ; les 3 000 sont ceux du nouveau service, sous l'uniforme.
    etapes:
      - { quand: "Avant 1997", valeur: "Obligatoire" }
      - { quand: "Depuis 1997", valeur: "Volontaire" }
    chute: "Avant, la plupart des garçons étaient appelés. Aujourd'hui, 3 000 jeunes volontaires, filles et garçons, servent dix mois sous l'uniforme."
  ecart:
    # § 1.1, [3] [4] [9] [12] : la trajectoire votée (3 000 puis 10 000), face à une génération de 820 000 à 850 000 jeunes.
    titre: "Combien de jeunes dans le nouveau service ?"
    etapes:
      - { quand: "En 2026", valeur: "3 000" }
      - { quand: "En 2030", valeur: "10 000", projection: true }
    chute: "Une génération compte plus de 800 000 jeunes. Un service obligatoire changerait d'échelle."
    source: "Loi de programmation militaire, 2026 ; France Stratégie, 2025"
  leviers:
    # Les quatre options de la fiche, à égalité et dans l'ordre. § 1.3, 2d et 2j, [1] [3] [12]. La chute : le constat
    # commun de l'étude sur le coût (§ 2d et 3, [9] [12]), payé par l'État, du bas (service volontaire) au haut (service
    # militaire obligatoire) des scénarios de France Stratégie.
    titre: "Faut-il obliger ? Quatre réponses"
    choix:
      - { texte: "Arrêter le nouveau service", detail: "miser sur la réserve de l'armée et le service civique" }
      - { texte: "Le volontariat", detail: "dix mois sous l'uniforme pour celles et ceux qui le choisissent" }
      - { texte: "Un service civique obligatoire", detail: "quelques mois au service des autres, l'armée pour qui le veut" }
      - { texte: "Un service militaire obligatoire", detail: "quelques mois sous l'uniforme pour tous les jeunes" }
    chute: "Selon sa durée et sa forme, civile ou militaire, un service coûterait à l'État de quelques centaines de millions à plus de 14 milliards d'euros par an."
    source: "Loi du 16 août 2026 ; France Stratégie, 2025"
  camps: { pour: POUR, contre: CONTRE, objet: "un service obligatoire" }
  # POUR rassemble les options C et D, CONTRE les options A et B. Relu par IA le 28/10/2026 en deux relectures opposées
  # (pour l'obligation, puis contre), à vérifier par l'auteur.
  questions:
    # § 2b, [9] [10]. Les deux réponses portent sur deux services volontaires différents (SNU d'un côté, service civique
    # de l'autre) et mesurent chacune l'écart entre les jeunes et les places ; chaque carte nomme son service et son année
    # (2023, 2025), pour que la comparaison ne passe pas pour un même dispositif.
    - question: "Le volontariat suffit-il ?"
      pour: { affirmation: "Non, il n'a pas fait le plein.", chiffre: "40 000", texte: "En 2023, le service national universel, volontaire, a accueilli 40 000 jeunes. L'objectif était de 64 000.", source: "Cour des comptes, 2024" }
      contre: { affirmation: "Oui, les candidats sont nombreux.", chiffre: "3 fois", texte: "En 2025, le service civique, volontaire lui aussi, recevait trois fois plus de demandes que de missions disponibles.", source: "Sénat, 2025" }
    # § 2h, [12] [13] : la même source pour les deux réponses ; la Suède est l'un des trois pays cités par la réponse POUR
    # (Lituanie 2015, Suède 2017, Croatie 2025).
    - question: "Nos voisins reviennent-ils à l'obligation ?"
      pour: { affirmation: "Oui, dix pays de l'Union l'ont.", chiffre: "10 pays", texte: "Dix pays de l'Union européenne ont un service militaire obligatoire. La Lituanie, la Suède et la Croatie l'ont rétabli.", source: "France Stratégie, 2025" }
      contre: { affirmation: "Pas pour tous les jeunes.", chiffre: "8 %", texte: "En Suède, où le service est obligatoire, l'armée retient environ 8 % d'une génération, après des tests.", source: "France Stratégie, 2025" }
    # § 2d, [12] : la même source, la même unité (euros par jeune), la même base (600 000 jeunes, par an, hors bâtiments).
    # 5 900 € est le coût moyen réel du service civique en 2023 (le texte le date), 24 000 € une estimation pour six mois
    # sous l'uniforme (le texte le dit) ; les deux totaux sont des estimations. Les deux réponses ne parlent pas de la même
    # forme de service, et chaque affirmation le dit : c'est le constat commun de l'étude (§ 2d et 3), le coût dépend
    # d'abord de la dimension militaire ; le total civil (3,5 milliards) reste à l'écran pour qui le juge trop cher.
    - question: "Un service obligatoire coûterait-il trop cher ?"
      pour: { affirmation: "Non, s'il est civil.", chiffre: "5 900 €", texte: "Un service civique a coûté 5 900 euros par jeune en 2023. Pour 600 000 jeunes, on l'estime à 3,5 milliards par an.", source: "France Stratégie, 2025" }
      contre: { affirmation: "Oui, s'il est militaire.", chiffre: "24 000 €", texte: "On estime six mois sous l'uniforme à 24 000 euros par jeune : 14,5 milliards par an pour 600 000 jeunes.", source: "France Stratégie, 2025" }
    # § 2i, [15] : le même sondage (mars 2025) et la même question, l'obligation pour tous ou pour les seuls hommes,
    # posée à tous puis lue chez les moins de 35 ans ; 41 % n'est pas une majorité contre, d'où « pas la majorité ».
    - question: "Les Français veulent-ils l'obligation ?"
      pour: { affirmation: "Oui, plus d'un sur deux.", chiffre: "53 %", texte: "Dans un sondage, 53 % des Français voulaient un service militaire obligatoire, pour tous ou pour les garçons.", source: "Ipsos pour Le Parisien, 2025" }
      contre: { affirmation: "Pas la majorité des moins de 35 ans.", chiffre: "41 %", texte: "Dans le même sondage, 41 % des moins de 35 ans le voulaient obligatoire : moins de la moitié.", source: "Ipsos pour Le Parisien, 2025" }
