# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/049-service-national.md (tout ce qui suit y est sourcé).
# Aucune note d'axe : l'obligation civique est défendue de LFI à Debout la France en passant par Place publique, le
# refus de l'obligation va des Écologistes (A) au centre (B), et aucun candidat n'est rangé en D : le clivage ne suit
# ni l'axe économique ni l'axe progressiste/conservateur (étude, § 4).
numero: 49
date: 2026-09-09
theme: education-jeunesse
question: "Faut-il rendre obligatoire un service national pour les jeunes ?"
titreCourt: "Le service national"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/049-service-national-DdY5XbXl90UCBLavSoYxL8jX2hqAjS.mp4", duree: "2 min 10" }
contexte:
  - "Le service militaire obligatoire a été suspendu en 1997 : depuis, seuls le recensement et une journée de défense restent obligatoires, et toutes les autres formes de service sont volontaires."
  - "Le service national universel, lancé en 2019 pour des volontaires de 15 à 17 ans, devait s'étendre à tous les jeunes en 2024. La Cour des comptes a jugé ses objectifs incertains et son coût sous-estimé, et il a été suspendu en septembre 2025."
  - "Depuis la fin de l'été 2026, un nouveau service militaire de dix mois, volontaire et sélectif, accueille 3 000 jeunes de 18 à 25 ans, payés au moins 800 euros brut par mois, qui servent sur le territoire national."
chiffres:
  - valeur: "3 000"
    unite: jeunes
    legende: "dans la première promotion du nouveau service militaire volontaire ; 10 000 sont prévus en 2030"
    source: { organisme: Légifrance, document: "loi n° 2026-791 du 16 août 2026, rapport annexé", annee: 2026 }
  - valeur: "40 135"
    unite: jeunes
    legende: "au service national universel en 2023, pour un objectif de 64 000"
    source: { organisme: Cour des comptes, document: "Le service national universel, un premier bilan", annee: 2024 }
  - valeur: "3,5 à 5"
    unite: milliards d'euros
    legende: "par an : le coût estimé d'un service national universel étendu à toute une classe d'âge"
    source: { organisme: Cour des comptes, document: "Le service national universel, un premier bilan", annee: 2024 }
options:
  - id: A
    libelle: "Non, et arrêter le service militaire volontaire"
    implique: "Le nouveau service militaire de dix mois est supprimé ; l'engagement des jeunes passe par le service civique, volontaire, et l'effort de défense par la réserve opérationnelle et le recrutement des armées."
    defenseurs: "Un service de dix mois limité au territoire national a une utilité militaire réduite pour 2,3 milliards d'euros de 2026 à 2030 : mieux vaut renforcer la réserve et le service civique, qui reçoit trois fois plus de demandes que de missions."
    critiques: "Selon le rapporteur du texte à l'Assemblée, les régiments sont « ravis d'avoir un renfort » pour défendre le territoire, et un service choisi permet aux jeunes qui le veulent de s'engager sans rien imposer aux autres."
    axes: { societe: -1 }
  - id: B
    libelle: "Non, garder le volontariat"
    implique: "Le service militaire de dix mois, ouvert aux 18-25 ans et payé au moins 800 euros brut par mois, monte en charge jusqu'à 10 000 jeunes en 2030, à côté du service civique ; en cas de crise majeure, le Parlement pourrait appeler au-delà des volontaires."
    defenseurs: "Les armées n'ont plus vocation à encadrer toute une génération : un service choisi et sélectif répond à leurs besoins sans contraindre ceux qui n'en veulent pas."
    critiques: "Le volontariat attire plus de jeunes déjà proches des métiers en uniforme : au service national universel, 26 % avaient un parent militaire, policier ou pompier, contre 2 % de la population, et ce service n'a atteint ni ses objectifs de participants ni celui de mixité sociale."
    axes: { societe: 0 }
  - id: C
    libelle: "Oui, un service civique obligatoire"
    implique: "Chaque jeune consacre plusieurs mois, de trois à dix selon les projets, à des missions d'intérêt général (écoles, maisons de retraite, secours, environnement) ; servir dans l'armée reste un choix."
    defenseurs: "Un temps commun à toute une génération, quel que soit son milieu, utile aux autres et face aux crises comme les canicules ou les inondations, sans obliger quiconque à porter les armes."
    critiques: "Une obligation civile sans lien avec la défense a une base constitutionnelle incertaine, et il faudrait des centaines de milliers de missions : 3,5 milliards d'euros par an selon France Stratégie, 18,5 milliards pour neuf mois payés au Smic selon l'Institut Montaigne (7,4 milliards nets selon ceux qui le proposent)."
    axes: { societe: 1 }
  # D garde le pôle de l'échelle : aucun candidat n'y est rangé avec une source vérifiée (étude, § 4), mais l'option est
  # défendue dans le débat (président du RN, scénario chiffré de France Stratégie).
  - id: D
    libelle: "Oui, un service militaire obligatoire"
    implique: "Une loi rétablit l'appel sous les drapeaux, suspendu depuis 1997 : les jeunes, filles et garçons, font quelques mois de service militaire (six dans les projets chiffrés), avec une forme civile pour les objecteurs de conscience."
    defenseurs: "Former toute une génération à la défense donne au pays des réserves nombreuses (la Finlande, 5,7 millions d'habitants, peut mobiliser 285 000 réservistes entraînés) et réunit les jeunes de tous les milieux sous la même règle."
    critiques: "Six mois pour 600 000 jeunes coûteraient 14,5 milliards d'euros par an selon France Stratégie, pour qui il semblerait impossible à organiser en moins de cinq ans et risquerait d'affaiblir l'armée de métier."
    axes: { societe: 2 }
