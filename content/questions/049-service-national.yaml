# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour un service obligatoire"
    argument: "Un temps commun à toute une génération, quel que soit son milieu : au service national universel, volontaire, la mixité sociale n'a pas été atteinte."
  - titre: "Contre l'obligation"
    argument: "Les armées n'ont plus vocation à encadrer toute une génération : un service choisi répond à leurs besoins sans contraindre ceux qui n'en veulent pas."
# Les deux choix de l'autocollant « Et toi ? » de la story.
