  - titre: "CEPII, la régularisation exceptionnelle de 1981 et ses effets sur l'économie, 2024"
    url: https://www.cepii.fr/PDF_PUB/lettre/2024/let446.pdf
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour régulariser davantage"
    argument: "Ces personnes vivent et travaillent déjà ici : leur donner un titre les sort de l'exploitation et fait entrer des cotisations."
  - titre: "Pour régulariser moins, ou plus du tout"
    argument: "Entrer ou rester sans titre ne doit ouvrir aucun droit, sinon chaque régularisation crée un « appel d'air »."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Régulariser plus"
    precision: "au moins ceux qui travaillent"
  - choix: "Régulariser moins"
    precision: "ou plus du tout"
