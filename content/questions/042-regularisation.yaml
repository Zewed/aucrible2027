# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/042-regularisation.md (chaque chiffre y a sa source
# numérotée, voir son annexe). Le fil : le repère est passé de cinq à sept ans ; quatre choix sont sur la table, et la
# voie des métiers qui manquent de bras s'arrête fin 2026. Pas de mécanisme : aucun ratio « X pour 1 » ne résume le sujet.
reportage:
  accroche:
    # § 1.1, [1] [4] [5] : cinq ans en général dans la circulaire de 2012, sept ans comme « l'un des indices d'intégration »
    # en 2025 ; « un repère », pas « le repère » : la voie des métiers qui manquent de bras demande trois ans.
    etapes:
      - { quand: "En 2012", valeur: "5 ans" }
      - { quand: "En 2025", valeur: "7 ans" }
    chute: "… de vie en France : un repère donné aux préfets pour régulariser un étranger sans titre de séjour."
  ecart:
    # § 1.2, [6] [7] : même décompte du ministère (toutes causes) ; 11 525 pour le travail sur 34 724 en 2023.
    titre: "Combien de régularisations par an ?"
    etapes:
      - { quand: "En 2023", valeur: "34 724" }
      - { quand: "En 2025", valeur: "28 610" }
    chute: "Le chiffre de 2025 est provisoire. En 2023, une régularisation sur trois était liée au travail."
    source: "Ministère de l'Intérieur, 2026"
  leviers:
    # § 4 : les quatre options de la fiche, à égalité ; § 1.1, [2] pour la fin de l'expérimentation.
    titre: "Quatre choix possibles"
    choix:
      - { texte: "Régulariser largement", detail: "tous les étrangers sans titre, ou ceux qui travaillent, étudient ou ont un enfant à l'école" }
      - { texte: "Un titre pour qui travaille", detail: "accordé de droit après des mois de travail, sans attendre l'accord du préfet" }
      - { texte: "Au cas par cas", detail: "le préfet décide, après des années en France, surtout pour les métiers qui manquent de bras" }
      - { texte: "Ne plus régulariser", detail: "qui est entré ou resté sans titre ne peut plus en obtenir un" }
    chute: "La voie ouverte pour les métiers qui manquent de bras s'arrête le 31 décembre 2026, sauf nouvelle loi."
    source: "Loi immigration, 2024"
  camps: { pour: POUR, contre: CONTRE, objet: "plus de régularisations" }
  questions:
    # § 2a, [20] [21] : le POUR parle de tous les immigrés (devenus français ou non, en règle ou non, données 2017,
    # publiées en 2021), pas des seuls étrangers sans titre, que personne ne compte par métier ; le CONTRE de tous les
    # chômeurs. Deux arguments différents sur le même besoin, chacun daté, pas une comparaison.
    - question: "Le pays a-t-il besoin de ces travailleurs ?"
      pour: { affirmation: "Oui, des métiers en dépendent.", chiffre: "39 %", texte: "En 2017, près de quatre employés de maison sur dix étaient immigrés, en règle ou non, contre un travailleur sur dix.", source: "Dares, 2021" }
      contre: { affirmation: "Non, il y a d'abord les chômeurs.", chiffre: "8,3 %", texte: "Au printemps 2026, 8,3 % des actifs cherchaient un emploi en France, soit 2,7 millions de personnes.", source: "Insee, 2026" }
    # § 2c, [18] [26] : l'étude de la régularisation espagnole de 2005, seule étude causale lue, contre la crainte
    # d'un effet d'attraction exprimée par des dirigeants européens (lettre citée par L'Espresso, source secondaire,
    # à vérifier). Les 1 174 978 demandes espagnoles de 2026 ne disent pas pourquoi les demandeurs sont venus : elles
    # restent dans les critiques de l'option A, pas en réponse à cette question.
    - question: "Régulariser attire-t-il d'autres migrants ?"
      pour: { affirmation: "Non, selon une étude sur l'Espagne.", chiffre: "600 000", texte: "En 2005, l'Espagne a régularisé près de 600 000 étrangers. Une étude n'y a pas trouvé de hausse des arrivées.", source: "Journal of Labor Economics, 2025" }
      contre: { affirmation: "Oui, selon des dirigeants européens.", chiffre: "22", texte: "Dans une lettre, 22 dirigeants européens ont dénoncé ce qui attire l'immigration irrégulière, en citant l'Espagne.", source: "L'Espresso (presse italienne), 2026" }
    # § 2e, [17] [8] : deux réponses à l'exploitation, le titre de séjour ou la sanction des employeurs. Aucun chiffre
    # de l'étude ne mesure si les sanctions protègent les travailleurs : le CONTRE dit sa solution, le chiffre montre
    # qu'elle est appliquée et en hausse (1 984 procédures d'amende, +46 % ; 1 257 décisions, 78,7 millions d'euros).
    - question: "Faut-il les régulariser pour les protéger ?"
      pour: { affirmation: "Oui, sinon ils sont sous-payés.", chiffre: "4 à 8 %", texte: "Selon des études, à travail égal, un étranger sans titre gagne au moins 4 à 8 % de moins qu'avec un titre.", source: "CEPII, 2024" }
      contre: { affirmation: "Non, il faut punir les employeurs.", chiffre: "78,7 millions €", texte: "En 2025, 78,7 millions d'euros d'amendes ont été prononcées pour emploi illégal d'étrangers, et les procédures ont augmenté de 46 %.", source: "Ministère de l'Intérieur, 2026" }
    # § 2h, [30] [31] : deux sondages de 2023 sur les métiers qui manquent de bras, à deux mois d'écart, aux questions
    # différentes : celle d'Elabe posait des conditions (3 ans de présence, 8 mois de travail sur 24) ; celle de CSA
    # n'est connue que par le compte rendu de CNews, qui n'en cite pas. Chaque texte dit ce qu'on sait de sa question.
    - question: "Les Français veulent-ils les régulariser ?"
      pour: { affirmation: "Oui, sous conditions, selon un sondage.", chiffre: "68 %", texte: "En novembre 2023, 68 % approuvaient leur régularisation dans les métiers qui manquent de bras, après trois ans en France.", source: "Elabe pour BFMTV, 2023" }
      contre: { affirmation: "Non, selon un autre sondage.", chiffre: "55 %", texte: "En septembre 2023, l'institut CSA posait une autre question : 55 % s'opposaient à leur régularisation dans les mêmes métiers.", source: "CSA pour CNews, 2023" }
