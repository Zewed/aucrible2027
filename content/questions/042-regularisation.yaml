  zemmour: { option: D, source: "Programme présidentiel 2022 d'É. Zemmour, « Immigration », visuel 2/3 « Je supprimerai les dispositifs qui attirent l'immigration » (programme.ericzemmour.fr, archive du 26/04/2022) ; BFMTV, 17/09/2026, rapporté par Public Sénat", statut: deduite }
