# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/042-regularisation.md (tout ce qui suit y est sourcé).
# Vocabulaire : « sans-papiers », « clandestins » et « illégaux » sont des mots disputés, attribués dans l'étude ;
# la fiche dit « étrangers sans titre de séjour », comme le droit (« en situation irrégulière »).
numero: 42
date: 2026-09-16
theme: immigration
question: "Faut-il régulariser les étrangers sans titre de séjour qui travaillent ?"
titreCourt: "La régularisation par le travail"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/042-regularisation-Rr9hOEmD5EAYddaIqDzeVwoLVvZeZ6.mp4", duree: "2 min 20" }
contexte:
  - "Un étranger sans titre de séjour peut être régularisé au cas par cas par le préfet ; depuis la loi du 26 janvier 2024 et jusqu'au 31 décembre 2026, il peut l'être s'il a travaillé 12 mois sur 24 dans un métier qui manque de bras et vit en France depuis trois ans."
  - "En janvier 2025, une circulaire du ministre de l'Intérieur Bruno Retailleau a remplacé la circulaire Valls de 2012 : la régularisation doit rester exceptionnelle, et sept ans de présence servent de repère d'intégration."
  - "Le ministère de l'Intérieur a compté 28 610 régularisations en 2025, contre 34 724 en 2023, et estime à environ 700 000 le nombre d'étrangers en situation irrégulière."
chiffres:
  - valeur: "28 610"
    unite: régularisations
    legende: "en 2025 (chiffre provisoire), contre 34 724 en 2023, dont un tiers pour le travail"
    source: { organisme: "Ministère de l'Intérieur", document: "chiffres de l'immigration 2025", annee: 2026 }
  - valeur: "1 655"
    unite: titres
    legende: "de séjour délivrés en 2025 à des travailleurs d'un métier qui manque de bras"
    source: { organisme: "Ministère de l'Intérieur", document: "télégramme aux préfets du 14 avril 2026", annee: 2026 }
  - valeur: "700 000"
    legende: "étrangers en situation irrégulière en France, selon une estimation du ministère de l'Intérieur"
    source: { organisme: Sénat, document: "avis sur le budget 2026, Immigration, asile et intégration", annee: 2025 }
options:
  - id: A
    libelle: "Régulariser largement"
    implique: "Un titre de séjour est ouvert à tous les étrangers sans titre, ou à de larges catégories (ceux qui travaillent, étudient ou ont un enfant scolarisé), sans exiger un métier qui manque de bras, comme l'Espagne l'a fait en 2005 et en 2026."
    defenseurs: "Ces personnes vivent et travaillent déjà ici : leur donner un titre les sort de l'exploitation et fait entrer des cotisations, au moins 4 000 euros par travailleur et par an en Espagne, où une étude n'a pas trouvé de hausse des arrivées après 2005."
    critiques: "Une régularisation générale récompense un séjour illégal et peut attirer d'autres arrivées, selon ses opposants ; les pays de l'Union se sont engagés en 2008 à régulariser au cas par cas, et l'Espagne a reçu en 2026 plus d'un million de demandes, plus du double de sa prévision."
    axes: { societe: -2 }
  - id: B
    libelle: "Un titre pour ceux qui travaillent"
    implique: "L'étranger sans titre qui a travaillé un certain temps obtient de plein droit un titre de séjour, sans dépendre de la décision du préfet ni de son employeur, comme le prévoyait le projet du gouvernement en 2023 (8 mois de travail sur 24 et trois ans en France)."
    defenseurs: "Des critères clairs plutôt que des décisions inégales d'une préfecture à l'autre : le travailleur ne dépend plus d'un employeur ou d'un guichet, et l'on met fin à ce que le ministre de l'Intérieur appelait en 2023 un « servage moderne »."
    critiques: "Le Sénat a retiré ce titre automatique de la loi en 2023 : ses opposants veulent que l'État garde le dernier mot, refusent de récompenser un séjour illégal et craignent d'attirer d'autres arrivées."
    axes: { societe: -1 }
  - id: C
    libelle: "Au cas par cas, par le préfet"
    implique: "La régularisation reste exceptionnelle et décidée par le préfet, qui regarde le travail, l'intégration (sept ans de présence comme repère), le français et l'ordre public ; la voie des métiers qui manquent de bras peut être prolongée après 2026."
    defenseurs: "L'État garde le dernier mot : on régularise ceux qui sont intégrés et utiles, sans créer de droit automatique, en vérifiant leur travail, leur maîtrise du français et le respect de l'ordre public."
    critiques: "Les uns jugent la voie trop étroite et inégale selon les préfectures (1 655 titres pour les métiers qui manquent de bras en 2025, la moitié des dossiers non instruits) ; les autres jugent que régulariser, même au cas par cas, récompense un séjour illégal."
    axes: { societe: 1 }
  - id: D
    libelle: "Ne plus régulariser"
    implique: "Un étranger entré ou resté sans titre ne peut plus en obtenir un, sauf exception décidée en Conseil des ministres pour un motif d'intérêt national ; il doit repartir, et les besoins de main-d'œuvre passent par d'autres voies, comme le recrutement à l'étranger ou la formation des chômeurs."
    defenseurs: "Entrer ou rester sans titre ne doit ouvrir aucun droit : chaque régularisation crée un « appel d'air », selon ses partisans, et il faut d'abord mieux payer ces métiers et y former des chômeurs, qui sont 2,7 millions."
    critiques: "Les quelque 700 000 étrangers sans titre estimés par le ministère ne pourraient plus en obtenir et resteraient à la merci d'employeurs, alors qu'environ une obligation de quitter la France sur dix est exécutée ; des études étrangères trouvent des gains à régulariser."
    axes: { societe: 2 }
