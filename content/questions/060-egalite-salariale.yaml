cotes:
  - titre: "Pour des sanctions plus dures"
    argument: "La sanction actuelle ne fait pas peur : chaque employeur doit mesurer ses écarts, puis les justifier ou les corriger."
  - titre: "Contre des sanctions plus dures"
    argument: "La France ne doit pas imposer à ses entreprises plus que ce qu'exige l'Europe : ces règles pèsent d'abord sur les PME."
