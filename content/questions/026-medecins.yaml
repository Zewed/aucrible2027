# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux dont cette fiche découle : docs/etudes/026-medecins.md
# Ancienne fiche de démonstration refaite : la question, le titre court et les quatre chiffres clés sont gardés ; les
# chiffres corrigés sont listés dans l'annexe de l'étude.
numero: 26
date: 2026-10-25
theme: sante
question: Faut-il réguler l'installation des médecins ?
titreCourt: "L'installation des médecins"
contexte:
  - "Un médecin libéral peut s'installer où il veut, une liberté inscrite dans la loi depuis 1971, alors que les infirmiers, les kinésithérapeutes, les sages-femmes et les dentistes ont des règles d'installation."
  - "En 2025, 6,4 millions d'assurés n'avaient pas de médecin traitant ; aujourd'hui, trois Français sur quatre vivent dans une zone où l'accès aux médecins est jugé insuffisant, et les écarts entre territoires se creusent."
  - "Les députés ont voté en 2025 une loi qui limite l'installation hors des zones qui manquent de médecins ; en juin 2026, le Sénat a préféré que ceux qui s'installent là où ils sont très nombreux exercent aussi en partie là où ils manquent, sans finir l'examen : rien n'est en vigueur."
chiffres:
  - valeur: "6"
    unite: millions
    legende: et 400 000 assurés sans médecin traitant en 2025
    source: { organisme: Sénat, document: rapport n° 668, annee: 2026 }
  - valeur: 87 %
    legende: "des communes classées en zone où l'accès aux médecins est difficile, en 2023"
    source: { organisme: Cour des comptes, document: "Les aides à l'installation des médecins libéraux", annee: 2025 }
  - valeur: "83"
    legende: "généralistes libéraux pour 100 000 habitants en 2023, en métropole, après une baisse de 7 % de leur nombre depuis 2016"
    source: { organisme: Insee, document: données Drees, annee: 2026 }
  - valeur: "10"
    unite: ans
    legende: "d'études pour devenir médecin généraliste, avec la quatrième année d'internat qui commence le 2 novembre 2026"
    source: { organisme: Ministère de la Santé, document: instruction sur la quatrième année, annee: 2026 }
options:
  - id: A
    libelle: Affecter les nouveaux médecins là où ils manquent
    implique: "Pendant quelques années après leur diplôme, les nouveaux médecins exercent dans une zone qui manque de médecins, comme le prévoyait une proposition de loi de 2021 ; ensuite, ils s'installent où ils veulent."
    defenseurs: "La formation des médecins est payée par la collectivité : quelques années là où les patients attendent en sont la contrepartie, et cela agit plus vite que les médecins formés en plus, attendus dans dix ans."
    critiques: "Selon une synthèse de la Drees citée par le Sénat, les médecins installés en contrepartie d'un engagement restent moins longtemps que ceux qui choisissent la campagne, et les syndicats d'internes et d'étudiants jugent que « la coercition n'est pas une solution »."
    axes: { economie: -2 }
  - id: B
    libelle: Limiter les installations là où les médecins sont nombreux
    implique: "Hors des zones qui manquent de médecins, un médecin s'installe avec l'accord de l'agence régionale de santé, à la place d'un médecin de même spécialité qui cesse son activité : c'est la loi votée par les députés en 2025."
    defenseurs: "Les infirmiers, les kinésithérapeutes, les sages-femmes et les dentistes ont déjà des règles d'installation ; chez les infirmières, l'écart de densité entre territoires a diminué de moitié de 2006 à 2016, et chez les sages-femmes, la Cour des comptes note une « nette réduction des inégalités territoriales » de 2016 à 2022."
    critiques: "La règle toucherait les nouvelles installations, pas les médecins déjà installés ; chez les infirmières, l'écart s'est réduit pendant que leur nombre augmentait de 55 %, alors que les généralistes libéraux diminuent ; chez les kinésithérapeutes, régulés depuis 2018, les nouveaux sont surtout allés dans les zones voisines bien pourvues."
    axes: { economie: -1 }
  - id: C
    libelle: S'installer librement, mais donner du temps aux zones qui manquent de médecins
    implique: "Dans une zone très bien pourvue, un généraliste s'installe à condition d'exercer aussi à temps partiel là où les médecins manquent, comme dans la version votée par le Sénat en 2026 ; tous peuvent être appelés en renfort jusqu'à deux jours par mois, comme le proposait le gouvernement en 2025."
    defenseurs: "Aucune zone n'est fermée aux jeunes médecins, et l'effort est partagé entre tous pour aider vite les territoires les plus en difficulté, où vivent plus de 2,5 millions d'habitants."
    critiques: "Pour l'association de patients France Assos Santé, la mesure est « vidée de sa substance » ; pour le syndicat de médecins CSMF, elle garde « une logique de contrainte », et la mission volontaire lancée en 2025 réunissait 250 généralistes fin 2025."
    axes: { economie: 0 }
  - id: D
    libelle: Garder la liberté d'installation et attirer les médecins
    implique: "Chaque médecin choisit où il s'installe ; on l'attire avec des maisons de santé, des assistants médicaux et des aides, et on forme plus de médecins, dont les futurs généralistes de quatrième année, incités à commencer là où les médecins manquent."
    defenseurs: "Le problème est le nombre de médecins, pas leur répartition : trois Français sur quatre vivent dans une zone jugée sous-dotée, et en 2025, deux fois plus de généralistes qu'en 2012 se sont installés en libéral pour la première fois."
    critiques: "La Cour des comptes juge « non démontrée » l'efficacité des aides, 205 millions d'euros en 2023, et la Drees compte dix ans avant que former plus de médecins produise ses effets."
    axes: { economie: 1 }
pourAllerPlusLoin:
  - titre: "Cour des comptes, Les aides à l'installation des médecins libéraux, novembre 2025"
    url: https://www.ccomptes.fr/fr/publications/les-aides-linstallation-des-medecins-liberaux
  - titre: "Sénat, rapport n° 668 sur la proposition de loi visant à lutter contre les déserts médicaux, mai 2026"
    url: https://www.senat.fr/rap/l25-668/l25-668.html
  - titre: "Assemblée nationale, scrutin n° 1214 sur la régulation de l'installation, 02/04/2025"
    url: https://www.assemblee-nationale.fr/dyn/17/scrutins/1214
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour réguler l'installation"
    argument: "D'autres soignants ont déjà des règles d'installation : chez les infirmières, l'écart entre territoires a diminué de moitié de 2006 à 2016."
  - titre: "Pour ne pas la réguler"
    argument: "Le problème est le nombre de médecins : trois Français sur quatre vivent dans une zone où l'État juge qu'ils manquent."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Réguler"
    precision: "l'installation"
  - choix: "Garder"
    precision: "la liberté"
# Seuls les candidats sourcés ; les six autres sont « inconnue » (voir l'étude, § 4, avec les raisons). Personne n'a
# été trouvé en A. Les votes retenus portent sur l'article de régulation lui-même, pas sur la loi entière.
positions:
