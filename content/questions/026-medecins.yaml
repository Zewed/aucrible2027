  le-pen: { option: D, source: "Vote du groupe RN contre l'article 1er de la loi Garot, 02/04/2025 ; programme 2022", statut: deduite }
  # Scrutin n° 1214 du 02/04/2025, groupe LFI : 40 pour, 0 contre : https://datan.fr/votes/legislature-17/vote_1214 ; amendement de régulation du 14/06/2023, LFI 47 pour : https://datan.fr/votes/legislature-16/vote_1812
  melenchon: { option: B, source: "Vote du groupe LFI pour l'article 1er de la loi Garot, 02/04/2025", statut: deduite }
