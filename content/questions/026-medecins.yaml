  ruffin: { option: B, source: "Cosignataire de la proposition de loi n° 966, 13/02/2025 ; vote du 14/06/2023", statut: deduite }
# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/026-medecins.md (chaque chiffre y a sa source
# numérotée, et l'annexe de l'étude dit d'où vient chacun). Le fil : depuis 1971, un médecin s'installe où il veut ; les
# députés ont voté une limite, le Sénat l'a adoucie ; quatre choix, et quatre questions où chaque camp avance son meilleur
# fait. Les face-à-face des fiches voisines (006 franchises, 017 hôpital, 044 dépassements) ne sont pas repris.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1 à 1.3, [1] [4] [6] [7] : l'article L162-2 du code de la sécurité sociale renvoie à la loi du 3 juillet 1971 ;
    # au 28/10/2026, aucune règle d'installation des médecins n'est en vigueur. La limite votée par les députés (scrutin du
    # 02/04/2025) a été réécrite par le Sénat le 11/06/2026, qui n'a pas fini l'examen.
    etapes:
      - { quand: "En 1971", valeur: "Libre" }
      - { quand: "En 2026", valeur: "Toujours libre" }
    # Chute de 130 caractères au plus (au-delà, elle passe en petit) : les années du vote sont dans le contexte.
    chute: "… de s'installer où il veut, pour un médecin. Les députés ont voté une limite, le Sénat l'a adoucie : rien n'est en vigueur."
  # Pas de « mécanisme » : aucun rapport « X pour 1 » ne résume le sujet, et son dessin est propre aux retraites.
  # Pas d'« écart » : la série des généralistes libéraux (−7 % de 2016 à 2023) est dans les chiffres clés, et aucune
  # grandeur sur longue période n'a été trouvée avec une source primaire.
  leviers:
    # § 4 de l'étude, [2] [3] [12] [37]. Les quatre options de la fiche, à égalité et dans son ordre ; la chute ne
    # désigne aucun choix (l'accroche dit déjà que l'installation est libre) et donne le montant des aides de l'État et
    # de l'Assurance maladie en 2023, hors collectivités locales (§ 1.1 et 2c, [2]).
    titre: "L'installation des médecins : quatre choix"
    choix:
      - { texte: "Affecter les nouveaux médecins", detail: "quelques années là où ils manquent, puis libres" }
      - { texte: "Limiter les installations", detail: "là où les médecins sont nombreux, à la place d'un départ" }
      - { texte: "Demander du temps", detail: "s'installer partout, mais exercer aussi en partie là où ils manquent" }
      - { texte: "Garder la liberté", detail: "attirer par des maisons de santé, des aides et plus d'étudiants" }
    chute: "En 2023, l'État et l'Assurance maladie ont versé 205 millions d'euros d'aides pour attirer les médecins là où ils manquent."
    source: "Cour des comptes, 2025"
  # POUR : affecter ou limiter (options A et B, notées −2 et −1) ; CONTRE : garder la liberté (D, +1). C (0), qui ne
  # ferme aucune zone mais impose du temps, n'est dans aucun camp, comme l'option E des fiches 001 et 024. Chaque réponse
  # POUR vaut pour A et B. L'objet (22 caractères) dit l'enjeu sans le mot d'un camp (« réguler » est le choix POUR de la
  # story, « coercition » le mot des syndicats).
  camps: { pour: POUR, contre: CONTRE, objet: "limiter l'installation" }
  # Chaque texte dit ce qu'il mesure ; quand les deux cartes ne mesurent pas la même chose, chacune le nomme. L'ordre
  # d'apparition des camps suit ABBA : POUR d'abord aux questions 1 et 4, CONTRE d'abord aux questions 2 et 3.
  questions:
    # § 1.1 et 2d, [19] [3] : deux professions déjà régulées, chacune nommée avec l'année de sa règle et ce que mesure
    # son chiffre. Le POUR : chez les infirmières (règle depuis 2008), l'écart de densité entre territoires très
    # sous-dotés et sur-dotés a diminué de moitié de 2006 à 2016 (Irdes, analyse qui attribue au zonage un effet
    # positif). Le CONTRE : chez les kinés (règle de 2018), dans les deux ans qui ont suivi, plus de 1 000
    # conventionnements en plus en zones très dotées, moins de 400 en zones sous-dotées et très sous-dotées (Sénat,
    # d'après l'Assurance maladie).
    - question: "Les soignants déjà régulés sont-ils mieux répartis ?"
      pour: { affirmation: "Oui, les infirmières.", chiffre: "÷2", texte: "Depuis 2008, s'installer où elles abondent exige un départ. De 2006 à 2016, l'écart de densité entre territoires a diminué de moitié.", source: "Irdes, 2022" }
      contre: { affirmation: "Pas les kinés.", chiffre: "1 000", texte: "Deux ans après leur règle de 2018, plus de 1 000 s'étaient installés en zone bien pourvue, moins de 400 où ils manquent.", source: "Sénat, 2026" }
    # § 2c, [2] : deux résultats de la même étude (Irdes et EHESP, communes de 2005 à 2022, citée par la Cour des
    # comptes), dans la même unité : les généralistes de moins de 40 ans pour 100 000 habitants. Le CONTRE : +16,2 là où
    # une maison de santé a ouvert. Le POUR : aucun effet des baisses d'impôts liées à certaines zones, sans maison de
    # santé (« aucun effet positif » : la carte dit qu'elles n'ont pas augmenté leur nombre, pas qu'aucun n'est venu).
    # Le CONTRE parle en premier et ne renvoie pas à l'autre carte. La question ne dit pas « contraindre », proche de la
    # « coercition » des syndicats de médecins.
    - question: "Peut-on attirer les médecins là où ils manquent ?"
      pour: { affirmation: "Pas avec l'argent seul.", chiffre: "0", texte: "Selon la même étude, sans maison de santé, les baisses d'impôts dans certaines zones n'ont pas augmenté le nombre de jeunes généralistes.", source: "Cour des comptes, 2025" }
      contre: { affirmation: "Oui, avec des maisons de santé.", chiffre: "+16", texte: "Selon une étude, une maison de santé a attiré en moyenne 16 jeunes généralistes de plus pour 100 000 habitants.", source: "Cour des comptes, 2025" }
    # § 2a et 2b, [3] [16] : deux mesures différentes, chacune nommée. Le CONTRE : 75,7 % de la population vit en zone
    # d'intervention prioritaire ou d'action complémentaire (zonage en vigueur en 2026) ; l'affirmation dit « la plupart
    # des Français », ce que mesure ce zonage, pas « presque partout ». Le POUR : généralistes, tous modes d'exercice
    # (salariés compris), au 1er janvier 2025, Paris 240 et Eure-et-Loir 84 pour 100 000 habitants (le plus bas de
    # métropole) : 2,86, arrondi à ×2,9 ; l'affirmation ne nie pas le manque global, sur lequel les experts s'accordent
    # (§ 2b et 3).
    - question: "Manque-t-on de médecins partout ?"
      pour: { affirmation: "Pas autant partout : ils sont mal répartis.", chiffre: "×2,9", texte: "En 2025, Paris compte 240 généralistes, salariés compris, pour 100 000 habitants, l'Eure-et-Loir 84 : près de trois fois moins.", source: "Insee, 2025" }
      contre: { affirmation: "Oui, pour la plupart des Français.", chiffre: "76 %", texte: "En 2026, trois Français sur quatre vivent dans une zone où l'État juge l'accès aux médecins insuffisant.", source: "Sénat, 2026" }
    # § 2b, [20] [15] : une estimation et un constat, chacun nommé. Le POUR : selon la Drees (2021), il faut compter
    # « cinq à dix ans » (sages-femmes et médecins) pour qu'une hausse des places en formation produise ses effets, dix
    # pour les médecins (« ses effets », le mot de la source). Le CONTRE : selon l'Assurance maladie, les premières
    # installations de généralistes en libéral en 2025 (2 810) sont « plus de deux fois » celles de 2012, grâce aux
    # places ouvertes au cours de la décennie précédente : un nombre d'arrivées dans l'année, pas le nombre de
    # généralistes en exercice (en baisse de 7 % de 2016 à 2023, chiffres clés).
    - question: "Former plus de médecins, est-ce assez rapide ?"
      pour: { affirmation: "Non, il faut dix ans.", chiffre: "10 ans", texte: "Selon le ministère de la Santé, former plus de médecins met dix ans à produire ses effets.", source: "Drees, 2021" }
      contre: { affirmation: "Les effets se voient déjà.", chiffre: "×2", texte: "Avec plus d'étudiants formés, deux fois plus de généralistes se sont installés pour la première fois en libéral en 2025 qu'en 2012.", source: "Assurance maladie, 2026" }
