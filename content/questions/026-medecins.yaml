  retailleau: { option: C, source: "Sénat, scrutins n° 305 et 307 sur l'article 1er, 11/06/2026", statut: deduite }
  # Question au gouvernement n° 1791, réponse du Premier ministre, 10/04/2024 (« Le problème est donc le nombre de médecins. Il faut en former davantage ») : https://www.assemblee-nationale.fr/dyn/16/questions/QANR5L16QG1791
  attal: { option: D, source: "Réponse à une question au gouvernement, Assemblée nationale, 10/04/2024", statut: deduite }
  # Scrutin n° 1214 du 02/04/2025, groupe Écologiste et Social : 19 pour, 0 contre : https://datan.fr/votes/legislature-17/vote_1214
  tondelier: { option: B, source: "Vote du groupe Écologiste et Social pour l'article 1er de la loi Garot, 02/04/2025", statut: deduite }
  # Programme 2022, proposition 13 (« dans les zones denses, un·e médecin ne devra s'installer que si un·e autre part à la retraite ») : https://d3n8a8pro7vhmx.cloudfront.net/fabienroussel2022/pages/217/attachments/original/1643038967/exe_la_france_des_jours_heureux_LIVRE_stc.pdf
  roussel: { option: B, source: "La France des jours heureux, proposition 13, 2022", statut: deduite }
