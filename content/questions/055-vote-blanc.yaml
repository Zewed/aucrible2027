# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/055-vote-blanc.md (tout ce qui suit y est sourcé).
# Le vote obligatoire a sa propre fiche (054) : celle-ci n'en traite pas (étude, § 2h).
# Aucune note d'axe : compter le vote blanc est défendu de LFI à Debout la France en passant par des élus LR, MoDem et
# UDI, et refusé par des gouvernements et des groupes de gauche comme du centre (étude, § 1.3 et 2) ; le clivage ne suit
# ni l'axe économique ni l'axe progressiste/conservateur.
numero: 55
date: 2026-09-03
theme: institutions-democratie
question: "Faut-il compter le vote blanc dans les suffrages exprimés ?"
titreCourt: "Le vote blanc"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/055-vote-blanc-g8sPY4HZrG1ZhP3MmN9Te8Ov4xSofj.mp4", duree: "1 min 50" }
contexte:
  - "Depuis 2014, les bulletins blancs sont comptés à part des bulletins nuls et publiés dans les résultats, mais ils n'entrent pas dans les suffrages exprimés, sur lesquels se calculent les pourcentages et la majorité."
  - "Au second tour de la présidentielle, 3 millions d'électeurs ont voté blanc en 2017 et 2,2 millions en 2022, soit 8,5 % puis 6,4 % des votants, contre 1,5 % au premier tour de 2022."
  - "Les compter à la présidentielle demanderait de changer la Constitution, qui exige la majorité absolue des suffrages exprimés ; plus de trente propositions de loi sur le vote blanc ont été déposées depuis 1993, sans qu'aucune ne le fasse entrer dans le résultat."
chiffres:
  - valeur: "2,2"
    unite: millions
    legende: "de bulletins blancs au second tour de la présidentielle de 2022, soit 6,4 % des votants"
    source: { organisme: Conseil constitutionnel, document: "décision n° 2022-197 PDR", annee: 2022 }
  - valeur: "54,7 %"
    legende: "des voix pour le président élu en 2022 si les blancs avaient compté, au lieu de 58,6 %"
    source: { organisme: Conseil constitutionnel, document: "décision n° 2022-197 PDR, calcul de l'étude", annee: 2022 }
  - valeur: "81 %"
    legende: "des Français favorables, dans un sondage en ligne, à ce que le vote blanc compte dans le résultat de toute élection"
    source: { organisme: "Ifop pour le groupe Union centriste du Sénat", document: "Les Français et les moyens de renforcer la participation électorale", annee: 2020 }
options:
  - id: A
    libelle: "Non, le garder à part comme aujourd'hui"
    implique: "Les bulletins blancs restent comptés à part et publiés dans les résultats, sans entrer dans les suffrages exprimés : les pourcentages, la majorité et les seuils se calculent sur les seuls votes pour un candidat, une liste ou une réponse."
    defenseurs: "Une élection sert à choisir quelqu'un : le vote blanc « agrège les rejets » sans désigner personne (Emmanuel Macron, 2019). Le compter rendrait aussi plus durs les seuils de voix qui donnent des sièges ou le remboursement des campagnes, au détriment des petites listes."
    critiques: "Plus de deux millions de bulletins blancs au second tour de 2022 n'ont rien changé au résultat ; tant que le vote blanc reste sans effet, « les électeurs seront toujours plus tentés par l'abstention » (le député Pacôme Rupin, 2021)."
  - id: B
    libelle: "Oui, sans pouvoir annuler l'élection"
    implique: "Les blancs entrent dans les suffrages exprimés : les pourcentages et les seuils se calculent avec eux, mais il y a toujours un élu, par exemple le candidat arrivé en tête du second tour même sous la moitié des voix, ou en ne les comptant qu'au premier tour de la présidentielle. Pour la présidentielle, il faut changer la Constitution."
    defenseurs: "Celui qui se déplace pour voter blanc s'exprime : son vote doit peser dans les pourcentages, sans bloquer les institutions. En comptant les blancs, le président élu aurait encore eu 60,3 % des voix en 2017 et 54,7 % en 2022."
    critiques: "Un président pourrait être élu sans la majorité absolue que demande la Constitution : selon une estimation de l'Assemblée nationale, le gagnant de 2012 aurait eu 49,45 % des voix en comptant les blancs. Pour les partisans de l'annulation, un vote blanc sans effet reste symbolique."
  - id: C
    libelle: "Oui, et refaire l'élection au-delà d'un seuil"
    implique: "Les blancs entrent dans les suffrages exprimés et, au-delà d'un seuil fixé par la loi (blancs majoritaires, aucun candidat à la moitié des voix ou trop peu d'électeurs exprimés, selon les projets), l'élection est annulée et refaite, parfois sans les mêmes candidats. Pour la présidentielle, il faut changer la Constitution."
    defenseurs: "Pour que le refus compte, il doit pouvoir changer le résultat : « si le vote blanc est majoritaire, le scrutin est reporté et les candidats battus ne peuvent pas se représenter » (Debout la France). La Colombie refait ainsi l'élection quand les blancs sont majoritaires."
    critiques: "Une élection pourrait ne désigner personne et devoir être recommencée, au risque d'instabilité : le jour du second tour de 2017, 32 % des votants disaient dans un sondage qu'ils auraient voté blanc si ce vote avait compté."
pourAllerPlusLoin:
  - titre: "Assemblée nationale, rapport n° 4039 sur la reconnaissance du vote blanc pour l'élection présidentielle, 2021"
    url: https://www.assemblee-nationale.fr/dyn/15/rapports/cion_lois/l15b4039_rapport-fond.pdf
  - titre: "Sénat, rapport n° 357 sur la proposition de loi visant à reconnaître le vote blanc aux élections, 2013"
    url: https://www.senat.fr/rap/l12-357/l12-357_mono.html
  - titre: "Conseil constitutionnel, résultats du second tour de la présidentielle de 2022"
    url: https://www.conseil-constitutionnel.fr/decision/2022/2022197PDR.htm
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour compter le vote blanc"
    argument: "Celui qui se déplace pour voter blanc s'exprime : son vote doit peser dans le résultat."
  - titre: "Pour le garder à part"
    argument: "Une élection sert à choisir quelqu'un : le vote blanc refuse sans désigner personne."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Le compter"
    precision: "dans le résultat"
  - choix: "Le garder à part"
    precision: "comme aujourd'hui"
positions:
  # L'Avenir en commun, chap. 1 « Le pouvoir au peuple » (« Reconnaître le vote blanc […] et instaurer un seuil de votes exprimés pour valider une élection ») : https://avenir-en-commun.net/revolution-citoyenne ; amendements cosignés n° 198 (21/07/2017) : https://www.assemblee-nationale.fr/15/amendements/0106/AN/198.pdf et CL640 (22/06/2018) : https://www.assemblee-nationale.fr/15/amendements/0911/CION_LOIS/CL640.pdf
  # Amendement LFI n° 313 au projet de loi constitutionnelle n° 2529, 25/03/2026 ; L'Avenir en commun 2027 : https://www.assemblee-nationale.fr/dyn/17/amendements/2529/AN/313.pdf
  melenchon: { option: C, source: "Amendement LFI n° 313 au projet de loi constitutionnelle n° 2529, 25/03/2026 ; L'Avenir en commun 2027", statut: officielle }
  # Debout la France, projet 2027, « Refonder et moraliser notre démocratie » : https://www.debout-la-france.fr/projet/refonder-et-moraliser-notre-democratie/
  dupont-aignan: { option: C, source: "Debout la France, projet 2027, « Refonder et moraliser notre démocratie »", statut: officielle }
  # Europe 1, « Présidentielle : au fait, comment fait-on pour voter blanc ? », 2017 (tribune de N. Arthaud sur Change.org) : https://www.europe1.fr/politique/vote-blanc-au-fait-comment-ca-fonctionne-3304604
  arthaud: { option: B, source: "Europe 1, « Présidentielle : au fait, comment fait-on pour voter blanc ? », 2017 (tribune de N. Arthaud sur Change.org)", statut: estimee }
  # S. Peu pour le groupe GDR, commission des lois, rapport n° 4039 sur la PPL constitutionnelle de reconnaissance du vote blanc, 31/03/2021 : https://www.assemblee-nationale.fr/dyn/15/rapports/cion_lois/l15b4039_rapport-fond.pdf
  roussel: { option: B, source: "S. Peu pour le groupe GDR, commission des lois, rapport n° 4039 sur la PPL constitutionnelle de reconnaissance du vote blanc, 31/03/2021", statut: estimee }
  # Sénat, compte rendu de la séance du 12/02/2014, amendement n° 3 d'H. Lipietz (groupe écologiste) à la loi sur le vote blanc : https://www.senat.fr/cra/s20140212/s20140212_4.html
  tondelier: { option: B, source: "Sénat, compte rendu de la séance du 12/02/2014, amendement n° 3 d'H. Lipietz (groupe écologiste) à la loi sur le vote blanc", statut: estimee }
# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/055-vote-blanc.md (chaque chiffre y a sa source
# numérotée). Le fil : depuis 2014, les blancs sont comptés à part mais ne pèsent pas ; faut-il qu'ils pèsent, et
# jusqu'à pouvoir faire refaire l'élection ? Pas de mécanisme : aucun rapport « X pour 1 » ne résume le sujet. Pas
# d'écart : la taille du vote blanc est le sujet de la première question.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1 et 1.3, [2] [5] : décret du 2 février 1852 (blancs et nuls assimilés, exclus du résultat), loi du
    # 21 février 2014 (comptés à part, toujours hors des suffrages exprimés).
    etapes:
      - { quand: "De 1852 à 2014", valeur: "Mêlés aux nuls" }
      - { quand: "Depuis 2014", valeur: "Comptés à part" }
    chute: "Mais ils n'entrent pas dans le résultat : seuls comptent les votes pour un candidat."
  leviers:
    # Les trois options de la fiche, à égalité et dans l'ordre. § 1.1, 1.4 et 2d, [5] [14] [18] [20] [25]. La chute :
    # l'article 7 de la Constitution, constat commun de l'étude (§ 3).
    titre: "Que faire des votes blancs ? Trois réponses"
    choix:
      - { texte: "Les compter à part", detail: "comme aujourd'hui : connus de tous, sans effet sur qui est élu" }
      - { texte: "Les compter dans le résultat", detail: "ils pèsent dans les pourcentages, mais il y a toujours un élu" }
      - { texte: "Refaire l'élection", detail: "si les votes blancs dépassent un seuil fixé par la loi" }
    chute: "Pour la présidentielle, il faudrait changer la Constitution : elle exige la majorité absolue des suffrages exprimés."
    source: "Constitution, article 7 ; Assemblée nationale, 2021"
  camps: { pour: POUR, contre: CONTRE, objet: "le vote blanc dans le résultat" }
  # POUR rassemble les options B et C, CONTRE l'option A.
  # Ordre d'apparition (ABBA) : POUR d'abord aux questions 1 et 4, CONTRE d'abord aux questions 2 et 3. Chaque carte se
  # lit donc seule : aucune ne renvoie à « le même sondage » d'une carte qui n'est pas encore apparue. Aucun candidat
  # n'est nommé.
  questions:
    # § 1.2, [7] [8] : la même élection (2022), la même unité (part des votants) ; seul le tour change, et chaque carte
    # le dit. La question porte sur le nombre : « peser » sert, dans les leviers, à dire « compter dans le résultat ».
    - question: "Les votes blancs sont-ils nombreux ?"
      pour: { affirmation: "Oui, au second tour.", chiffre: "6,4 %", texte: "Au second tour de 2022, 6,4 % des votants ont voté blanc : 2,2 millions de personnes.", source: "Conseil constitutionnel, 2022" }
      contre: { affirmation: "Non, pas au premier tour.", chiffre: "1,5 %", texte: "Au premier tour de 2022, avec douze candidats, 1,5 % des votants ont voté blanc.", source: "Conseil constitutionnel, 2022" }
    # § 2a, [16] : le même sondage (OpinionWay, 7 mai 2017) et le même groupe (ceux qui ont voté blanc au second tour,
    # 1 423 personnes). 81 % : « aucun candidat ne correspondait » à leurs attentes. 64 % = 35 % (Jean-Luc Mélenchon,
    # gauche) + 29 % (François Fillon, droite) au premier tour ; la carte ne nomme pas les candidats.
    - question: "Le vote blanc est-il un message clair ?"
      pour: { affirmation: "Oui : aucun candidat ne convient.", chiffre: "81 %", texte: "Selon un sondage, 81 % des votants blancs du second tour de 2017 disaient qu'aucun candidat ne correspondait à leurs attentes.", source: "OpinionWay, 2017" }
      contre: { affirmation: "Non, il mêle gauche et droite.", chiffre: "64 %", texte: "Selon un sondage, 64 % des votants blancs de 2017 avaient voté au premier tour pour deux candidats, de gauche et de droite.", source: "OpinionWay, 2017" }
    # § 2b, [5] [7] [9] [11] : la même mesure (la part des voix du président élu, blancs compris). POUR recalcule les
    # résultats officiels des deux dernières élections ; CONTRE donne l'estimation de l'Assemblée pour l'élection serrée
    # de 2012, où blancs et nuls n'étaient pas séparés (blancs supposés égaux aux trois quarts des deux).
    - question: "Le président élu aurait-il encore la majorité ?"
      pour: { affirmation: "Oui, en 2017 comme en 2022.", chiffre: "60,3 %", texte: "Recalculés avec les votes blancs, les résultats officiels donnent au président élu 60,3 % en 2017 et 54,7 % en 2022.", source: "Conseil constitutionnel, 2017 et 2022 (calcul)" }
      contre: { affirmation: "Pas dans une élection serrée.", chiffre: "49,45 %", texte: "En 2012, selon une estimation de l'Assemblée nationale, le président élu aurait eu 49,45 % des voix en comptant les blancs.", source: "Assemblée nationale, 2021 (estimation)" }
    # § 2e et 2g, [16] : le même sondage (OpinionWay, 7 mai 2017), deux questions différentes, et chaque carte dit ce
    # qu'elle mesure.
    - question: "Les Français tiennent-ils au vote blanc ?"
      pour: { affirmation: "Oui, ils veulent qu'il compte.", chiffre: "83 %", texte: "Dans un sondage de 2017, 83 % des Français voulaient que le vote blanc compte dans le résultat.", source: "OpinionWay, 2017" }
      contre: { affirmation: "Une majorité préfère choisir un candidat.", chiffre: "53 %", texte: "Dans le même sondage de 2017, 53 % jugeaient préférable de voter pour le candidat le moins déplaisant plutôt que blanc.", source: "OpinionWay, 2017" }
