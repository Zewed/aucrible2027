# BROUILLON À VÉRIFIER : rédigé par IA le 10/11/2026 à partir de sources publiques.
# Chaque chiffre et chaque position doivent être vérifiés par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/057-ivg.md (tout ce qui suit y est sourcé).
# Mots disputés (étude, « Règles de lecture ») : « double clause de conscience » (partisans de la suppression ; le
# Syngof la conteste), « stigmatisante », « droit » ou « liberté » d'avorter, « anti-choix » et « pro-vie », « déserts »
# d'IVG. La fiche écrit « clause propre à l'IVG » et « clause générale », « liberté » pour la Constitution ; les autres
# mots n'apparaissent que dans la voix d'un camp ou dans une citation, ou pas du tout.
# Défendre la clause n'est pas s'opposer à l'IVG (étude, « Règles de lecture ») : aucune option ne touche à l'IVG elle-même.
numero: 57
date: 2026-09-01
theme: sante
question: "Faut-il supprimer la clause de conscience propre à l'IVG ?"
titreCourt: "La clause de conscience"
contexte:
  # § 1.1 et 1.5, [1] [2] [5].
  - "La loi dit qu'un médecin ou une sage-femme « n'est jamais tenu » de pratiquer une IVG, mais doit alors donner tout de suite à la patiente le nom d'autres praticiens : c'est la clause de conscience propre à l'IVG, présente dans la loi depuis 1975."
  # § 1.1, [6].
  - "Une seconde clause, générale et fixée par décret, permet à tout médecin de refuser un soin pour des raisons personnelles, sauf en cas d'urgence."
  # § 1.3 et 1.4, [1] [16] [17].
  - "Depuis mars 2024, la Constitution garantit la liberté de recourir à l'IVG, sans parler de la clause de conscience ; en octobre 2026, 28 députés socialistes ont déposé un texte pour supprimer la clause propre à l'IVG."
chiffres:
  # § 2b, [8].
  - valeur: "259 400"
    unite: IVG
    legende: "ont été pratiquées en France en 2025, soit 17,8 pour 1 000 femmes de 15 à 49 ans"
    source: { organisme: "Drees", document: "Études et résultats n° 1384", annee: 2026 }
  # § 1.1 et 2a, [5].
  - valeur: "3"
    unite: actes
    legende: "ont une clause de conscience propre dans le droit français : l'IVG, la stérilisation à visée contraceptive et la recherche sur l'embryon"
    source: { organisme: "Assemblée nationale", document: "rapport d'information n° 3343", annee: 2020 }
  # § 2b, [8] : l'accès selon le territoire ; aucun chiffre ne dit combien de refus viennent de la clause.
  - valeur: "83 %"
    legende: "des femmes de métropole ont avorté dans leur département en 2025, de 55 % dans l'Ain à 96 % dans les Alpes-Maritimes"
    source: { organisme: "Drees", document: "Études et résultats n° 1384", annee: 2026 }
# L'ordre est une échelle : de la protection la plus forte de la clause (A) à sa suppression avec un délai plus long (D).
options:
  - id: A
    libelle: "Inscrire la clause de conscience dans la Constitution"
    implique: "La Constitution, qui garantit depuis 2024 la liberté de recourir à l'IVG, garantirait aussi aux soignants le droit « de ne pas être tenus de la pratiquer ou d'y concourir ». La clause propre à l'IVG resterait dans la loi."
    # § 2c, [17] [18].
    defenseurs: "La liberté de conscience des soignants doit être garantie au même niveau que celle des femmes, pour que la liberté de recourir à l'IVG ne puisse jamais être opposée aux médecins."
    # § 2a et 2c, [1] [4] [5].
    critiques: "Aucun texte ne propose d'obliger un soignant à pratiquer une IVG : graver le refus dans la Constitution ferait encore plus de l'avortement un acte à part."
    detail:
      chiffrage:
        # § 1.6d et 2h, [17]. Aucun coût n'est donné par l'étude.
        texte: "Inscrire la clause n'a pas de coût direct. L'ajout proposé au Sénat en 2024 visait le droit des soignants « de ne pas être tenus de la pratiquer ou d'y concourir »."
        source: { organisme: "Sénat", document: "amendement n° 1 rect. sexies", annee: 2024 }
      defenseurs:
        - texte: "La Constitution protège depuis 2024 la liberté des femmes : elle doit protéger, à côté, celle des soignants qui ne veulent pas pratiquer l'acte."
        - texte: "Une liberté « garantie » pourrait un jour être opposée aux médecins devant les juges : seule la Constitution met leur conscience durablement à l'abri."
        # § 2c, [34] [source secondaire].
        - texte: "En Suède, où la loi ne reconnaît pas de clause, deux sages-femmes ont été écartées d'emplois parce qu'elles refusaient de participer à des avortements : il faut mettre la clause hors d'atteinte d'une simple loi."
      critiques:
        - texte: "Aucun texte ne propose d'obliger un soignant à pratiquer une IVG, et la liberté de conscience a déjà valeur constitutionnelle."
        - texte: "Mettre le refus des soignants dans la Constitution, à côté de l'IVG, ferait encore plus de l'avortement un acte à part."
        # § 2b et 3, [8] : 83 % des femmes de métropole avortent dans leur département, soit environ une sur six hors.
        - texte: "L'accès est déjà inégal, une femme sur six avortant hors de son département en métropole : protéger davantage le refus n'aiderait pas les femmes."
          source: { organisme: "Drees", annee: 2026 }
  - id: B
    libelle: "Garder la clause propre à l'IVG dans la loi"
    implique: "Rien ne change : la loi dit toujours qu'un médecin ou une sage-femme n'est jamais tenu de pratiquer une IVG, et oblige celui qui refuse à donner tout de suite le nom d'autres praticiens. Le délai reste de 14 semaines de grossesse."
    # § 2a, [7] [10].
    defenseurs: "L'IVG n'est pas un acte comme les autres : la conscience des soignants mérite la protection d'une loi, pas seulement celle d'un décret que le gouvernement peut changer seul."
    # § 2a, [1] [5].
    critiques: "La clause générale suffit à permettre un refus : garder une clause propre fait de l'IVG un acte toléré plutôt qu'un droit à part entière."
    detail:
      chiffrage:
        # § 1.1, [6].
        texte: "La garder ne change rien. Aucun chiffre ne dit combien de soignants l'invoquent : en 2013, le Haut Conseil à l'égalité jugeait son usage « très mal connu »."
        source: { organisme: "Haut Conseil à l'égalité entre les femmes et les hommes", annee: 2013 }
      defenseurs:
        - texte: "L'IVG n'est pas un acte médical comme les autres : une clause qui lui est propre reconnaît cette singularité, sans rien retirer aux femmes."
        # § 2a, [3] : le code de déontologie modifié par le décret n° 2026-691.
        - texte: "La clause générale n'est qu'un décret, que le gouvernement peut modifier seul, comme il l'a encore fait pour le code de déontologie en juillet 2026 : la conscience des soignants mérite la protection d'une loi."
        # § 1.1, 1.5 et 2a, [2] [4] [5] [6].
        - texte: "Toutes les lois qui ont élargi l'IVG depuis 1975 ont gardé cette clause : dans les hôpitaux publics, qui ne peuvent pas refuser l'IVG, elle garantit par la loi à chaque soignant qu'il ne sera pas obligé de la pratiquer lui-même."
      critiques:
        - texte: "Elle n'apporte aux soignants aucune protection de plus que la clause générale, et fait de l'IVG un acte toléré plutôt qu'un droit à part entière."
        - texte: "Certains médecins l'invoquent à partir d'un certain terme de la grossesse, ce qui raccourcit de fait le délai légal."
        # § 2b, [6] : relevés des agences régionales de santé, cités par le HCE en 2013.
        - texte: "En 2013, les agences régionales de santé relevaient des refus visant des mineures sans autorisation parentale ou des femmes jugées « récidivistes »."
  - id: C
    libelle: "Supprimer la clause propre, garder la clause générale"
    implique: "Un médecin ou une sage-femme pourrait toujours refuser une IVG au nom de la clause générale, sauf urgence, et la loi l'obligerait toujours à informer la patiente sans délai et à lui donner le nom d'autres praticiens. C'est ce que prévoit une proposition de loi déposée à l'Assemblée en octobre 2026."
    # § 2a et 2c, [1] [5].
    defenseurs: "Personne ne serait obligé de pratiquer une IVG : supprimer la dernière condition posée en 1975 ferait enfin de l'avortement un droit à part entière."
    # § 2a et 2b, [10] [22].
    critiques: "La clause générale n'est qu'un décret, modifiable par le gouvernement seul, et supprimer la clause propre ne suffirait pas à garantir l'accès sans moyens en plus."
    detail:
      chiffrage:
        # § 1.4 et 2h, [1].
        texte: "Supprimer la clause propre n'a pas de coût direct. Une proposition de loi en ce sens a été déposée par 28 députés le 6 octobre 2026."
        source: { organisme: "Assemblée nationale", document: "proposition de loi n° 3247", annee: 2026 }
      defenseurs:
        - texte: "Personne ne serait obligé de pratiquer une IVG : la clause générale demeure, et le soignant qui refuse devra toujours orienter la patiente sans délai."
        - texte: "La clause propre est la dernière condition de la loi de 1975 encore en vigueur : elle culpabilise les femmes, et la supprimer ferait de l'IVG un droit à part entière."
        # § 2b, [1] [5].
        - texte: "La clause propre entretient des refus constatés sur le terrain malgré la Constitution : certains médecins l'invoquent à partir d'un certain terme, ce qui raccourcit de fait le délai légal."
      critiques:
        - texte: "La clause générale n'est qu'un décret : sans clause propre, la conscience des soignants ne serait plus protégée par la loi."
        - texte: "La clause propre est la contrepartie de l'autorisation d'interrompre une grossesse : elle protège les soignants, d'abord ceux du service public."
        # § 2b, [7] : le ministère expliquait cette baisse par la fermeture de maternités et la démographie médicale.
        - texte: "Entre 2005 et 2018, le nombre d'établissements qui pratiquent l'IVG est passé de 653 à 511, en même temps que fermaient des maternités : supprimer la clause ne rouvrira pas ces services."
          source: { organisme: "Drees", document: "cité par le Sénat", annee: 2021 }
  - id: D
    libelle: "Supprimer la clause et passer à 22 semaines"
    implique: "La clause propre à l'IVG disparaît, la clause générale demeure, et le délai pour avorter passe de 14 à 22 semaines de grossesse, comme aux Pays-Bas et au Royaume-Uni."
    # § 2d, [29] [30].
    defenseurs: "Une femme qui découvre sa grossesse tard doit pouvoir avorter en France, comme aux Pays-Bas ou au Royaume-Uni, sans qu'une clause propre fasse de l'IVG un acte à part."
    # § 2d, [7] [8].
    critiques: "Allonger le délai ne répond pas au manque de moyens des services d'IVG, et 1 à 2 % des IVG ont lieu dans les deux dernières semaines du délai actuel."
    detail:
      chiffrage:
        # § 2d, [7]. Délais en semaines de grossesse.
        texte: "Le délai passerait de 14 à 22 semaines de grossesse, celui des Pays-Bas et du Royaume-Uni. Il est de 14 semaines en Espagne et en Autriche, de 16 en Suède."
        source: { organisme: "Sénat", document: "commission des affaires sociales", annee: 2021 }
      defenseurs:
        - texte: "Une femme qui découvre sa grossesse tard doit pouvoir avorter en France, sans devoir partir à l'étranger."
        # § 2d, [7] : ratios de 2019.
        - texte: "Un délai plus long ne fait pas plus d'IVG : 0,18 IVG pour une naissance aux Pays-Bas, 0,32 au Royaume-Uni, 0,31 en France."
          source: { organisme: "CCNE", document: "cité par le Sénat", annee: 2020 }
        - texte: "Aucun soignant ne serait obligé de pratiquer une IVG tardive : la clause générale demeure."
      critiques:
        - texte: "Allonger le délai ne répond pas au manque de moyens et de médecins des services d'IVG."
        # § 2d, [8] : 3,3 % des IVG à l'hôpital ont lieu à partir de 14 SA (les deux dernières semaines avant la limite
        # de 16 SA), soit 1 à 2 % de toutes les IVG.
        - texte: "1 à 2 % des IVG, quelques milliers par an, ont lieu dans les deux dernières semaines du délai actuel : allonger ne concernerait qu'une petite part des femmes."
          source: { organisme: "Drees", annee: 2026 }
        # § 1.2 et 1.5, [5] [8] : 10 semaines en 1975, 12 en 2001, 14 en 2022.
        - texte: "Le délai a déjà été allongé deux fois, de 10 à 14 semaines : il faut le stabiliser plutôt que le repousser encore."
          source: { organisme: "Drees", annee: 2026 }
