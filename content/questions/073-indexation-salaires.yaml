# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour indexer tous les salaires"
    argument: "On ne doit pas s'appauvrir en travaillant : les salaires doivent suivre les prix, comme le SMIC et les pensions."
  - titre: "Pour ne pas les indexer"
    argument: "Indexer tous les salaires entretiendrait la hausse des prix et pèserait sur l'emploi des petites entreprises : mieux vaut négocier branche par branche."
# Les deux choix de l'autocollant « Et toi ? » de la story : A d'un côté, B et C (pas d'indexation) de l'autre.
story:
  - choix: "Indexer tous les salaires"
    precision: "sur les prix, chaque année"
  - choix: "Ne pas les indexer"
    precision: "les branches négocient, avec ou sans obligation"
