# BROUILLON À VÉRIFIER : rédigé par IA le 11/11/2026 à partir de sources publiques.
# Chaque chiffre et chaque position doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/073-indexation-salaires.md (tout ce qui suit y est sourcé).
# La fiche porte sur le mécanisme qui protège les salaires des hausses de prix, pas sur le niveau du SMIC (question 002).
# Décision de l'auteur (11/11/2026) : l'indexation plafonnée à deux fois le salaire médian est retirée, personne ne la
# défendant aujourd'hui ; les options sont A (tout indexer), B (obliger les branches, sans indexer), C (règles actuelles).
# Mots disputés, attribués ou évités (étude, « Règles de lecture ») : « boucle » ou « spirale prix-salaires » (mot des
# opposants ; les partisans parlent de « boucle prix-profits »), évités dans le texte de la fiche, gardés dans les
# citations ; « charges » évité, la fiche écrit « cotisations » ; « smicardisation » évité, la fiche dit que les grilles
# « s'écrasent » sur le SMIC.
# Question reformulée après relecture (11/11/2026) : « comme le SMIC » reprenait l'argument de l'option A ; l'étude
# (§ 4) garde l'ancienne formulation.
numero: 73
date: 2026-08-17
theme: travail-retraites
question: "Faut-il indexer tous les salaires du privé sur les prix ?"
titreCourt: "L'indexation des salaires"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/073-indexation-salaires-constat-iPNswDCSbQeCmRZ5YHltAwblIXWmCt.mp4", duree: "4 min 34", ecrans: [0, 12.5, 25, 38.14, 51.87, 64.37, 77.5, 90, 103.77, 115.64, 126.87, 138.77, 151.27, 165.64, 180, 193.77, 207.5, 221.87, 236.87, 251.87, 266.87] }
contexte:
  - "Depuis 1958, la loi interdit de lier les salaires à la hausse des prix : seul le SMIC est relevé automatiquement quand les prix montent."
  - "Le Parlement a rejeté l'indexation de tous les salaires du privé en 2022 et en 2025, mais la commission des affaires sociales de l'Assemblée nationale l'a adoptée le 19 octobre 2026."
  - "Le débat oppose ceux qui veulent indexer tous les salaires, ceux qui préfèrent obliger chaque branche professionnelle à garder ses plus bas salaires au niveau du SMIC, et ceux qui veulent garder les règles actuelles."
chiffres:
  - valeur: "−1,3 %"
    legende: "de pouvoir d'achat pour le salaire net moyen du privé en 2022, puis −1,0 % en 2023 et +0,8 % en 2024"
    source: { organisme: Insee, document: Insee Première n° 2079, annee: 2025 }
  - valeur: "126"
    unite: branches sur 179
    legende: "avaient un premier niveau de salaire sous le SMIC juste après sa hausse de juin 2026"
    source: { organisme: Ministère du Travail, document: "cité par le rapport n° 3350 de l'Assemblée nationale", annee: 2026 }
  - valeur: "3 %"
    legende: "des salariés du privé de la zone euro ont un salaire indexé sur les prix, surtout en Belgique"
    source: { organisme: BCE, document: Bulletin économique 7/2021, annee: 2021 }
options:
  - id: A
    libelle: Indexer tous les salaires sur les prix
    implique: "Chaque année, tout salaire du privé est relevé au moins autant que les prix ; les accords de branche et d'entreprise peuvent prévoir mieux. Le texte adopté en commission en 2026 prévoit une caisse payée par les entreprises de plus de 750 millions d'euros de chiffre d'affaires pour aider les petites."
    defenseurs: "On ne doit pas s'appauvrir en travaillant : le SMIC, les pensions et la plupart des prestations suivent déjà les prix, les autres salaires doivent les suivre aussi."
    critiques: "Une hausse automatique de tous les salaires risque d'entretenir la hausse des prix et de peser sur les petites entreprises, qui n'ont pas les marges des grands groupes."
    detail:
      chiffrage:
        texte: "Aucun chiffrage de son coût n'a été trouvé : il dépend de l'inflation et des hausses déjà négociées. Sur vingt ans, le salaire de base a progressé de 2,1 % par an en moyenne, contre 1,4 % pour les prix : en temps normal, la garantie jouerait peu."
        source: { organisme: Institut Montaigne, document: "chiffrage du programme du Nouveau Front populaire", annee: 2024 }
      defenseurs:
        - texte: "Quand les prix montent plus vite que les salaires, on s'appauvrit sans avoir moins travaillé : le salaire net moyen a perdu 1,3 % de pouvoir d'achat en 2022, puis 1,0 % en 2023."
          source: { organisme: Insee, document: Insee Première n° 2079, annee: 2025 }
        - texte: "Le SMIC, les pensions et la plupart des prestations suivent déjà les prix : les salariés juste au-dessus du SMIC sont les seuls à ne pas être protégés."
        - texte: "Ce ne sont pas les salaires qui ont tiré les prix : près de la moitié de la hausse des prix de la zone euro depuis début 2022 vient des profits des entreprises."
          source: { organisme: FMI, document: document de travail 23/131, annee: 2023 }
      critiques:
        - texte: "Le boulanger, le restaurateur ou l'artisan paieraient la hausse en emplois : en Belgique, 1 % de coût salarial en plus par l'indexation réduirait de 0,6 % le travail demandé par les entreprises."
          source: { organisme: Institut Montaigne, document: "chiffrage du programme du Nouveau Front populaire, d'après Bijnens et al., De Economist, 2023", annee: 2024 }
        - texte: "En 1982-1983, l'arrêt de l'indexation a cassé l'inflation : ensuite, une hausse des prix ne passait plus qu'aux deux tiers dans les salaires."
          source: { organisme: Économie et Prévision, document: "Ralle et Toujas-Bernate, 1990, cité par l'Assemblée nationale", annee: 1990 }
        - texte: "Si les salaires n'ont pas entraîné les prix en 2022, c'est justement parce qu'ils étaient peu indexés : indexer tous les salaires, énergie comprise, prolongerait chaque hausse des prix."
  - id: B
    libelle: "Sans indexer, obliger les branches à suivre le SMIC"
    implique: "Pas d'indexation par la loi. Chaque branche professionnelle doit garder les plus bas salaires de sa convention collective au moins au niveau du SMIC, sinon ses employeurs perdent leurs baisses de cotisations ; une conférence nationale sur les salaires lance des négociations dans chaque branche."
    defenseurs: "Le retard vient de branches qui tardent à négocier : il faut les obliger à suivre le SMIC, plutôt que de faire fixer tous les salaires par un indice des prix."
    critiques: "Les uns jugent qu'obliger à négocier ne garantit aucune hausse aux salaires au-dessus du minimum ; les autres veulent garder la souplesse de chaque branche face à sa concurrence."
    detail:
      chiffrage:
        texte: "Aucun chiffrage n'a été trouvé. La loi de financement de la sécurité sociale pour 2026 prévoit déjà de lier les baisses de cotisations des employeurs à des minima de branche au niveau du SMIC, mais son décret n'était pas pris le 19 octobre 2026."
        source: { organisme: Assemblée nationale, document: rapport n° 3350, annee: 2026 }
      defenseurs:
        - texte: "Les branches tardent à suivre : au 2e trimestre 2026, leurs plus bas salaires n'avaient monté que de 1,1 % en un an. Il faut les y obliger, pas fixer tous les salaires par un indice."
          source: { organisme: Banque de France, document: "citée par le rapport n° 3350 de l'Assemblée nationale", annee: 2026 }
        - texte: "Une indexation générale « protège autant le salarié au Smic que celui qui gagne dix fois plus » : l'effort doit aller d'abord aux bas salaires."
        - texte: "La loi doit garantir un plancher, et la négociation entre syndicats et employeurs faire le reste : d'abord une conférence nationale sur les salaires, puis des accords dans chaque branche."
      critiques:
        - texte: "Obliger à négocier n'oblige pas à augmenter : seuls les plus bas salaires seraient protégés, et ceux juste au-dessus continueraient de perdre face aux prix."
        - texte: "Dans une petite entreprise sans syndicat, le salarié n'a personne pour négocier : il n'y a de délégué syndical qu'à partir de 50 salariés."
          source: { organisme: Assemblée nationale, document: rapport n° 3350, annee: 2026 }
        - texte: "Les branches se remettent déjà à niveau, sans sanction : 82 avaient encore un premier niveau de salaire sous le SMIC le 30 septembre 2026, contre 126 en juin."
          source: { organisme: Ministère du Travail, document: "cité par le rapport n° 3350 de l'Assemblée nationale", annee: 2026 }
  - id: C
    libelle: "Garder la règle actuelle, seul le SMIC indexé"
    implique: "Seul le SMIC est relevé automatiquement avec les prix. Les autres salaires se négocient chaque année dans les branches et les entreprises, sans obligation d'aboutir à une hausse ; ses défenseurs proposent plutôt de baisser les cotisations pour augmenter le salaire net."
    defenseurs: "Sans indexation, les prix ne se sont pas emballés, et le dialogue social a permis le rattrapage dès 2024 : chaque branche garde la souplesse que demande sa concurrence."
    critiques: "Sans protection, les salaires perdent face aux prix à chaque poussée d'inflation, et le bas des grilles s'écrase sur le SMIC."
    detail:
      chiffrage:
        texte: "Rien ne change. De 2020 à 2025, le salaire de base a suivi les prix selon l'indice de l'Insee (+0,3 % une fois l'inflation déduite), mais a perdu 1,8 % selon l'indice européen, qui compte les frais de santé restant à la charge des ménages."
        source: { organisme: Assemblée nationale, document: "calcul de la commission des affaires sociales, d'après la Dares et l'Insee", annee: 2026 }
      defenseurs:
        - texte: "Le système actuel a permis le rattrapage : les salaires réels sont repartis à la hausse en 2024, de 0,8 % une fois l'inflation déduite."
          source: { organisme: Insee, document: Insee Première n° 2079, annee: 2025 }
        - texte: "Pour que le salaire net suive les prix sans peser sur l'emploi, mieux vaut baisser les cotisations que d'imposer une hausse à toutes les entreprises."
        - texte: "Une hausse des prix venue de l'énergie appauvrit tout le pays : indexer ne fait pas disparaître cette perte, elle la reporte sur les entreprises, l'emploi ou de nouvelles hausses de prix."
      critiques:
        - texte: "Les hausses négociées restent faibles quand les prix montent : au 2e trimestre 2026, plus de 15 % des accords de branche prévoyaient 1 % ou moins."
          source: { organisme: Banque de France, document: "citée par le rapport n° 3350 de l'Assemblée nationale", annee: 2026 }
        - texte: "Rien n'oblige à aboutir : les branches et les entreprises doivent négocier chaque année, pas augmenter les salaires."
        - texte: "Quand le SMIC rattrape les premiers échelons d'une grille, l'ancienneté et la qualification ne sont plus payées."
