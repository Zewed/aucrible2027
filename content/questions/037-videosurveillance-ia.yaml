  # Votes du groupe RN, 23/03/2023 et 10/07/2026 : https://datan.fr/votes/legislature-17/vote_8194
  le-pen: { option: B, source: "Votes du groupe RN, 23/03/2023 et 10/07/2026", statut: deduite }
  # L'Avenir en commun, 2025 ; votes du groupe LFI, 2023 et 2026 : https://melenchon2027.fr/programme2025/livre/chapitre18/s5/
  melenchon: { option: A, source: "L'Avenir en commun, 2025 ; votes du groupe LFI, 2023 et 2026", statut: deduite }
  # Projet 2027 et vote du groupe écologiste, 10/07/2026 : https://datan.fr/votes/legislature-17/vote_8194
  tondelier: { option: A, source: "Projet 2027 et vote du groupe écologiste, 10/07/2026", statut: deduite }
  # Vote du groupe socialiste, 10/07/2026 : https://datan.fr/votes/legislature-17/vote_8194
  glucksmann: { option: A, source: "Vote du groupe socialiste, 10/07/2026", statut: deduite }
