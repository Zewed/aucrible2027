# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/037-videosurveillance-ia.md (chaque chiffre y a sa
# source numérotée). Le fil : un essai né pour les Jeux, prolongé jusqu'en 2030 ; faut-il l'arrêter, le généraliser
# ou aller jusqu'aux visages ?
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1 et 1.2, [1] [2] [9].
    etapes:
      - { quand: "D'abord à l'essai jusqu'en", valeur: mars 2025 }
      - { quand: "Aujourd'hui jusqu'en", valeur: décembre 2030 }
    chute: "… pour les caméras qui signalent à un agent certaines situations à risque, sans reconnaître les visages."
  ecart:
    # § 2a, [21] [22] : même périmètre (caméras de voie publique), deux décomptes dont la Cour souligne l'imprécision.
    titre: "Combien de caméras dans nos rues ?"
    etapes:
      - { quand: Fin 2010, valeur: "~10 000" }
      - { quand: Fin 2018, valeur: "~60 000" }
    chute: "Ce sont des estimations : la Cour des comptes juge le décompte approximatif."
    source: "Cour des comptes, 2011 et 2020"
  leviers:
    # § 2h et § 4 : les quatre options de la fiche, à égalité.
    titre: "Quatre choix possibles"
    choix:
      - { texte: Arrêter, detail: "et interdire la reconnaissance faciale dans la loi" }
      - { texte: "Continuer l'essai", detail: "jusqu'en 2030, puis décider" }
      - { texte: Généraliser, detail: "dans plus de lieux, sans reconnaître les visages" }
      - { texte: Aller plus loin, detail: "reconnaître le visage des personnes recherchées" }
    chute: "En Europe, reconnaître les visages en direct dans les lieux publics reste interdit à la police, sauf exceptions."
    source: "Parlement, 2026 ; Union européenne, 2024"
  camps: { pour: POUR, contre: CONTRE, objet: généraliser ces caméras }
  questions:
    # § 2b et § 3, [23] [24] : deux synthèses d'études avec zones témoins, des mêmes chercheurs (celle de 2019 met à jour
    # celle de 2008) ; les deux camps citent des caméras classiques, sans intelligence artificielle. La comparaison de
    # 58 communes par la Cour des comptes (2020) n'est pas une étude de cause à effet : écartée face à une synthèse.
    - question: "Les caméras font-elles reculer la délinquance ?"
      pour: { affirmation: "Oui, dans certains lieux.", chiffre: 40 ans, texte: "Quarante ans d'études montrent une baisse modeste des délits, plus forte dans les parkings et avec un agent devant les écrans.", source: "Criminology & Public Policy, 2019" }
      contre: { affirmation: "Pas les violences.", chiffre: 44 études, texte: "Une synthèse de 44 études ne trouve pas d'effet sur les violences, et moins d'effet dans les transports et les centres-villes.", source: "Campbell Collaboration, 2008" }
    # § 2c, [3] : même opérateur (RATP), même période (Jeux olympiques), même unité (part des alertes) : intrusions,
    # 1 222 justes sur 1 546 (79 %) ; objets abandonnés, 151 fausses sur 193 (78 %). La question porte sur la justesse
    # des alertes, seule mesurée : ce que le logiciel a manqué ne l'a pas été.
    - question: "Les alertes de l'intelligence artificielle sont-elles fiables ?"
      pour: { affirmation: "Oui, pour les intrusions.", chiffre: 4 sur 5, texte: "Dans les transports parisiens, pendant les Jeux olympiques, près de quatre alertes d'intrusion sur cinq étaient justes.", source: "Comité d'évaluation, 2025" }
      contre: { affirmation: "Pas pour les objets abandonnés.", chiffre: 4 sur 5, texte: "Dans les mêmes transports, près de quatre alertes sur cinq pour un objet abandonné étaient fausses.", source: "Comité d'évaluation, 2025" }
    # § 2d, [3] [4] : le même essai, vu par ses utilisateurs et par ses interventions sur le terrain (1 préfecture de
    # police, 7 SNCF, selon le Sénat). « Peu » suit le comité (intérêt « limité », interventions « extrêmement
    # résiduel[les] ») ; l'affirmation dit sur quoi elle juge, car le comité note que les interventions ne mesurent pas
    # tout l'intérêt (vérifications, présence policière massive pendant les Jeux).
    - question: "L'essai a-t-il été utile ?"
      pour: { affirmation: "Oui, selon ceux qui l'ont mené.", chiffre: 4 sur 4, texte: "Les quatre services qui ont testé ces caméras, dont la police de Paris, demandent à les garder.", source: "Sénat, 2025" }
      contre: { affirmation: "Peu, à en juger par les interventions.", chiffre: "8", texte: "Pendant l'essai, les alertes de l'intelligence artificielle ont conduit à huit interventions d'agents sur le terrain.", source: "Sénat, 2025" }
    # § 2h et 2l, [3] : le même sondage pour les deux camps.
    - question: "Faut-il aller jusqu'à reconnaître les visages ?"
      pour: { affirmation: "Oui, pour retrouver une personne recherchée.", chiffre: 76 %, texte: "Dans un sondage, 76 % des Français se disent favorables à des caméras capables de reconnaître une personne précise.", source: "Verian, 2024" }
      contre: { affirmation: "Non, ce serait surveiller tout le monde.", chiffre: 62 %, texte: "Dans le même sondage, 62 % pensent que les caméras à intelligence artificielle vont banaliser la surveillance de tous.", source: "Verian, 2024" }
