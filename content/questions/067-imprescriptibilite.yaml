# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour supprimer le délai"
    argument: "La victime parle quand elle le peut : aucun délai ne doit plus tomber comme un couperet."
  - titre: "Pour garder un délai"
    argument: "C'est le manque de preuves et de moyens, pas le délai, qui empêche de juger."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Aucune limite de temps"
    precision: "pour tout ou partie de ces crimes"
  - choix: "Garder un délai"
    precision: "30 ans après la majorité"
