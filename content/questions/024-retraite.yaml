# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/024-retraite.md (chaque chiffre y a sa source
# numérotée). Le fil : pour équilibrer les retraites, il n'y a que trois leviers (COR) ; l'âge est le premier.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1 et 1.3, [1] [3].
    etapes:
      - { quand: "Aujourd'hui", valeur: 62 ans et 9 mois }
      - { quand: En 2033, valeur: 64 ans }
    chute: … sauf si une nouvelle loi change les règles.
  mecanisme:
    # § 2a, [1] [2] : les cotisations font les deux tiers des ressources (277 Md€ sur 417).
    titre: Qui paie les retraites ?
    texte: "Surtout ceux qui travaillent : une partie de leur salaire va directement aux retraités."
    points:
      - { annee: 2002, valeur: 2.1 }
      - { annee: 2070, valeur: 1.3, projection: true }
    chute: Il y a de moins en moins de travailleurs pour chaque retraité.
    source: COR, 2026
  ecart:
    # § 2a, [11] : en euros de 2024, même unité et même horizon que la question sur le financement.
    titre: Combien manque-t-il ?
    etapes:
      - { quand: En 2025, valeur: "6,6 milliards €" }
      - { quand: En 2045, valeur: "~30 milliards €", projection: true }
    chute: "C'est une prévision : tout dépendra des naissances, de l'économie et de la façon de compter."
    source: Cour des comptes, 2025
  leviers:
    # § 2i et 2k, [1]. Le troisième levier nomme tous ceux qui pourraient payer : c'est là que les camps s'opposent.
    titre: Pour trouver cet argent, trois solutions
    choix:
      - { texte: Partir plus tard, detail: travailler plus longtemps }
      - { texte: Toucher moins, detail: des retraites qui augmentent moins vite que les salaires }
      - { texte: Faire payer plus, detail: "les salariés, les entreprises ou les très grandes fortunes" }
    chute: Chaque âge de départ mélange ces trois solutions.
    source: COR, 2026
  camps: { pour: POUR, contre: CONTRE, objet: un départ plus tard }
  # Relu trois fois par deux relecteurs, l'un pour reculer l'âge, l'autre contre (notes finales 9 et 8,5) ;
  # chaque réponse compare ce qui se compare, et l'ordre d'apparition des camps suit ABBA.
  questions:
    # § 2b et 2c, [13] [14] [18].
    - question: "On vit plus longtemps : faut-il partir plus tard ?"
      pour: { affirmation: La retraite dure déjà plus longtemps., chiffre: "+6 ans", texte: "À 60 ans, on vit en moyenne six ans de plus qu'en 1980.", source: "Insee, 2025" }
      contre: { affirmation: Pas pour tout le monde., chiffre: 2 ans, texte: "Les ouvriers passent deux ans de moins à la retraite que les cadres, alors qu'ils partent plus tôt.", source: "COR, 2025" }
    # § 2e, [23] [28].
    - question: Les plus de 60 ans pourront-ils travailler plus longtemps ?
      pour: { affirmation: Ils travaillent déjà plus., chiffre: 44 %, texte: "Aujourd'hui, 44 % des 60-64 ans ont un emploi. Ils étaient 18 % en 2010.", source: "Eurostat, 2025" }
      contre: { affirmation: Pas tous., chiffre: 1 sur 2, texte: "Un senior sur deux a travaillé plus longtemps. L'autre a attendu sa retraite au chômage, en invalidité ou sans activité.", source: "IPP, 2025 (réforme de 2010)" }
    # § 1.1 et 2j, [1] [45].
    - question: Part-on plus tôt que dans les autres pays ?
      pour: { affirmation: "Oui, plus tôt que la moyenne.", chiffre: "61,9 ans", texte: "En France, les hommes arrêtent de travailler à 61,9 ans en moyenne, contre 64,7 ans dans les pays riches.", source: "OCDE, 2025 ; COR, 2026" }
      contre: { affirmation: L'âge ne fait pas tout., chiffre: 43 ans, texte: "Pour une retraite complète, il faudra bientôt avoir travaillé 43 ans. Atteindre l'âge minimum ne suffit pas.", source: "COR, 2026" }
    # § 2e, 2i et 2k, [1] [11].
    - question: Peut-on trouver l'argent autrement ?
      pour: { affirmation: Travailler plus longtemps crée des emplois., chiffre: "+200 000", texte: "Chaque année de travail en plus créerait 200 000 emplois à long terme, selon les estimations du COR.", source: "COR, 2026" }
      contre: { affirmation: "Oui, en cotisant un peu plus.", chiffre: "5 à 8 milliards €", texte: "Une hausse d'un point des cotisations sur les salaires rapporterait chaque année à peu près ce qui manque aujourd'hui.", source: "Cour des comptes, 2025" }
