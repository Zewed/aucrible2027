numero: 24
date: 2026-10-23
theme: travail-retraites
question: À quel âge devrait-on pouvoir partir à la retraite ?
titreCourt: "L'âge de la retraite"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/024-retraite-SYmDdO5Fz9N0WNJ6i8r18yYFskZU77.mp4", duree: "2 min" }
contexte:
  - La réforme de 2023 a commencé à repousser l'âge légal de 62 à 64 ans, puis sa hausse a été suspendue fin 2025.
  - "Notre système fonctionne par répartition : les cotisations de ceux qui travaillent paient les pensions d'aujourd'hui."
  - Comme on vit plus longtemps, il y a de moins en moins d'actifs pour chaque retraité.
chiffres:
  - valeur: "1,7"
    legende: cotisant pour 1 retraité
    source: { organisme: COR, document: rapport, annee: 2025 }
  - valeur: 14 %
    legende: "du PIB : environ ce que représentent les retraites"
    source: { organisme: COR, annee: 2025 }
  - valeur: "62"
    unite: ans
    legende: "et 10 mois : l'âge moyen de départ"
    source: { organisme: DREES, annee: 2025 }
options:
  - id: A
    libelle: 60 ans
    implique: Retour à l'âge légal d'avant 2010, financé par de nouvelles cotisations.
    defenseurs: Deux ans de retraite en bonne santé en plus, d'abord pour ceux qui ont commencé tôt.
    critiques: Un coût élevé, qui pèserait sur les salaires ou sur les entreprises.
    axes: { economie: -2 }
  - id: B
    libelle: 62 ans
    implique: On revient à l'âge fixé par la réforme de 2010.
    defenseurs: Un repère connu, appliqué pendant dix ans, sans brutalité pour les carrières longues.
    critiques: Sans recette nouvelle, le déficit des caisses de retraite se creuse.
    axes: { economie: -1 }
  - id: C
    libelle: 64 ans
    implique: On garde l'âge prévu par la réforme de 2023.
    defenseurs: Le système se rapproche de l'équilibre sans baisser les pensions.
    critiques: Les métiers pénibles et les carrières hachées en paient le prix.
    axes: { economie: 0 }
  - id: D
    libelle: 65 ans ou plus
    implique: Un âge proche de celui de plusieurs voisins européens.
    defenseurs: "On vit plus longtemps : travailler un peu plus protège le niveau des pensions."
    critiques: Beaucoup de seniors sont déjà sans emploi bien avant cet âge.
    axes: { economie: 1 }
  - id: E
    libelle: À la carte, avec un système à points
    implique: Chacun part quand il veut ; la pension dépend des points acquis.
    defenseurs: Plus de liberté, et les mêmes règles pour tous les métiers.
    critiques: "La valeur du point peut baisser : la pension devient moins prévisible."
    # Ne se range pas entre les âges (maquettes/methode.html) : compte 1 si la carte est la même, 0 sinon.
    horsEchelle: true
