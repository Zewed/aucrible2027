# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour des heures obligatoires"
    argument: "La règle s'adapte à chacun, et dans l'essai, les participants ont plus souvent trouvé un emploi durable."
  - titre: "Pour les supprimer"
    argument: "Le RSA est un minimum pour vivre, pas un salaire, et l'évaluation de l'essai ne trouve pas d'emploi en plus au total."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
