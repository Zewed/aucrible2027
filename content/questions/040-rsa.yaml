# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/040-rsa.md (chaque chiffre y a sa source
# numérotée). Le fil : depuis 2025, 15 heures en principe ; faut-il les supprimer, les garder, les durcir ou
# demander un travail ? Ni mécanisme ni écart : aucun ratio « X pour 1 » ni aucune grandeur à deux dates n'éclaire
# ce débat mieux que les leviers.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1 et 1.3, [1] [2] : la loi n'exigeait aucun minimum d'heures avant 2025.
    etapes:
      - { quand: "Jusqu'en 2024", valeur: "Aucun minimum" }
      - { quand: "Depuis 2025", valeur: "15 heures" }
    # « demandées » et non « pour toucher le RSA » : la sanction vise un manquement au contrat, pas des heures non faites (§ 1.1, [2]).
    chute: "… d'activité par semaine, en principe, demandées aux allocataires du RSA."
  leviers:
    # § 2a et 2j, [31] [32] [33]. Supprimer = revenir à avant 2025 : les démarches d'insertion de 2009 restent (§ 1.1, [10]).
    # La chute dit qui est concerné (§ 1.2, [10]) ; un résultat de la réforme (l'inscription à France Travail) aurait clos
    # les leviers sur un argument pour « les garder ».
    titre: "Que faire de ces 15 heures ?"
    choix:
      - { texte: "Les supprimer", detail: "sans minimum d'heures, comme avant 2025" }
      - { texte: "Les garder", detail: "15 heures en principe, moins selon la santé ou la famille" }
      - { texte: "Les durcir", detail: "pour tous, avec une aide plus basse sans activité" }
      - { texte: "Un travail contre le RSA", detail: "une journée par semaine pour une collectivité" }
    chute: "Fin 2024, 1,84 million de foyers touchaient le RSA."
    source: "Drees, 2025"
  camps: { pour: POUR, contre: CONTRE, objet: "les heures obligatoires" }
  # Chaque réponse compare ce qui se compare : même étude, même essai ou même règle.
  questions:
    # § 2b, [7] : les deux réponses viennent de la même évaluation, la seule avec groupe de comparaison. « 0 en plus » rend
    # « pas d'effet net significatif » et la conclusion des auteurs (« réallocation » plutôt que « créations nettes ») ;
    # le texte garde « ne mesure », qui dit la limite de la mesure.
    - question: "Les heures aident-elles à trouver un emploi ?"
      pour: { affirmation: "Oui, pour ceux qui les suivent.", chiffre: "3 sur 100", texte: "Sur 100 participants à l'essai, 3 de plus que chez des allocataires semblables avaient un emploi salarié dans l'année.", source: "Dares et IPP, 2026" }
      contre: { affirmation: "Pas d'emploi en plus au total.", chiffre: "0 en plus", texte: "Ces emplois ont manqué à d'autres allocataires voisins. Au total, l'évaluation ne mesure aucun gain net.", source: "Dares et IPP, 2026" }
    # § 2c, [7] : même évaluation, mêmes participants. Le contre parle en premier (ABBA).
    - question: "Quels emplois ont-ils trouvés ?"
      pour: { affirmation: "Des emplois qui durent.", chiffre: "7 sur 10", texte: "Sept emplois gagnés sur dix durent plus de six mois, sans plus de temps partiel ni de salaire plus bas.", source: "Dares et IPP, 2026" }
      contre: { affirmation: "Souvent des emplois aidés.", chiffre: "2 sur 3", texte: "Deux tiers des emplois durables gagnés sont des contrats aidés, payés en partie par l'État, en nombre limité.", source: "Dares et IPP, 2026" }
    # § 2d, [8] : même bilan, mêmes 18 territoires, même date. Deux mesures différentes, chacune dite pour ce qu'elle est :
    # l'orientation (68 % emploi ou socio-professionnel, d'où « avec ou sans suivi social ») et les freins (82 % des 73 %
    # dont la situation a été examinée, d'où « évalués »). « Difficultés » est le mot de la source, pas « urgences ».
    - question: "Peut-on demander 15 heures à chacun ?"
      pour: { affirmation: "La plupart peuvent viser l'emploi.", chiffre: "68 %", texte: "Dans les territoires d'essai, 68 % des allocataires ont été orientés vers un parcours qui vise l'emploi, avec ou sans suivi social.", source: "État et France Travail, 2025" }
      contre: { affirmation: "Beaucoup ont d'abord d'autres difficultés.", chiffre: "82 %", texte: "Parmi les allocataires évalués à l'entrée, 82 % avaient au moins une difficulté : transport, santé, argent, logement ou garde d'enfants.", source: "État et France Travail, 2025" }
    # § 1.1, 1.2 et 2e, [2] [4] [6] : la règle de la première sanction, et ce qu'en font les départements.
    # 100 % dans la limite de 50 % pour une famille (§ 1.2, [5]) : le texte le dit. L'enquête du Monde n'est connue que par
    # une question écrite d'un député (12/05/2026, [6]), sa date est à vérifier : la source le dit. Le contre parle en premier (ABBA).
    - question: "Les sanctions sont-elles mesurées ?"
      pour: { affirmation: "Oui, courtes et réversibles.", chiffre: "2 mois", texte: "Au premier manquement, la retenue dure deux mois au plus, et l'argent est rendu si l'on reprend ses démarches.", source: "Journal officiel, 2025" }
      contre: { affirmation: "Pas partout.", chiffre: "17 sur 51", texte: "D'après la presse, 17 départements sur 51 retiennent tout le RSA au premier manquement, la moitié au plus pour une famille.", source: "Le Monde, cité par un député, 2026" }
