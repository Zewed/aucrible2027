# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/040-rsa.md (tout ce qui suit y est sourcé).
# La distinction qui structure la fiche : des heures d'accompagnement (formation, démarches, stage), pas un emploi ;
# les options vont de leur suppression à un travail pour la collectivité.
numero: 40
date: 2026-09-18
theme: travail-retraites
question: "Faut-il conditionner le RSA à 15 heures d'activité par semaine ?"
titreCourt: "Les 15 heures du RSA"
contexte:
  - "Depuis le 1er janvier 2025, les allocataires du RSA, 1,84 million de foyers fin 2024, sont inscrits d'office à France Travail et signent un contrat qui prévoit en principe au moins 15 heures d'activité par semaine, comme une formation, des démarches ou un stage en entreprise."
  - "Ces heures peuvent être réduites selon la situation, ou supprimées pour raison de santé, de handicap ou pour un parent isolé sans solution de garde. Depuis juin 2025, un premier manquement peut entraîner une retenue d'au moins 30 % du RSA pendant un à deux mois, rendue si la personne reprend ses démarches ; en cas de récidive, elle peut durer jusqu'à quatre mois et ne plus être rendue."
  - "Dans l'essai mené de 2023 à 2024, sans les sanctions actuelles, les participants ont plus souvent trouvé un emploi que des allocataires comparables ; au total, l'évaluation officielle ne mesure pas d'emploi en plus, d'autres allocataires voisins en ayant trouvé moins."
chiffres:
  - valeur: "15"
    unite: heures
    legende: "d'activité par semaine en principe, réductibles selon la situation de chacun, demandées depuis 2025 aux allocataires du RSA"
    source: { organisme: Conseil constitutionnel, document: "décision n° 2023-858 DC", annee: 2023 }
  - valeur: "651,69"
    unite: euros
    legende: "par mois : le RSA d'une personne seule sans ressources, depuis le 1er avril 2026"
    source: { organisme: Journal officiel, document: "décret n° 2026-220", annee: 2026 }
  - valeur: "1 sur 3"
    legende: "des foyers qui avaient droit au RSA ne le percevaient pas fin 2021, avant la réforme"
    source: { organisme: Drees, document: "Études et résultats n° 1370", annee: 2026 }
options:
  - id: A
    libelle: "Supprimer les heures obligatoires"
    implique: "On revient sur la loi pour le plein emploi : plus de minimum d'heures ni la retenue créée en 2025 ; l'allocataire reste tenu, comme depuis 2009, de suivre des démarches d'insertion, et le RSA reste soumis à ses conditions de ressources."
    defenseurs: "Le RSA est un minimum pour vivre, pas un salaire : la Commission nationale consultative des droits de l'homme juge que ces heures portent atteinte aux droits humains, et l'évaluation officielle ne trouve pas d'emploi en plus au total."
    critiques: "Avant la loi, six allocataires sur dix n'avaient pas de contrat d'accompagnement valide selon la Cour des comptes, et huit Français sur dix approuvaient ces heures dans un sondage de 2022."
    axes: { economie: -2 }
  - id: B
    libelle: "Garder la règle actuelle"
    implique: "15 heures par semaine en principe, réduites selon la situation, ou aucune pour raison de santé, de handicap ou pour un parent isolé sans garde ; au premier manquement, au moins 30 % du RSA est retenu un à deux mois, puis rendu si la personne reprend ses démarches."
    defenseurs: "La règle s'adapte à chacun et vient d'entrer en vigueur : dans l'essai, les participants ont plus souvent trouvé un emploi durable, et le Conseil d'État a jugé les sanctions proportionnées en 2026."
    critiques: "Pour les uns, l'évaluation de l'essai ne trouve pas d'emploi en plus au total et les sanctions varient d'un département à l'autre ; pour les autres, la règle reste trop souple pour que le travail rapporte toujours plus que les aides."
    # 0 et non une absence de note : c'est le point milieu entre la suppression et le durcissement.
    axes: { economie: 0 }
  - id: C
    libelle: "Les durcir : 15 heures pour tous, moins d'aide sans activité"
    implique: "Le RSA est fusionné avec d'autres aides : une part est versée sans condition, 300 euros par mois dans la proposition des Républicains, le reste à condition de justifier 15 heures d'activité, et le total des aides est plafonné à 70 % du Smic net."
    defenseurs: "Le travail doit toujours rapporter plus que les aides : une allocation plus haute pour ceux qui se forment ou cherchent un emploi récompense l'effort, et deux allocataires sur trois sont orientés vers un parcours qui vise l'emploi."
    critiques: "Ceux qui ne peuvent pas faire 15 heures vivraient avec moins, alors que huit allocataires sur dix ont au moins une difficulté de transport, de santé, d'argent ou de logement, et aucune économie n'est chiffrée par l'administration."
    axes: { economie: 1 }
  - id: D
    libelle: "Le RSA contre un travail pour la collectivité"
    implique: "En échange du RSA, l'allocataire travaille, par exemple une journée par semaine, pour une commune, un hôpital ou une maison de retraite, comme le proposait Nicolas Dupont-Aignan en 2022 ; il ne s'agit plus d'heures d'accompagnement mais d'un travail, sans autre paie que le RSA."
    defenseurs: "Recevoir une aide de la collectivité, c'est lui rendre un peu de son temps : un travail utile redonne un rythme et des contacts, et le Conseil d'État a admis en 2018 du bénévolat dans le contrat d'un allocataire."
    critiques: "Un travail sans salaire ni contrat concurrence les emplois payés, ce que ses opposants appellent du « travail gratuit », et le gouvernement rappelle que la loi n'oblige en aucun cas à travailler bénévolement."
    axes: { economie: 2 }
