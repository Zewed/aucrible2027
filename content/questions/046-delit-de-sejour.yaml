# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour rétablir le délit"
    argument: "Une règle sans sanction n'est pas respectée : sans peine, l'ordre de quitter la France reste ignoré."
  - titre: "Pour ne pas le rétablir"
    argument: "Un délit puni d'une amende serait un symbole : il ne donnerait aucun pouvoir de plus à la police, et les départs bloquent ailleurs."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
