# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/046-delit-de-sejour.md (chaque chiffre y a sa source
# numérotée, voir son annexe). Le fil : le délit a disparu en 2013 ; environ un ordre de partir sur dix est exécuté ;
# quatre choix sont sur la table. Pas de mécanisme : aucun ratio « X pour 1 » ne résume le sujet (et l'écran est dessiné
# pour les retraites).
reportage:
  accroche:
    # § 1.1 et 1.3, [1] [8] : la peine encourue avant 2012 (un an au plus, et 3 750 euros) ; depuis le 01/01/2013,
    # aucune peine pour le seul séjour (l'entrée irrégulière et le maintien après une rétention restent punis).
    etapes:
      - { quand: "Jusqu'en 2012", valeur: "1 an de prison" }
      - { quand: "Depuis 2013", valeur: "Aucune peine" }
    chute: "… pour un étranger resté en France sans titre de séjour. Depuis, l'État peut lui ordonner de partir, sans le punir pour ce seul fait."
  ecart:
    # § 1.2, [10] : le même indicateur de la DGEF, repris par le Sénat ; 2025 porte sur les neuf premiers mois.
    titre: "Combien d'ordres de quitter la France sont exécutés ?"
    etapes:
      - { quand: "En 2024", valeur: "8,3 %" }
      - { quand: "En 2025", valeur: "10,9 %" }
