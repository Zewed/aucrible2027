# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/046-delit-de-sejour.md (tout ce qui suit y est sourcé).
# Vocabulaire : « clandestins » et « sans-papiers » sont des mots disputés, attribués dans l'étude ; la fiche dit
# « étranger sans titre de séjour », comme le droit (« en situation irrégulière »). L'OQTF est expliquée dans le contexte.
# Options : A et B rétablissent le délit (prison ou amende) ; C et D ne le rétablissent pas (renvoyer plus, ou
# régulariser plutôt qu'expulser). Le scrutin du 30/10/2025 écarte A et B sans trancher entre C et D.
numero: 46
date: 2026-09-12
theme: immigration
question: "Faut-il rétablir le délit de séjour irrégulier ?"
titreCourt: "Le délit de séjour irrégulier"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/046-delit-de-sejour-tYs4ro9TL7HqV5eN8V6aNxN9lPYkQo.mp4", duree: "2 min 10" }
contexte:
  - "Jusqu'à la fin de 2012, un étranger resté en France sans titre de séjour commettait un délit, puni d'un an de prison et de 3 750 euros d'amende ; la loi l'a supprimé après deux arrêts de la Cour de justice de l'Union européenne."
  - "Aujourd'hui, il peut recevoir une obligation de quitter le territoire français (OQTF), l'ordre écrit du préfet de partir, en général sous 30 jours ; s'il reste, il peut être placé dans un centre fermé, dit de rétention, puis renvoyé de force."
  - "Le Parlement a rétabli le délit en 2023, puni d'une amende, mais le Conseil constitutionnel l'a censuré pour une raison de procédure ; le 30 octobre 2025, l'Assemblée nationale a rejeté par 209 voix contre 169 un texte du RN qui reprenait celui de 2023."
chiffres:
  - valeur: "8,3 %"
    legende: "des obligations de quitter le territoire ont été exécutées en 2024 ; 10,9 % estimés sur neuf mois en 2025"
    source: { organisme: "Sénat", document: "avis sur le budget 2026, Immigration, asile et intégration", annee: 2025 }
  - valeur: "137 550"
    unite: étrangers
    legende: "ont reçu l'ordre de quitter la France en 2025, le plus grand nombre de l'Union européenne (28 % du total)"
    source: { organisme: "Eurostat", annee: 2026 }
  - valeur: "209"
    unite: députés
    legende: "ont refusé le retour du délit, puni d'une amende, contre 169, le 30 octobre 2025"
    source: { organisme: "Assemblée nationale", document: "scrutin n° 3261", annee: 2025 }
options:
  - id: A
    libelle: "Le rétablir, avec de la prison"
    implique: "Rester en France sans titre de séjour redevient un délit puni de prison et d'amende, comme jusqu'en 2012 ; le droit européen autorise aujourd'hui la prison une fois la procédure de renvoi menée à son terme, pas avant."
    defenseurs: "Seule une peine de prison permet la garde à vue, qui donnait à la police le temps d'identifier les étrangers à renvoyer ; la retenue actuelle, 24 heures sans accès à leur téléphone, n'y suffit pas, et la prison ferme dissuade de rester."
    critiques: "En 2011, la Cour de justice de l'Union a jugé la prison contraire au droit européen tant que la procédure de renvoi n'est pas allée à son terme, et en 2012, la Cour de cassation a exclu la garde à vue pour ce motif ; avant 2012, 500 à 600 étrangers par an étaient condamnés pour ce seul délit."
    axes: { societe: 2 }
  - id: B
    libelle: "Le rétablir, avec une amende"
    implique: "Rester en France sans titre de séjour redevient un délit puni de 3 750 euros d'amende, et le juge peut interdire le territoire pendant trois ans, comme l'avait voté le Parlement en 2023 ; la garde à vue reste impossible."
    defenseurs: "Une règle sans sanction n'est pas respectée : moins de 1,5 % des étrangers qui reçoivent l'ordre de partir le font d'eux-mêmes. Le droit européen permet l'amende, et la plupart des pays de l'Union sanctionnaient ce séjour en 2013."
    critiques: "Ses opposants, dont le ministre de l'Intérieur en 2025, y voient un symbole : sans prison, la police n'a aucun pouvoir de plus, l'amende viserait des personnes souvent sans ressources et des milliers de dossiers encombreraient les tribunaux."
    axes: { societe: 1 }
  - id: C
    libelle: "Renvoyer plus, sans délit"
    implique: "Pas de délit : l'État mise sur plus de places en centre de rétention (de moins de 2 000 à 3 000 en 2029), sur la pression envers les pays qui refusent de reprendre leurs ressortissants et sur de nouveaux moyens d'identifier les étrangers."
    defenseurs: "Ce qui bloque les départs, ce sont les pays d'origine, l'identification et le manque de places : la rétention est le moyen le plus sûr de renvoyer, selon le Sénat, alors qu'un délit puni d'une amende ne donnerait aucun pouvoir de plus à la police."
    critiques: "Pour les uns, sans sanction l'ordre de partir reste ignoré, et en 2024, six étrangers sur dix sont sortis de rétention sans être renvoyés ; pour les autres, enfermer coûte cher (16 200 euros par séjour en 2022) et la pression sur les visas a eu une efficacité « en demi-teinte »."
    axes: { societe: 0 }
  - id: D
    libelle: "Régulariser plutôt qu'expulser"
    implique: "Pas de délit et moins d'enfermement : les étrangers installés ou qui travaillent obtiennent un titre de séjour, et ceux qui doivent partir sont aidés à rentrer chez eux plutôt que placés en rétention."
    defenseurs: "Être sans titre est une situation administrative, pas une faute, parfois créée par l'attente en préfecture ; un titre sort ces personnes de l'exploitation, et un départ aidé coûte quatre fois moins qu'un renvoi forcé."
    critiques: "Des étrangers sous ordre de partir resteraient sans sanction et pourraient espérer un titre, ce qui attirerait d'autres arrivées selon ses opposants ; en 2024, 6 909 personnes sont parties avec une aide au retour, en dessous de l'objectif de 8 000."
    axes: { societe: -2 }
