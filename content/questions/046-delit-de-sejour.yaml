# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/046-delit-de-sejour.md (chaque chiffre y a sa source
# numérotée, voir son annexe). Le fil : le délit a disparu en 2013 ; environ un ordre de partir sur dix est exécuté ;
# quatre choix sont sur la table. Pas de mécanisme : aucun ratio « X pour 1 » ne résume le sujet (et l'écran est dessiné
# pour les retraites).
reportage:
  accroche:
    # § 1.1 et 1.3, [1] [8] : la peine encourue avant 2012 (un an au plus, et 3 750 euros) ; depuis le 01/01/2013,
    # aucune peine pour le seul séjour (l'entrée irrégulière et le maintien après une rétention restent punis).
    etapes:
      - { quand: "Jusqu'en 2012", valeur: "1 an de prison" }
      - { quand: "Depuis 2013", valeur: "Aucune peine" }
    chute: "… pour un étranger resté en France sans titre de séjour. Depuis, l'État peut lui ordonner de partir, sans le punir pour ce seul fait."
  ecart:
    # § 1.2, [10] : le même indicateur de la DGEF, repris par le Sénat ; 2025 porte sur les neuf premiers mois.
    titre: "Combien d'ordres de quitter la France sont exécutés ?"
    etapes:
      - { quand: "En 2024", valeur: "8,3 %" }
      - { quand: "En 2025", valeur: "10,9 %" }
    chute: "Une OQTF est l'ordre écrit du préfet de quitter la France. Ces taux sont des estimations, sur neuf mois pour 2025."
    source: "Sénat, 2025"
  leviers:
    # § 4 : les quatre options de la fiche, à égalité ; § 2c, [1] [8] pour la chute : ce que le droit européen permet à
    # B (amende, arrêt Sagor de 2012) et à A (prison après la procédure de renvoi, arrêts El Dridi et Achughbabian de 2011).
    titre: "Quatre choix possibles"
    choix:
      - { texte: "Le rétablir, avec prison", detail: "comme avant 2012, pour tout étranger resté sans titre de séjour" }
      - { texte: "Le rétablir, avec amende", detail: "3 750 euros et une interdiction du territoire, comme voté en 2023" }
      - { texte: "Renvoyer plus, sans délit", detail: "plus de places en rétention et de pression sur les pays d'origine" }
      - { texte: "Régulariser plutôt qu'expulser", detail: "un titre pour qui travaille, une aide pour rentrer plutôt que l'enfermement" }
    chute: "Le droit européen permet une amende, si elle n'empêche pas le renvoi, et la prison une fois la procédure de renvoi menée à son terme."
    source: "Cour de justice de l'Union européenne, 2011 et 2012"
  camps: { pour: POUR, contre: CONTRE, objet: "le retour du délit" }
  questions:
    # § 1.1, [1] : deux règles du code des étrangers, même peine (un an de prison) ; le POUR montre l'entrée punie et le
    # séjour non, le CONTRE montre que le maintien en France après une rétention l'est déjà (214 condamnations en 2024) ; son
    # affirmation dit « après une rétention », pas « s'il refuse de partir » : le seul refus d'une OQTF n'est pas puni.
    - question: "Rester sans titre doit-il être puni ?"
      pour: { affirmation: "Oui, comme l'entrée irrégulière.", chiffre: "1 an", texte: "Entrer en France sans autorisation est puni d'un an de prison. Y rester sans titre ne l'est plus.", source: "Assemblée nationale, 2025" }
      contre: { affirmation: "Déjà, s'il reste après une rétention.", chiffre: "214", texte: "Rester après une rétention sans renvoi est puni d'un an de prison : 214 étrangers condamnés en 2024.", source: "Assemblée nationale, 2025" }
    # § 2a, 1.2 et 2b, [9] [1] [4] : le 1,5 % est un comptage incomplet, mais la Cour des comptes juge le nombre réel
    # « probablement pas significativement supérieur » (§ 1.2) ; les deux sont dits. Le CONTRE donne le meilleur argument
    # de l'étude sur l'effet d'une amende, le seul sur lequel tous s'accordent (§ 2b, 3) : sans prison, pas de garde à vue,
    # donc « aucun pouvoir coercitif supplémentaire » (L. Nuñez) pour identifier et renvoyer ; la retenue reste à 24 heures.
    - question: "Une amende ferait-elle partir davantage ?"
      pour: { affirmation: "Oui, l'ordre seul ne suffit pas.", chiffre: "1,5 %", texte: "Moins de 1,5 % des étrangers sommés de partir quittent la France d'eux-mêmes : un compte incomplet, mais sans doute proche du réel.", source: "Cour des comptes, 2024" }
      contre: { affirmation: "Non, la police n'y gagne rien.", chiffre: "24 h", texte: "Sans prison, pas de garde à vue : pour identifier un étranger à renvoyer, la police le garde 24 heures au plus.", source: "Assemblée nationale, 2025" }
    # § 2a, [9] [10] : deux obstacles relevés par les rapports officiels, chacun avec son chiffre ; 44 641 personnes de
    # 2019 à février 2023 ; 40 % des retenus des centres de rétention de métropole (pas d'outre-mer) en 2025, coopération
    # algérienne arrêtée en mars 2025. Aucune source ne mesure la part de chaque obstacle (§ 2a).
    - question: "Qu'est-ce qui bloque les départs ?"
      pour: { affirmation: "Ils restent, ordre après ordre.", chiffre: "44 641", texte: "De 2019 à début 2023, 44 641 étrangers ont reçu plusieurs ordres de quitter la France.", source: "Cour des comptes, 2024" }
      contre: { affirmation: "Des pays refusent leur retour.", chiffre: "40 %", texte: "En 2025, en métropole, 40 % des étrangers en rétention étaient Algériens. L'Algérie bloquait leur retour depuis mars.", source: "Sénat, 2025" }
    # § 2g, [10] [9] : six sur dix = 100 - 38,8 = 61,2 % (calcul de l'étude, à partir du taux de renvoi à l'issue de la
    # rétention en métropole, 2024) ; le CONTRE : 34 % des départs avec une aide, moyenne 2017-2022, dite dans le texte
    # comme l'année du POUR ; 1 120 euros contre 4 414 pour un renvoi forcé.
    - question: "Peut-on les faire partir sans les punir ?"
      pour: { affirmation: "Non, la rétention ne suffit pas.", chiffre: "6 sur 10", texte: "En 2024, en métropole, six étrangers placés en rétention sur dix en sont sortis sans être renvoyés.", source: "Sénat, 2025" }
      contre: { affirmation: "Oui, avec l'aide au retour.", chiffre: "1 sur 3", texte: "De 2017 à 2022, un départ sur trois s'est fait avec une aide pour rentrer, quatre fois moins chère qu'un renvoi forcé.", source: "Cour des comptes, 2024" }
