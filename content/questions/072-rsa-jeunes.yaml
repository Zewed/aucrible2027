cotes:
  - titre: "Pour un revenu dès 18 ans"
    argument: "Les 18-25 ans sont plus pauvres que la moyenne et, sauf exceptions, restent privés du RSA : rien ne justifie de les exclure de cette solidarité."
  - titre: "Pour garder le RSA à 25 ans"
    argument: "La réponse à la pauvreté des jeunes est l'emploi et la formation : un minimum social dès 18 ans risque d'enfermer dans l'aide au lieu d'accompagner vers l'emploi."
# Les deux choix de l'autocollant « Et toi ? » de la story : A et B contre C et D.
story:
  - choix: "Un revenu dès 18 ans"
    precision: "le RSA, ou un revenu étudiants compris"
  - choix: "Le RSA à 25 ans"
    precision: "avec le contrat d'engagement jeune, élargi ou non"
