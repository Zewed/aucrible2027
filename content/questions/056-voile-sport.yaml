    url: https://www.senat.fr/dossier-legislatif/ppl23-376.html
  - titre: "Conseil d'État, décision du 29 juin 2023 sur l'interdiction des signes religieux par la Fédération française de football"
    url: https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2023-06-29/458088
  - titre: "Défenseur des droits, Les discriminations fondées sur la religion, 2025"
    url: https://www.defenseurdesdroits.fr/sites/default/files/2025-12/ddd_rapport_les-discriminations-fondees-sur-la-religion_20251204.pdf
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour l'interdire"
    argument: "Le terrain doit rester neutre et le même pour toutes et tous."
  - titre: "Pour ne pas l'interdire"
    argument: "La neutralité s'impose à ceux qui représentent l'État, pas aux joueuses amateurs."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "L'interdire partout"
    precision: "par la loi"
  - choix: "Ne pas l'interdire partout"
    precision: "chaque sport décide, ou on l'autorise"
# Positions sourcées seulement (étude, § 4). Inconnues : Glucksmann, Lisnard, Attal, Tondelier, Roussel, Ruffin, Arthaud.
