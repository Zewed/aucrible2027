# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/056-voile-sport.md (tout ce qui suit y est sourcé).
# Les règles et textes étudiés visent tous les signes religieux et politiques ; le débat, les recours et le sondage portent
# surtout sur le voile. La fiche ne va pas au-delà de ce que disent les textes. Mots disputés (« séparatisme »,
# « islamisme », « liberté religieuse », « discrimination ») : toujours attribués, voir l'étude, « Règles de lecture ».
numero: 56
date: 2026-09-02
theme: societe
question: "Faut-il interdire les signes religieux, dont le voile, dans les compétitions sportives ?"
titreCourt: "Le voile dans le sport"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/056-voile-sport-0dupfJcw5sS0MBWxXjv6tAd7pz75UY.mp4", duree: "1 min 40" }
contexte:
  - "Les sportifs sélectionnés en équipe de France doivent rester neutres et ne portent aucun signe religieux en compétition, comme l'a jugé le Conseil d'État en 2023."
  - "Pour les autres licenciés, chaque fédération décide. Le football et le basket interdisent les signes religieux en match, d'autres sports comme le handball les autorisent."
  - "En février 2025, le Sénat a voté un texte qui les interdirait dans toutes les compétitions, amateurs comprises. L'Assemblée nationale ne l'a pas encore examiné."
chiffres:
  - valeur: "210"
    unite: sénateurs
    legende: "ont voté, contre 81, le texte qui interdirait les signes religieux dans toutes les compétitions, le 18 février 2025"
    source: { organisme: Sénat, document: scrutin public n° 199, annee: 2025 }
  - valeur: "14"
    unite: fédérations
    legende: "sur 80 étudiées par le ministère des Sports interdisent un signe ou une tenue religieuse en compétition"
    source: { organisme: Assemblée nationale, document: mission flash sur le sport, annee: 2025 }
  - valeur: "1"
    unite: pays sur 38
    # Amnesty est partie au débat ; aucune source indépendante ne confirme ce décompte (étude § 2f) : la légende le dit.
    legende: "en Europe interdit le voile au football, au basket ou au volley : la France, selon Amnesty International, qui conteste ces interdictions"
    source: { organisme: Amnesty International, annee: 2024 }
options:
  - id: A
    libelle: L'interdire dans toutes les compétitions
    implique: "Une règle nationale interdit les signes et tenues religieux ou politiques visibles dans toutes les compétitions officielles, du niveau départemental au niveau national, comme le prévoit le texte voté par le Sénat en 2025."
    # L'égalité entre les femmes et les hommes est l'argument d'une partie de la gauche laïque comme de la droite
    # (étude § 2d, [18] [22]) ; « prosélytisme » retiré, absent de l'étude.
    defenseurs: "Le terrain doit rester neutre et le même pour toutes et tous : une loi claire protège les arbitres et les clubs, défend l'égalité entre les femmes et les hommes et ferme la porte au repli communautaire."
    critiques: "La laïcité oblige l'État et ses agents, pas les joueuses : la loi écarterait des compétitions, même amateurs, des femmes qui portent le voile, ce que des experts de l'ONU jugent discriminatoire."
    # Société : la note mesure l'écart à la règle actuelle (B, 0). A et C changent un point (la loi interdit dans
    # toutes les fédérations, ou leur interdit d'interdire), D en change deux (l'équipe de France aussi).
    # +1 et non +2 : l'interdiction n'est pas une position de la seule droite. Une partie de la gauche laïque la
    # défend au nom de la laïcité et de l'égalité (§ 2d) : 12 des 18 sénateurs communistes ont voté l'article 1er
    # (§ 1.4, [3]) et 66 % des proches du PS y sont favorables dans le sondage CSA (§ 2g, [21]).
    axes: { societe: 1 }
  - id: B
    libelle: Laisser chaque fédération décider
    implique: "Les sélectionnés en équipe de France restent neutres. Pour les autres, chaque fédération fixe sa règle sous le contrôle du juge, qui exige qu'une interdiction soit nécessaire au bon déroulement des matchs."
    defenseurs: "Chaque fédération connaît les risques de son sport : le juge a validé l'interdiction au football, sans qu'une loi impose la même règle à tous."
    critiques: "Les uns y voient un flou qui laisse arbitres et clubs seuls face aux pressions, les autres des interdictions qui écartent déjà des joueuses au football et au basket."
    # 0 et non +1 : c'est la règle actuelle, le point milieu, défendue à gauche comme au centre (J.-L. Mélenchon,
    # É. Borne, étude § 1.4 et § 4) ; +1 la rangeait du côté conservateur.
    axes: { societe: 0 }
  - id: C
    libelle: "L'autoriser, sauf en équipe de France"
    implique: "Les sélectionnés en équipe de France restent neutres. Pour tous les autres, une fédération ne peut plus interdire un couvre-chef religieux adapté au sport, sauf pour une raison de sécurité."
    defenseurs: "La neutralité s'impose à ceux qui représentent la France, pas aux amateurs, qui ne représentent pas l'État : les écarter les prive de sport."
    critiques: "Le terrain deviendrait un lieu d'affichage religieux, et chaque club serait exposé seul aux pressions de ceux qui veulent y imposer leurs règles."
    axes: { societe: -1 }
  - id: D
    libelle: "L'autoriser partout, équipe de France comprise"
    implique: "Aucune fédération ne peut interdire un couvre-chef religieux adapté au sport, et les athlètes de l'équipe de France peuvent le porter, comme le permettent les règles mondiales du basket ou du football."
    defenseurs: "Les fédérations internationales et le Comité international olympique l'autorisent : une athlète qui porte le voile doit pouvoir représenter son pays, comme ailleurs en Europe."
    critiques: "Une équipe nationale représente un État laïque : ses membres doivent rester neutres, comme l'a jugé le Conseil d'État."
    axes: { societe: -2 }
