  # LCI, 16/09/2026, rapporté par La Gazette France : https://www.lagazettefrance.fr/article/interdiction-du-voile-le-pen-veut-le-faire-de-maniere-progressive
  # et par Dakaractu : https://www.dakaractu.com/Marine-Le-Pen-veut-interdire-le-voile-de-maniere-progressive-en-cas-de-victoire_a276105.amp.html
  # Europe 1 (dépêche), point presse du mercredi 19/03/2025 : https://www.europe1.fr/node/668697
  melenchon: { option: B, source: "Europe 1 (dépêche), point presse du mercredi 19/03/2025", statut: deduite }
  # CNews, 18/03/2025, rapporté par Sud Radio le 19/03/2025 (transcription) : https://www.sudradio.fr/emission/dites-le-franchement-366
  philippe: { option: A, source: "CNews, 18/03/2025, rapporté par Sud Radio le 19/03/2025 (transcription)", statut: deduite }
  # LCI, 16/09/2026 (dépêche AFP reprise par La Gazette France) : https://www.lagazettefrance.fr/article/interdiction-du-voile-le-pen-veut-le-faire-de-maniere-progressive
  le-pen: { option: A, source: "LCI, 16/09/2026 (dépêche AFP reprise par La Gazette France)", statut: deduite }
  # Message d'Éric Zemmour du 27/06/2023, republié sur son blog (Goodreads) : https://www.goodreads.com/author/show/243305._ric_Zemmour/blog?page=1
  zemmour: { option: A, source: "Message d'Éric Zemmour du 27/06/2023, republié sur son blog (Goodreads)", statut: officielle }
  # Déclaration radio du 25/03/2025 (dépêche AFP, Bluewin) : https://www.bluewin.ch/fr/infos/le-tacle-ose-du-ministre-de-linterieur-teddy-riner-il-ma-fait-vibrer-on-aime-le-sportif-mais-la-li.2622494
  retailleau: { option: A, source: "Déclaration radio du 25/03/2025 (dépêche AFP, Bluewin)", statut: officielle }
# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/056-voile-sport.md (chaque chiffre y a sa source
# numérotée, voir son annexe). Le fil : le Sénat veut une loi, l'Assemblée ne l'a jamais votée ; quatre choix possibles,
# la France applique le deuxième.
# Ni mécanisme ni écart : aucun rapport « X pour 1 » ni aucune grandeur à deux dates ne sont sourcés pour ce sujet.
reportage:
  accroche:
    # § 1.4, [2] [5] [6] [30].
    etapes:
      - { quand: "En 2021", valeur: "Voté au Sénat" }
      - { quand: "En 2025", valeur: "Voté à nouveau" }
    chute: "… mais jamais adopté par l'Assemblée nationale."
  leviers:
    # § 1.2 et 2h, [2] [7] [8].
    titre: "Quatre choix possibles"
    choix:
      - { texte: "L'interdire par la loi", detail: "dans toutes les compétitions, comme l'a voté le Sénat" }
      - { texte: "Laisser chaque fédération décider", detail: "le football et le basket l'interdisent, d'autres sports non" }
      - { texte: "L'autoriser, sauf en équipe de France", detail: "ceux qui représentent la France restent neutres" }
      - { texte: "L'autoriser partout", detail: "comme les fédérations internationales" }
    chute: "Aujourd'hui, la France applique le deuxième."
    source: "Conseil d'État, 2023"
  camps: { pour: POUR, contre: CONTRE, objet: "une interdiction par la loi" }
  # Relu le 28/10/2026 par deux relecteurs, l'un pour une interdiction par la loi (gauche laïque comprise), l'autre
  # contre (sportives concernées comprises). Chaque réponse compare ce qui se compare : question 1, le même sondage des
  # deux côtés, ses commanditaires nommés ; question 2, deux arguments de principe sur la laïcité ; question 3, deux
  # mesures différentes, que chaque texte nomme ; question 4, la même décision du Conseil d'État, lue par chaque camp.
  # Le récit ne rattache pas le voile au « séparatisme » : les comptages de l'État portent sur des associations, pas
  # sur des sportives qui portent un signe religieux, et aucune source ne mesure un lien entre les deux (étude § 2c).
  questions:
    # § 2g, [21] : même sondage des deux côtés, commandé par CNews, Europe 1 et Le JDD. Taille, dates et mode de
    # recueil non vus [à vérifier] ; la question portait sur « le voile », sans distinguer amateurs et équipe de France.
    - question: "Les Français veulent-ils l'interdire ?"
      pour: { affirmation: "Oui, près de trois sur quatre.", chiffre: "73 %", texte: "Dans un sondage de mars 2025, 73 % des personnes interrogées veulent interdire le voile en compétition.", source: "CSA pour CNews, Europe 1 et Le JDD, 2025" }
      contre: { affirmation: "Pas la majorité des jeunes.", chiffre: "57 %", texte: "Dans le même sondage, 57 % des 18-24 ans s'opposent à cette interdiction.", source: "CSA pour CNews, Europe 1 et Le JDD, 2025" }
    # § 1.1 et 2a, [13] [5] [8] : le meilleur argument de principe de chaque camp. POUR : la loi de 2004 impose déjà
    # la neutralité à des usagers, les élèves ; « le sport, comme l'école, apprend la règle commune » (Sénat). CONTRE :
    # le Défenseur des droits juge « contraire au principe même de laïcité » l'extension à tous les licenciés.
    # Remplace « Des clubs sont-ils en rupture avec la République ? » (127 associations, 0,03 % : calcul de l'étude),
    # hors du sujet (voir plus haut) et qui forçait chaque camp à répondre sur le terrain du « séparatisme ».
    # Chiffres : la durée d'application de la loi de 2004 (§ 1.2, [13]) et le nombre de licenciés que viserait
    # une interdiction générale (16,5 millions, [18], source secondaire), plutôt que des années, qui ne prouvent rien.
    - question: "La laïcité doit-elle s'imposer à tous les sportifs ?"
      pour: { affirmation: "Oui, comme aux élèves à l'école.", chiffre: "22 ans", texte: "Depuis 22 ans, la loi interdit les signes religieux voyants aux élèves des écoles publiques, qui ne sont pas des agents de l'État.", source: "Loi du 15 mars 2004" }
      contre: { affirmation: "Non, elle oblige l'État, pas les amateurs.", chiffre: "16,5 millions", texte: "L'interdire aux 16,5 millions de licenciés des clubs serait contraire à la laïcité, selon le Défenseur des droits.", source: "Défenseur des droits, 2025 ; gouvernement, 2025" }
    # § 2b et 2f, [19] [9] : deux mesures différentes, que chaque texte dit. « La France fait exception » est le
    # constat partagé de l'étude (§ 2f) ; le décompte « 1 sur 38 » est celui d'Amnesty, partie au débat, sans
    # confirmation indépendante : le texte dit qu'elle s'oppose à ces interdictions.
    - question: "Faut-il une même règle pour tous les sports ?"
      pour: { affirmation: "Oui, les règles varient d'un sport à l'autre.", chiffre: "14 sur 80", texte: "Sur 80 fédérations étudiées par le ministère des Sports, 14 interdisent les signes religieux en compétition.", source: "Assemblée nationale, 2025" }
      contre: { affirmation: "Non, la France fait déjà exception.", chiffre: "1 sur 38", texte: "Sur 38 pays européens, seule la France interdit le voile au foot, au basket ou au volley, selon Amnesty, qui s'y oppose.", source: "Amnesty International, 2024" }
    # § 1.2 et 2b, [7] [8] [5] : la même décision, lue par chaque camp. POUR : elle ne vaut que pour la Fédération
    # française de football, chaque autre fédération doit justifier sa règle (Défenseur des droits), d'où la demande
    # d'un « cadre législatif clair » (Sénat). Remplace « 1 club » (un retrait d'agrément depuis 2021, § 2c) : cet
    # outil vise les clubs contraires aux principes républicains, pas les signes religieux. CONTRE : la décision vise
    # tous les signes (statuts de la FFF), d'où « les signes religieux » et non « le voile ».
    - question: "Les règles actuelles suffisent-elles ?"
      pour: { affirmation: "Non, chaque fédération doit se justifier seule.", chiffre: "1 sport", texte: "Le Conseil d'État a validé l'interdiction au football. Chaque autre fédération doit prouver que la sienne est nécessaire.", source: "Conseil d'État, 2023 ; Défenseur des droits, 2025" }
      contre: { affirmation: "Oui, le juge permet d'interdire.", chiffre: "3 recours", texte: "Le Conseil d'État a rejeté trois recours : une fédération peut interdire les signes religieux si c'est nécessaire.", source: "Conseil d'État, 2023" }
