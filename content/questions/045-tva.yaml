# Inconnues (étude § 4) : Philippe (« rééquilibrer le financement du modèle social », sans nommer la TVA :
# https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere), Glucksmann, Retailleau (« pas d'impôt nouveau »,
# sans rien dire d'une baisse), Lisnard (simplifier les taux : https://www.unenouvelleenergie.fr/changer-de-logiciel-fiscal/),
# Zemmour, Ruffin (aucune mesure de TVA dans son plan : https://nouspresident.fr/plan-de-redressement/).
# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/045-tva.md (chaque chiffre y a sa source numérotée,
# et l'annexe de l'étude dit d'où vient chacun). Le fil : une TVA sociale votée puis abrogée en 2012 ; trois choix ;
# les camps s'opposent sur une baisse de la TVA, le débat de la campagne de 2026 (« l'essentiel » est le mot des
# partisans d'une baisse, étude « Règles de lecture » : il reste dans leur levier, pas dans le nom des camps).
# Pas de « mécanisme » ni d'« écart » : aucun rapport « X pour 1 » ni aucune grandeur à deux dates n'éclaire le débat
# sans le pencher (le prix du gazole sur deux semaines de septembre 2026 a été écarté pour cette raison).
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.3 et 2f, [28] [29] : loi du 14 mars 2012, abrogée par la loi du 16 août 2012 avant d'entrer en vigueur (le
    # dire évite de laisser croire qu'elle a été essayée puis a échoué). La chute nomme les trois choix d'aujourd'hui.
    etapes:
      - { quand: "Mars 2012", valeur: "Votée" }
      - { quand: "Août 2012", valeur: "Abrogée" }
    chute: "… avant d'entrer en vigueur : la « TVA sociale », plus de TVA pour moins de cotisations. Aujourd'hui, certains veulent la relancer, d'autres baisser la TVA sur l'essentiel, d'autres ne pas y toucher."
  leviers:
    # § 2a, 2d, 2e et 2f, [6] [25] [28]. Les trois options de la fiche, dans son ordre. Le premier et le troisième
    # disent qui paierait : la chute nomme la compensation d'une baisse et ceux qui paient une hausse.
    titre: "Pour la TVA, trois choix"
    choix:
      - { texte: "La baisser sur l'essentiel", detail: "l'alimentation de base, l'énergie, voire les carburants" }
      - { texte: "Ne pas y toucher", detail: "et aider ceux qui en ont besoin" }
      - { texte: "L'augmenter", detail: "pour baisser les cotisations sur les salaires" }
    chute: "Une baisse doit être compensée par d'autres impôts, des économies ou de la dette. Une hausse est payée par tous ceux qui achètent."
    source: "Conseil des prélèvements obligatoires, 2023 ; Sénat, 2012"
  camps: { pour: POUR, contre: CONTRE, objet: une baisse de la TVA }
  # Chaque réponse est le meilleur argument de son camp ; les estimations sont dites comme telles. Le camp CONTRE
  # réunit ceux qui veulent garder les taux et ceux qui veulent les augmenter : ses réponses valent pour les deux.
  questions:
    # § 2b, [7] [8] : même organisme, mêmes données de 2016 (André et Biotteau). L'un mesure la TVA en part du
    # revenu de chaque groupe (13,1 % et 7,4 %, arrondis), l'autre la part de toute la TVA payée par chaque groupe.
    - question: "Qui paie le plus de TVA ?"
      pour: { affirmation: "Les modestes, en part du revenu.", chiffre: "13 %", texte: "Les 10 % les plus modestes versent 13 % de leur revenu en TVA, les 10 % les plus aisés 7 %.", source: "Insee, 2021" }
      contre: { affirmation: "Les plus aisés, en euros.", chiffre: "32 %", texte: "Les 20 % les plus aisés paient 32 % de toute la TVA, les 20 % les plus modestes 12 %.", source: "Insee, 2021" }
    # § 2c, [12] [13] [9] [10]. Pour : la part de la baisse arrivée dans les prix, « presque complète » (Banque
    # d'Espagne), d'où « presque 100 % » (l'ancien « 0 % », le nouveau taux, ne prouvait rien et se lisait « 0 % de
    # baisse »). Contre : la part gardée par les propriétaires (plus de 55 %). Chaque texte dit, à égalité, ce qui rend
    # son cas particulier : l'Espagne obligeait à baisser les prix d'autant ; la France de 2009 ne l'imposait pas
    # (contrat d'avenir, étude § 2c). Les deux viennent d'études, nommées en source.
    - question: "Une baisse ferait-elle baisser les prix ?"
      pour: { affirmation: "Oui, en Espagne.", chiffre: "presque 100 %", texte: "En 2023, l'Espagne a supprimé la TVA des aliments de base, avec obligation de baisser les prix : ils ont baissé presque d'autant.", source: "Banque d'Espagne, 2024" }
      contre: { affirmation: "Pas toujours.", chiffre: "55 %", texte: "En 2009, sans obligation de baisser leurs prix d'autant, les restaurateurs ont gardé plus de 55 % de leur baisse de TVA.", source: "Benzarti et Carloni, 2019" }
    # § 2d, [18] [17] : le non-recours à l'aide carburant (1,5 million de demandes manquantes sur près de 3 millions
    # d'ayants droit, à une semaine de la date limite) et le coût annuel de la baisse proposée par le RN (l'AFP la décrit
    # sur « toutes les énergies » dans une dépêche, sur les carburants dans une autre, pour le même chiffre). Les deux
    # chiffres viennent du gouvernement, par l'AFP (étude [source secondaire]), d'où « cité par l'AFP » dans les deux
    # sources. Chacun dit sa limite : l'un est un relevé à une semaine de la date limite, l'autre une estimation du
    # gouvernement (au conditionnel, « selon le gouvernement ») ; « les carburants » et non « l'essence », comme
    # l'étude et le chiffre 3 de la fiche. L'un est une part de personnes, l'autre un coût : ils ne se comparent pas,
    # chacun répond à la question.
    - question: "Vaut-il mieux aider tout le monde ?"
      pour: { affirmation: "Oui, une aide ciblée en oublie.", chiffre: "1 sur 2", texte: "À une semaine de la date limite, un travailleur sur deux qui y avait droit n'avait pas demandé l'aide carburant.", source: "Gouvernement, cité par l'AFP, 2026" }
      contre: { affirmation: "Non, cela coûte des milliards.", chiffre: "12 à 15 milliards €", texte: "Une TVA à 5,5 % sur l'énergie et les carburants coûterait 12 à 15 milliards d'euros par an, selon le gouvernement.", source: "Gouvernement, cité par l'AFP, 2026" }
    # § 2d et 2a, [17] [6] : la part des taxes dans le prix du sans-plomb (50,1 % au 24/08/2026) et la part des
    # achats soumis à la TVA qui paient le taux normal (65 % en France, 71 % en moyenne dans l'Union). Les deux
    # cartes répondent à la même question à deux échelles, chacune la sienne dite : un achat, toutes taxes
    # (l'autre taxe est l'accise), et tous les achats soumis à la TVA. Ni « surtout » (l'essence n'est pas le
    # produit le plus taxé), ni « nos voisins » (la preuve est une moyenne de l'Union).
    - question: "Taxe-t-on trop ce que l'on achète ?"
      pour: { affirmation: "Oui, à la pompe.", chiffre: "50 %", texte: "Les taxes font la moitié du prix de l'essence sans plomb, et la TVA se calcule aussi sur l'autre taxe.", source: "AFP, 2026" }
      contre: { affirmation: "Non, moins que la moyenne européenne.", chiffre: "65 %", texte: "En France, 65 % des achats soumis à la TVA paient le taux normal, contre 71 % en moyenne dans l'Union européenne.", source: "Conseil des prélèvements obligatoires, 2023" }
