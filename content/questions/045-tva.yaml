    argument: "La TVA pèse plus lourd sur les modestes : 13 % de leur revenu, contre 7 % pour les plus aisés."
  - titre: "Pour ne pas la baisser"
    argument: "Une baisse coûte cher et profite d'abord, en euros, aux 20 % les plus aisés, qui paient 32 % de la TVA."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "La baisser"
    precision: "sur l'essentiel"
  - choix: "Ne pas la baisser"
    precision: "voire l'augmenter"
