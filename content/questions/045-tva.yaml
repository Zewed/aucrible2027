# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux dont cette fiche découle : docs/etudes/045-tva.md (tout ce qui suit y est sourcé, l'annexe dit d'où vient chaque chiffre).
# Le déficit a sa fiche (012) ; l'ISF (001), les héritages (033) et la taxe Zucman (039) aussi : celle-ci porte sur la TVA.
numero: 45
date: 2026-09-13
theme: economie-impots
question: "Faut-il baisser la TVA sur l'essentiel, ou l'augmenter pour baisser les cotisations ?"
titreCourt: "La TVA"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/045-tva-ReRzVPPBYyn441E2SMD2q6TSVaZIyx.mp4", duree: "1 min 50" }
contexte:
  - "La TVA est la taxe payée sur ce que l'on achète : 20 % sur la plupart des produits, dont l'électricité, le gaz et les carburants, 10 % au restaurant et 5,5 % sur l'alimentation de base."
  - "Certains veulent la baisser sur les produits de première nécessité, comme les députés qui ont voté en novembre 2025 une TVA à 0 % sur une liste de ces produits ; le gouvernement préfère des aides réservées à ceux qui en ont besoin."
  - "D'autres veulent l'augmenter pour baisser les cotisations prélevées sur les salaires : c'est la « TVA sociale », votée en mars 2012 puis abrogée en août 2012, avant d'entrer en vigueur."
chiffres:
  - valeur: "212"
    unite: milliards d'euros
    legende: "de TVA en 2025 : c'est le premier impôt, et 27 % de cette somme va à la Sécurité sociale, 25 % aux collectivités"
    source: { organisme: DGFiP, document: "DGFiP Statistiques n° 43", annee: 2026 }
  - valeur: "13 %"
    legende: "de leur revenu : ce que versent en TVA les 10 % les plus modestes, contre 7 % pour les 10 % les plus aisés (données 2016)"
    source: { organisme: Insee, document: "Économie et Statistique n° 522-523", annee: 2021 }
  - valeur: "12 à 15"
    unite: milliards d'euros
    legende: "par an : ce que coûterait la TVA à 5,5 % sur l'énergie et les carburants que propose le RN, selon le gouvernement"
    source: { organisme: Gouvernement, document: "chiffrage cité par l'AFP", annee: 2026 }
options:
  - id: A
    libelle: "Baisser la TVA sur l'essentiel"
    implique: "La TVA baisse, ou disparaît, sur des produits de première nécessité : l'alimentation et l'hygiène de base, l'électricité et le gaz, et pour certains les carburants, que le droit européen interdit aujourd'hui de taxer à taux réduit. La recette perdue doit être compensée par d'autres impôts, des économies ou de la dette."
    defenseurs: "La TVA pèse plus lourd sur les ménages modestes : 13 % de leur revenu pour les 10 % les plus modestes, contre 7 % pour les 10 % les plus aisés. Les taxes font la moitié du prix de l'essence sans plomb, et en Espagne, en 2023, la suppression de la TVA sur le pain, le lait ou les fruits est arrivée presque entièrement dans les prix, comme la loi l'imposait."
    critiques: "Une baisse coûte cher, 12 à 15 milliards d'euros par an pour l'énergie et les carburants selon le gouvernement, et profite d'abord, en euros, aux 20 % les plus aisés, qui paient 32 % de la TVA. Après la baisse de 2009 dans les restaurants, sans obligation de baisser les prix d'autant, les propriétaires en ont gardé plus de la moitié, selon une étude."
    # Économie : les trois options déplacent la charge entre les mêmes ménages. A allège un impôt que l'Insee juge
    # plus lourd, en part du revenu, pour les modestes, au nom de leur pouvoir d'achat : −1. B garde les taux et
    # cible les aides : 0, comme les options de statu quo des fiches 039 (B et C). C fait passer une part du
    # financement des salaires vers la consommation pour baisser le coût du travail ou augmenter le salaire net,
    # ce que défend le Medef : +1. Aucune option à ±2 : ni la suppression de la TVA (N. Arthaud, rangée en A) ni
    # la TVA sociale ne sont jugées plus redistributives ou plus libérales que cela par les sources de l'étude.
    axes: { economie: -1 }
  - id: B
    libelle: "Ne pas y toucher, aider de façon ciblée"
    implique: "Les taux restent les mêmes. Pour le pouvoir d'achat, l'État verse des aides réservées à ceux qui en ont besoin, comme le chèque énergie ou l'aide carburant de 100 euros versée en 2026 à des travailleurs modestes."
    defenseurs: "Le chèque énergie protège mieux les ménages vulnérables qu'une baisse de TVA, pour un coût moindre, selon le Conseil des prélèvements obligatoires. La TVA, premier impôt avec 212 milliards d'euros en 2025, finance aussi la Sécurité sociale et les collectivités."
    critiques: "Une aide réservée n'atteint pas tous ceux qui y ont droit : à une semaine de la date limite, un travailleur sur deux qui y avait droit n'avait pas demandé l'aide carburant. Et la TVA reste plus lourde, en part du revenu, pour les ménages modestes."
    axes: { economie: 0 }
  - id: C
    libelle: "L'augmenter pour baisser les cotisations"
    implique: "Le taux de la TVA augmente de quelques points, et la recette sert à baisser les cotisations prélevées sur les salaires, pour augmenter le salaire net ou baisser le coût du travail. C'est la « TVA sociale », votée en 2012 puis abrogée avant d'entrer en vigueur."
    defenseurs: "La protection sociale repose surtout sur les salaires ; la financer aussi par la consommation fait contribuer les produits importés. Une note du ministère de l'Économie attendait en 2007 jusqu'à 300 000 emplois si la baisse vise les bas salaires, et la France taxe moins la consommation que ses voisins."
    critiques: "Une hausse de TVA passe vite dans les prix, à 70 ou 80 % en France. Selon une simulation de l'Insee, qui ne compte pas la baisse des cotisations, trois points de plus ôteraient 1,4 % de pouvoir d'achat aux 10 % les plus modestes, même après la hausse du Smic et des aides, et en Allemagne la consommation a baissé de 1,8 % au trimestre de la hausse de 2007."
    axes: { economie: 1 }
