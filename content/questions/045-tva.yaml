  attal: { option: B, source: "AFP via Connaissance des énergies, 22/09/2026 (BFMTV, 21/09/2026) ; votes personnels contre l'abonnement d'électricité à 5,5 %, scrutin n° 4041, 20/11/2025", statut: deduite }
