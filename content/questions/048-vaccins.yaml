# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux dont cette fiche découle : docs/etudes/048-vaccins.md
# Pas de note de plateau : l'opposition à l'obligation vaccinale traverse la gauche et la droite (RN et LFI contre
# l'obligation grippe en 2025, EPR, socialistes et écologistes pour), et ne se range ni sur « redistribution / marché »
# ni sur « progressiste / conservateur ».
numero: 48
date: 2026-09-10
theme: sante
question: Faut-il élargir, garder ou réduire les vaccins obligatoires ?
titreCourt: "Les vaccins obligatoires"
contexte:
  - "Depuis 2018, onze vaccins sont obligatoires pour les enfants, contre trois auparavant : sans eux, un enfant ne peut pas entrer à la crèche ou à l'école, et depuis 2025 l'obligation contre les méningocoques couvre cinq types au lieu d'un."
  - "Pour les soignants, l'obligation de se vacciner contre le Covid-19, créée en 2021, est suspendue depuis mai 2023 ; l'hépatite B, la diphtérie, le tétanos et la polio restent obligatoires."
  - "En juillet 2026, la Haute Autorité de santé a recommandé de rendre obligatoire chaque année la vaccination des soignants contre la grippe ; une loi de décembre 2025 le permet pour les libéraux, et le ministère prépare sa mise en œuvre."
chiffres:
  - valeur: "11"
    unite: vaccins
    legende: "obligatoires pour les enfants nés depuis le 1er janvier 2018, contre 3 auparavant"
    source: { organisme: Santé publique France, document: "Extension des obligations vaccinales", annee: 2018 }
  - valeur: "20 %"
    legende: "des professionnels des établissements de santé vaccinés contre la grippe en 2024-2025, entre 19 et 22 % depuis quatre hivers"
    source: { organisme: HAS, document: "Grippe saisonnière, pertinence d'une obligation vaccinale", annee: 2026 }
  - valeur: "873"
    unite: cas
    legende: "de rougeole déclarés en 2025, 80 % de plus qu'en 2024 ; six malades sur dix n'étaient pas ou mal vaccinés"
    source: { organisme: Santé publique France, document: "Rougeole en France, bilan annuel 2025", annee: 2026 }
options:
  - id: A
    libelle: Ajouter des vaccins obligatoires
    implique: "Les onze vaccins des enfants restent obligatoires et de nouvelles obligations s'ajoutent, d'abord la grippe chaque année pour les soignants, comme le recommande la Haute Autorité de santé depuis juillet 2026, voire la rougeole pour les soignants non protégés."
    defenseurs: "Dans les établissements de santé, un soignant sur cinq est vacciné contre la grippe malgré des années d'incitations ; là où l'obligation existe, comme en Finlande, la couverture dépasse 90 %, et elle protège des malades qui ne peuvent pas se défendre."
    critiques: "Le bénéfice pour les patients repose sur des études jugées peu solides, et selon la Haute Autorité de santé, l'expérience du Covid montre qu'une obligation perçue comme stigmatisante peut créer des tensions."
  - id: B
    libelle: Garder les obligations actuelles
    implique: "Onze vaccins restent obligatoires pour les enfants, et l'hépatite B, la diphtérie, le tétanos et la polio pour les soignants ; la grippe et le papillomavirus restent conseillés, avec des campagnes comme la vaccination au collège."
    defenseurs: "L'obligation de 2018 a fait passer la vaccination des bébés contre le méningocoque C de 36 % à 76 % en un an, sans alerte de sécurité ; pour les autres vaccins, l'incitation progresse : 62 % des filles de 15 ans ont reçu une première dose contre le papillomavirus en 2025."
    critiques: "Pour les uns, c'est trop peu : la rougeole revient, avec 873 cas en 2025, et les soignants restent peu vaccinés contre la grippe ; pour les autres, c'est trop : onze vaccins imposés ne laissent aucun choix aux parents."
  - id: C
    libelle: Revenir aux trois vaccins d'avant 2018
    implique: "Seuls la diphtérie, le tétanos et la polio restent obligatoires pour les enfants ; les huit autres vaccins, dont la rougeole et l'hépatite B, redeviennent conseillés et remboursés, et aucune nouvelle obligation n'est créée."
    defenseurs: "Obliger n'est pas convaincre : l'approbation de l'extension de 2018 est passée de 66 % à 59 % entre 2020 et 2022 selon des sondages, et 17 pays européens sur 30 n'imposent aucun vaccin aux enfants, comme le Portugal, où 96 % ont leurs deux doses contre la rougeole."
    critiques: "Avant 2018, les vaccins conseillés étaient moins faits : 36 % des bébés étaient vaccinés contre le méningocoque C, 76 % un an après l'obligation, et pour le Conseil d'État, l'obligation a une incidence directe sur la couverture."
  - id: D
    libelle: Ne plus imposer aucun vaccin
    implique: "Toutes les vaccinations deviennent conseillées et restent remboursées comme aujourd'hui ; l'entrée à la crèche ou à l'école n'exige plus de preuve de vaccination."
    defenseurs: "Chaque parent doit pouvoir décider pour son enfant après une information complète : la liberté de choix est un motif de réticence de plus en plus cité, par 40 % des réticents en 2021 contre 31 % en 2020, et selon l'OMS, une obligation perçue comme autoritaire peut entamer la confiance."
    # Le tétanos : § 2b, [38].
    critiques: "Le tétanos ne se transmet pas d'une personne à l'autre : seul son propre vaccin protège ; et les bébés trop jeunes pour être vaccinés dépendent des autres, alors que 62 d'entre eux ont eu la rougeole en 2025."
