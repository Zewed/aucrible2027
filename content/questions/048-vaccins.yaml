# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/048-vaccins.md (chaque chiffre y a sa source numérotée,
# et l'annexe de l'étude dit d'où vient chacun). Le fil : en 2018, la France passe de trois à onze vaccins obligatoires
# pour les enfants ; la rougeole revient ; quatre choix, de « en ajouter » à « ne rien imposer ».
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1, [1] [3].
    etapes:
      - { quand: Avant 2018, valeur: 3 vaccins }
      - { quand: Depuis 2018, valeur: 11 vaccins }
    chute: "… obligatoires pour qu'un enfant entre à la crèche ou à l'école."
  # Pas de « mécanisme » : aucun rapport « X pour 1 » ne résume le sujet.
  ecart:
    # § 2c, [11] : cas déclarés de rougeole, même source et même mode de comptage aux deux dates. La chute dit les
    # deux faits : la hausse de chaque année (117, 483, 873) et le niveau, sous celui de la dernière épidémie.
    titre: "La rougeole revient-elle ?"
    etapes:
      - { quand: En 2023, valeur: 117 cas }
      - { quand: En 2025, valeur: 873 cas }
    chute: "Les cas ont augmenté chaque année depuis 2023, sans atteindre le niveau de la dernière épidémie : 2 778 par an en 2018 et 2019."
    source: "Santé publique France, 2026"
  leviers:
    # § 1.2 et 4, [6] [7]. Les quatre options de la fiche, à égalité.
    titre: "Les vaccins obligatoires : quatre choix"
    choix:
      - { texte: En ajouter, detail: "la grippe chaque année pour les soignants" }
      - { texte: Garder les onze, detail: "et encourager les autres vaccins sans les imposer" }
      - { texte: Revenir à trois, detail: "diphtérie, tétanos, polio ; les huit autres conseillés et remboursés" }
      - { texte: Ne rien imposer, detail: "tous les vaccins conseillés et remboursés" }
    chute: "Chaque choix met en balance la liberté de chacun et la protection de ceux qui ne peuvent pas se vacciner."
    source: "HAS, 2026"
  camps: { pour: POUR, contre: CONTRE, objet: l'obligation de se vacciner }
  # Relu le 28/10/2026 par deux relecteurs, l'un pour l'obligation, l'autre contre. Chaque texte dit ce qu'il mesure ;
  # Q1 à Q3 comparent ce qui se compare, Q4 oppose deux questions de sondage différentes et le dit dans les deux textes.
  # Le camp CONTRE est contre l'obligation, pas contre les vaccins : aucune de ses réponses ne met en doute leur sécurité.
  questions:
    # § 2a et 2h, [12] [13] : le même indicateur (deux doses contre la rougeole), la même source, la même année.
    # Ce sont des estimations OMS-Unicef : Santé publique France, avec sa propre méthode, donne « autour de 90 % »
    # pour la France ; la comparaison avec le Portugal ne vaut qu'entre estimations OMS-Unicef, d'où 93 % ici.
    # Le POUR montre sa hausse (sa preuve), le CONTRE un niveau ; sans obligation, les Pays-Bas sont à 81 %, et
    # avec dix obligations l'Italie à 84 % (§ 2h).
    - question: "Faut-il obliger pour bien vacciner ?"
      pour: { affirmation: "En France, l'obligation a payé.", chiffre: "80 → 93 %", texte: "L'OMS estime que 93 % des enfants ont leurs deux doses contre la rougeole en 2024, contre 80 % en 2017.", source: "OMS et Unicef, 2025" }
      contre: { affirmation: "D'autres y arrivent sans obliger.", chiffre: "96 %", texte: "Au Portugal, sans aucun vaccin obligatoire, l'OMS estime que 96 % des enfants ont leurs deux doses en 2024.", source: "OMS et Unicef, 2025" }
    # § 2c, [11] [9] : le même bilan annuel ; le premier vaccin contre la rougeole se fait à 12 mois.
    - question: "Qui attrape la rougeole aujourd'hui ?"
      pour: { affirmation: "Aussi des bébés trop jeunes.", chiffre: "62 bébés", texte: "En 2025, 62 bébés de moins d'un an, trop jeunes pour être vaccinés, ont attrapé la rougeole.", source: "Santé publique France, 2026" }
      contre: { affirmation: "Souvent des jeunes nés avant 2018.", chiffre: "16 ans", texte: "La moitié des malades de 2025 avaient plus de 16 ans. Nés avant 2018, ils ne sont pas visés par l'obligation.", source: "Santé publique France, 2026" }
    # § 2d, [6] : les deux réponses viennent de la même revue Cochrane (Thomas et al., 2025, citée par la HAS), sur les
    # mêmes essais en maisons de retraite (résidents de 60 ans et plus). Grippes confirmées : 5 % → 4 %, « peu ou pas
    # d'effet », niveau de preuve faible. Décès toutes causes : risque relatif 0,69, soit 31 % de moins, niveau de
    # preuve modéré, à interpréter « avec prudence » selon la HAS, ce critère n'étant pas propre à la grippe. Le
    # conditionnel vaut pour les deux. La couverture des soignants (un sur cinq) reste dans les chiffres de la fiche.
    - question: "Faut-il obliger les soignants contre la grippe ?"
      pour: { affirmation: "Oui, les résidents meurent moins.", chiffre: "−31 %", texte: "En maison de retraite, vacciner les soignants ferait baisser de 31 % les décès de résidents, toutes causes confondues.", source: "Revue Cochrane, 2025" }
      contre: { affirmation: "Non, l'effet sur la grippe est incertain.", chiffre: "5 → 4 %", texte: "En maison de retraite, vacciner les soignants aurait peu ou pas d'effet sur la grippe des résidents : de 5 % à 4 %.", source: "Revue Cochrane, 2025" }
    # § 2g, [5] : deux sondages rapportés par le même bilan du ministère, qui ne posent pas la même question (la
    # vaccination, l'obligation) ; les affirmations et les textes le disent, et chaque chiffre prouve son affirmation
    # (un niveau qui tient, une baisse). Les deux séries partent de 2020 et couvrent la période du Covid : aucune
    # étude trouvée ne sépare l'effet de l'obligation de celui de la crise sanitaire.
    - question: "Obliger fait-il perdre confiance ?"
      pour: { affirmation: "Non, l'adhésion aux vaccins tient.", chiffre: "82,5 %", texte: "Interrogés sur la vaccination, 82,5 % des Français y étaient favorables en 2021, contre 80 % en 2020.", source: "Ministère de la Santé, 2022" }
      contre: { affirmation: "Oui, l'obligation convainc moins.", chiffre: "66 → 59 %", texte: "Interrogés sur l'obligation, 59 % des Français approuvaient son extension en 2022, contre 66 % en 2020.", source: "Ministère de la Santé, 2022" }
