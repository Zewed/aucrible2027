# BROUILLON À VÉRIFIER : rédigé par IA le 26/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/022-cannabis.md
numero: 22
date: 2026-10-21
theme: societe
question: "Faut-il légaliser le cannabis ?"
titreCourt: "Le cannabis"
contexte:
  - "En France, l'usage de cannabis est un délit puni d'un an de prison et de 3 750 € d'amende au plus, et une amende forfaitaire de 200 € s'applique depuis 2020."
  - "Environ un adulte sur dix en consomme chaque année, et la France compte parmi les premiers pays consommateurs d'Europe."
  - "Le Canada, l'Uruguay, Malte, le Luxembourg et l'Allemagne ont légalisé tout ou partie de l'usage récréatif ; la France maintient l'interdiction."
chiffres:
  - valeur: 10,8 %
    legende: "des adultes de 18 à 64 ans ont consommé du cannabis dans l'année"
    source: { organisme: OFDT, document: enquête 2023, annee: 2023 }
  - valeur: "124,7"
    unite: "tonnes"
    legende: "de cannabis saisies en France"
    source: { organisme: OFDT, annee: 2023 }
  - valeur: "568"
    unite: "millions d'euros"
    legende: "de dépense publique pour lutter contre le cannabis (estimation)"
    source: { organisme: Conseil d'analyse économique, document: note n° 52, annee: 2019 }
  - valeur: "2"
    unite: "milliards d'euros"
    legende: "de recettes fiscales par an estimées en cas de légalisation (scénario de 500 tonnes)"
    source: { organisme: Conseil d'analyse économique, document: note n° 52, annee: 2019 }
options:
  - id: A
    libelle: "Oui, légaliser et encadrer"
    implique: "La production, la vente et la consommation de cannabis par les adultes deviennent légales et encadrées, sous contrôle de l'État."
    defenseurs: "L'interdit n'empêche ni la consommation ni le trafic : un marché légal et contrôlé protège les mineurs, affaiblit les trafics, libère la police et la justice et rapporte des recettes."
    critiques: "Un marché légal banalise l'usage, avec des risques pour la santé des jeunes, et un marché noir peut subsister."
    axes: { societe: -2 }
  - id: B
    libelle: "Dépénaliser l'usage, sans légaliser la vente"
    implique: "Consommer n'est plus un délit, mais la production et la vente restent interdites."
    defenseurs: "On cesse de traiter les consommateurs comme des délinquants et on soigne plutôt que de punir, sans rendre le produit commercial."
    critiques: "La dépénalisation laisse le marché aux trafiquants et ne rapporte aucune recette."
    axes: { societe: -1 }
  - id: C
    libelle: "Non, maintenir l'interdiction"
    implique: "L'usage et la vente restent interdits et sanctionnés, avec la prévention et la lutte contre les trafics en priorité."
    defenseurs: "Le cannabis est dangereux, surtout pour les jeunes, et le légaliser enverrait le signal que sa consommation est acceptable : mieux vaut renforcer la prévention et combattre le trafic."
    critiques: "L'interdit n'empêche ni la consommation ni le trafic, et coûte cher à la police et à la justice sans rapporter de recettes."
    axes: { societe: 1 }
pourAllerPlusLoin:
