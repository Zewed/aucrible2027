# BROUILLON À VÉRIFIER : rédigé par IA le 27/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux dont cette fiche découle : docs/etudes/033-heritage.md
numero: 33
date: 2026-09-28
theme: economie-impots
question: Faut-il taxer davantage les héritages ?
titreCourt: "L'impôt sur l'héritage"
contexte:
  - "Un enfant ne paie rien sur les 100 000 premiers euros reçus de chacun de ses parents ; au-delà, l'impôt monte par tranches de 5 % à 45 %, taux appliqué au-delà de 1,8 million d'euros. Le conjoint ne paie rien ; frères, sœurs, neveux et beaux-enfants paient de 35 % à 60 %."
  - "Des régimes à part réduisent la note, comme l'assurance-vie ou le pacte Dutreil, qui exonère 75 % de la valeur d'une entreprise transmise si les héritiers s'engagent à la garder."
  - "Les candidats s'opposent : les uns veulent taxer davantage les plus gros héritages, les autres alléger les droits, notamment en facilitant les dons aux enfants et petits-enfants."
chiffres:
  - valeur: "16,6"
    unite: milliards d'euros
    legende: "de droits de succession en 2023, plus du double de 2011"
    source: { organisme: Cour des comptes, document: Les droits de succession, annee: 2024 }
  - valeur: "0,74 %"
    legende: "de la richesse produite en 2021 : la France taxe les héritages et les dons plus que les 38 autres pays comparés"
    source: { organisme: Conseil des prélèvements obligatoires, document: comparaisons internationales, annee: 2023 }
  - valeur: "10 %"
    legende: "environ : ce que paient, selon une estimation, les 0,1 % qui héritent le plus, pour un taux affiché de 45 %"
    source: { organisme: Conseil d'analyse économique, document: note n° 69, annee: 2021 }
options:
  - id: A
    libelle: Fixer un héritage maximal
    implique: "Au-delà d'un plafond, par exemple 12 millions d'euros reçus par une même personne sur toute sa vie, l'État prend tout ; les droits augmentent aussi sur les plus hauts patrimoines."
    defenseurs: "Douze millions d'euros, c'est cent fois le patrimoine médian selon ses partisans : au-delà, l'héritage décide de la place de chacun dès la naissance."
    critiques: "Prendre tout au-delà d'un seuil risque d'être jugé confiscatoire, et les plus fortunés peuvent répartir leurs dons dans le temps et entre héritiers, ou s'installer ailleurs."
    axes: { economie: -2 }
  - id: B
    libelle: Taxer davantage les gros héritages
    implique: "Les droits augmentent sur les plus gros héritages, par exemple au-delà de 4 millions d'euros, et des avantages comme l'assurance-vie ou le pacte Dutreil sont réduits ; les petits héritages ne paient pas plus."
    defenseurs: "Selon une estimation, les plus gros héritiers, un sur mille, paient environ 10 % d'impôt, loin du taux affiché de 45 % ; ses partisans annoncent 15 milliards d'euros de recettes en plus par an."
    critiques: "Les entreprises familiales coûteraient plus cher à transmettre, au risque d'être vendues, et les recettes annoncées, qu'aucune administration n'a chiffrées, dépendent de patrimoines peu nombreux qui peuvent s'organiser."
    axes: { economie: -1 }
  - id: C
    libelle: Garder le même total
    implique: "Les héritiers ne paient ni plus ni moins au total ; on garde les règles, ou l'on baisse les taux en réduisant les avantages, comme le propose la Cour des comptes."
    defenseurs: "Les finances publiques interdisent une baisse non financée, et la France est déjà le pays qui taxe le plus les héritages parmi 39 pays comparés : mieux vaut un impôt plus juste à recette égale."
    critiques: "Les uns y voient un impôt toujours trop lourd pour les familles ; les autres, des milliards que les plus gros héritages pourraient apporter et qu'on laisse de côté."
    axes: { economie: 0 }
  - id: D
    libelle: Alléger les droits
    implique: "La part reçue sans impôt augmente, par exemple 300 000 euros de logement exonérés ou des dons de 100 000 euros tous les dix ans au lieu de quinze ; les dons aux jeunes sont facilités."
    defenseurs: "On hérite en moyenne vers 50 ans : il faut aider les parents à transmettre plus tôt aux jeunes, sans obliger des familles à vendre la maison pour payer l'impôt."
    critiques: "Cela coûterait plusieurs milliards d'euros par an, 3,8 milliards pour exonérer 300 000 euros de logement selon l'Institut Montaigne, et profiterait d'abord à ceux qui reçoivent plus que la part aujourd'hui sans impôt."
    axes: { economie: 1 }
  - id: E
    libelle: Les supprimer entre parents et enfants
    implique: "Plus aucun impôt n'est dû quand des parents transmettent à leurs enfants, de leur vivant ou au décès ; les autres héritiers continuent de payer."
    defenseurs: "Cet argent a déjà été taxé quand il a été gagné, et douze pays riches, dont la Norvège, ont supprimé l'impôt sur les successions."
    critiques: "L'État perdrait une grande partie des 16,6 milliards d'euros de droits de succession, les plus gros héritiers y gagneraient le plus, et une part des biens transmis n'a jamais été taxée, comme les gains des placements gardés jusqu'au décès."
    axes: { economie: 2 }
pourAllerPlusLoin:
