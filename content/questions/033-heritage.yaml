# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/033-heritage.md (chaque chiffre y a sa source
# numérotée, et l'annexe de l'étude dit d'où vient chacun). Le fil : l'impôt rapporte plus, l'héritage pèse plus,
# et trois leviers permettent de le changer ; les camps s'opposent sur le niveau.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.2, [2].
    etapes:
      - { quand: En 2011, valeur: "7 milliards €" }
      - { quand: En 2023, valeur: "16,6 milliards €" }
    chute: "… de droits de succession, surtout parce que les biens transmis valent plus cher, et aussi parce que l'impôt a été relevé en 2011 et 2012."
  ecart:
    # § 1.4 et 2a, [3] [11] : une estimation discutée, d'où la chute. Les deux calculs portent sur la même année (2021) ;
    # le désaccord des experts porte sur l'ampleur de la hausse (§ 2a et 3), pas sur son sens.
    titre: "Quelle part du patrimoine vient d'un héritage ?"
    etapes:
      - { quand: "Début des années 1970", valeur: "35 %" }
      - { quand: En 2021, valeur: "60 %" }
    chute: "C'est une estimation discutée : un autre calcul trouve environ 52 % la même année."
    source: "Conseil d'analyse économique, 2021 ; OFCE, 2026"
  leviers:
    # § 1.1, [1] [2]. Les trois leviers sur lesquels jouent toutes les propositions, dans un sens ou dans l'autre.
    titre: "Pour changer ce que paient les héritiers, trois leviers"
    choix:
      - { texte: Changer les taux, detail: "de 5 % à 45 % aujourd'hui entre parents et enfants" }
      - { texte: Changer la part sans impôt, detail: "100 000 € par parent et par enfant, tous les quinze ans" }
      - { texte: Changer les régimes à part, detail: "assurance-vie, entreprises familiales, dons en gardant l'usage du bien" }
    chute: Chaque proposition des candidats joue sur un ou plusieurs de ces leviers.
    source: "Cour des comptes, 2024"
  camps: { pour: POUR, contre: CONTRE, objet: "taxer plus l'héritage" }
  questions:
    # § 1.3, 1.5 et 2b, [2] [3]. Deux mesures différentes, chacune le meilleur fait de son camp et nommée dans son texte :
    # le taux réel payé par les plus gros héritiers (le CAE l'oppose lui-même au taux de 45 % au-delà de 1,8 M€),
    # et le poids de l'impôt rapporté à la richesse produite. Aucune n'est présentée comme réfutant l'autre.
    - question: "Les héritiers paient-ils beaucoup d'impôt ?"
      pour: { affirmation: "Pas les plus gros héritiers.", chiffre: "10 %", texte: "Selon une estimation, les plus gros héritiers, un sur mille, paient environ 10 % d'impôt. Le taux affiché monte à 45 %.", source: "Conseil d'analyse économique, 2021" }
      contre: { affirmation: "Oui, plus que dans 38 autres pays.", chiffre: "1er sur 39", texte: "Rapportés à la richesse produite, les impôts sur l'héritage et les dons sont plus lourds en France que dans 38 autres pays.", source: "Conseil des prélèvements obligatoires, 2023" }
    # § 1.4 et 2a, [3] [8].
    - question: "Les héritages sont-ils réservés à quelques-uns ?"
      pour: { affirmation: "Les gros héritages, oui.", chiffre: "Moins d'1 sur 10", texte: "Selon une estimation, moins d'une personne sur dix héritera de plus de 500 000 € dans sa vie.", source: "Conseil d'analyse économique, 2021" }
      contre: { affirmation: "Non, beaucoup de familles héritent.", chiffre: "4 sur 10", texte: "Début 2021, quatre ménages sur dix avaient déjà reçu un héritage, et près d'un sur cinq une donation.", source: "Insee, 2024" }
    # § 2c, [4] : les deux réponses viennent du même rapport.
    - question: "L'allègement pour les entreprises familiales est-il utile ?"
      pour: { affirmation: "Pas pour l'emploi ni l'investissement.", chiffre: "5,5 milliards €", texte: "En 2024, cet allègement a coûté 5,5 milliards d'euros à l'État, sans effet mesuré sur l'investissement ni sur l'emploi.", source: "Cour des comptes, 2025" }
      contre: { affirmation: "Oui, il garde les entreprises en famille.", chiffre: "40 % contre 48 %", texte: "Dix ans après, 40 % des entreprises transmises avec l'allègement ont changé de mains, contre 48 % des autres.", source: "Cour des comptes, 2025" }
    # § 2h, [10] : les deux réponses viennent du même sondage (1 000 personnes, en ligne, 2-3 décembre 2025), à deux
    # questions différentes ; chaque texte dit la question posée. C'est la « lecture » de l'étude : la réponse dépend de la question.
    - question: "Les Français veulent-ils baisser l'impôt sur l'héritage ?"
      pour: { affirmation: "Pas sur les très gros patrimoines.", chiffre: "73 %", texte: "Dans un sondage de décembre 2025, 73 % approuvent une contribution à part sur les très hauts patrimoines quand ils sont transmis.", source: "Elabe pour Les Echos, 2025" }
      contre: { affirmation: "Oui, ils le jugent trop élevé.", chiffre: "71 %", texte: "Dans un sondage de décembre 2025, 71 % jugent l'impôt sur l'héritage trop élevé.", source: "Elabe pour Les Echos, 2025" }
