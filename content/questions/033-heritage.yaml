    url: https://cae-eco.fr/static/pdf/cae-note069.pdf
  - titre: "Cour des comptes, Le pacte Dutreil, 18/11/2025"
    url: https://www.ccomptes.fr/fr/publications/le-pacte-dutreil-un-dispositif-fiscal-en-forte-croissance-mieux-cibler
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour taxer davantage"
    argument: "Les plus gros héritiers, un sur mille, paient environ 10 % d'impôt, loin du taux affiché de 45 %."
  - titre: "Pour ne pas taxer davantage"
    argument: "Rapporté à la richesse produite, l'impôt sur les héritages et les dons est plus lourd en France que dans 38 autres pays."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Taxer davantage"
    precision: "les gros héritages"
  - choix: "Alléger"
    precision: "les droits de succession"
