numero: 23
date: 2026-10-22
theme: logement
question: Faut-il encadrer les loyers dans les grandes villes ?
contexte:
  - Dans plusieurs grandes villes, un loyer de référence fixe le plafond qu'un propriétaire ne peut pas dépasser.
  - Ce dispositif est une expérimentation, et les villes choisissent de l'appliquer ou non.
  - Ses effets sur les loyers et sur le nombre de logements à louer sont discutés.
chiffres:
  - valeur: 40 %
    legende: des ménages sont locataires de leur résidence principale
    source: { organisme: INSEE, annee: 2023 }
  - valeur: "26"
    unite: villes
    legende: appliquent un encadrement des loyers
    source: { organisme: Ministère du Logement, annee: 2025 }
options:
  - id: A
    libelle: Oui, dans toutes les grandes villes
    implique: Un plafond de loyer s'applique partout où le logement est le plus cher.
    defenseurs: Les locataires gardent un logement abordable près de leur travail.
    critiques: Des propriétaires risquent de retirer leur logement de la location.
  - id: B
    libelle: Seulement là où la ville le demande
    implique: Chaque ville décide d'encadrer ou non ses loyers.
    defenseurs: La ville connaît son marché et choisit l'outil qui lui convient.
    critiques: Les règles changent d'une ville à l'autre et deviennent difficiles à suivre.
  - id: C
    libelle: Non, laisser les loyers libres
    implique: Le loyer se fixe entre le propriétaire et le locataire.
    defenseurs: Des loyers libres encouragent à construire et à mettre des logements en location.
    critiques: Dans les villes les plus chères, les loyers peuvent continuer de grimper.
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour encadrer les loyers"
    argument: "Les locataires gardent un logement abordable près de leur travail."
  - titre: "Pour ne pas les encadrer"
    argument: "Des loyers libres encouragent à construire et à mettre des logements en location."
