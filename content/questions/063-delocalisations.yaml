# BROUILLON À VÉRIFIER : rédigé par IA le 10/11/2026 à partir de sources publiques.
# Chaque chiffre et chaque position doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/063-delocalisations.md (tout ce qui suit y est sourcé).
# Mots disputés, attribués ou évités (étude, « Vocabulaire ») : « aides » (mot du Sénat, du HCSP et de la Cour des
# comptes ; France Industrie le réfute, pour qui les entreprises « sont taxées »), « cadeaux fiscaux » (LFI), « charges »
# (la fiche écrit « cotisations »), « licenciements boursiers » (expression de la gauche ; la fiche écrit « licencier en
# faisant des bénéfices »), « coût du travail » (écrit sans guillemets, comme l'étude).
numero: 63
date: 2026-08-26
theme: economie-impots
question: "Une entreprise qui délocalise doit-elle rembourser les aides publiques qu'elle a reçues ?"
titreCourt: "Le remboursement des aides publiques"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/063-delocalisations-constat-TbYdqnm0WAhdE0uHLjyra8JkO8oyy3.mp4", duree: "4 min 06", ecrans: [0, 10.34, 23.1, 35.4, 47.7, 60.5, 74.27, 87.04, 96.9, 109.17, 122.97, 135.74, 149, 162.3, 175.07, 188.87, 201.64, 214.94, 229.17, 238.54] }
contexte:
  # § 1.1, [1] [3] [5].
  - "Aucune loi n'oblige aujourd'hui une entreprise qui délocalise à rembourser toutes ses aides publiques : seules certaines aides ciblées, comme les grands projets ou les aides régionales, le prévoient dans leur contrat."
  # § 1.3, [1] [2].
  # § 1.1 : réponse du gouvernement du 07/07/2026, [3].
  - "En juillet 2025, une commission d'enquête du Sénat a recommandé d'imposer le remboursement des aides de l'État et des collectivités quand une entreprise délocalise dans les deux ans ; le gouvernement répond en juillet 2026 que de telles conditions se heurteraient au droit européen et pourraient faire renoncer des entreprises à investir."
  # § 1.1, 1.4 et § 3, [3] [6] [7] [9].
  - "Les baisses de cotisations et le crédit d'impôt recherche s'arrêtent déjà quand l'activité quitte la France, sans rien rendre sur le passé ; les députés ont voté en 2024 et en 2025 le remboursement du crédit d'impôt recherche en cas de délocalisation, mais aucune de ces mesures n'est entrée dans la loi."
chiffres:
  # § 1.2, [1] [2] [16] : il n'existe ni définition légale ni chiffre officiel unique ; les périmètres diffèrent.
  # L'année des chiffres du HCSP (2023 ou 2025) reste à vérifier (étude § 1.2) : la légende ne la donne pas.
  - valeur: "82 à 211"
    unite: milliards d'euros
    legende: "d'aides publiques aux entreprises, selon ce que l'on y compte"
    source: { organisme: "Sénat ; Haut-commissariat à la stratégie et au plan", document: "commission d'enquête sur les aides publiques aux grandes entreprises ; rapport de concertation", annee: 2026 }
  # § 2b, [14].
  - valeur: "2 %"
    legende: "des entreprises de 50 salariés ou plus ont délocalisé une activité de 2021 à 2023"
    source: { organisme: Insee, document: Insee Première n° 2115, annee: 2026 }
  # § 2b, [14].
  - valeur: "55 %"
    legende: "des entreprises qui ont délocalisé de 2021 à 2023 citent une main-d'œuvre moins chère"
    source: { organisme: Insee, document: Insee Première n° 2115, annee: 2026 }
  # § 2b, [1] : le pendant du précédent, pour ceux qui visent aussi les licenciements.
  - valeur: "plus de 30 %"
    legende: "de plans sociaux en 2024 qu'en 2023, beaucoup sans lien avec une délocalisation"
    source: { organisme: "Ministère du Travail (DGEFP)", document: "cité par le Sénat", annee: 2025 }
# L'ordre est une échelle, de la plus exigeante à la moins exigeante pour l'entreprise (étude § 4) ; la règle actuelle
# est D. La limite entre B et C : les baisses de cotisations, et le déclenchement par des licenciements.
options:
  - id: A
    libelle: "Rembourser, et interdire à l'entreprise de licencier"
    implique: "Une entreprise qui verse des dividendes ou reçoit des aides de l'État ne peut plus faire de licenciements économiques ; chaque aide est liée à des objectifs sociaux et écologiques, et remboursée s'ils ne sont pas tenus. En cas de délocalisation, l'État peut réquisitionner le site."
    defenseurs: "Une entreprise qui fait des bénéfices ou touche de l'argent public ne doit pas pouvoir licencier : l'argent public ne doit plus servir à financer les dividendes des actionnaires."
    critiques: "Licencier est souvent le dernier recours pour sauver le reste de l'entreprise : l'interdire l'empêcherait d'anticiper ses difficultés et dissuaderait d'embaucher et d'investir en France."
    detail:
      chiffrage:
        # § 2b, [1].
        texte: "Aucun chiffrage n'a été trouvé. Les plans sociaux ont augmenté de plus de 30 % entre 2023 et 2024."
        source: { organisme: "Ministère du Travail (DGEFP)", document: "cité par le Sénat", annee: 2025 }
      defenseurs:
        # § 2f, [5].
        - texte: "Le droit permet aujourd'hui de licencier pour rester compétitif, sans être en difficulté : une entreprise qui verse des dividendes ne devrait pas le pouvoir."
        # § 2c, [2] : dividendes calculés par le rapporteur.
        - texte: "L'argent public ne doit plus financer les dividendes : Michelin a reçu 32,4 millions d'euros d'exonérations de cotisations en 2023 et versé environ 1,4 milliard d'euros de dividendes la même année."
          source: { organisme: Sénat, document: "commission d'enquête, calcul du rapporteur communiste Fabien Gay", annee: 2025 }
        # § 2j, [29].
        - texte: "Quand une entreprise délocalise ou ferme une activité, l'État doit pouvoir réquisitionner le site plutôt que la laisser partir."
      critiques:
        # § 2f, [5].
        - texte: "Licencier n'est jamais un acte de complaisance : c'est souvent le dernier recours pour sauver le reste de l'entreprise."
        # § 2f, [4].
        - texte: "Interdire de licencier à une entreprise qui n'est pas encore en difficulté l'empêcherait d'anticiper : elle devrait attendre d'aller mal pour réagir."
        # § 2f, [32].
        - texte: "Plus il est difficile de se séparer d'un salarié, moins on embauche et moins on implante d'usines en France."
  - id: B
    libelle: "Tout rembourser, cotisations comprises, si elle délocalise ou licencie"
    implique: "Une entreprise qui délocalise, ou qui supprime des emplois en faisant des bénéfices, rend toutes les aides des trois dernières années : crédit d'impôt recherche, subventions et baisses de cotisations sur les salaires. Une entreprise en redressement ou en liquidation n'est pas concernée."
    defenseurs: "Celui qui touche l'argent public garde les emplois, investit dans les usines et forme les salariés ; sinon, il rend tout, baisses de cotisations comprises, car ce sont les plus grosses aides."
    critiques: "Reprendre trois ans de baisses de cotisations à une entreprise qui supprime des postes alourdit le coût du travail au moment où elle se restructure, au risque de la fragiliser."
    detail:
      chiffrage:
        # § 2a et 2e, [5].
        texte: "Aucun chiffrage n'a été trouvé. Les baisses générales de cotisations patronales, que cette option ferait aussi rembourser, ont représenté 39,5 milliards d'euros en 2023, pour 1,9 million d'employeurs."
        source: { organisme: Sécurité sociale, document: "annexe aux comptes 2023, citée par l'Assemblée nationale", annee: 2025 }
      defenseurs:
        # § 2a, [28].
        - texte: "Celui qui touche l'argent public garde les emplois, investit dans les usines et forme les salariés ; sinon, il rembourse."
        # § 2e, [5] [1].
        - texte: "Les baisses de cotisations sont la plus grosse des aides : les exclure rendrait le remboursement symbolique."
        # § 2b et 2f, [1].
        - texte: "La plupart des plans sociaux ne sont pas des délocalisations : viser seulement le départ à l'étranger laisserait de côté l'essentiel des suppressions d'emplois."
      critiques:
        # § 2c, [5].
        - texte: "Une entreprise qui supprime des postes sans être en redressement peut quand même aller mal : lui faire rendre trois ans d'aides au moment où elle se restructure risque de la conduire au dépôt de bilan."
        # § 2e, [5].
        - texte: "Les baisses de cotisations portent sur le coût du travail et facilitent les embauches : les reprendre pénaliserait l'emploi."
        # § 2h, [1].
        - texte: "Aucun pays comparé ne fait rembourser les baisses générales de cotisations : nos voisins ne conditionnent que des aides ciblées."
  - id: C
    libelle: "Rembourser les aides du site délocalisé, pas les cotisations"
    implique: "Une entreprise qui délocalise un site ou une activité rend les aides qui l'ont financé, subventions de l'État et des collectivités ou crédit d'impôt recherche, reçues dans les deux ou trois années précédentes. Les baisses de cotisations sur les salaires ne sont pas reprises, et un plan social sans délocalisation ne déclenche rien."
    defenseurs: "L'argent public doit servir l'emploi en France : quand il a financé un site ou une recherche qui part à l'étranger, la collectivité doit le récupérer."
    critiques: "Les uns la jugent trop étroite, car la plupart des plans sociaux ne sont pas des délocalisations, les autres craignent qu'elle décourage d'investir en France."
    detail:
      chiffrage:
        # § 2a, [5].
        texte: "Aucun chiffrage n'a été trouvé. Le crédit d'impôt recherche, principale aide visée, a représenté 7,2 milliards d'euros en 2021 ; 42 % de sa part recherche est allée à 465 grandes entreprises."
        source: { organisme: Gouvernement, document: "annexe au budget 2025, citée par l'Assemblée nationale", annee: 2025 }
      defenseurs:
        # § 2a, [3].
        - texte: "Les aides publiques doivent ancrer l'industrie et l'emploi dans nos territoires : quand un site aidé part à l'étranger, la collectivité doit récupérer son argent."
        # § 2e, [5].
        - texte: "Une subvention ou un crédit d'impôt recherche financent un projet précis, qu'on peut reprendre s'il part ; les baisses de cotisations, elles, facilitent les embauches."
        # § 2h, [1].
        - texte: "Nos voisins le font déjà : en Italie, une entreprise aidée qui ne garde pas son activité dans le pays pendant cinq ans rembourse toute l'aide, avec une majoration."
          source: { organisme: Sénat, document: "étude de législation comparée", annee: 2025 }
      critiques:
        # § 2e et 2f, [1] [5].
        - texte: "La mesure laisserait de côté la plupart des plans sociaux, qui ne sont pas des délocalisations, et la plus grosse des aides, les baisses de cotisations."
        # § 2b, [14].
        - texte: "Le premier motif de délocalisation est le coût de la main-d'œuvre, cité par 55 % des entreprises concernées : une sanction ne le corrige pas."
          source: { organisme: Insee, document: Insee Première n° 2115, annee: 2026 }
        # § 2a, [5].
        - texte: "Le crédit d'impôt recherche ne paie que la recherche faite en France : il s'arrête déjà quand elle part, et grandit avec elle quand elle reste."
  - id: D
    libelle: "Seulement si le contrat de l'aide le prévoit"
    implique: "Pas de règle générale : seules les aides dont le contrat le prévoit, comme les grands projets, France 2030, les aides régionales ou les fonds européens, sont reprises en cas de départ. Les baisses de cotisations et le crédit d'impôt recherche s'arrêtent quand l'activité quitte la France, sans rien rendre sur le passé."
    defenseurs: "Les aides générales ne sont dues que sur une activité réelle en France et s'arrêtent quand elle part ; des conditions sans lien avec leur objet seraient fragiles en droit et feraient renoncer à des investissements."
    critiques: "Des groupes suppriment des postes après avoir reçu des centaines de millions d'euros d'aides, dont l'essentiel n'est soumis à aucune clause de remboursement."
    detail:
      chiffrage:
        # § 1.1, [1] [5].
        texte: "Garder ces règles ne coûte rien. La loi permet déjà de demander le remboursement des aides des deux dernières années quand une entreprise de 1 000 salariés ou plus ferme un site sans avoir assez cherché de repreneur ; le Sénat juge cette possibilité très peu utilisée."
        source: { organisme: Sénat, document: "commission d'enquête sur les aides publiques aux grandes entreprises", annee: 2025 }
      defenseurs:
        # § 1.1 et 2a, [3] [18].
        - texte: "Ces aides ont déjà une condition : elles ne sont dues que sur une activité en France, et toute délocalisation met fin à leur versement."
        # § 1.1 et 2d, [3].
        - texte: "Des conditions sans lien avec l'objectif d'une aide sont fragiles en droit européen et peuvent faire renoncer une entreprise à investir en France."
        # § 2d, [2] [1].
        - texte: "Une clause de remboursement est plus sûre quand elle est écrite dans le contrat de l'aide dès le départ, comme pour les grands projets et les aides régionales."
      critiques:
        # § 2c, [2] : les montants ne sont pas tous liés au site fermé (étude).
        - texte: "Des groupes suppriment des postes après avoir reçu beaucoup d'aides : ArcelorMittal a reçu 298 millions d'euros en 2023, dont 195 millions liés au prix de l'énergie, puis annoncé près de 600 suppressions de postes."
          source: { organisme: Sénat, document: "commission d'enquête sur les aides publiques aux grandes entreprises", annee: 2025 }
        # § 1.1, [3].
        - texte: "Les clauses de remboursement ne valent que pour quelques aides ciblées : pour les plus grosses, rien n'est repris sur le passé."
        # § 2h, [1].
        - texte: "Les États-Unis protègent leurs aides : une entreprise de puces aidée ne peut pas étendre de plus de 5 % ses capacités en Chine pendant dix ans."
          source: { organisme: Sénat, document: "étude de législation comparée", annee: 2025 }
  - id: E
    libelle: "Non : moins d'aides et moins d'impôts de production"
    implique: "Pas de remboursement obligatoire : l'État supprime une partie des aides, jugées trop dispersées par les défenseurs de cette option, et baisse d'autant les impôts de production, pour que produire en France coûte moins cher. Une proposition échange 50 milliards d'euros d'aides contre 50 milliards d'impôts en moins chaque année."
    defenseurs: "Les entreprises françaises paient plus de prélèvements que leurs concurrentes : mieux vaut moins d'aides compliquées et moins d'impôts que des sanctions qui font fuir les investissements."
    critiques: "Sans contrepartie, une baisse d'impôts nourrit des effets d'aubaine : rien n'oblige l'entreprise allégée à garder ses emplois en France."
    detail:
      chiffrage:
        # § 2g, [2].
        texte: "Aucun chiffrage n'a été trouvé. Les prélèvements nets sur les entreprises non financières atteignent 20 % de leur valeur ajoutée, le deuxième niveau de l'Union européenne après la Suède."
        source: { organisme: Rexecode, document: "cité par le Sénat", annee: 2025 }
      defenseurs:
        # § 2g, [18] : chiffre d'une organisation patronale, partie au débat ; le texte le dit.
        - texte: "Les entreprises paient chaque année 100 milliards d'euros de plus que leurs concurrentes de la zone euro, selon France Industrie, une organisation patronale."
          source: { organisme: "France Industrie, organisation patronale", annee: 2026 }
        # § 2g, [22].
        - texte: "Beaucoup d'aides sont saupoudrées, complexes et incompréhensibles : mieux vaut les supprimer et baisser d'autant les impôts."
        # § 2g, [20] [3].
        - texte: "Sans baisser le coût du travail, d'autres usines partiront : ajouter des sanctions ne traite pas la cause des départs."
      critiques:
        # § 2g.
        - texte: "Des aides sans contrepartie nourrissent des effets d'aubaine : conditionner, c'est mieux dépenser l'argent public, pas dépenser moins."
        # § 2g, [22] (source secondaire).
        - texte: "L'effet d'une baisse des impôts de production est discuté : une baisse passée n'a eu qu'un effet positif mais limité sur l'investissement."
        # § 2g, [31].
        - texte: "La baisse des impôts ne peut pas être financée par une réduction massive des aides aux entreprises, dont certaines, comme le crédit d'impôt recherche, doivent être préservées."
