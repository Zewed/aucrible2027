# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour l'obliger à rembourser"
    argument: "L'argent public doit servir l'emploi en France : quand il a financé un site qui part, la collectivité doit le récupérer."
  - titre: "Pour ne pas l'y obliger"
    argument: "Les aides s'arrêtent déjà quand l'activité part : de nouvelles sanctions feraient fuir les investissements."
# Les deux choix de l'autocollant « Et toi ? » de la story : A, B et C d'un côté, D et E de l'autre.
story:
  - choix: "L'obliger à rembourser"
    precision: "au moins les aides du site"
  - choix: "Ne pas l'y obliger"
    precision: "le contrat suffit, ou moins d'impôts"
# Positions sourcées (étude, § 4, et « Positions vérifiées le 10/11/2026 ») : 2 officielles, 9 déduites, 2 estimées.
# Inconnues : aucune.
