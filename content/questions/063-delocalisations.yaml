  attal: { option: D, source: "Son vote contre le remboursement du crédit d'impôt recherche en cas de délocalisation, 06/11/2024 ; votes du groupe EPR, 14/11/2025", statut: deduite, lien: "https://datan.fr/votes/legislature-17/vote_288" }
