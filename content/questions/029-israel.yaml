# BROUILLON À VÉRIFIER : rédigé par IA le 27/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/029-israel.md (tout ce qui suit y est sourcé).
# La question porte sur un choix de politique étrangère de la France envers un gouvernement, jamais sur un peuple ou
# une religion. Aucune note de plateau : aucune option ne se range clairement sur l'axe économique ou sociétal.
numero: 29
date: 2026-09-24
theme: europe-international
question: "La France doit-elle prendre des sanctions contre le gouvernement israélien ?"
titreCourt: "Les sanctions contre le gouvernement israélien"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/029-israel-constat-kezI6g5FbE7TmgTBE0jit4yfXcTYy7.mp4", duree: "3 min 27", ecrans: [0, 13.27, 26.5, 39.07, 50.24, 63.5, 76.74, 87.9, 100.47, 113.74, 126.97, 136.74, 147.9, 159.77, 173.04, 186.97, 199.54] }
contexte:
  - "Après l'attaque du Hamas du 7 octobre 2023 et deux ans de guerre à Gaza, un cessez-le-feu est en vigueur depuis le 10 octobre 2025 : selon l'ONU, des frappes israéliennes continuent, et le désarmement du Hamas n'est pas confirmé."
  - "La France a reconnu l'État de Palestine en septembre 2025 ; en 2026, elle a interdit d'entrée deux ministres israéliens et annoncé l'interdiction des produits des colonies de Cisjordanie."
  - "Selon le gouvernement, la France livre à Israël des composants militaires, pas des armes ; l'Union européenne n'a pas trouvé de majorité pour retirer à Israël ses avantages commerciaux."
chiffres:
  - valeur: "19,8"
    unite: millions d'euros
    legende: "de matériel militaire livré par la France à Israël en 2025 : des composants, selon le gouvernement"
    source: { organisme: Ministère des Armées, document: rapport au Parlement sur les exportations d'armement, annee: 2026 }
  - valeur: 31,7 %
    legende: "du commerce de biens d'Israël se fait avec l'Union européenne, son premier partenaire"
    source: { organisme: Commission européenne, document: relations commerciales UE-Israël, annee: 2025 }
  - valeur: "27 941"
    unite: logements
    legende: "de colonies en Cisjordanie ont avancé en 2025 dans les procédures d'urbanisme : plus du double du précédent record"
    source: { organisme: Union européenne, document: rapport 2025 sur les colonies, annee: 2026 }
options:
  - id: A
    libelle: "Non, et renforcer le soutien à Israël"
    implique: "Aucune sanction : la France revient sur les mesures déjà prises, comme l'interdiction d'entrée de deux ministres et celle des produits des colonies, et resserre sa coopération de sécurité avec Israël."
    defenseurs: "Israël a été attaqué le 7 octobre 2023 et reste menacé sur plusieurs fronts : le sanctionner affaiblit un allié et encourage ceux qui le combattent."
    critiques: "Revenir sur ces mesures irait contre l'avis de la Cour internationale de justice sur la colonisation et éloignerait la France de nombreux partenaires européens."
    detail:
      chiffrage:
        texte: "Aucun chiffrage n'a été trouvé. En 2025, la France a accordé 37 autorisations d'exporter du matériel militaire vers Israël, contre 75 en 2023."
        source: { organisme: "Ministère des Armées", annee: 2026 }
      defenseurs:
        - texte: "Israël a été attaqué le 7 octobre 2023 et reste en guerre sur plusieurs fronts : en 2026, face à l'Iran et au Hezbollah libanais."
        - texte: "La coopération avec Israël sert aussi la défense de l'Europe : de 2021 à 2025, 41 % des armes qu'il a exportées sont parties vers l'Europe."
          source: { organisme: "Institut international de recherche sur la paix de Stockholm", annee: 2026 }
        - texte: "Sanctionner Israël encourage ceux qui le combattent, alors que le désarmement du Hamas, annoncé en juillet 2026, n'est toujours pas confirmé."
      critiques:
        - texte: "Lever les sanctions contre les colons violents ignorerait leurs violences : 7,4 attaques par jour en Cisjordanie en 2026, contre 5 en 2025."
          source: { organisme: "Bureau des affaires humanitaires de l'ONU", annee: 2026 }
        - texte: "Revenir sur ces mesures irait contre le droit international : les États ne doivent pas entretenir de relations qui aident à maintenir l'occupation des territoires palestiniens."
        - texte: "Une coopération sans condition ignorerait la clause sur les droits de l'homme de l'accord qui lie l'Europe à Israël."
  - id: B
    libelle: "Non, s'en tenir à la diplomatie"
    implique: "La France revient sur les mesures déjà prises, comme l'interdiction d'entrée de deux ministres et celle des produits des colonies, sans limiter le commerce ni les ventes militaires : elle condamne ce qu'elle désapprouve et négocie."
    defenseurs: "Les sanctions braquent un pays en guerre sans changer sa politique ; c'est la négociation qui a obtenu le cessez-le-feu et le retour des otages."
    critiques: "En 2025, la colonisation a battu des records et la situation reste grave à Gaza : pour eux, les condamnations seules n'ont rien arrêté."
    detail:
      chiffrage:
        texte: "Le commerce continuerait comme aujourd'hui : en 2025, l'Union européenne et Israël ont échangé 43,3 milliards d'euros de biens."
        source: { organisme: "Commission européenne", annee: 2025 }
      defenseurs:
        - texte: "La négociation a obtenu des résultats : des 251 personnes enlevées le 7 octobre 2023, plus aucune n'est retenue à Gaza depuis janvier 2026."
          source: { organisme: "AFP", annee: 2026 }
        - texte: "Le vrai levier est à Washington : de 2021 à 2025, 68 % des principales armes achetées par Israël venaient des États-Unis."
          source: { organisme: "Institut international de recherche sur la paix de Stockholm", annee: 2026 }
        - texte: "Aucune cour n'a tranché sur le fond des accusations portées contre Israël, et un avis consultatif n'est pas un jugement."
      critiques:
        - texte: "Les condamnations seules n'ont pas freiné la colonisation : 27 941 logements de colonies ont avancé en 2025, plus du double du précédent record."
          source: { organisme: "Union européenne", annee: 2026 }
        - texte: "La situation reste grave à Gaza : de juillet à décembre 2026, deux habitants sur trois devraient connaître une crise alimentaire, ou pire."
          source: { organisme: "Classification IPC (agences de l'ONU et ONG)", annee: 2026 }
        - texte: "La France tient elle-même les colonies pour illégales : s'en tenir aux mots, c'est n'en tirer aucune conséquence."
  - id: C
    libelle: "Oui, des sanctions ciblées"
    implique: "La France garde les mesures déjà prises et peut les étendre : interdire d'entrée les ministres qui poussent à l'annexion et les colons violents, ou bloquer leurs avoirs en Europe, et interdire les produits des colonies ; le reste du commerce et les composants militaires continuent."
    defenseurs: "On vise ceux qui violent le droit international, pas la population ni la sécurité d'Israël ; d'autres pays, dont le Royaume-Uni et le Canada, vont dans ce sens."
    critiques: "Pour certains, ces mesures restent symboliques et ne changeront pas la politique israélienne ; pour d'autres, viser des ministres d'un pays allié abîme une relation utile à la France."
    detail:
      chiffrage:
        texte: "En 2026, la France a interdit d'entrée deux ministres israéliens, 4 dirigeants d'organisations de colons et 21 colons violents, et annoncé l'interdiction des produits des colonies."
        source: { organisme: "AFP", annee: 2026 }
      defenseurs:
        - texte: "Ces mesures visent des personnes, ministres ou colons violents, et non l'armée, la défense ou la population d'Israël."
        - texte: "La France n'est pas seule : en septembre 2026, 12 pays, dont le Royaume-Uni et le Canada, ont dit restreindre le commerce avec les colonies ou l'envisager."
          source: { organisme: "Déclaration commune de ministres des Affaires étrangères", annee: 2026 }
        - texte: "Ce n'est pas un boycott de l'État d'Israël, qui reste un partenaire économique : seules les colonies sont visées."
      critiques:
        - texte: "Ces mesures pèsent peu : tous les produits des territoires palestiniens vendus en Europe, colonies comprises, ne font qu'environ 400 millions d'euros par an."
          source: { organisme: "Commission européenne", annee: 2025 }
        - texte: "L'interdiction des produits des colonies sera difficile à faire respecter : leur origine est compliquée à contrôler aux frontières."
        - texte: "Israël réplique aux mesures de ses partenaires : après la déclaration de septembre 2026, il a fermé le consulat britannique à Jérusalem."
  - id: D
    libelle: "Oui, et viser aussi le commerce ou les armes"
    implique: "En plus des sanctions ciblées, des mesures qui touchent l'État israélien : suspendre l'accord d'association qui donne à Israël des avantages commerciaux en Europe, arrêter toute vente militaire, ou les deux."
    defenseurs: "L'Europe est le premier partenaire commercial d'Israël : c'est le levier le plus fort pour faire respecter le droit international à Gaza et en Cisjordanie."
    critiques: "Cela frapperait toute l'économie israélienne, au-delà de son gouvernement ; et pour le commerce, la majorité manque en Europe."
    detail:
      chiffrage:
        texte: "Aucun chiffrage n'a été trouvé pour la France. Suspendre les avantages commerciaux priverait environ 5,8 milliards d'euros d'exportations israéliennes de leur accès privilégié à l'Europe."
        source: { organisme: "Reuters", annee: 2026 }
      defenseurs:
        - texte: "L'Europe a le levier le plus fort : elle pèse 31,7 % du commerce de biens d'Israël, quand Israël n'est que son 27e partenaire."
          source: { organisme: "Commission européenne", annee: 2025 }
        - texte: "Les livraisons militaires continuent : en 2025, la France a encore livré à Israël 19,8 millions d'euros de composants militaires."
          source: { organisme: "Ministère des Armées", annee: 2026 }
        - texte: "Le but n'est pas de sanctionner pour sanctionner, mais de faire changer la politique du gouvernement israélien."
      critiques:
        - texte: "Cela frapperait toute l'économie israélienne et sa population, bien au-delà du gouvernement visé."
        - texte: "La majorité manque en Europe : retirer à Israël ses avantages commerciaux exige 15 pays sur 27, et le compte n'y était pas en avril 2026."
          source: { organisme: "Reuters", annee: 2026 }
        - texte: "Les pièces livrées ne sont pas des armes : un tiers sert à des matériels de défense, et deux tiers repartent vers d'autres pays."
          source: { organisme: "Ministère des Armées", annee: 2026 }
