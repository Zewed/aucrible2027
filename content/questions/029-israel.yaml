# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour des sanctions"
    argument: "On vise ceux qui violent le droit international, pas la population ni la sécurité d'Israël."
  - titre: "Contre des sanctions"
    argument: "Les sanctions braquent un pays en guerre sans changer sa politique ; c'est la négociation qui a obtenu le retour des otages."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
