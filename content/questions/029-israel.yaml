# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/029-israel.md (chaque chiffre y a sa source
# numérotée, voir l'annexe de l'étude). Le fil : depuis le cessez-le-feu, la France a déjà pris des mesures ; faut-il
# aller plus loin ou revenir en arrière ? Pas de « mécanisme » (aucun rapport « X pour 1 ») ni d'« écart » ; aucun
# bilan de morts à l'écran.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1, [1] [5].
    etapes:
      - { quand: 7 octobre 2023, valeur: Attaque du Hamas en Israël }
      - { quand: 10 octobre 2025, valeur: Cessez-le-feu }
    chute: … après deux ans de guerre à Gaza.
  leviers:
    # § 1.3, 1.4 et 2h, [17] [23]. Les quatre choix de la fiche, présentés à égalité.
    titre: Ce que la France peut faire
    choix:
      - { texte: Soutenir davantage Israël, detail: revenir sur les mesures déjà prises et coopérer davantage }
      - { texte: Ne pas sanctionner, detail: "revenir sur les mesures déjà prises, condamner et négocier" }
      - { texte: Garder des sanctions ciblées, detail: "des ministres, des colons violents, les produits des colonies" }
      - { texte: Viser le commerce ou les armes, detail: "retirer à Israël ses avantages en Europe, arrêter les ventes militaires" }
    chute: "Certaines mesures se décident à Paris, d'autres à vingt-sept."
    source: "Ministère des Affaires étrangères ; Conseil de l'Union européenne, 2026"
  camps: { pour: POUR, contre: CONTRE, objet: des sanctions }
  # Chaque réponse compare ce qui se compare ; aucun mot disputé n'est employé sans être attribué.
  questions:
    # § 2d, [12] [25].
    - question: "Des sanctions peuvent-elles peser sur Israël ?"
      pour: { affirmation: "Oui, si elles viennent de l'Europe.", chiffre: "31,7 %", texte: "En 2025, près d'un tiers du commerce de biens d'Israël s'est fait avec l'Union européenne, son premier partenaire.", source: "Commission européenne, 2025" }
      contre: { affirmation: Pas sans les États-Unis., chiffre: 68 %, texte: "De 2021 à 2025, 68 % des principales armes importées par Israël venaient des États-Unis.", source: "SIPRI (institut de Stockholm), 2026" }
    # § 2h, [18] [23].
    - question: "La France serait-elle seule ?"
      pour: { affirmation: "Non, d'autres pays agissent aussi.", chiffre: 11 pays, texte: "En septembre 2026, la France et onze pays, dont le Royaume-Uni et le Canada, disent vouloir limiter le commerce avec les colonies.", source: "Déclaration commune, 8 septembre 2026" }
      contre: { affirmation: "En Europe, la majorité manque.", chiffre: 15 pays sur 27, texte: "Retirer à Israël ses avantages commerciaux en Europe exige 15 pays sur 27. En avril 2026, le compte n'y était pas.", source: "Conseil de l'Union européenne, avril 2026" }
    # § 2e, [11].
    - question: "Faut-il arrêter les ventes militaires à Israël ?"
      pour: { affirmation: "Oui, les livraisons continuent.", chiffre: "19,8 millions €", texte: "En 2025, année de guerre à Gaza, la France a livré à Israël pour 19,8 millions d'euros de pièces militaires.", source: "Ministère des Armées, 2026" }
      contre: { affirmation: "Pas pour attaquer, dit le gouvernement.", chiffre: 1 sur 3, texte: "Selon le gouvernement, un tiers de ces pièces sert à la défense d'Israël, et les deux autres tiers repartent vers d'autres pays.", source: "Ministère des Armées, 2026" }
    # § 1.1, 2b et 2c, [1] [5]. Chaque camp cite les personnes dont il défend la sécurité : aucun des deux sans l'autre.
    - question: "Le cessez-le-feu suffit-il ?"
      pour: { affirmation: "Non, l'urgence demeure à Gaza.", chiffre: 2 sur 3, texte: "De juillet à décembre 2026, deux habitants de Gaza sur trois devraient connaître une crise alimentaire, ou pire.", source: "ONU et ONG (classification IPC de la faim), juillet 2026" }
      contre: { affirmation: "Oui, plus aucun otage n'est retenu.", chiffre: "251", texte: "Sur les 251 personnes enlevées le 7 octobre 2023, plus aucune n'est retenue à Gaza depuis janvier 2026.", source: "AFP, janvier 2026" }
