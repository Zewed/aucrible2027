    url: https://www.ccomptes.fr/fr/publications/le-pacte-enseignant
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour augmenter tous les enseignants"
    argument: "En milieu de carrière, un enseignant français gagne 18 % de moins que la moyenne de l'OCDE : le rattrapage doit concerner tous les enseignants."
  - titre: "Pour ne pas augmenter tout le monde"
    argument: "Les hausses décidées depuis 2022 coûtent déjà 4,2 milliards d'euros par an : mieux vaut payer le travail en plus, le mérite, ou ne rien ajouter."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Augmenter tout le monde"
    precision: "sans condition"
  - choix: "Pas tout le monde"
    precision: "missions, mérite, ou rien de plus"
