# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux dont cette fiche découle : docs/etudes/050-salaire-enseignants.md
numero: 50
date: 2026-09-08
theme: education-jeunesse
question: "Faut-il augmenter le salaire des enseignants, et à quelles conditions ?"
titreCourt: "Le salaire des enseignants"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/050-salaire-enseignants-yFGfyQ4qsVqIbhfB6qtFNx7Yxll7fy.mp4", duree: "2 min" }
contexte:
  - "Le salaire d'un enseignant suit une grille commune, qui monte avec l'ancienneté, plus des primes ; depuis septembre 2023, la prime versée à tous a doublé, à 2 550 euros bruts par an."
  - "Le « pacte enseignant », créé en 2023, paie en plus ceux qui acceptent des missions, comme remplacer un collègue absent : 1 250 euros bruts par an et par mission, jusqu'à trois missions."
  - "Selon le Sénat, le pouvoir d'achat des enseignants a baissé de 5 à 8 % entre 2002 et 2022 ; après des années de postes vides aux concours, presque tous les postes ont été pourvus en 2026, première année d'un concours ouvert dès la licence."
chiffres:
  - valeur: "3 090"
    unite: euros nets par mois
    legende: "gagnés en moyenne par un enseignant fonctionnaire en 2024, primes comprises"
    source: { organisme: DEPP, document: "Note d'information n° 26.36", annee: 2026 }
  - valeur: "18 %"
    legende: "de salaire en moins que la moyenne des pays de l'OCDE en milieu de carrière, contre 2 % en début de carrière"
    source: { organisme: OCDE, document: "Regards sur l'éducation 2026, cité par L'Étudiant", annee: 2026 }
  - valeur: "4,2"
    unite: milliards d'euros
    legende: "par an : ce que coûtent en 2026 les hausses de salaire des enseignants décidées depuis 2022"
    source: { organisme: Sénat, document: "rapport sur le budget 2026 de l'enseignement scolaire", annee: 2025 }
options:
  - id: A
    libelle: "Augmenter tous les enseignants"
    implique: "La grille et les primes communes augmentent pour tous, de 10 à 30 % ou de 135 à 500 euros nets par mois selon les propositions, souvent davantage en milieu de carrière, sans travail en plus demandé en échange."
    defenseurs: "En milieu de carrière, un enseignant français gagne 18 % de moins que la moyenne de l'OCDE, et son pouvoir d'achat a baissé de 2002 à 2022 : le rattrapage doit concerner tous les enseignants."
    critiques: "Une hausse de 10 % pour tous coûterait de l'ordre de 4 à 5 milliards d'euros par an, payés par l'impôt ou par des économies ailleurs, alors que le déficit public atteint 5,1 % du PIB."
    axes: { economie: -1 }
  - id: B
    libelle: "Augmenter ceux qui font des missions en plus"
    implique: "Le pacte de 2023 est gardé ou élargi : chaque mission acceptée, comme remplacer un collègue absent ou aider des élèves en difficulté, est payée en plus, ou la hausse est donnée contre plus de présence dans l'établissement."
    defenseurs: "Payer le travail fait en plus améliore aussi l'école : en un an, le pacte a multiplié par 2,5 le remplacement des absences de quelques jours."
    critiques: "Moins d'un tiers des enseignants du public l'avaient choisi à la rentrée 2024, la Cour des comptes juge la participation « encore fragile », et son budget est passé de 780 à 480 millions d'euros entre 2025 et 2026."
    axes: { economie: 1 }
  - id: C
    libelle: "Payer selon le mérite ou l'établissement"
    implique: "Une part du salaire dépend de l'évaluation de chaque enseignant, des résultats de son équipe ou des choix de son établissement, qui recrute ses professeurs ; l'ancienneté compte moins."
    defenseurs: "Une carrière fondée sur l'ancienneté paie pareil celui qui s'investit et celui qui ne le fait pas ; selon une synthèse de 44 études, surtout américaines, les primes au mérite améliorent un peu les résultats des élèves, davantage quand elles récompensent une équipe."
    critiques: "Le travail d'un enseignant se mesure mal, et d'un pays à l'autre l'OCDE ne trouve pas de lien d'ensemble entre primes au mérite et résultats des élèves ; les études favorables viennent surtout des États-Unis."
    axes: { economie: 2 }
  - id: D
    libelle: "Pas de nouvelle hausse"
    implique: "On garde les hausses de 2023 et la grille actuelle ; l'argent va d'abord à la réduction du déficit, à des classes moins chargées et à la formation payée des futurs professeurs."
    defenseurs: "Les hausses décidées depuis 2022 coûtent déjà 4,2 milliards d'euros par an, le salaire moyen a augmenté de 4,3 % de plus que les prix en 2024, et 97 % des postes de professeurs des écoles ont été pourvus en 2026, première année du concours dès la licence."
    critiques: "En milieu de carrière, l'écart avec la moyenne de l'OCDE reste de 18 %, et le bond des candidats en 2026 tient en partie à deux concours organisés la même année."
    axes: { economie: 1 }
