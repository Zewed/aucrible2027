# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/050-salaire-enseignants.md (chaque chiffre y a sa
# source numérotée, et l'annexe de l'étude dit d'où vient chacun). Le fil : depuis 1990, les débuts de carrière ont
# gagné, le milieu a perdu ; l'écart avec les autres pays est au milieu de la carrière ; quatre façons de payer.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 2a, [2] (Sénat, 2025) : le salaire statutaire à un même stade de carrière, 1990–2023, après inflation.
    # Fourchettes sur trois corps : débuts +3,4 % (agrégés) à +10,1 % (certifiés) ; 15 ans −9,8 % à −12,8 %.
    # Pas le salaire moyen (−5 à −8 % de 2002 à 2022, +4,3 % en 2024) : il manque 2022–2023, et un an
    # à côté de vingt ferait croire à un rattrapage qu'aucun chiffre ne mesure.
    etapes:
      - { quand: "En début de carrière", valeur: "+3 à +10 %" }
      - { quand: "Après 15 ans de métier", valeur: "−10 à −13 %" }
    chute: "… de salaire, inflation déduite, entre un professeur de 1990 et un professeur de 2023 au même stade."
  # Pas de « mécanisme » : aucun rapport « X pour 1 » ne résume le sujet. Pas d'« écart » : le recrutement, seule
  # grandeur à deux dates qui éclaire le débat, est traité dans les questions.
  leviers:
    # § 2d, 2e et 2f, [2] [3] [14] [16] [20]. Les quatre options de la fiche, à égalité ; la chute dit qui paierait.
    titre: "Le salaire des enseignants : quatre choix"
    choix:
      - { texte: "Augmenter tout le monde", detail: "une hausse pour tous, sans condition" }
      - { texte: "Payer le travail en plus", detail: "remplacer un collègue absent, aider des élèves" }
      - { texte: "Payer selon le mérite", detail: "ou selon l'établissement où l'on enseigne" }
      - { texte: "Ne rien ajouter", detail: "garder les hausses de 2023, sans nouvelle hausse" }
    chute: "Une hausse pour tous coûterait plusieurs milliards d'euros par an, payés par les impôts ou par des économies ailleurs."
    source: "Sénat, 2025"
  camps: { pour: POUR, contre: CONTRE, objet: une hausse pour tous }
  # Chaque question oppose deux faits de la même source ou du même indicateur, et chaque texte dit ce qu'il mesure.
  questions:
    # § 2b, [10] : la même édition de l'OCDE, deux moments de la carrière, lue chez L'Étudiant, qui ne dit ni le
    # niveau d'enseignement ni le nombre d'années : les textes n'en disent pas plus, et la source le dit.
    - question: "Les enseignants sont-ils mal payés ?"
      pour: { affirmation: "Oui, en milieu de carrière.", chiffre: "−18 %", texte: "En milieu de carrière, les enseignants français gagnent 18 % de moins que la moyenne des pays riches.", source: "OCDE, cité par L'Étudiant, 2026" }
      contre: { affirmation: "Pas en début de carrière.", chiffre: "−2 %", texte: "En début de carrière, les enseignants français gagnent 2 % de moins que la moyenne des pays riches.", source: "OCDE, cité par L'Étudiant, 2026" }
    # § 1.5 et 2c, [2] [7] : le même indicateur (candidats présents au concours de professeur des écoles), deux périodes ;
    # le pour dit que les postes offerts ont baissé aussi (−20,8 %) ; le contre dit que le ×2 additionne deux concours
    # tenus la même année (le nombre de candidats inscrits aux deux n'est pas connu).
    - question: "Faut-il mieux payer pour recruter ?"
      pour: { affirmation: "Oui, les candidats manquaient.", chiffre: "−31 %", texte: "De 2016 à 2024, les candidats au concours de professeur des écoles ont baissé de 31 %, les postes offerts de 21 %.", source: "Sénat, 2025" }
      contre: { affirmation: "Non, la réforme a ramené des candidats.", chiffre: "×2", texte: "En 2026, l'ancien concours et un nouveau, ouvert dès la licence, ont attiré ensemble deux fois plus de candidats qu'en 2025.", source: "Ministère de l'Éducation, 2026" }
    # § 1.4 et 2d, [2] : le même rapport du Sénat.
    - question: "Payer des missions en plus, est-ce efficace ?"
      pour: { affirmation: "Non, moins d'un tiers des enseignants y participent.", chiffre: "28 %", texte: "À la rentrée 2024, 28 % des enseignants du public avaient accepté ces missions payées en plus.", source: "Sénat, 2025" }
      contre: { affirmation: "Oui, pour remplacer les absents.", chiffre: "×2,5", texte: "En un an, ces missions ont multiplié par 2,5 la part des absences de quelques jours remplacées.", source: "Sénat, 2025" }
    # § 1.6 et 2f, [7] : le même dossier du ministère sur le budget 2027.
    - question: "Moins d'élèves, est-ce de quoi payer la hausse ?"
      pour: { affirmation: "En partie, oui.", chiffre: "−650 000", texte: "Le primaire public a près de 650 000 élèves de moins qu'en 2017 : il faut moins de classes, donc moins de postes.", source: "Ministère de l'Éducation, 2026" }
      contre: { affirmation: "Pas si l'on garde ces postes.", chiffre: "2 sur 3", texte: "Le budget 2027 garde deux postes libérés sur trois pour alléger les classes et aider les élèves fragiles.", source: "Ministère de l'Éducation, 2026" }
