# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/035-vols-interieurs.md (chaque chiffre y a sa source
# numérotée ; tableau des renvois en annexe de l'étude). Le fil : la loi a retenu 2 h 30 au lieu de 4 heures ; faut-il aller plus loin ?
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1, 1.2 et 1.5, [1] [6] [7].
    etapes:
      - { quand: Proposé en 2020, valeur: 4 heures }
      - { quand: Voté en 2021, valeur: 2 h 30 }
    chute: "Résultat en 2023 : trois lignes interdites, toutes depuis Paris-Orly."
  # Pas de mécanisme : aucun rapport « X pour 1 » suivi à deux dates ne résume le sujet.
  ecart:
    # § 2a, [13] [14] : même périmètre (vols intérieurs en métropole), même unité, même organisme.
    titre: Combien de CO2 pour les vols intérieurs en métropole ?
    etapes:
      - { quand: En 2019, valeur: "2,1 millions de tonnes" }
      - { quand: En 2024, valeur: "1,5 million de tonnes" }
    chute: "Moins de passagers et des avions plus sobres : près de 30 % de baisse."
    source: "DGAC, 2024"
  leviers:
    # § 1.2, 2c et 4, [2] [7] [17] [18] [19].
    titre: "Pour les vols intérieurs, quatre choix"
    choix:
      - { texte: Supprimer, detail: "l'interdiction, et laisser chacun choisir entre l'avion et le train" }
      - { texte: "Garder 2 h 30", detail: "trois lignes interdites, les vols depuis Roissy permis" }
      - { texte: Passer à 4 heures, detail: "18 à 23 lignes concernées, selon deux associations favorables" }
      - { texte: Aller plus loin, detail: "jusqu'à 6 heures de train, comme le demande Greenpeace" }
    chute: "Le décret de 2023 était prévu pour trois ans, jusqu'en mai 2026 : aucune prolongation n'est connue."
    source: "Légifrance, 2023 ; UFC-Que Choisir, Réseau Action Climat et Greenpeace, 2021"
  camps: { pour: POUR, contre: CONTRE, objet: "étendre l'interdiction" }
  # Relu une fois par deux relecteurs, l'un pour étendre l'interdiction, l'autre contre (notes 8,5 et 8,5) ;
  # chaque réponse compare ce qui se compare, et l'ordre d'apparition des camps suit ABBA.
  questions:
    # § 2d, [17] [21].
    - question: "Sous 4 heures, le train peut-il remplacer l'avion ?"
      pour: { affirmation: "Oui, en perdant peu de temps.", chiffre: 40 minutes, texte: "Attente à l'aéroport comprise, l'avion fait gagner 40 minutes en moyenne, selon une association de consommateurs favorable à ce seuil.", source: "UFC-Que Choisir, 2021" }
      contre: { affirmation: Les TGV sont déjà très remplis., chiffre: 77 %, texte: "En 2025, les TGV étaient remplis à 77 % en moyenne, un record, sans hausse du nombre de places.", source: "Autorité de régulation des transports, 2026" }
    # § 2a, [7] [16].
    - question: Le gain pour le climat en vaut-il la peine ?
      pour: { affirmation: "Oui, pour chaque voyageur.", chiffre: 80 fois moins, texte: "Pour 100 km, un passager émet 22,5 kg de CO2 en avion, et près de 80 fois moins en TGV.", source: "ADEME, 2026" }
      contre: { affirmation: Pas à l'échelle du pays., chiffre: "0,5 %", texte: "Les vols intérieurs pèsent 0,5 % des émissions de gaz à effet de serre de la France.", source: "Ministère de la Transition écologique, 2023" }
    # § 1.5 et 2h, [26] : les fermetures de bases de Hop! viennent du plan d'Air France aidée par l'État en 2020, pas de la loi.
    - question: Les emplois de l'aérien en souffriraient-ils ?
      pour: { affirmation: Ces vols perdaient déjà de l'argent., chiffre: "200 millions €", texte: "Air France perdait de l'argent sur ses vols intérieurs depuis plusieurs années : près de 200 millions d'euros en 2019.", source: "Gouvernement, 2021" }
      contre: { affirmation: "Oui, l'aérien régional a déjà reculé.", chiffre: 12 sur 14, texte: "En échange de l'aide publique, Air France a réduit ses vols intérieurs : 12 des 14 bases de sa filiale Hop! devaient fermer.", source: "Gouvernement, 2021" }
    # § 2e et 2i, [20] [22] [25].
    - question: Une taxe sur les billets suffirait-elle ?
      pour: { affirmation: "Non, elle change peu le prix.", chiffre: 7 %, texte: "Là où un train direct existe, le billet d'avion le moins cher coûte 106 € en moyenne, dont 7,40 € de taxe.", source: "UFC-Que Choisir, 2025 ; Ministère de la Transition écologique, 2026" }
      contre: { affirmation: "Oui, elle a déjà presque triplé.", chiffre: "7,40 €", texte: "Depuis mars 2025, la taxe sur un billet d'avion en France ou en Europe est passée de 2,63 € à 7,40 €.", source: "Ministère de la Transition écologique, 2026" }
