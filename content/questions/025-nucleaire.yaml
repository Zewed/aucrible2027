# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options,
# resserrés pour tenir dans l'image).
cotes:
  - titre: "Pour sortir du nucléaire"
    argument: "On supprime le risque d'accident et les nouveaux déchets, et le gestionnaire du réseau a jugé possible en 2021 une électricité 100 % renouvelable en 2050."
  - titre: "Pour ne pas en sortir"
    argument: "Le nucléaire produit une électricité bas carbone qu'on règle selon les besoins, et s'en passer coûterait plus cher, selon le gestionnaire du réseau en 2021."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "En sortir"
    precision: "ou réduire"
  - choix: "Le garder"
    precision: "ou le relancer"
