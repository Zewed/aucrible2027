# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/025-nucleaire.md (chaque chiffre y a sa source
# numérotée, et l'annexe de l'étude dit d'où vient chacun). Le fil : un parc qui vieillit (les plus vieux réacteurs
# auront 60 ans en 2038, quand le premier neuf est attendu), un devis qui monte, quatre choix, puis quatre questions où
# chaque camp avance son meilleur fait. Aucun face-à-face de la fiche 014 (éoliennes) n'est repris.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1, 1.2 et 1.3, [4] [6] [10] [12] : les plus vieux réacteurs (900 MWe) ont été mis en service en 1978, d'où
    # 48 ans en 2026 (2026 − 1978) et 60 ans en 2038 (1978 + 60 = 2038, calcul de l'étude) ; le premier EPR2 est attendu
    # « d'ici 2038 » ; le plan de l'État (PPE 3) vise « 50 ou 60 ans ». Deux âges, la même mesure. La chute dit l'enjeu
    # commun aux quatre choix (remplacer ou prolonger un parc qui vieillit), sans en trancher aucun.
    etapes:
      - { quand: "En 2026", valeur: "48 ans" }
      - { quand: "En 2038", valeur: "60 ans" }
    chute: "… pour les plus vieux réacteurs. L'État prévoit de les faire durer 50 ou 60 ans ; le premier réacteur neuf est attendu en 2038."
  # Pas de « mécanisme » : aucun rapport « X pour 1 » ne résume le sujet.
  ecart:
    # § 1.3, [2] [4] [5] [7] : même périmètre (les six EPR2), même unité (euros de 2020, hors coûts de financement),
    # deux devis : 51,7 Md€ (gouvernement, février 2022) et 72,8 Md€ (EDF, 18/12/2025), arrondis. La hausse sert le
    # camp POUR ; la chute la remet en perspective sans trancher : ce qui se compare (mêmes prix, hors intérêts), ce qui
    # reste à décider (décision finale d'EDF attendue fin 2026, [7]) et qui paie (prêt de l'État pour 60 % du total,
    # conseil du 12/03/2026, [7]). « Coûteraient » : rien n'est encore décidé.
    titre: "Combien coûteraient les six nouveaux réacteurs ?"
    etapes:
      - { quand: "En 2022", valeur: "52 milliards €" }
      - { quand: "Fin 2025", valeur: "73 milliards €" }
    chute: "Les devis sont aux prix de 2020, hors intérêts. EDF doit décider fin 2026 de les construire, avec un prêt de l'État pour 60 %."
    source: "Cour des comptes, 2025 ; EDF, 2025 ; Élysée, 2026"
  leviers:
    # § 1.2 et 4, [2] [10] [28]. Les quatre options de la fiche, à égalité, chaque détail suivant l'« implique » de son
    # option (six EPR2 et huit à décider : « peut-être quatorze »). La chute dit la règle en vigueur depuis la loi du
    # 22/06/2023 : ni plafond (63,2 GW) ni objectif de baisse (50 %) ; elle ne favorise aucun choix. « Les économies
    # d'énergie » (choix A) ne sont pas dans l'étude : retirées. « Plus d'aide » (choix D) se lisait aussi « davantage ».
    titre: "Le nucléaire : quatre choix"
    choix:
      - { texte: "En sortir", detail: "fermer peu à peu les réacteurs, remplacés par les renouvelables" }
      - { texte: "Réduire sa part", detail: "garder une partie des réacteurs, en construire moins que prévu" }
      - { texte: "Nucléaire et renouvelables", detail: "faire durer les réacteurs, en construire six, peut-être quatorze, et développer éolien et solaire" }
      - { texte: "Le nucléaire d'abord", detail: "de nouveaux réacteurs, et la fin de l'aide publique à l'éolien et au solaire" }
    chute: "Depuis 2023, la loi ne fixe plus ni plafond ni objectif de baisse pour le nucléaire."
    source: "Journal officiel, 2023 ; Gouvernement, 2026"
  # Les mots de la question, sans ceux d'un camp (ni « relance » ni « sortie ») : POUR veut moins de nucléaire (options
  # A et B), CONTRE veut le garder ou le relancer (options C et D).
  camps: { pour: POUR, contre: CONTRE, objet: "moins de nucléaire" }
  # Chaque réponse POUR vaut pour A et B, chaque réponse CONTRE pour C et D. Chaque question oppose deux faits de la
  # même source, ou deux faits que chaque texte nomme. L'ordre d'apparition des camps suit ABBA (POUR ouvre les
  # questions 1 et 4, CONTRE les questions 2 et 3).
  questions:
    # § 2d, [2] [16] [17] : la même étude de RTE (Futurs énergétiques 2050, 2021). POUR : le scénario M0, 100 %
    # renouvelable en 2050, « chemin possible mais sûrement pas facile », à des rythmes plus rapides que les pays
    # européens les plus dynamiques, d'où « sous de fortes conditions ». CONTRE : l'écart « de l'ordre de 10 milliards
    # d'euros par an » entre M23 (sans nouveaux réacteurs) et N2 (avec), coûts annualisés vers 2060 ; une estimation,
    # que le texte dit. Les deux textes disent « en 2021 » : l'étude précède la hausse du devis des EPR2 (§ 2d) et RTE la
    # met à jour fin 2026 [18] ; « a jugé », « a estimé » des deux côtés, pour que l'âge pèse autant sur chacun.
    - question: "Peut-on se passer du nucléaire ?"
      pour: { affirmation: "Oui, d'ici 2050, selon une étude.", chiffre: "100 %", texte: "En 2021, le gestionnaire du réseau a jugé possible une électricité 100 % renouvelable en 2050, sous de fortes conditions.", source: "RTE, 2021" }
      contre: { affirmation: "Pas sans payer plus cher.", chiffre: "10 milliards €", texte: "La même étude de 2021 a estimé que s'en passer coûterait environ 10 milliards € de plus par an, vers 2060.", source: "RTE, 2021" }
    # § 1.4 et 2c, [2] [3] [12] : deux faits que chaque texte nomme, un cas concret de chaque côté. POUR : Flamanville 3,
    # raccordé le 21/12/2024, « 12 ans après la date prévue » (mi-2012). CONTRE : les 32 réacteurs de 900 MWe mis en
    # service entre 1978 et 1987, toujours en fonctionnement.
    - question: "Peut-on construire des réacteurs à temps ?"
      pour: { affirmation: "Pas d'après le dernier chantier.", chiffre: "12 ans", texte: "Le réacteur de Flamanville a été raccordé au réseau fin 2024, douze ans après la date prévue au départ.", source: "Cour des comptes, 2025" }
      contre: { affirmation: "La France l'a déjà fait.", chiffre: "32", texte: "Entre 1978 et 1987, la France a mis en service 32 réacteurs de même puissance. Ils fonctionnent toujours.", source: "ASNR, 2025" }
    # § 1.5 et 2e, [20] : la même dépêche, d'après l'Andra. POUR : « environ 83 000 m³ de déchets radioactifs issus des
    # centrales nucléaires », danger « sur plusieurs centaines de milliers d'années », stockage pas encore autorisé (le
    # volume prouve ce qui attend, « 30 ans » ne faisait que redire l'affirmation ; « pour les plus radioactifs » : les
    # autres déchets sont stockés en surface, § 1.5). CONTRE : stockage « à environ 500 mètres sous terre », à Bure, avis
    # favorable de la commission d'enquête en août 2026, avec deux réserves (contrôle du Parlement sur la phase pilote,
    # réversibilité) que le texte signale.
    - question: "Sait-on quoi faire des déchets ?"
      pour: { affirmation: "Pas encore pour les plus radioactifs.", chiffre: "83 000 m³", texte: "Le stockage prévu pour 83 000 m³ de déchets, dangereux des centaines de milliers d'années, n'est pas encore autorisé.", source: "AFP, 2026" }
      contre: { affirmation: "Oui, les stocker très profond.", chiffre: "500 m", texte: "Les plus radioactifs iraient à 500 mètres sous terre, à Bure. L'enquête publique a donné un avis favorable, avec réserves.", source: "AFP, 2026" }
    # § 2i, [23] [24] : le même communiqué de l'office allemand de la statistique, la même année, la même mesure (la part
    # de l'électricité injectée dans le réseau). POUR : renouvelables 58,6 %, deux ans après l'arrêt des derniers
    # réacteurs (15/04/2023). CONTRE : charbon 22,1 % et gaz 16,1 %, soit 38,2 % (calcul de l'étude). Chaque affirmation
    # ne dit que ce que prouve son chiffre : « Qu'on peut s'en passer » allait plus loin que 59 % (l'Allemagne importe
    # de l'électricité, § 2i), et aucune des deux ne prête au charbon et au gaz une cause que l'étude ne chiffre pas.
    - question: "Que montre l'exemple allemand ?"
      pour: { affirmation: "Que les renouvelables peuvent fournir la majorité.", chiffre: "59 %", texte: "Deux ans après l'arrêt de ses réacteurs, l'Allemagne a tiré 59 % de son électricité des renouvelables en 2025.", source: "Destatis, 2026" }
      contre: { affirmation: "Que charbon et gaz restent.", chiffre: "38 %", texte: "Selon le même office de statistique, 38 % de l'électricité allemande venait du charbon et du gaz en 2025.", source: "Destatis, 2026" }
