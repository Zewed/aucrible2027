# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/025-nucleaire.md (tout ce qui suit y est sourcé).
numero: 25
date: 2026-10-24
theme: ecologie-energie
question: Faut-il sortir du nucléaire ?
titreCourt: "Le nucléaire"
contexte:
  - "En 2025, les 57 réacteurs du pays ont produit 68 % de l'électricité française ; les plus anciens tournent depuis 1978."
  - "La programmation de l'énergie de février 2026 prévoit de les faire durer 50 ou 60 ans et de construire six nouveaux réacteurs, appelés EPR2, le premier vers 2038."
  - "Leur devis atteint 72,8 milliards d'euros aux prix de 2020 et EDF doit décider fin 2026 de les construire ; le stockage profond des déchets les plus radioactifs a reçu en août 2026 un avis favorable, avec réserves, de l'enquête publique et attend son autorisation."
chiffres:
  - valeur: "68 %"
    legende: "de l'électricité produite en France en 2025 vient du nucléaire ; en dix ans, cette part a varié entre 63 et 77 %"
    source: { organisme: RTE, document: "Bilan électrique 2025", annee: 2025 }
  - valeur: "57"
    unite: réacteurs
    legende: "en service fin 2025 ; les 32 plus anciens réacteurs ont démarré entre 1978 et 1987"
    source: { organisme: "Cour des comptes, ASNR", document: "La filière EPR ; réexamens périodiques", annee: 2025 }
# Pas de note d'axe : ni « plus de redistribution / plus de marché » ni « progressiste / conservateur » ne range ces
# options (la sortie comme la relance passent par l'État), et une note forcée ajouterait des blocs au plateau.
options:
  - id: A
    libelle: "En sortir progressivement"
    implique: "Plus de nouveaux réacteurs (ni EPR2 ni petits réacteurs) et fermeture des réacteurs actuels au fil des années, sur une vingtaine d'années pour les uns, jusqu'à une électricité 100 % renouvelable en 2050 pour les autres."
    defenseurs: "On supprime le risque d'accident et les nouveaux déchets, dangereux des centaines de milliers d'années ; en 2021, le gestionnaire du réseau a jugé possible une électricité 100 % renouvelable en 2050, et le devis des six réacteurs prévus a augmenté de 41 % depuis 2022, à prix constants."
    critiques: "Selon la même étude de 2021, que le gestionnaire du réseau met à jour fin 2026, se passer de nouveaux réacteurs coûterait environ 10 milliards d'euros de plus par an vers 2060 et demanderait de construire les renouvelables plus vite que les pays européens les plus rapides ; l'Allemagne, sortie en 2023, a tiré 38 % de son électricité du charbon et du gaz en 2025."
  - id: B
    libelle: "Réduire sa part, sans en sortir"
    implique: "On garde tout ou partie des réacteurs actuels, tant que l'autorité de sûreté l'autorise, mais on construit moins que les six réacteurs prévus, voire aucun ; les renouvelables prennent une part croissante. C'était l'objectif de la loi de 2015 à 2023 : 50 % de nucléaire."
    defenseurs: "Ne pas dépendre d'une seule technologie, comme en 2022 quand jusqu'à près de 65 % du parc était à l'arrêt, tout en gardant une production stable et sans engager des dizaines de milliards dans des réacteurs attendus vers 2038 au lieu de 2035."
    critiques: "Près de la moitié de la puissance nucléaire aura 60 ans d'ici 2045 : sans assez de réacteurs neufs, il faudra la remplacer vite ; pour les partisans de la sortie, c'est garder le risque et les déchets."
  - id: C
    libelle: "Le relancer avec les renouvelables"
    implique: "C'est le plan de l'État : faire durer les réacteurs 50 ou 60 ans, construire six EPR2 (le premier vers 2038) et peut-être huit de plus, tout en continuant à développer l'éolien et le solaire."
    defenseurs: "Selon une étude de 2021 du gestionnaire du réseau, construire de nouveaux réacteurs « est pertinent du point de vue économique » et coûte moins cher à long terme qu'une électricité 100 % renouvelable ; le parc actuel produit pour environ 60 euros le mégawattheure une électricité bas carbone qu'on règle selon les besoins."
    critiques: "Le devis des six réacteurs est passé de 51,7 à 72,8 milliards d'euros aux prix de 2020, le premier est attendu vers 2038 au lieu de 2035, et le stockage des déchets les plus radioactifs n'est pas encore autorisé ; d'autres jugent l'aide aux renouvelables trop coûteuse."
  - id: D
    libelle: "Miser d'abord sur le nucléaire"
    implique: "Faire durer les réacteurs le plus longtemps possible, en construire de nouveaux, souvent plus que les six prévus, et arrêter l'aide publique à l'éolien et au solaire."
    defenseurs: "Une électricité bas carbone, produite en France et qu'on règle selon les besoins, sans payer d'aides à des énergies qui dépendent du vent et du soleil ; la France a déjà mis en service 32 réacteurs entre 1978 et 1987."
    critiques: "Le premier nouveau réacteur est attendu vers 2038 et le dernier chantier a pris douze ans de retard ; d'ici 2030, le gestionnaire du réseau recommande de développer les renouvelables « le plus rapidement possible », et miser sur une seule technologie expose à un défaut commun, comme les fissures de 2022."
