# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/028-etat-civil.md (chaque chiffre y a sa source
# numérotée, annexe « Chiffres du reportage »). Le fil : trois façons de décider d'un changement (un médecin et un juge,
# un juge seul, une simple déclaration) ; la question porte sur la troisième. Pas de mécanisme « X pour 1 » ni d'écart
# à deux dates qui éclaire le débat : les blocs mecanisme et ecart sont omis.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.2, [1] [3]. De 1992 à 2016, la Cour de cassation exigeait un « traitement médico-chirurgical » (hormones
    # suffisantes après 2010), pas seulement des preuves : d'où « un traitement médical ».
    etapes:
      - { quand: "De 1992 à 2016", valeur: "Un juge et un traitement médical" }
      - { quand: "Depuis 2016", valeur: "Un juge, sans condition médicale" }
    chute: "Certains veulent maintenant une simple déclaration en mairie."
  leviers:
    # § 2d et 2g, [1]. La France d'avant 2016 n'est plus citée ici : elle exigeait un traitement, pas un simple avis.
    # Trois pays de chaque côté, pour que la déclaration ne paraisse pas seule à suivre « les voisins ».
    titre: "Pour changer la mention du sexe, trois façons de faire"
    choix:
      - { texte: "Un avis médical", detail: "comme en Italie, en Autriche ou au Royaume-Uni" }
      - { texte: "Un juge, sans condition médicale", detail: "comme en France aujourd'hui" }
      - { texte: "Une simple déclaration", detail: "comme en Espagne, en Allemagne ou en Belgique" }
    chute: "Pour les mineurs, chaque pays fixe son propre âge."
    source: "Ministère de la Justice, 2025"
  camps: { pour: POUR, contre: CONTRE, objet: "une simple déclaration" }
  questions:
    # § 2b, [1] : même rapport, même période (2018-2024).
    - question: "Le passage devant le juge est-il un obstacle ?"
      pour: { affirmation: "Oui, il faut se justifier.", chiffre: "4,9 mois", texte: "Il faut réunir témoignages et documents, puis attendre en moyenne près de cinq mois la décision du juge.", source: "Ministère de la Justice, 2025" }
      contre: { affirmation: "Non, presque tous l'obtiennent.", chiffre: "99 %", texte: "Le juge accepte 99 % des demandes. La démarche est gratuite et l'avocat n'est pas obligatoire.", source: "Ministère de la Justice, 2025" }
    # § 2c et 2d, [1] [5]. Le même arrêt de 2017 a condamné la France (6 voix contre 1) pour l'exigence d'une
    # transformation irréversible ; aucune option ne la défend, et l'accroche ne présente plus l'avant-2016 comme un
    # simple avis médical : l'argument CONTRE porte sur le seul diagnostic, que la Cour a admis à l'unanimité.
    - question: "Une simple déclaration, est-ce trop facile ?"
      pour: { affirmation: "Non, des garde-fous existent.", chiffre: "3 mois", texte: "En Allemagne, il faut annoncer sa demande trois mois à l'avance, puis attendre un an avant tout nouveau changement.", source: "Ministère de la Justice, 2025" }
      contre: { affirmation: "Oui, un contrôle reste utile.", chiffre: "7 juges sur 7", texte: "En 2017, la Cour européenne a admis, à l'unanimité, qu'un pays exige un diagnostic, pour qu'on ne s'engage pas à la légère.", source: "Cour européenne des droits de l'homme, 2017" }
    # § 2e, [1] [11] [12] [13]. CONTRE donne une date et pas un âge : « 18 ans » (périmètre des recommandations médicales)
    # face à « 16 ans » (âge légal espagnol pour l'état civil) faisait croire à un âge fixé par la HAS.
    - question: "Faut-il l'ouvrir aux mineurs ?"
      pour: { affirmation: "Oui, comme en Espagne.", chiffre: "16 ans", texte: "En Espagne, on peut changer seul la mention de son sexe dès 16 ans, et dès 12 ans avec un juge.", source: "Ministère de la Justice, 2025" }
      contre: { affirmation: "Non, le recul médical manque.", chiffre: "Fin 2027", texte: "En 2025, faute de consensus, la Haute autorité de santé a reporté ses recommandations sur la transition des mineurs, attendues fin 2027.", source: "Haute autorité de santé, 2025 et 2026" }
    # § 2h et 2b, [1] : même source, même période.
    - question: "Combien de personnes sont concernées ?"
      pour: { affirmation: "Peu de personnes.", chiffre: "1 sur 20 000", texte: "En 2024, environ un adulte sur 20 000 a demandé à changer la mention de son sexe.", source: "Ministère de la Justice, 2025" }
      contre: { affirmation: "Rare, mais en forte hausse.", chiffre: "× 7", texte: "Le nombre de demandes a été multiplié par près de sept entre 2018 et 2024.", source: "Ministère de la Justice, 2025" }
    # § a et § f, [4] [16]. Ajoutée à la demande de l'auteur : l'argument de chaque camp que la vidéo laissait de côté.
    # POUR : l'enquête de la FRA est faite en ligne auprès de volontaires, d'où « enquête en ligne » dans le texte.
    # CONTRE : une décision britannique sur la loi sur l'égalité, pas une règle française ; le texte nomme le pays.
    - question: "Qui une simple déclaration toucherait-elle ?"
      pour: { affirmation: "Les personnes trans, souvent discriminées.", chiffre: "7 sur 10", texte: "Dans une enquête européenne en ligne, 7 personnes trans sur 10 en France disent avoir été discriminées dans l'année.", source: "Agence des droits fondamentaux de l'UE, 2023" }
      contre: { affirmation: "Aussi les espaces réservés aux femmes.", chiffre: "5 juges sur 5", texte: "Au Royaume-Uni, la Cour suprême a jugé à l'unanimité que la loi sur l'égalité vise le sexe biologique.", source: "Cour suprême du Royaume-Uni, 2025" }
