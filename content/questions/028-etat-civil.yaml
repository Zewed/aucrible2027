# Le libellé dit « la mention du sexe à l'état civil », comme la loi : il s'agit du document, pas du corps.
numero: 28
date: 2026-10-27
theme: societe
question: "Faut-il pouvoir changer la mention du sexe à l'état civil par une simple déclaration ?"
titreCourt: "Le sexe à l'état civil"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/028-etat-civil-jWBZ6ZHvsH6YbEBIF6DLa6xeAtQ0lk.mp4", duree: "1 min 50" }
contexte:
  - "Depuis une loi de 2016, un adulte peut faire modifier la mention de son sexe à l'état civil par un juge, sans traitement médical ni opération."
  - "Il doit montrer qu'il vit et qu'il est connu sous ce sexe, par des témoignages ou des documents ; les mineurs non émancipés ne le peuvent pas."
  - "La Défenseure des droits et des députés de gauche demandent une simple déclaration en mairie ; le ministère de la Justice propose d'« engager une réflexion » sur ce choix, qu'il juge « hautement politique »."
chiffres:
  - valeur: "2 883"
    unite: demandes
    legende: "de changement de la mention du sexe en 2024, contre 426 en 2018"
    source: { organisme: "Ministère de la Justice", document: "rapport d'évaluation de la loi de 2016", annee: 2025 }
  - valeur: "99,1 %"
    legende: "des demandes acceptées par le juge de 2018 à 2024 : 81 refus en sept ans"
    source: { organisme: "Ministère de la Justice", document: "rapport d'évaluation de la loi de 2016", annee: 2025 }
  - valeur: "4,9"
    unite: mois
    legende: "de procédure en moyenne, entre la demande et la décision du juge"
    source: { organisme: "Ministère de la Justice", document: "rapport d'évaluation de la loi de 2016", annee: 2025 }
options:
  - id: A
    libelle: "Rétablir une condition médicale"
    implique: "Le juge exige de nouveau un diagnostic médical, comme avant 2016, mais sans opération ni stérilisation, que la Cour européenne interdit ; les mineurs restent exclus."
    defenseurs: "Un diagnostic évite que des personnes changent d'état civil à la légère : la Cour européenne a jugé en 2017 qu'un pays pouvait l'exiger."
    critiques: "Exiger des pièces médicales porte atteinte à la vie privée, selon la Défenseure des droits, et traite comme un trouble mental ce que l'OMS et la Haute autorité de santé ne considèrent plus comme tel."
    axes: { societe: 1 }
  - id: B
    libelle: "Garder le juge, sans condition médicale"
    implique: "On garde la loi de 2016 : le juge vérifie, sur témoignages et documents, que la personne vit et est connue sous ce sexe ; les mineurs non émancipés restent exclus."
    defenseurs: "Le juge, impartial, protège la stabilité de l'état civil et accepte 99 % des demandes, gratuitement et sans avocat obligatoire."
    critiques: "Il faut se justifier devant un tribunal et attendre près de cinq mois ; des juges demandent encore des pièces médicales ou s'attachent à l'apparence."
    axes: { societe: 0 }
  - id: C
    libelle: "Une simple déclaration, pour les adultes"
    implique: "Un adulte déclare le changement en mairie, sans témoins ni pièces médicales ; les mineurs ne peuvent pas le faire par simple déclaration."
    defenseurs: "Personne ne connaît mieux son identité que soi-même : une déclaration évite d'avoir à prouver sa vie intime, comme en Espagne, en Allemagne ou en Belgique."
    critiques: "Sans juge pour vérifier, l'état civil, qui sert à identifier chacun, devient moins stable, et des changements faits à la légère ou détournés deviennent possibles."
    axes: { societe: -1 }
  - id: D
    libelle: "Une simple déclaration, aussi pour les mineurs"
    implique: "Comme pour les adultes, et aussi pour les mineurs : seuls dès 15 ans, et avant par l'un de leurs parents, comme le propose un texte déposé en 2024."
    defenseurs: "Les jeunes trans subissent souvent harcèlement et discriminations à l'école : reconnaître leur identité les protège, comme le permet l'Espagne dès 16 ans."
    critiques: "Un mineur est en développement et les médecins n'ont pas de consensus sur son accompagnement ; la Défenseure des droits préfère pour eux un juge saisi par les parents."
    axes: { societe: -2 }
