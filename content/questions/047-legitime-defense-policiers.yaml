  ruffin: { option: A, source: "Amendement n° 25 au texte n° 691 (art. unique), groupe Écologiste et Social, F. Ruffin parmi les auteurs, 19/01/2026 (rejeté)", statut: deduite }
  # Assemblée nationale, scrutin n° 7987 (vote sur l'ensemble, article unique), 07/07/2026 : vote personnel pour ; programme RN des législatives 2024 : https://www.assemblee-nationale.fr/dyn/17/scrutins/7987
  le-pen: { option: C, source: "Assemblée nationale, scrutin n° 7987 (vote sur l'ensemble, article unique), 07/07/2026 : vote personnel pour ; programme RN des législatives 2024", statut: deduite }
  # Assemblée nationale, scrutin n° 7987 (vote sur l'ensemble, article unique), 07/07/2026 : Horizons & Indépendants 31 pour, 0 contre : https://www.assemblee-nationale.fr/dyn/17/scrutins/7987
  philippe: { option: C, source: "Assemblée nationale, scrutin n° 7987 (vote sur l'ensemble, article unique), 07/07/2026 : Horizons & Indépendants 31 pour, 0 contre", statut: deduite }
