  zemmour: { option: C, source: "Programme présidentiel d'Éric Zemmour 2022, « Assurer la sécurité et la tranquillité des Français », visuel 1/4 (mars 2022)", statut: deduite }
  # Inconnues : Glucksmann (rien de Place publique), Lisnard (programme muet), Roussel (vote GDR contre, rien sur la loi de 2017), Arthaud.
  # Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/047-legitime-defense-policiers.md (chaque chiffre y a
  # sa source numérotée). Le fil : plus de refus de s'arrêter dangereux, plus de tirs ; faut-il présumer que le policier qui
  # tire respecte la loi, garder les règles, ou les resserrer ?
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 2b et 2c, [11] [12] [13] : refus aggravés (police et gendarmerie), même source et mêmes années ; la chute donne
    # le fait de l'autre camp aux mêmes années, en nombres plutôt qu'en « plus souvent » (tirs de policiers sur des
    # véhicules en mouvement : 116 en 2012, 138 en 2022, ministère de l'Intérieur).
    etapes:
      - { quand: "En 2012", valeur: "2 520 refus" }
      - { quand: "En 2022", valeur: "4 905 refus" }
    chute: "… de s'arrêter qui ont mis des vies en danger. Sur la même période, les tirs de policiers sur des voitures sont passés de 116 à 138."
  # Pas de mécanisme : aucun rapport « X pour 1 » parlant (moins d'un refus sur cent finit par un tir, repris en question).
  # Pas d'écart : la seule grandeur à deux dates qui compte (les tirs) est déjà dans la chute et dans les questions.
  leviers:
    # § 1.2, 2c et 2f, [8] [11] [29] : les trois options de la fiche, à égalité.
    titre: "Trois réponses possibles"
    choix:
      - { texte: "Revenir sur la loi de 2017", detail: "l'abroger, ou réserver les tirs sur une voiture à un danger évident et immédiat" }
      - { texte: "Garder les règles actuelles", detail: "sans présomption, en misant sur la formation" }
      - { texte: "Présumer que le tir respecte la loi", detail: "sauf preuve contraire, comme l'a voté l'Assemblée" }
    # La chute ne dit plus « elles changent » : garder les règles actuelles ne change rien (§ 1.2, 2a).
    chute: "Revenir sur la loi change les cas où l'on peut tirer ; présumer change qui doit prouver que le tir était nécessaire."
    source: "Assemblée nationale, 2024 et 2026"
  # L'objet tient sur une ligne (28 caractères, 418 px sur 458 côté CONTRE) ; « pour les policiers » faisait lire le camp
  # CONTRE comme « contre les policiers ».
  camps: { pour: POUR, contre: CONTRE, objet: "la présomption en cas de tir" }
  questions:
    # § 1.1, 1.4 et 2b, [30] [36] : deux faits de même poids, une mort de chaque côté, racontée de la même façon et
    # datée. Comyn : percuté par un véhicule qui refusait d'obtempérer, Mougins, 26/08/2024. Toubache c. France,
    # 07/06/2018 : un gendarme tire sur une voiture qui a foncé sur lui puis fuit, tuant un passager ; au moment du tir,
    # sa vie n'était « plus menacée et le véhicule était déjà en fuite » (faits de 2008, avant la loi de 2017).
    # L'étude n'a aucun chiffre sur les tirs « après le danger » : chaque chiffre compte donc la mort qu'il raconte.
    - question: "Tirer sur une voiture qui fuit, est-ce justifié ?"
      pour: { affirmation: "Oui, quand la voiture peut tuer.", chiffre: "1 gendarme tué", texte: "En août 2024, un gendarme est mort près de Cannes, percuté par un conducteur qui refusait de s'arrêter.", source: "Gendarmerie nationale, 2024" }
      contre: { affirmation: "Pas quand le danger est passé.", chiffre: "1 passager tué", texte: "En 2008, une voiture fonce sur un gendarme, puis s'enfuit : il tire et tue un passager. La France a été condamnée.", source: "Cour européenne des droits de l'homme, 2018" }
    # § 2c, [11] [13] [14]. Les deux camps ne mesurent pas la même chose, et c'est le cœur de la controverse : la mission
    # rapporte les tirs aux refus (0,6 à 0,7 % de 2012 à 2016, même niveau dès 2019) ; l'étude de 2022 compte les tirs
    # mortels (×5 entre 2012-2016 et 2017-2021, chiffres lus dans la question écrite n° 549 ; limite dans l'étude : le
    # ministère n'a pas de décompte fiable des morts avant 2018 et la mission « nuance » l'étude). Chaque texte dit ce
    # qu'il mesure (une part des refus, un nombre de tirs mortels), sur quelles années, et qui le dit.
    - question: "La loi de 2017 a-t-elle fait plus de morts ?"
      pour: { affirmation: "Le lien n'est pas prouvé.", chiffre: "< 1 %", texte: "Depuis 2019, moins d'un refus de s'arrêter sur cent finit par un tir, comme avant la loi, selon les députés.", source: "Assemblée nationale, 2024" }
      contre: { affirmation: "Oui, plus de tirs mortels.", chiffre: "×5", texte: "Selon des chercheurs, il y a eu cinq fois plus de tirs mortels de policiers sur des voitures en 2017-2021 qu'en 2012-2016.", source: "Revue Esprit, 2022" }
    # § 1.2, 2c et 3, [8] [11] [13] : la règle écrite (cinq cas inchangés) contre la façon dont une loi est comprise
    # (constat des deux rapporteurs de la mission, Renaissance et socialiste : « ce nouveau cadre a pu être compris comme
    # un assouplissement »). La preuve : 2017, année record (202 tirs de policiers sur des véhicules en mouvement, contre
    # 137 en 2016), consensus de l'étude ; le retour à la normale depuis 2019 est dans la réponse POUR de la question 2.
    - question: "La présomption change-t-elle les règles du tir ?"
      pour: { affirmation: "Non, les mêmes cinq cas.", chiffre: "5 cas", texte: "Le texte voté ne crée aucun nouveau cas de tir. La loi en garde cinq, tous soumis à l'absolue nécessité.", source: "Assemblée nationale, 2026" }
      contre: { affirmation: "Elle peut changer les pratiques.", chiffre: "202 tirs", texte: "En 2017, 202 tirs de policiers ont visé des voitures, un record. Selon les députés, la loi a pu sembler plus souple.", source: "Ministère de l'Intérieur et Assemblée nationale, 2024" }
    # § 1.1, 1.2 et 2a, [3] [4] [8] [17] : le même article du code pénal pour les deux camps. Pour : l'argument du
    # rapporteur (des présomptions simples existent déjà, pour tous ; ce ne sont pas les mêmes). Contre : celui du
    # Défenseur des droits et du député Roger Vicot (elles visent des circonstances, la nouvelle viserait un métier) ;
    # sa preuve est le texte adopté, qui ne vaut que pour la police nationale et la gendarmerie (policiers municipaux retirés).
    - question: "Est-ce une règle à part pour la police ?"
      pour: { affirmation: "Non, des présomptions existent déjà pour tous.", chiffre: "2 cas", texte: "Chacun est déjà présumé en légitime défense dans deux cas, comme repousser de nuit une intrusion chez soi.", source: "Code pénal, article 122-6 ; Assemblée nationale, 2026" }
      contre: { affirmation: "Oui, elle dépend du métier.", chiffre: "2 métiers", texte: "Ces deux cas visent une situation. La nouvelle présomption s'appliquerait à deux métiers : policier et gendarme.", source: "Défenseur des droits ; Assemblée nationale, 2026" }
