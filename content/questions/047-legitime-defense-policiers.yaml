# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour une présomption"
    argument: "Quand ils ont agi dans le cadre de la loi, les policiers et les gendarmes ne doivent pas être traités d'emblée comme des suspects."
  - titre: "Contre une présomption"
    argument: "La présomption dépendrait du métier de celui qui tire, et pourrait faire peser la preuve sur les victimes."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Présumer"
    precision: "que le tir respecte la loi"
  - choix: "Ne pas présumer"
    precision: "garder ou resserrer les règles"
