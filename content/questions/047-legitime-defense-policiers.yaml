# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/047-legitime-defense-policiers.md (tout ce qui suit y est sourcé).
# Vocabulaire : « présomption de légitime défense » (auteurs du texte, RN, Reconquête, Debout la France ; titre du texte
# voté) et « permis de tuer » (opposants : LFI, Amnesty, LDH) sont des mots attribués ; le texte voté parle de
# « présomption d'usage légitime de l'arme ». Ne contredit pas les fiches 005, 037 et 043 (même gouvernement,
# même ministre de l'Intérieur, mêmes règles de déduction des positions).
numero: 47
date: 2026-09-11
theme: securite-justice
question: "Quand un policier ou un gendarme tire, faut-il présumer qu'il respecte la loi ?"
titreCourt: "Le tir des policiers"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/047-legitime-defense-policiers-0qx9Gw3IgW9djD3YLvbhtFHfjGF5eh.mp4", duree: "2 min" }
contexte:
  - "Depuis une loi de 2017, policiers et gendarmes peuvent tirer dans cinq cas, toujours en cas d'absolue nécessité, dont celui d'une voiture qui refuse de s'arrêter et dont les occupants risquent de mettre des vies en danger en fuyant."
  - "Le 7 juillet 2026, l'Assemblée nationale a voté par 313 voix contre 199 une présomption : quand ils tirent, ils seraient réputés avoir respecté ces règles, sauf preuve contraire."
  - "Ses auteurs parlent de « présomption de légitime défense » et ses opposants de « permis de tuer » ; le Sénat ne l'a pas encore examinée."
chiffres:
  # § 2b, [11] [12] : refus « aggravés », qui exposent d'autres personnes à un risque de mort ou de blessure grave.
  - valeur: "4 905"
    unite: refus
    legende: "de s'arrêter mettant des vies en danger en 2022, deux fois plus qu'en 2012 (2 520)"
    source: { organisme: Assemblée nationale, document: "mission d'information sur les refus d'obtempérer", annee: 2024 }
  # § 2c, [11] : police nationale ; la part des refus suivis d'un tir est revenue à son niveau d'avant 2017 dès 2019.
  - valeur: "156"
    unite: tirs par an
    legende: "de policiers sur des voitures en mouvement de 2018 à 2022, contre 122 de 2012 à 2016"
    source: { organisme: Assemblée nationale, document: "mission d'information sur les refus d'obtempérer", annee: 2024 }
  # § 1.2, [7].
  - valeur: "313"
    unite: députés
    legende: "pour la présomption le 7 juillet 2026, contre 199 : le texte doit encore passer au Sénat"
    source: { organisme: Assemblée nationale, document: scrutin n° 7987, annee: 2026 }
options:
  - id: A
    libelle: "Revenir sur la loi de 2017"
    implique: "La règle de 2017 qui permet de tirer sur une voiture qui refuse de s'arrêter est supprimée, ou réservée à un danger évident et immédiat. Aucune présomption n'est créée."
    defenseurs: "Selon une étude de chercheurs, les tirs mortels de policiers sur des voitures ont été multipliés par cinq après 2017, et la Cour européenne des droits de l'homme a condamné la France en 2018 pour un tir de 2008 sur une voiture déjà en fuite."
    critiques: "Les refus de s'arrêter qui mettent des vies en danger ont doublé en dix ans, et les députés chargés d'évaluer la loi n'ont pas établi qu'elle ait fait tirer davantage : la part des refus suivis d'un tir est revenue dès 2019 à son niveau d'avant 2017."
    axes: { societe: -2 }
  - id: B
    libelle: "Garder les règles actuelles"
    implique: "Les cinq cas de tir fixés en 2017 restent tels quels, sans présomption : après un tir, la justice vérifie au cas par cas qu'il était nécessaire. L'effort porte sur la formation et le matériel pour arrêter les voitures."
    defenseurs: "La loi protège déjà le policier qui respecte ses règles, alors qu'une présomption risquerait, selon le Défenseur des droits, de faire peser la preuve sur les victimes et de banaliser l'usage des armes."
    critiques: "Pour les uns, la loi de 2017 a été comprise comme des règles plus souples et doit être resserrée ; pour les autres, des policiers qui ont respecté la loi restent traités d'emblée comme des suspects."
    axes: { societe: 0 }
  - id: C
    libelle: "Présumer que le tir respecte la loi"
    implique: "Quand un policier ou un gendarme tire, il est présumé avoir agi dans l'un des cinq cas prévus et avec l'absolue nécessité exigée. Toute preuve contraire, une vidéo par exemple, peut renverser cette présomption à tout moment."
    defenseurs: "Les agents décident en quelques secondes, face à des refus de s'arrêter plus dangereux : quand ils ont agi dans le cadre de la loi, ils ne doivent pas être traités d'emblée comme des suspects. Chacun est déjà présumé en légitime défense dans deux cas."
    critiques: "La présomption dépendrait du métier de celui qui tire et non des circonstances, et le Défenseur des droits comme les avocats craignent qu'elle affaiblisse le contrôle du juge et fasse peser la preuve sur les victimes."
    axes: { societe: 2 }
