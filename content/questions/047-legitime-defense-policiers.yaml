  retailleau: { option: C, source: "Assemblée nationale, scrutin n° 7987 (vote sur l'ensemble, article unique), 07/07/2026 : Droite républicaine 48 pour, 0 contre ; texte d'É. Pauget (LR)", statut: deduite }
