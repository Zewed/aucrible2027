# BROUILLON À VÉRIFIER : rédigé par IA le 26/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/008-sru.md (tout ce qui suit y est sourcé).
numero: 8
date: 2026-10-07
theme: logement
question: Que faire de l'obligation de 25 % de logements sociaux par commune (loi SRU) ?
titreCourt: "La loi SRU"
contexte:
  - Depuis la loi SRU de 2000, les communes d'au moins 3 500 habitants (1 500 en Île-de-France), dans les agglomérations importantes, doivent compter 25 % de logements sociaux, ou 20 % dans les territoires moins tendus.
  - Une commune en retard doit rattraper une part de son déficit à chaque période de trois ans, sous peine d'un prélèvement sur ses recettes, majoré en cas de carence.
  - En janvier 2026, le Sénat a voté un texte qui permettrait de compter des logements intermédiaires dans ce rattrapage ; il a été transmis à l'Assemblée nationale.
chiffres:
  - valeur: "1 000"
    unite: communes
    legende: sur 2 100 soumises à la loi n'atteignent pas leur taux légal
    source: { organisme: Ministère du Logement, document: bilan 2020-2022 de la loi SRU, annee: 2024 }
  - valeur: "186 000"
    unite: logements sociaux
    legende: produits en 2020-2022 dans les communes soumises à la loi
    source: { organisme: Ministère du Logement, document: bilan 2020-2022 de la loi SRU, annee: 2024 }
  - valeur: "5,4"
    unite: millions
    legende: "de logements locatifs sociaux, soit 15,9 % des résidences principales"
    source: { organisme: SDES, document: répertoire du parc locatif social au 1er janvier 2025, annee: 2025 }
  - valeur: "2,8"
    unite: millions
    legende: "de demandes de logement social en attente fin 2024, dont environ 1,9 million hors demandes de mutation"
    source: { organisme: Cour des comptes, document: rapport annuel, annee: 2026 }
options:
  - id: A
    libelle: La supprimer
    implique: L'article 55 est abrogé ; chaque commune fixe librement sa part de logements sociaux.
    defenseurs: La loi n'a manifestement pas fait ses preuves ; il faut redonner aux maires leur liberté d'action.
    critiques: Les communes les plus aisées pourraient cesser d'accueillir des logements sociaux, qui se concentreraient ailleurs.
    axes: { economie: 2 }
  - id: B
    libelle: L'assouplir
    implique: Une partie des logements intermédiaires compte dans le rattrapage, et les objectifs tiennent compte des contraintes de chaque territoire.
    defenseurs: Il faut soutenir les communes qui font des efforts et adapter l'objectif aux contraintes locales, comme les zones inondables ou les couloirs aériens.
    critiques: Le logement intermédiaire est trop cher pour la plupart des demandeurs, et il permettrait de contourner la loi.
    axes: { economie: 1 }
  - id: C
    libelle: La maintenir telle quelle
    implique: Taux de 25 % ou 20 %, rattrapage de 33 % du déficit par période de trois ans, exemptions pour les communes qui ne peuvent pas construire.
    defenseurs: La loi produit des logements sociaux et prévoit déjà des exemptions pour les communes qui ne peuvent pas construire.
    critiques: Un millier de communes restent sous le seuil, et d'autres jugent un quota national uniforme trop rigide.
  - id: D
    libelle: La durcir
    implique: Le taux passe à 30 % et les sanctions des communes en retard sont alourdies.
    defenseurs: Sans sanction lourde, les communes qui ne jouent pas le jeu ne construisent pas ; l'État doit faire appliquer la loi.
    critiques: "Beaucoup de communes manquent de foncier ou de moyens : relever le taux et les pénalités les frapperait sans les aider à construire."
    axes: { economie: -2 }
