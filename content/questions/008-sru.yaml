    url: https://www.senat.fr/dossier-legislatif/ppl25-171.html
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour alléger la loi"
    argument: "Il faut redonner aux maires leur liberté d'action et adapter l'objectif aux contraintes locales."
  - titre: "Pour la maintenir ou la durcir"
    argument: "Sans sanction lourde, les communes qui ne jouent pas le jeu ne construisent pas de logements sociaux."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Alléger"
    precision: "ou supprimer"
  - choix: "Maintenir"
    precision: "ou durcir"
