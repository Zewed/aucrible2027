  attal: { option: C, source: "Assemblée nationale, scrutin n° 289 du 07/11/2024, ensemble de la proposition de loi Le Meur-Echaniz sur les meublés de tourisme (texte de la CMP)", statut: estimee, lien: "https://www.assemblee-nationale.fr/dyn/17/scrutins/289" }
