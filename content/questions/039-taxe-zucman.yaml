# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux dont cette fiche découle : docs/etudes/039-taxe-zucman.md (tout ce qui suit y est sourcé).
# L'ISF et l'IFI ont leur propre fiche (001) : celle-ci porte sur l'impôt minimum de 2 % au-delà de 100 M€ et ses variantes.
numero: 39
date: 2026-09-19
theme: economie-impots
question: "Faut-il créer un impôt minimum sur les très grandes fortunes ?"
titreCourt: "La taxe Zucman"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/039-taxe-zucman-pbDY4yjqDaTZ4Z1OrhstWcqHGSg12g.mp4", duree: "2 min 10" }
contexte:
  - "La taxe Zucman, du nom de l'économiste qui l'a conçue, obligerait les foyers qui possèdent plus de 100 millions d'euros, parts d'entreprises comprises, à payer chaque année en impôts au moins 2 % de ce patrimoine : s'ils paient moins, ils versent la différence."
  - "Les députés l'ont adoptée en février 2025, puis le Sénat l'a rejetée ; l'Assemblée l'a ensuite repoussée dans les budgets pour 2026 et pour 2027, en octobre 2025 et en octobre 2026."
  - "Il existe déjà un impôt minimum de 20 % sur les revenus de plus de 250 000 euros par personne, créé en 2025, et, depuis 2026, une taxe sur les biens de luxe gardés dans des sociétés de détention, appelées holdings."
chiffres:
  - valeur: "1 800"
    unite: foyers
    legende: "environ possèdent plus de 100 millions d'euros, selon l'estimation de Gabriel Zucman, que l'administration fiscale n'a pas pu retracer"
    source: { organisme: Sénat, document: "rapport n° 689", annee: 2025 }
  - valeur: "26 %"
    legende: "de leur revenu : ce que paient en impôts les 75 foyers les plus riches, contre 46 % pour le 0,1 % le plus aisé, selon une estimation sur 2016 dont le Sénat juge la méthode contestable"
    source: { organisme: Institut des politiques publiques, document: "note n° 92", annee: 2023 }
  - valeur: "5 à 20"
    unite: milliards d'euros
    legende: "par an : ce que rapporterait la taxe selon les estimations, environ 20 pour Gabriel Zucman, environ 5 pour d'autres économistes"
    source: { organisme: OFCE, document: "document de travail n° 2026-6", annee: 2026 }
options:
  - id: A
    libelle: "Créer la taxe Zucman"
    implique: "Chaque foyer qui possède plus de 100 millions d'euros, parts d'entreprises comprises, paie chaque année en impôts au moins 2 % de ce patrimoine, ou verse la différence ; partir à l'étranger ne permet pas d'y échapper aussitôt."
    defenseurs: "Selon une estimation, les 75 foyers les plus riches paient 26 % de leur revenu en impôts, contre 46 % pour le 0,1 % le plus aisé : un plancher corrigerait cet écart et rapporterait environ 20 milliards d'euros par an, selon Gabriel Zucman."
    critiques: "Sept économistes estiment qu'elle réduirait le déficit de 5 milliards d'euros par an, pas de 20 ; taxer chaque année des parts d'entreprises peut obliger à vendre, et le rapporteur du Sénat juge le texte probablement contraire à la Constitution."
    # Même note que l'option B de la fiche 001, qui décrit le même impôt ; B et C à 0, comme les deux scénarios
    # du Conseil des prélèvements obligatoires qui les rapprochent (étude § 2g) ; D, le statu quo, à +1 comme dans 001.
    axes: { economie: -2 }
  - id: B
    libelle: "Taxer la fortune, pas les entreprises"
    implique: "Pas de taxe Zucman, mais un impôt sur le patrimoine des plus riches dont sont exclues les parts des entreprises qu'ils détiennent ou dirigent, par exemple 0,5 % par an comme le propose la Cour des comptes, ou un impôt sur la fortune qui épargne les entreprises et la résidence principale."
    defenseurs: "Les plus riches contribuent davantage sans que l'on taxe l'activité des entreprises ni que leurs propriétaires doivent vendre des parts pour payer ; la Cour des comptes chiffre sa version à 1,4 milliard d'euros par an."
    critiques: "Les très grandes fortunes sont surtout faites de parts d'entreprises : le rapporteur du Sénat juge que les exclure dénaturerait l'impôt, et la recette attendue serait plus faible que celle de la taxe Zucman."
    axes: { economie: -1 }
  - id: C
    libelle: "Viser les façons d'éviter l'impôt"
    implique: "Pas d'impôt sur le patrimoine. On resserre les règles qui permettent aux plus riches de garder leurs bénéfices dans des sociétés de détention, les holdings, sans payer d'impôt sur le revenu, et l'on corrige l'impôt minimum de 20 % sur les très hauts revenus."
    defenseurs: "Le problème vient de ces sociétés, pas du patrimoine : un dividende versé à une personne est taxé à 31,4 %, contre 1,25 % s'il reste dans une holding. C'est la voie retenue en 2026 par la commission d'enquête de l'Assemblée."
    critiques: "Ces outils rapportent peu : l'impôt minimum sur les hauts revenus devait rapporter 2 milliards d'euros, 388 millions sont attendus pour 2025, et la taxe sur les holdings rapporte environ 100 millions."
    axes: { economie: 0 }
  - id: D
    libelle: "Ne rien ajouter"
    implique: "Aucun nouvel impôt ni hausse pour les plus riches ; l'effort passe par la baisse des dépenses, et certains veulent même alléger la fiscalité du patrimoine."
    defenseurs: "La France est le deuxième pays de l'Union où l'on prélève le plus d'impôts et de cotisations, 45,3 % de la richesse produite en 2024 ; un nouvel impôt reposant sur quelques familles perdrait la moitié de sa recette avec trois départs, selon le Sénat."
    critiques: "Les plus grandes fortunes continueraient de payer, selon une estimation, une part de leur revenu plus faible que d'autres foyers très aisés, et l'État renoncerait à des recettes alors que le déficit atteignait 5,1 % de la richesse produite en 2025."
    axes: { economie: 1 }
