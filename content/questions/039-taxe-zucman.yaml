# fortunes qui ont beaucoup grossi ; les quatre choix de la fiche ; les camps s'opposent sur la taxe.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.3, [1] [2] [4] [8].
    etapes:
      - { quand: "Février 2025", valeur: "Adoptée" }
      - { quand: "Octobre 2026", valeur: "Rejetée" }
    chute: "… par les députés. Entre les deux, le Sénat puis l'Assemblée l'avaient déjà repoussée : elle n'existe pas dans la loi."
  ecart:
    # § 2i, [35] : estimations d'un magazine (source secondaire), d'où la chute ; même série, deux dates. L'année de
    # départ n'est connue qu'à peu près (« il y a 20 ans », écrit l'Observatoire en 2025) : « Vers 2005 ».
    titre: "Ce que possèdent les 500 plus grandes fortunes, en milliards d'euros"
    etapes:
      - { quand: "Vers 2005", valeur: "170" }
      - { quand: "En 2025", valeur: "1 128" }
    chute: "Ce sont des estimations d'un magazine, en euros de chaque année : elles suivent la Bourse et ont baissé en 2025 et 2026."
    source: "Challenges, 2025"
  leviers:
    # § 1.2, 2f, 2g et 4, [3] [11] [12] [14] [23]. Les quatre options de la fiche, dans son ordre, pour que « ne rien
    # ajouter » ait sa carte comme les autres, ici et sur l'écran final. La chute dit ce qui existe déjà (impôt minimum
    # de 2025, taxe sur les holdings de 2026) : ce que D garde et ce que C veut resserrer.
    titre: "Pour l'impôt des plus grandes fortunes, quatre choix"
    choix:
      - { texte: "Créer la taxe Zucman", detail: "au moins 2 % par an au-delà de 100 millions d'euros, entreprises comprises" }
      - { texte: "Taxer la fortune, pas les entreprises", detail: "par exemple 0,5 % par an, comme le propose la Cour des comptes" }
      - { texte: "Viser les façons d'éviter l'impôt", detail: "les bénéfices gardés dans des sociétés, l'impôt minimum sur les hauts revenus" }
      - { texte: "Ne rien ajouter", detail: "aucun nouvel impôt, l'effort passe par la baisse des dépenses" }
    chute: "Il existe déjà un impôt minimum sur les très hauts revenus, et une taxe sur les biens de luxe gardés dans des sociétés."
    source: "Sénat, 2025 et 2026 ; Cour des comptes, 2026 ; Assemblée nationale, 2026"
  camps: { pour: POUR, contre: CONTRE, objet: la taxe Zucman }
  # Chaque réponse est le meilleur argument de son camp ; les estimations sont dites comme telles. L'origine des
  # chiffres est dite de la même façon des deux côtés : par le nom de l'organisme, dans la source.
  questions:
    # § 2a, [15] [17] : même mesure de base (impôts rapportés au revenu, bénéfices gardés dans les sociétés compris),
    # même taux de 26 % pour les milliardaires (26,2 %). L'Institut de l'entreprise recalcule le foyer à l'entrée des
    # 10 % les plus aisés en comptant aussi le loyer qu'il n'a pas à payer et l'épargne sans impôt : 24,5 % au lieu de
    # 29,9 %, d'où « selon un autre calcul ». Les deux camps ne comparent pas au même groupe : chacun le nomme.
    - question: "Les plus riches paient-ils moins d'impôts, en proportion ?"
      pour: { affirmation: "Moins que d'autres très riches.", chiffre: "26 %", texte: "Selon une estimation, l'impôt prend 26 % du revenu des milliardaires, contre 46 % pour le 0,1 % le plus aisé.", source: "Institut des politiques publiques, 2023" }
      contre: { affirmation: "Plus qu'un foyer aisé.", chiffre: "24,5 %", texte: "Selon un autre calcul, un foyer à l'entrée des 10 % les plus aisés paie 24,5 %, moins que les milliardaires.", source: "Institut de l'entreprise, 2026" }
    # § 2b et 2i, [3] [16] [21] : deux estimations faites en 2025, pour le même impôt, par an ; l'une est une
    # recette, l'autre une baisse du déficit (les sept économistes ne disent pas, dans l'étude, ce qu'ils ont compté).
    # Le chiffre les rapporte au même déficit public de 2025, 152,5 milliards (calcul de l'étude, § 2i) : l'affirmation
    # donne la somme, le chiffre ce qu'elle pèse, sans sigle.
    - question: "Combien rapporterait-elle chaque année ?"
      pour: { affirmation: "Environ 20 milliards d'euros.", chiffre: "13 %", texte: "Gabriel Zucman, qui l'a conçue, l'estime à 20 milliards, à 5 près, soit 13 % du déficit public de 2025.", source: "Sénat, 2025 ; Insee, 2026" }
      contre: { affirmation: "Environ 5 milliards d'euros.", chiffre: "3 %", texte: "Sept économistes estiment qu'elle réduirait le déficit de 5 milliards, soit 3 % de celui de 2025.", source: "OFCE, 2026 ; Insee, 2026" }
    # § 2d, [18] [3]. Le camp CONTRE parle en premier ici : son affirmation se comprend seule.
    - question: "Les plus riches quitteraient-ils la France ?"
      pour: { affirmation: "Peu partent.", chiffre: "0,2 %", texte: "Chaque année, 0,2 % des 1 % les plus aisés partent à l'étranger, deux fois moins que l'ensemble des Français.", source: "Conseil d'analyse économique, 2025" }
      contre: { affirmation: "Quelques départs coûteraient cher.", chiffre: "3 foyers", texte: "Selon le Sénat, si les trois plus grandes fortunes partaient, la recette attendue baisserait de moitié.", source: "Sénat, 2025" }
    # § 2a et 2c, [12] [3].
    - question: "Faut-il compter les entreprises qu'ils possèdent ?"
      pour: { affirmation: "Oui, l'argent y est moins taxé.", chiffre: "1,25 %", texte: "Un dividende versé à une personne est taxé à 31,4 %, et à 1,25 % s'il va dans sa société de détention.", source: "Assemblée nationale, 2026" }
      contre: { affirmation: "Non, ce serait trop lourd.", chiffre: "2 sur 3", texte: "Si une entreprise rapporte 3 % par an à son propriétaire, l'impôt de 2 % en prendrait les deux tiers.", source: "Sénat, 2025" }
