# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/038-reseaux-sociaux.md (chaque chiffre y a sa source
# numérotée). Le fil : deux lois votées, aucune appliquée ; quatre façons de protéger les enfants, que l'Europe mélange.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1, [1] [5] [6] [8].
    etapes:
      - { quand: Juillet 2026, valeur: Interdiction votée }
      - { quand: Août 2026, valeur: Interdiction censurée }
    chute: "… et aujourd'hui, aucune interdiction ne s'applique en France."
  # Pas de mécanisme : aucun rapport « X pour 1 » ne résume le sujet.
  ecart:
    # § 2c, [29] : même population (moins de 16 ans en Australie), même enquête, avant et après l'interdiction.
    # La chute donne les deux lectures du § 2c : la règle se contourne ; le régulateur en accuse les plateformes.
    titre: "En Australie, combien de moins de 16 ans ont un compte ?"
    etapes:
      - { quand: Fin 2025, valeur: "52 %" }
      - { quand: Mars 2026, valeur: "42 %" }
    chute: "Une baisse, mais la plupart de ceux qui avaient un compte l'ont gardé ou en ont ouvert un autre. Selon le régulateur, les plateformes vérifient mal l'âge."
    source: "eSafety Commissioner (Australie), 2026"
  leviers:
    # § 2f, 2g et 2j, [11] [13] [15]. Les quatre options de la fiche, dans l'ordre.
    titre: Pour protéger les enfants, quatre façons de faire
    choix:
      - { texte: Éduquer, detail: "apprendre aux enfants à s'en servir, aider les parents" }
      - { texte: Changer les applications, detail: "avant 15 ans, pas de fonctions qui poussent à rester connecté" }
      - { texte: Laisser décider les parents, detail: pas de compte avant 15 ans sans leur accord }
      # Toute règle d'âge suppose de vérifier l'âge (§ 3) : ce n'est pas ce qui distingue l'interdiction.
      - { texte: Interdire, detail: "aucun compte avant 15 ans, même avec l'accord des parents" }
    chute: "L'Europe propose d'en mélanger trois : pas de compte avant 13 ans, un compte limité ouvert par un parent jusqu'à 15 ans, des applications sans ces fonctions."
    source: Commission européenne, 2026
  camps: { pour: POUR, contre: CONTRE, objet: une interdiction avant 15 ans }
  questions:
    # § 2a, [21] [25]. Les deux réponses portent sur des adolescents ; la seconde dit qu'elle mesure tout le numérique
    # (l'étude n'a pas relu quelles questions sur les réseaux l'indicateur contient : on n'écrit pas « réseaux compris »).
    # Les deux mesures diffèrent (réseaux / tout le numérique, 2026 / 2019) : c'est la meilleure carte de chaque camp au
    # § 2a, et chaque carte dit ce qu'elle mesure.
    - question: Les réseaux sociaux nuisent-ils à la santé des jeunes ?
      pour: { affirmation: "Oui, selon l'agence de sécurité sanitaire.", chiffre: "1 000 études", texte: "Elle en a examiné plus de mille : sommeil perturbé, image de soi abîmée, harcèlement. Les filles sont les plus touchées.", source: "Anses, 2026" }
      contre: { affirmation: "Un lien existe, mais il est faible.", chiffre: "0,4 %", texte: "Sur 355 000 adolescents, l'usage du numérique dans son ensemble explique au plus 0,4 % des écarts de bien-être.", source: "Université d'Oxford, 2019" }
    # § 2c, [31] : le même sondage pour les deux réponses, et les deux disent que ce sont des réponses d'enfants.
    - question: Les enfants respecteraient-ils une interdiction ?
      pour: { affirmation: "Oui, pour la plupart.", chiffre: 2 sur 3, texte: "Dans le même sondage, deux enfants sur trois disent qu'ils respecteraient l'interdiction.", source: "Arcom, 2026" }
      contre: { affirmation: Pas tous., chiffre: 1 sur 3, texte: "Dans un sondage, un enfant sur trois de 10 à 14 ans dit qu'il la contournerait, avec une fausse date de naissance.", source: "Arcom, 2026" }
    # § 1.2 et 2d, [1] [2] [15] [17]. Les sept pays viennent de Toute l'Europe [17]. Le Conseil constitutionnel a
    # censuré pour deux motifs, liberté d'expression et vie privée : d'où « notamment ». Pas de « 100 % » construit.
    - question: "Vérifier l'âge de tous, est-ce acceptable ?"
      pour: { affirmation: "Oui, sans dévoiler son identité.", chiffre: 7 pays, texte: "Sept pays, dont la France, préparent une application européenne qui dit si l'on a l'âge, sans donner son nom.", source: "Commission européenne ; Toute l'Europe, 2026" }
      contre: { affirmation: Pas sans garanties solides., chiffre: Août 2026, texte: "Chacun, adultes compris, devrait prouver son âge. Le Conseil constitutionnel a censuré l'interdiction, notamment faute de garanties sur cette preuve.", source: "Conseil constitutionnel, 2026" }
    # § 2g, [15] [32]. Un sondage d'un côté, une proposition de l'autre : chaque camp donne son argument du § 2g, et
    # aucun chiffre n'est mis en face d'un autre ; les deux affirmations répondent à la question.
    - question: "Est-ce aux parents de décider ?"
      pour: { affirmation: "Non, la plupart des parents veulent une loi.", chiffre: "74 %", texte: "Trois parents d'enfants de 6 à 16 ans sur quatre sont favorables à l'interdiction avant 15 ans, selon un sondage.", source: "Observatoire de la parentalité numérique, 2026" }
      contre: { affirmation: "Oui, avec un compte surveillé.", chiffre: 13 ans, texte: "L'Europe propose qu'entre 13 et 15 ans, un parent puisse ouvrir à son enfant un compte limité à une heure par jour.", source: "Commission européenne, 2026" }
