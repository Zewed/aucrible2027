# BROUILLON À VÉRIFIER : rédigé par IA le 27/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/038-reseaux-sociaux.md (tout ce qui suit y est sourcé).
# Aucune note d'axe : le clivage ne suit pas l'axe progressiste/conservateur. La loi de juillet 2026 a été votée de LR
# au PS et chez les écologistes, combattue par LFI, et le RN, pour en janvier, s'est abstenu en juillet (étude, § 4).
numero: 38
date: 2026-09-20
theme: education-jeunesse
question: Faut-il interdire les réseaux sociaux aux moins de 15 ans ?
titreCourt: "Les réseaux sociaux avant 15 ans"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/038-reseaux-sociaux-1sgHeSDkf8JoaoRZJXHFdAoaftDRai.mp4", duree: "2 min 10" }
contexte:
  - "Une loi de 2023 exigeait l'accord d'un parent pour s'inscrire sur un réseau social avant 15 ans, mais elle n'est jamais entrée en vigueur."
  - "Le Parlement a voté en juillet 2026 une interdiction générale avant 15 ans. Le Conseil constitutionnel, qui juge l'objectif légitime, l'a censurée le 14 août pour atteinte à la liberté d'expression et à la vie privée."
  - "Le gouvernement a annoncé un nouveau texte, et la Commission européenne a proposé le 17 septembre 2026 de fixer à 15 ans l'âge d'un compte autonome dans toute l'Union."
chiffres:
  - valeur: "58 %"
    legende: des 12-17 ans vont chaque jour sur les réseaux sociaux
    source: { organisme: "Crédoc, cité par l'Anses", document: baromètre du numérique, annee: 2025 }
  - valeur: "11 %"
    legende: "des jeunes Européens de 11 à 15 ans ont un usage problématique des réseaux sociaux en 2022, contre 7 % en 2018"
    source: { organisme: OMS Europe, document: enquête HBSC, annee: 2024 }
  - valeur: "42 %"
    legende: "des moins de 16 ans ont encore un compte en Australie trois mois après l'interdiction, contre 52 % avant"
    source: { organisme: eSafety Commissioner (Australie), document: évaluation à trois mois, annee: 2026 }
options:
  - id: A
    libelle: Ne pas interdire, éduquer
    implique: "Pas d'âge minimum fixé par la loi française : les règles des plateformes (13 ans le plus souvent) et le droit européen s'appliquent, et l'on mise sur l'éducation au numérique et l'aide aux parents."
    defenseurs: "Une interdiction se contourne et oblige chacun, adultes compris, à prouver son âge : mieux vaut apprendre aux jeunes à s'en servir et aider les parents à les guider."
    critiques: "La limite de 13 ans n'est pas respectée, puisque 58 % des 11-12 ans avaient un compte en 2021, et l'éducation ne change pas la conception des applications."
    axes: { societe: -1 }
  - id: B
    libelle: Interdire les fonctions jugées addictives
    implique: "Les moins de 15 ans gardent accès aux réseaux sociaux, mais la loi leur interdit une liste de fonctions : lecture automatique des vidéos, défilement sans fin, notifications la nuit, messages d'inconnus."
    defenseurs: "On vise ce qui nuit, la façon dont les applications sont conçues, sans couper les adolescents de leurs amis ni interdire des services dont les risques ne sont pas établis."
    critiques: "Les plateformes n'ont pas fait respecter leur propre limite de 13 ans, et il faudrait tout de même vérifier l'âge de chacun pour savoir à qui appliquer ces règles."
    axes: { societe: 0 }
  - id: C
    libelle: Interdire avant 15 ans, sauf accord des parents
    implique: "Pas de compte avant 15 ans sans l'accord d'un parent, qui peut le donner service par service, comme le prévoyaient la loi de 2023 et la version votée par le Sénat en mars 2026."
    defenseurs: "Les parents décident selon la maturité de leur enfant, ce que le Conseil d'État et le Conseil constitutionnel reprochaient à l'interdiction générale de ne pas permettre."
    critiques: "La loi de 2023, fondée sur l'accord des parents, a été bloquée par le droit européen, et il faudrait vérifier à la fois l'âge de l'enfant et l'identité du parent."
    axes: { societe: 0 }
  - id: D
    libelle: Interdire strictement avant 15 ans
    implique: "Aucun compte sur un réseau social avant 15 ans, sans dérogation, et vérification de l'âge de tous les utilisateurs, comme dans la loi votée en juillet 2026 ; l'Australie a choisi 16 ans."
    defenseurs: "Les réseaux sociaux abîment le sommeil et l'image de soi des adolescents, selon l'agence de sécurité sanitaire. Une règle claire et la même pour tous les enfants les en protège ; 69 % des 10-14 ans la jugent eux-mêmes une bonne idée."
    critiques: "Le Conseil constitutionnel l'a censurée en 2026 pour atteinte à la liberté d'expression et à la vie privée, et en Australie, la plupart des enfants qui avaient un compte l'ont gardé ou en ont ouvert un autre."
    axes: { societe: 1 }
