cotes:
  - titre: "Pour que l'État la reprenne"
    argument: "Selon le département où il vit, un enfant est accompagné ou abandonné : seul l'État peut garantir la même protection partout."
  - titre: "Pour la laisser aux départements"
    argument: "Quand l'État la dirigeait, avant 1984, les écarts existaient déjà : changer d'échelon ne crée ni places ni familles d'accueil."
# Les deux choix de l'autocollant « Et toi ? » de la story : A contre B, C et D.
story:
  - choix: "L'État la reprend"
    precision: "comme avant 1984"
  - choix: "Les départements la gardent"
    precision: "avec plus de règles nationales, ou plus de liberté"
