# BROUILLON À VÉRIFIER : rédigé par IA le 10/11/2026 à partir de sources publiques.
# Chaque chiffre et chaque position doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/065-aide-sociale-enfance.md (tout ce qui suit y est sourcé).
# Les moyens, les familles d'accueil, les jeunes majeurs et les mineurs non accompagnés sont des enjeux de la question,
# pas des options (étude, « D'où vient la question »).
# Mots disputés, attribués ou évités (étude, « Règles de lecture ») : « recentraliser » (RN, LFI, rapport Woerth),
# « renationaliser » (LFI ; C. Caubel en 2023), « reprendre la main » : la fiche écrit « l'État reprend l'aide sociale à
# l'enfance » ; « recentraliser » n'apparaît que dans les citations. « Loterie territoriale » (LFI) : la fiche écrit
# « écarts entre départements ». « État stratège », « premier parent défaillant de France » : évités. « Placements
# abusifs » ou « injustifiés » (RN) : la fiche écrit « placements ». « Sorties sèches » : évité.
numero: 65
date: 2026-08-24
theme: education-jeunesse
question: "Qui doit diriger l'aide sociale à l'enfance, l'État ou les départements ?"
titreCourt: "L'aide sociale à l'enfance"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/065-aide-sociale-enfance-constat-4wJ1JVlk3yNYjYUU2x5bIkyQLBhyfY.mp4", duree: "3 min 24", ecrans: [0, 14.67, 25.1, 39.07, 52.34, 62.1, 75.34, 86.5, 95.57, 108.14, 123.5, 137.44, 151.4, 166.04, 181.4, 196.74], images: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/ecrans/065-aide-sociale-enfance-constat-4wJ1JVlk3yNYjYUU2x5bIkyQLBhyfY/" }
contexte:
  - "L'aide sociale à l'enfance (ASE) protège les enfants en danger et certains jeunes de moins de 21 ans : elle les place en famille d'accueil ou en foyer, ou envoie un éducateur chez eux, le plus souvent sur décision d'un juge."
  - "Depuis la décentralisation de 1982-1983, ce sont les départements qui dirigent et financent l'aide sociale à l'enfance ; l'État garde la justice, la santé, l'école et la loi."
  - "Le projet de loi de 2026 sur la protection des enfants ne change pas ce partage, que certains veulent revoir : que l'État reprenne l'aide sociale à l'enfance, comme avant 1984, qu'il impose des règles nationales, ou au contraire que les départements aient plus de liberté."
# Quatre chiffres qui posent le sujet : combien d'enfants, combien d'argent, quels écarts, combien de jeunes étrangers
# arrivés seuls. La légende du troisième dit que la cause des écarts n'est pas mesurée (étude § 2a) : le chiffre ne
# plaide pas pour un échelon.
chiffres:
  - valeur: "217 400"
    unite: jeunes placés
    legende: "vivaient hors de chez leurs parents fin 2025, en famille d'accueil, en foyer ou ailleurs"
    source: { organisme: "Drees", document: "données provisoires 2025", annee: 2026 }
  - valeur: "11,7"
    unite: milliards d'euros
    legende: "dépensés par les départements pour l'aide sociale à l'enfance en 2024"
    source: { organisme: "Drees", document: "L'aide sociale à l'enfance, édition 2026", annee: 2026 }
  - valeur: "0,7 à 2,7 %"
    legende: "des moins de 21 ans sont placés fin 2024, selon le département"
    source: { organisme: "Drees", document: "L'aide sociale à l'enfance, édition 2026", annee: 2026 }
  - valeur: "46 800"
    unite: jeunes étrangers arrivés seuls
    legende: "étaient placés fin 2024, soit 21 % de tous les jeunes placés"
    source: { organisme: "Drees", document: "L'aide sociale à l'enfance, édition 2026", annee: 2026 }
# L'ordre est une échelle : de la plus centralisée (A) à la plus décentralisée (D) (étude § 4).
options:
  - id: A
    libelle: "L'État reprend l'aide sociale à l'enfance"
    implique: "L'État dirige et paie l'aide sociale à l'enfance à la place des départements, comme avant 1984. Une proposition de loi de 2022 prévoyait de mettre leurs agents à la disposition du préfet, en gardant leur statut, et de réduire d'autant l'argent que l'État verse aux départements. Certains de ses défenseurs y ajoutent une forte hausse des moyens financiers et humains."
    defenseurs: "Selon le département où il vit, un enfant est accompagné ou abandonné : seul l'État peut garantir la même protection partout."
    critiques: "Quand l'État dirigeait l'aide sociale à l'enfance, avant 1984, les écarts existaient déjà : changer d'échelon ne crée ni places ni familles d'accueil."
    detail:
      chiffrage:
        texte: "Personne n'a chiffré ce que coûterait la reprise. L'État prendrait à sa charge des dépenses de 11,7 milliards d'euros par an : ce que les départements y ont consacré en 2024."
        source: { organisme: "Drees", annee: 2026 }
      defenseurs:
        - texte: "Selon le département où il vit, un enfant est accompagné ou abandonné : seul l'État peut garantir la même protection partout."
        - texte: "Les départements ne sont pas armés pour protéger les enfants : les hôtels, les placements non exécutés et les violences en foyer le montrent."
        - texte: "Les écarts entre départements sont forts : 4 % ou plus des moins de 21 ans sont suivis par l'aide sociale à l'enfance dans quatre départements, moins de 1,9 % dans quinze autres."
          source: { organisme: "Drees", annee: 2026 }
      critiques:
        - texte: "Les écarts existaient déjà quand l'État dirigeait l'aide sociale à l'enfance : dès 1980, on relevait des situations inacceptables et des inégalités entre territoires."
        - texte: "Un transfert absorberait des années d'énergie administrative pendant lesquelles les enfants attendent, et ne créerait ni places ni familles d'accueil."
        - texte: "Chez nos voisins, la protection de l'enfance revient à des communes, des comtés ou des arrondissements, pas à l'État central : c'était le cas dans les sept pays comparés en 2007."
          source: { organisme: "Sénat", document: "étude de législation comparée", annee: 2007 }
  - id: B
    libelle: "Aux départements, avec des règles nationales financées par l'État"
    implique: "Les départements gardent l'aide sociale à l'enfance, mais l'État impose partout un nombre minimum d'adultes par enfant dans les foyers et l'aide aux jeunes de 18 à 21 ans. Le préfet pourrait engager d'office les dépenses d'un département défaillant. Une loi fixerait les moyens sur cinq ans, avec un fonds payé par la branche Famille de la Sécurité sociale et une part de CSG."
    defenseurs: "Le département connaît le terrain, mais l'État doit fixer partout des règles minimales et payer ce qu'il impose."
    critiques: "Pour les uns, sans un responsable unique, les écarts entre départements resteront ; pour les autres, des normes imposées d'en haut contraindraient trop les départements."
    detail:
      chiffrage:
        texte: "Aucun chiffrage n'a été trouvé. Pour mesurer l'enjeu : un enfant placé coûte en moyenne 42 400 euros par an, et les dépenses des départements pour l'aide sociale à l'enfance ont augmenté de 6,7 % en 2024."
        source: { organisme: "Drees", annee: 2026 }
      defenseurs:
        - texte: "Le département connaît le terrain, mais l'État doit fixer partout des règles minimales et payer ce qu'il impose."
        - texte: "Les foyers sont le seul secteur de l'enfance sans nombre minimum d'adultes par enfant : c'est à l'État de le fixer."
        - texte: "Aucun jeune ne doit se retrouver à la rue en quittant l'aide sociale à l'enfance : 23 % des adultes nés en France et sans domicile ont été placés enfants."
          source: { organisme: "Insee", document: "enquête Sans-domicile, citée par l'Assemblée nationale", annee: 2012 }
      critiques:
        - texte: "Sans un responsable unique, les écarts entre départements resteront : l'État doit diriger, pas seulement encadrer."
        - texte: "Des normes d'encadrement et un budget sur cinq ans imposés d'en haut contraindraient trop l'action des départements."
        - texte: "L'uniformisation ne doit pas être un but en soi : chaque département doit pouvoir adapter son action aux réalités locales."
  - id: C
    libelle: "La règle actuelle, complétée par la loi de 2026"
    implique: "Le département reste responsable de l'aide sociale à l'enfance. L'État se coordonne avec lui dans des comités départementaux, fixe un cadre national pour contrôler les lieux d'accueil et fait vérifier d'ici fin 2029 l'honorabilité de tout adulte qui travaille auprès d'enfants, sans imposer de nombre minimum d'adultes par enfant ni de budget sur plusieurs années."
    defenseurs: "Quand l'État dirigeait l'aide sociale à l'enfance, cela ne marchait pas : mieux vaut renforcer la coordination et les contrôles que bouleverser l'organisation."
    critiques: "La loi de 2026 ne tranche pas qui dirige et n'apporte ni normes d'encadrement ni budget sur plusieurs années : comme les précédentes, elle n'y suffira pas."
    detail:
      chiffrage:
        texte: "Depuis 1998, les dépenses des départements pour l'aide sociale à l'enfance ont été multipliées par 2,7 (+78 % une fois l'inflation déduite), et le nombre de mesures, placements et suivis par un éducateur, par 1,5. La hausse récente tient au nombre d'enfants et à la hausse des salaires des familles d'accueil décidée en 2022."
        source: { organisme: "Drees", annee: 2026 }
      defenseurs:
        - texte: "Quand l'État dirigeait l'aide sociale à l'enfance, cela ne marchait pas : mieux vaut améliorer l'organisation que la bouleverser."
        - texte: "Il faut renforcer la coordination entre les départements, la justice, l'école, les services sociaux et les forces de sécurité : c'est ce que fait la loi de 2026."
        - texte: "La loi mise sur les solutions familiales, comme l'accueil par un proche de confiance, alors que les familles d'accueil reculent : elles accueillaient 36 % des enfants placés fin 2025, contre 56 % en 2006."
          source: { organisme: "Drees", annee: 2026 }
      critiques:
        - texte: "La loi ne tranche pas qui dirige : les écarts entre départements resteront."
        - texte: "Sans normes d'encadrement ni budget sur plusieurs années, cette loi, comme les précédentes, n'y suffira pas."
        - texte: "Les lois passées restent mal appliquées : en 2025, quatre décrets de la loi de 2022 n'étaient toujours pas publiés."
          source: { organisme: "Assemblée nationale", document: "commission d'enquête sur la protection de l'enfance", annee: 2025 }
  - id: D
    libelle: "Donner plus de liberté aux départements"
    implique: "Les départements gardent l'aide sociale à l'enfance et peuvent adapter les règles nationales à leur territoire. La Constitution interdirait de leur imposer une dépense nouvelle sans financement garanti, et l'État assumerait ses propres missions : psychiatrie des enfants, justice des mineurs, vérification de l'âge des jeunes étrangers arrivés seuls."
    defenseurs: "Au-delà d'un socle fixé par la loi, chaque département doit pouvoir adapter son action aux réalités de son territoire, et l'État doit payer ce qu'il impose."
    critiques: "Plus de liberté creuserait des écarts déjà forts entre départements, alors qu'un enfant en danger doit être protégé de la même façon partout."
    detail:
      chiffrage:
        texte: "Aucun chiffrage n'a été trouvé. Les pratiques varient déjà : selon le département, de 5 % à 55 % des suivis par un éducateur à domicile sont décidés avec l'accord des parents, sans juge."
        source: { organisme: "Drees", annee: 2026 }
      defenseurs:
        - texte: "Au-delà d'un socle fixé par la loi, chaque département doit pouvoir adapter son action aux réalités de son territoire."
        - texte: "Aucune dépense nouvelle ne devrait être imposée aux départements sans un financement identifié et réévalué."
        - texte: "Les manques viennent d'abord de l'État : psychiatrie des enfants saturée, juges des enfants trop peu nombreux, et jeunes étrangers arrivés seuls, qui relèvent de sa politique migratoire, laissés à la charge des départements."
      critiques:
        - texte: "Plus de liberté creuserait des écarts déjà forts : un enfant en danger doit être protégé de la même façon partout."
        - texte: "L'aide aux jeunes qui quittent l'aide sociale à l'enfance ne doit pas dépendre du budget de chaque département."
        - texte: "Les foyers n'ont toujours aucun nombre minimum d'adultes par enfant : il faut plus de règles communes, pas moins."
