# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour garantir les 3 milliards"
    argument: "Une loi sans moyens votés serait une promesse de plus : 3 milliards par an, c'est moins que ce que coûtent les violences."
  - titre: "Pour ne pas s'engager sur 3 milliards"
    argument: "Une loi ne vaut que si les peines sont exécutées : mieux vaut des moyens réels qu'une promesse de 3 milliards non financée."
# Les deux choix de l'autocollant « Et toi ? » de la story : A et B, puis C et D.
story:
  - choix: "3 milliards par an"
    precision: "votés ou programmés"
  - choix: "Sans les 3 milliards"
    precision: "pas à pas, ou d'abord la sanction"
