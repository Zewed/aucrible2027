# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux dont cette fiche découle : docs/etudes/044-depassements-honoraires.md
numero: 44
date: 2026-09-14
theme: sante
question: Faut-il limiter ou interdire les dépassements d'honoraires des médecins ?
titreCourt: "Les dépassements d'honoraires"
contexte:
  - "En secteur 1, le médecin applique le tarif de la Sécurité sociale ; en secteur 2, créé en 1980 et réservé aux médecins qui ont certains titres hospitaliers, il peut le dépasser, et ce supplément est payé par le patient et sa mutuelle, pas par la Sécurité sociale."
  - "Depuis 2017, une option facultative, l'Optam, récompense les médecins du secteur 2 qui modèrent leurs prix ; un peu plus de la moitié de ceux qui y ont droit l'ont signée. Les bénéficiaires de la complémentaire santé solidaire, réservée aux plus modestes, ne paient jamais de dépassement ; en 2021, 44 % des personnes qui y avaient droit ne l'avaient pas demandée."
  - "Deux députés en octobre 2025, puis le Haut Conseil pour l'avenir de l'assurance maladie en juin 2026, ont proposé de les encadrer davantage ; à l'Assemblée, des amendements pour les taxer ont été rejetés en décembre 2025 et en octobre 2026."
chiffres:
  - valeur: "4,7"
    unite: milliards d'euros
    legende: "de dépassements facturés par les médecins spécialistes en 2025, hors généralistes, payés par les patients et leurs mutuelles"
    source: { organisme: HCAAM, document: "Trois scénarios pour une réforme des dépassements d'honoraires", annee: 2026 }
  - valeur: "75 %"
    legende: "des jeunes spécialistes qui s'installent en ville choisissent le secteur 2 en 2024, contre 58 % en 2010"
    source: { organisme: HCAAM, document: "Trois scénarios pour une réforme des dépassements d'honoraires", annee: 2026 }
  - valeur: "40 %"
    legende: "des dépassements sont remboursés en moyenne par les mutuelles ; les patients paient le reste"
    source: { organisme: HCAAM, document: "Trois scénarios pour une réforme des dépassements d'honoraires", annee: 2026 }
options:
  - id: A
    libelle: Les interdire
    implique: "Tous les médecins conventionnés appliquent le tarif de la Sécurité sociale, revalorisé en échange ; le secteur 2 se ferme, d'abord aux nouveaux installés."
    defenseurs: "Le soin doit dépendre du besoin, pas des moyens : des tarifs justes payés par la Sécurité sociale plutôt que 4,7 milliards d'euros de dépassements par an laissés aux patients et à leurs mutuelles."
    critiques: "Selon une simulation, 95 % des spécialistes du secteur 2 perdraient 28 % de leurs honoraires, et même 4 milliards d'euros de hausses de tarifs payées par la Sécurité sociale laisseraient six perdants sur dix."
    axes: { economie: -2 }
  - id: B
    libelle: Les plafonner et rendre le secteur 2 plus sélectif
    implique: "Un dépassement maximum par acte, par exemple 50 % ou 150 % du tarif de la Sécurité sociale, et un secteur 2 ouvert après plusieurs années d'expérience ; certains soins essentiels peuvent être exclus des dépassements."
    defenseurs: "Les dépassements augmentent de plus de 5 % par an et pourraient dépasser 10 milliards d'euros en 2040 : une limite claire protège les patients sans supprimer la liberté des médecins."
    critiques: "Pour certains, un plafond à 150 % du tarif toucherait 13 % des médecins du secteur 2 et réduirait les dépassements de 255 millions d'euros la première année ; pour d'autres, il pénaliserait des spécialités dont les tarifs ne couvrent pas les coûts."
    axes: { economie: -1 }
  - id: C
    libelle: Garder les règles actuelles
    implique: "Le secteur 2 reste ouvert aux médecins qui ont les titres requis ; l'Optam, facultatif, récompense ceux qui modèrent leurs prix, et les patients de la complémentaire santé solidaire restent protégés."
    defenseurs: "Les engagements volontaires ont fait baisser le dépassement moyen de 55 % à 46 % du tarif entre 2012 et 2020 : mieux vaut négocier et revaloriser les tarifs que sanctionner les médecins."
    critiques: "Le dépassement moyen remonte depuis 2020, près d'un médecin concerné sur deux reste hors de l'Optam, et le secteur 2 pourrait concerner neuf spécialistes sur dix en 2040."
    axes: { economie: 1 }
  - id: D
    libelle: Les permettre à tous les médecins
    implique: "Tout médecin conventionné peut fixer ses prix, par exemple dans un secteur unique où seuls les excès sont encadrés ; les patients modestes et les urgences restent au tarif de la Sécurité sociale, comme le proposent des syndicats de médecins."
    defenseurs: "Les tarifs de la Sécurité sociale ne suivent pas le coût d'un cabinet : la liberté des prix rendrait la médecine de ville plus attractive et éviterait que des médecins quittent la convention."
    critiques: "Les patients et leurs mutuelles paieraient davantage, alors que les dépassements sont déjà plus élevés là où les revenus le sont, que des ménages modestes y sont exposés et que les mutuelles en remboursent 40 % en moyenne."
    axes: { economie: 2 }
pourAllerPlusLoin:
  - titre: "HCAAM, Les dépassements d'honoraires des médecins, état des lieux, octobre 2025"
    url: https://www.vie-publique.fr/files/rapport/pdf/300370.pdf
  - titre: "HCAAM, Trois scénarios pour une réforme des dépassements d'honoraires des médecins, juin 2026"
    url: https://www.vie-publique.fr/files/rapport/pdf/303561.pdf
  - titre: "Assemblée nationale, scrutin n° 8955 sur une contribution sur les dépassements, 21/10/2026"
    url: https://www.assemblee-nationale.fr/dyn/17/scrutins/8955
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour limiter les dépassements"
    argument: "Le soin doit dépendre du besoin, pas des moyens : sans limite, les dépassements pourraient dépasser 10 milliards d'euros en 2040."
  - titre: "Pour ne pas les limiter"
    argument: "Les tarifs de la Sécurité sociale ne suivent pas le coût d'un cabinet : sans dépassements, presque tous les spécialistes du secteur 2 perdraient 28 % de leurs honoraires."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Limiter"
    precision: "ou interdire"
  - choix: "Garder"
    precision: "ou les permettre à tous"
# Seuls les candidats sourcés ; les neuf autres sont « inconnue » (voir l'étude, § 4, avec les raisons, notamment pour Ruffin).
positions:
