  # Les Écologistes, « Pour une prospérité écologique », nouveau programme, juillet 2026, ch. 29 « Améliorer la prévention et le parcours de soin », mesure 5 (p. 111 du PDF) : https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf
  tondelier: { option: B, source: "Les Écologistes, « Pour une prospérité écologique », nouveau programme, juillet 2026, ch. 29 « Améliorer la prévention et le parcours de soin », mesure 5 (p. 111 du PDF)", statut: officielle }
  # F. Roussel, programme présidentiel 2022 « La France des jours heureux », proposition 13 (p. 15 du PDF), janvier 2022 : https://d3n8a8pro7vhmx.cloudfront.net/fabienroussel2022/pages/217/attachments/original/1643038967/exe_la_france_des_jours_heureux_LIVRE_stc.pdf
  roussel: { option: A, source: "F. Roussel, programme présidentiel 2022 « La France des jours heureux », proposition 13 (p. 15 du PDF), janvier 2022", statut: deduite }
  # Assemblée nationale, amendement n° 1786 du groupe LFI au PLFSS 2026, 31/10/2025 (interdiction progressive au 1er janvier 2027) ; amendement de repli n° 1841 au PLFSS 2027, 16/10/2026 : https://www.assemblee-nationale.fr/dyn/17/amendements/1907/AN/1786.pdf
  melenchon: { option: A, source: "Assemblée nationale, amendement n° 1786 du groupe LFI au PLFSS 2026, 31/10/2025 (interdiction progressive au 1er janvier 2027) ; amendement de repli n° 1841 au PLFSS 2027, 16/10/2026", statut: deduite }
# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/044-depassements-honoraires.md (chaque chiffre y a sa
# source numérotée, et l'annexe de l'étude dit d'où vient chacun). Le fil : le secteur 2 devient la norme chez les jeunes
# spécialistes, la facture grossit, et quatre choix la répartissent autrement entre patients, mutuelles et Sécurité sociale.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 2f, [2].
    etapes:
      - { quand: En 2010, valeur: "58 %" }
      - { quand: En 2024, valeur: "75 %" }
    chute: "… des jeunes spécialistes qui s'installent en ville choisissent de pouvoir dépasser le tarif de la Sécurité sociale."
  # Pas de « mécanisme » : aucun rapport « X pour 1 » ne résume le sujet.
  ecart:
    # § 2a, [2] : spécialistes hors généralistes, en euros constants ; 2040 est une projection « si rien ne change ».
    titre: "Combien paient les patients et leurs mutuelles ?"
    etapes:
      - { quand: En 2025, valeur: "4,7 milliards €" }
      - { quand: En 2040, valeur: "10 milliards €", projection: true }
    chute: "C'est une projection : plus de 10 milliards si rien ne change, en euros d'aujourd'hui."
    source: "HCAAM, 2026"
  leviers:
    # § 1.3 et 2e, [2]. Les quatre options de la fiche, à égalité ; la chute dit qui paierait.
    titre: "Les dépassements : quatre choix"
    choix:
      - { texte: Les interdire, detail: "tous les médecins au tarif de la Sécurité sociale, revalorisé" }
      - { texte: Les plafonner, detail: "un maximum par acte, et moins de nouveaux médecins autorisés à dépasser" }
      - { texte: Garder les règles, detail: "des engagements volontaires des médecins à modérer leurs prix" }
      - { texte: Les permettre à tous, detail: chaque médecin fixe ses prix }
    chute: "Selon le choix, la facture pèse plus sur les patients et le prix de leur mutuelle, ou plus sur la Sécurité sociale, donc sur les cotisations et les impôts."
    source: "HCAAM, 2026"
  camps: { pour: POUR, contre: CONTRE, objet: une limite aux dépassements }
  # Chaque question oppose deux faits du même rapport (ou du même modèle), et chaque texte dit ce qu'il mesure.
  questions:
    # § 2b, [1] : les deux chiffres viennent du même modèle de la DREES (2019), l'un en part de ce qui reste à payer
    # pour se soigner (pas du revenu : l'étude n'en donne pas), l'autre en euros ; chaque affirmation dit son unité.
    - question: "Les dépassements pèsent-ils sur les plus modestes ?"
      pour: { affirmation: "Autant que sur les plus aisés, en proportion.", chiffre: "20 %", texte: "Selon une estimation, c'est environ 20 % des frais de santé non remboursés des plus modestes, comme chez les plus aisés.", source: "DREES, 2019" }
      contre: { affirmation: "Moins que sur les plus aisés, en euros.", chiffre: "24 €", texte: "Selon une estimation, les plus modestes en paient 24 € par an et par personne, les plus aisés 110 €.", source: "DREES, 2019" }
    # § 2d, [1] : le HCAAM établit les deux, la compensation de tarifs bas dans certaines spécialités et la dispersion dans toutes.
    - question: "Les dépassements compensent-ils des tarifs trop bas ?"
      pour: { affirmation: "Pas en totalité.", chiffre: "1 sur 10", texte: "Chez les chirurgiens qui dépassent, un sur dix demande près du triple du tarif de la Sécurité sociale ou plus.", source: "HCAAM, 2025" }
      contre: { affirmation: "Oui, dans plusieurs spécialités.", chiffre: "40 %", texte: "Ils font 40 % du revenu des psychiatres qui en pratiquent, une spécialité moins bien payée que la moyenne.", source: "HCAAM, 2025" }
    # § 1.3 et 2e, [2] : deux simulations du même rapport ; chaque camp cite le scénario qui l'appuie, et le texte le
    # nomme (le scénario 3, graduel, contre la suppression de tous les dépassements d'un coup, à activité inchangée).
    - question: "Limiter les dépassements, est-ce tenable pour les médecins ?"
      pour: { affirmation: "Oui, en avançant pas à pas.", chiffre: "10 ans", texte: "Une piste : pas de dépassement les dix premières années d'installation, puis un plafond. Les médecins déjà installés gardent leurs prix.", source: "HCAAM, 2026" }
      contre: { affirmation: "Pas sans pertes de revenus.", chiffre: "−28 %", texte: "Si les dépassements disparaissaient d'un coup, 95 % des spécialistes concernés perdraient 28 % de leurs honoraires, selon une simulation.", source: "HCAAM, 2026" }
    # § 2f, [1] : le même indicateur (taux de dépassement moyen) à trois dates, et l'adhésion à l'Optam.
    - question: "Les règles actuelles freinent-elles les dépassements ?"
      pour: { affirmation: "Non, plus depuis 2020.", chiffre: "50 %", texte: "Le dépassement moyen remonte : 50 % du tarif en 2023. Près d'un médecin concerné sur deux est sans engagement.", source: "HCAAM, 2025" }
      contre: { affirmation: "Oui, elles les ont fait baisser.", chiffre: "46 %", texte: "Avec les engagements volontaires de 2012, le dépassement moyen est passé de 55 % du tarif à 46 % en 2020.", source: "HCAAM, 2025" }
