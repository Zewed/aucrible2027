# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour le vote obligatoire"
    argument: "Là où il existe, environ neuf inscrits sur dix votent : presque tout le monde participe au choix, jeunes et modestes compris."
  - titre: "Pour garder le vote libre"
    argument: "Ne pas voter est aussi une liberté : une obligation ne répond pas à la défiance, et une amende pèserait d'abord sur les plus modestes."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Obligatoire"
    precision: "avec ou sans amende"
  - choix: "Libre"
    precision: "comme aujourd'hui"
