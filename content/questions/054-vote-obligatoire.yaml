# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/054-vote-obligatoire.md (tout ce qui suit y est sourcé).
# La reconnaissance du vote blanc a sa propre fiche (055) : celle-ci n'en parle que pour le lien (étude, § 2j).
# Aucune note d'axe : le vote obligatoire est défendu par LFI, le groupe LIOT et des sénateurs de droite et de gauche,
# combattu par le RN, Renaissance, Horizons et les écologistes ; le clivage ne suit ni l'axe économique ni l'axe
# progressiste/conservateur (étude, § 4).
numero: 54
date: 2026-09-04
theme: institutions-democratie
question: "Faut-il rendre le vote obligatoire ?"
titreCourt: "Le vote obligatoire"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/054-vote-obligatoire-UXcML87enRfbqrAbmGgxMWlT28USzI.mp4", duree: "2 min" }
contexte:
  - "En France, voter est un droit et non une obligation : seuls les grands électeurs qui élisent les sénateurs risquent une amende, de 100 euros, s'ils ne votent pas."
  - "Au premier tour de la présidentielle, 26 % des inscrits n'ont pas voté en 2022, contre 19 % en 1981 ; aux municipales de mars 2026, 43 % se sont abstenus."
  - "Une vingtaine de pays obligent à voter, dont la Belgique, le Luxembourg et l'Australie ; en France, aucune des propositions de loi déposées en ce sens n'a été adoptée."
chiffres:
  - valeur: "26,3 %"
    legende: "des inscrits n'ont pas voté au premier tour de la présidentielle de 2022, contre 18,9 % en 1981"
    source: { organisme: Conseil constitutionnel, document: "décision n° 2022-195 PDR", annee: 2022 }
  - valeur: "1 sur 4"
    legende: "parmi les inscrits les plus modestes n'a voté à aucun tour en 2022, trois fois plus que chez les plus aisés"
    source: { organisme: Insee, document: "Insee Première n° 1928", annee: 2022 }
  - valeur: "90 %"
    legende: "des inscrits environ votent aux élections nationales en Belgique, au Luxembourg et en Australie, où voter est obligatoire"
    source: { organisme: Assemblée nationale, document: "rapport n° 1291", annee: 2023 }
options:
  - id: A
    libelle: "Non, garder le vote libre"
    implique: "Voter reste un droit que chacun est libre de ne pas exercer ; la participation passe par d'autres moyens : inscription automatique, procurations plus simples, éducation civique."
    defenseurs: "Ne pas voter est aussi une liberté, et parfois un message : une obligation ne répond pas à la défiance envers la politique, et une amende pèserait d'abord sur les plus modestes, qui s'abstiennent le plus."
    critiques: "Sans obligation, les jeunes et les plus modestes votent beaucoup moins : en 2022, un inscrit modeste sur quatre n'a voté à aucun tour, et les élus sont choisis par ceux qui votent, plus âgés et plus aisés."
  - id: B
    libelle: "Oui, mais sans amende"
    implique: "La loi fait du vote un devoir : qui s'abstient sans motif valable reçoit d'abord un rappel à la loi, puis doit suivre un stage de citoyenneté, comme le prévoyaient des propositions de loi de 2021 et 2023."
    defenseurs: "Affirmer que voter est un devoir civique, comme l'écrit déjà la carte électorale, sans faire payer ceux qui ont le moins : en Belgique, personne n'est sanctionné depuis 2003, et environ neuf inscrits sur dix votent."
    critiques: "Pour les partisans de l'amende, une obligation sans sanction financière change peu la participation ; pour ses opposants, c'est une contrainte de plus, qu'il faudra bien faire respecter."
  - id: C
    libelle: "Oui, avec une amende"
    implique: "Qui s'abstient sans motif valable paie une amende, comme le prévoit la loi en Belgique, au Luxembourg ou en Australie ; une proposition de loi de 2023 prévoyait 11 euros, et jusqu'à 38 euros en cas de retard."
    defenseurs: "Là où l'amende existe, environ neuf inscrits sur dix votent : presque tout le monde, jeunes et modestes compris, participe au choix, et les candidats doivent s'adresser à tous."
    critiques: "L'amende frapperait d'abord ceux qui votent le moins, souvent les plus modestes ; elle est difficile à appliquer (la Belgique n'a sanctionné personne depuis 2003) et fait voter des électeurs peu intéressés."
