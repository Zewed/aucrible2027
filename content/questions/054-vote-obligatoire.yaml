# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/054-vote-obligatoire.md (chaque chiffre y a sa source
# numérotée). Le fil : de moins en moins d'inscrits votent ; l'obligation ferait voter presque tout le monde, mais à quel
# prix et sous quelle contrainte ? Pas de mécanisme : aucun rapport « X pour 1 » ne résume le sujet.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.2, [1] [3] [8] : 18,9 % en 1981, 26,3 % en 2022 (12 824 169 abstentions sur 48 747 876 inscrits) ; municipales
    # 2026 : participation de 57,17 % au premier tour, soit 42,8 % d'abstention.
    etapes:
      - { quand: "En 1981", valeur: "19 %" }
      - { quand: "En 2022", valeur: "26 %" }
    chute: "C'est la part des inscrits qui n'ont pas voté au premier tour de la présidentielle. Aux municipales de mars 2026, ils étaient 43 %."
  ecart:
    # § 2c, [29] : la même mesure (part des inscrits qui ont voté), deux scrutins nationaux successifs ; l'inscription était
    # déjà automatique depuis 2012, seule l'obligation change. La chute nomme les deux scrutins, aux enjeux différents, puis
    # donne le scrutin suivant (85 % en mai 2023, même tableau) : le niveau de 2022 n'était pas propre au référendum.
    # Le contrepoids du camp CONTRE vient juste après, de la même enquête : la question 2 (43 %).
    titre: "Au Chili, l'obligation est revenue"
    etapes:
      - { quand: "Fin 2021, vote libre", valeur: "56 %" }
      - { quand: "En 2022, vote obligatoire", valeur: "86 %" }
    chute: "C'est la part des inscrits qui ont voté, à une présidentielle puis à un référendum sur la Constitution. En mai 2023, ils étaient 85 %."
    source: "Centre d'études publiques, Chili, 2023"
  leviers:
    # Les trois options de la fiche, à égalité et dans l'ordre. § 1.1, 2d et 2h, [9] [12] [14] [19]. La chute : la seule
    # obligation de vote existante en France (article L. 318 du code électoral), payée par le grand électeur qui s'abstient.
    titre: "Faut-il obliger à voter ? Trois réponses"
    choix:
      - { texte: "Laisser le vote libre", detail: "et rendre le vote plus simple : inscription automatique, procurations" }
      - { texte: "Obliger, sans amende", detail: "un devoir inscrit dans la loi, avec un rappel puis un stage de citoyenneté" }
      # L'Australie seule : la Belgique prévoit une amende mais ne sanctionne plus depuis 2003 (§ 2d, question 3).
      - { texte: "Obliger, avec une amende", detail: "payée par qui s'abstient sans excuse, comme en Australie" }
    chute: "Aujourd'hui en France, seuls les grands électeurs qui élisent les sénateurs doivent voter, sous peine d'une amende de 100 euros."
    source: "Code électoral, article L. 318"
  camps: { pour: POUR, contre: CONTRE, objet: "un vote obligatoire" }
  # POUR rassemble les options B et C, CONTRE l'option A. Relu par IA le 28/10/2026 du point de vue de chaque camp, à
  # vérifier par l'auteur.
  questions:
    # § 2b et 2e, [5] [30]. Les deux réponses parlent des mêmes personnes (les moins diplômés ou les plus modestes, ceux qui
    # s'abstiennent le plus). POUR : l'écart mesuré en Flandre une fois l'obligation levée (élections locales de 2024),
    # par un sondage, ce que dit « sondés ». CONTRE : l'étude note l'accord des experts sur la réduction des écarts (§ 2e),
    # donc ce camp n'y répond pas « non » mais par le prix (« pèse sur ceux qui ont le moins ») ; son chiffre vient de
    # l'Insee, relevé sur les listes d'émargement (24,9 % contre 8,2 %), ce que dit le texte.
    - question: "L'obligation rend-elle le vote plus égal ?"
      pour: { affirmation: "Oui : sans elle, les peu diplômés votent moins.", chiffre: "46 %", texte: "Aux élections locales flamandes de 2024, sans obligation, 46 % des peu diplômés sondés n'ont pas voté, contre 25 % des plus diplômés.", source: "Indiville pour la VRT, 2024" }
      contre: { affirmation: "Au prix de sanctions pour les modestes.", chiffre: "1 sur 4", texte: "En 2022, selon l'Insee, un inscrit modeste sur quatre n'a voté à aucun tour, trois fois plus que les plus aisés.", source: "Insee, 2022" }
    # § 2f, [29] : la même enquête, la même question (la raison principale du vote au référendum de 2022), lue sur tous
    # les votants interrogés (17 %) puis sur ceux qui ne votaient jamais (43 %) ; chaque carte dit qui elle compte. La
    # question demande ce que mesure l'enquête, sans juger ce vote (« un vrai choix ») ; chaque affirmation dit ce que
    # son chiffre montre.
    - question: "Avec l'obligation, vote-t-on surtout pour éviter l'amende ?"
      pour: { affirmation: "Non, pas la plupart des votants.", chiffre: "17 %", texte: "Dans la même enquête, 17 % des votants interrogés disaient être venus surtout pour éviter l'amende.", source: "Centre d'études publiques, Chili, 2023" }
      contre: { affirmation: "Souvent, chez ceux qui ne votaient jamais.", chiffre: "43 %", texte: "Au Chili en 2022, 43 % de ceux qui ne votaient jamais disaient être venus surtout pour éviter l'amende.", source: "Centre d'études publiques, Chili, 2023" }
    # § 2d, [12] [13] : deux pays qui ont tous deux une amende dans la loi ; l'un l'envoie à chaque abstentionniste sans
    # excuse (20 dollars australiens, 12,88 euros selon le Sénat, arrondis à 13), l'autre ne poursuit plus. La carte CONTRE
    # dit « ne sanctionne plus », non que l'obligation n'y sert à rien : la Belgique garde environ 90 % de participation
    # (§ 2c), ce que montrent les chiffres de la fiche.
    - question: "Peut-on faire respecter l'obligation ?"
      pour: { affirmation: "Oui, l'Australie fait payer les abstentionnistes.", chiffre: "13 €", texte: "En Australie, chaque électeur qui s'abstient sans excuse reçoit une amende de 20 dollars australiens, environ 13 euros.", source: "Sénat, 2022" }
      contre: { affirmation: "Pas partout : la Belgique ne sanctionne plus.", chiffre: "0", texte: "En Belgique, aucun abstentionniste n'a été sanctionné depuis 2003 : la justice en a fait sa plus basse priorité.", source: "Ministère de l'Intérieur, 2020" }
    # § 2k, [21] : le même sondage et la même question (« pour lutter contre l'abstention, diriez-vous qu'il faut… »), mais
    # deux mesures distinctes : tous les sondés (44 %, vote obligatoire seul ou avec le vote blanc) et les foyers sous
    # 900 euros par personne (35 %, contre 53 % au-dessus de 2 500 euros ; sous-échantillons). L'étude lit ce soutien plus
    # faible « chez ceux qui s'abstiennent le plus ».
    - question: "Les Français veulent-ils le vote obligatoire ?"
      pour: { affirmation: "Plus de quatre sur dix, oui.", chiffre: "44 %", texte: "En 2023, 44 % des sondés le choisissaient pour lutter contre l'abstention, seul ou avec le vote blanc.", source: "Ifop pour Sud Radio, 2023" }
      contre: { affirmation: "Non, et encore moins les plus modestes.", chiffre: "35 %", texte: "Dans le même sondage, 35 % des sondés les plus modestes le choisissaient, contre 53 % des plus aisés.", source: "Ifop pour Sud Radio, 2023" }
