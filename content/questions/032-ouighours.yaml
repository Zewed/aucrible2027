    argument: "On vise les auteurs et ceux qui profitent du travail forcé, pas le peuple chinois ; c'est aux entreprises de prouver que leurs produits sont sans travail forcé."
  - titre: "Pour s'en tenir au dialogue ou à la loi européenne"
    argument: "La loi vise le travail forcé partout, sans cibler un pays, et permet d'interdire un produit sans preuve absolue, sans rupture avec Pékin."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Plus de mesures"
    precision: "contre la Chine"
  - choix: "Pas plus"
    precision: "dialogue ou loi européenne"
