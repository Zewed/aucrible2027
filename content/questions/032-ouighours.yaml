# BROUILLON À VÉRIFIER : rédigé par IA le 27/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/032-ouighours.md (tout ce qui suit y est sourcé).
numero: 32
date: 2026-09-27
theme: europe-international
question: "Que doit faire la France face à la Chine pour les Ouïghours ?"
titreCourt: "La Chine et les Ouïghours"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/032-ouighours-allV6AfSp5nVytbRElzldgQPVBDD8V.mp4", duree: "2 min 20" }
contexte:
  - "En 2022, le Haut-Commissariat des Nations unies aux droits de l'homme a jugé que la détention de nombreux Ouïghours au Xinjiang « peut constituer » des crimes contre l'humanité ; Pékin dénonce des « mensonges » et parle de « centres de formation »."
  - "La même année, l'Assemblée nationale a parlé de « génocide » ; le gouvernement a répondu que ce mot relevait des juges, et l'évaluation des Nations unies ne l'emploie pas."
  - "Depuis 2021, l'Union européenne sanctionne quatre responsables chinois, et la Chine a riposté. Une loi européenne interdira à partir de décembre 2027 les produits fabriqués avec du travail forcé, quel que soit le pays."
chiffres:
  - valeur: "48,7 %"
    legende: "de baisse de la natalité au Xinjiang entre 2017 et 2019, selon les statistiques chinoises"
    source: { organisme: Nations unies (HCDH), document: évaluation sur le Xinjiang, annee: 2022 }
  - valeur: "4"
    unite: responsables
    legende: "chinois et un service de police du Xinjiang sanctionnés par l'Union européenne depuis 2021"
    source: { organisme: Conseil de l'Union européenne, annee: 2021 }
  - valeur: "47"
    unite: milliards d'euros
    legende: "de déficit commercial de la France avec la Chine en 2024, selon les douanes françaises"
    source: { organisme: Douanes (DGDDI), document: note du service économique de Pékin, annee: 2025 }
# Pas de note d'axe : aucune option ne se range clairement sur l'axe économie ou sur l'axe société.
options:
  - id: A
    libelle: "Aucune nouvelle mesure : le dialogue d'abord"
    implique: "La France porte le sujet auprès de Pékin et aux Nations unies, sans nouvelle sanction ni mesure qui vise la Chine."
    defenseurs: "Les sanctions de 2021 ont valu des représailles le jour même, alors que le dialogue a obtenu que la Chine ratifie les deux traités internationaux contre le travail forcé."
    # La 38e session du dialogue date du 17/02/2023 (§ 1.4) : après l'évaluation de 2022, d'où « des années de dialogue » (§ 2e).
    critiques: "Après des années de dialogue entre l'Europe et la Chine, les Nations unies jugeaient en 2022 que les lois à l'origine des détentions restaient en vigueur."
  - id: B
    libelle: "Appliquer l'interdiction européenne des produits du travail forcé"
    implique: "Dès décembre 2027, les produits fabriqués avec du travail forcé sont interdits en Europe, enquête par enquête et quel que soit le pays ; pas de nouvelle sanction."
    defenseurs: "La loi vise le travail forcé partout, sans cibler un pays, et permet d'interdire un produit sans preuve absolue, sans rupture avec Pékin."
    critiques: "Elle ne s'appliquera pas avant décembre 2027, et ce sera aux autorités de réunir les preuves, alors que les contrôles sont entravés au Xinjiang."
  - id: C
    libelle: "Sanctions ciblées et produits du Xinjiang bloqués"
    implique: "En plus de la loi européenne, la France pousse l'Union à sanctionner d'autres responsables et des entreprises, et à bloquer les produits du Xinjiang sauf preuve qu'ils sont sans travail forcé, comme les États-Unis depuis 2022."
    defenseurs: "On vise les auteurs et ceux qui profitent du travail forcé, pas le peuple chinois ; c'est aux entreprises de prouver que leurs produits sont sans travail forcé."
    critiques: "Prouver qu'aucun travail forcé n'entre dans un produit serait presque impossible pour les petites entreprises, et Pékin a riposté aux sanctions de 2021 en sanctionnant dix Européens."
  - id: D
    libelle: "Des sanctions commerciales plus larges"
    implique: "En plus, la France pousse l'Union à restreindre le commerce ou les investissements avec la Chine, par exemple par des droits de douane, tant que la situation ne change pas."
    defenseurs: "Les sanctions ciblées n'ont pas fait changer les lois du Xinjiang ; l'Europe achète à la Chine 305 milliards d'euros de plus qu'elle ne lui vend, un moyen de pression."
    critiques: "En 2024, la France a vendu 24 milliards d'euros à la Chine, qui a visé le cognac français ; une rupture pèserait sur ces ventes, sans garantie pour les Ouïghours."
