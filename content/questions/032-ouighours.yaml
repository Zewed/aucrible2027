# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/032-ouighours.md (chaque chiffre y a sa source
# numérotée ; l'annexe de l'étude relie chaque écran à ses sources). Le fil : ce qu'on sait du Xinjiang, ce que la France
# y engage, les quatre voies possibles, puis quatre questions où chaque camp donne sa meilleure preuve.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1, [1] : 15,88 ‰ en 2017 et 8,14 ‰ en 2019 (statistiques chinoises reprises par le HCDH), arrondis.
    # Explication disputée : modernisation selon Pékin, application coercitive des règles selon le HCDH (§ 1.1, 1.3) ;
    # le HCDH parle d'« indications sérieuses » (§ 146), d'où « de sérieux indices ». Chiffre admis de tous (§ 3).
    etapes:
      - { quand: En 2017, valeur: "16 naissances pour 1 000 habitants" }
      - { quand: En 2019, valeur: "8 pour 1 000" }
    chute: "Au Xinjiang, la région des Ouïghours, selon les chiffres chinois. Pékin y voit la modernisation ; les Nations unies, de sérieux indices d'un contrôle des naissances imposé."
  ecart:
    # § 1.7 et 2d, [18] : selon les douanes françaises ; les douanes chinoises comptent environ 10 milliards en 2024.
    titre: "Combien la France achète-t-elle de plus à la Chine qu'elle ne lui vend ?"
    etapes:
      - { quand: En 2014, valeur: "27 milliards €" }
      - { quand: En 2024, valeur: "47 milliards €" }
    chute: "C'est près de la moitié du déficit commercial de la France : une dépendance pour les uns, un moyen de pression pour les autres."
    source: "Douanes françaises, 2025"
  leviers:
    # § 1.4 à 1.6, [5] [6] [15] [19] : les quatre options de la fiche, à égalité.
    titre: Ce que la France peut faire
    choix:
      - { texte: Dialoguer, detail: "en parler à Pékin et aux Nations unies, sans nouvelle sanction" }
      - { texte: Interdire les produits du travail forcé, detail: "la loi européenne, produit par produit, dès fin 2027" }
      - { texte: Sanctionner des responsables, detail: "et des entreprises, et bloquer les produits du Xinjiang" }
      - { texte: Freiner le commerce avec la Chine, detail: droits de douane ou accords suspendus }
    chute: "Ces quatre voies vont du dialogue à la pression sur le commerce, et peuvent se combiner."
    source: "Sénat, 2023 ; Union européenne, 2024"
  camps: { pour: POUR, contre: CONTRE, objet: de nouvelles mesures }
  questions:
    # § 1.5 et 2c, [5] [7] [10] [13] : sanctions et contre-sanctions du même jour, 22/03/2021.
    - question: Faut-il sanctionner des responsables chinois ?
      pour: { affirmation: "Oui, sans punir toute la population.", chiffre: 4 responsables, texte: "Depuis 2021, quatre responsables du Xinjiang sont interdits d'entrée dans l'Union européenne, et leurs biens y sont gelés.", source: "Union européenne, 2021" }
      contre: { affirmation: "Non, Pékin riposte aussitôt.", chiffre: 10 Européens, texte: "Le jour même, la Chine a sanctionné dix Européens, dont cinq députés européens, et quatre institutions.", source: "Parlement européen, 2025" }
    # § 1.5, 1.6, 2b et 2f, [15] [19] [20].
    - question: L'interdiction européenne suffira-t-elle ?
      pour: { affirmation: "Non, elle arrive tard.", chiffre: "5 ans", texte: "Elle s'appliquera en 2027, cinq ans après le blocage américain des produits du Xinjiang, sauf preuve qu'ils sont sans travail forcé.", source: "Union européenne, 2024 ; douanes américaines, 2022" }
      # L'estimation de l'OIT vaut pour 2021 (§ 1.6) et compte des personnes, pas des produits : d'où « le vise » et non « vise leurs produits ».
      contre: { affirmation: "Oui, elle vise tout le travail forcé.", chiffre: 28 millions, texte: "Dans le monde, le travail forcé touchait 28 millions de personnes en 2021. La loi européenne le vise sans cibler un pays.", source: "Organisation internationale du travail, 2022" }
    # § 1.7 et 2d, [18] : mêmes douanes, même année ; 71 / 24 ≈ 3 (calcul de l'étude).
    - question: Des mesures coûteraient-elles cher à la France ?
      pour: { affirmation: "Elles coûteraient aussi à la Chine.", chiffre: 71 milliards €, texte: "En 2024, la France a acheté 71 milliards d'euros de produits chinois, trois fois ce qu'elle a vendu à la Chine.", source: "Douanes françaises, 2025" }
      contre: { affirmation: "Oui, les ventes françaises seraient menacées.", chiffre: 24 milliards €, texte: "En 2024, la France a vendu 24 milliards d'euros à la Chine, dont 5 en avions et 5 en luxe.", source: "Douanes françaises, 2025" }
    # § 1.1, 1.4, 2c et 2e, [1] [5] [7] : 38e session du dialogue UE-Chine le 17/02/2023 ; lois toujours en vigueur selon le HCDH
    # (§ 144). « Suffit-il » obligeait le camp CONTRE, qui tient aussi pour la loi européenne, à défendre le dialogue seul.
    # Conventions 29 et 105 de l'OIT : condition posée par le président le 19/01/2022 [5], ratifiées selon O. Becht en 2023 [7].
    - question: Le dialogue donne-t-il des résultats ?
      pour: { affirmation: "Non, les lois en cause sont restées.", chiffre: 38 dialogues, texte: "L'Europe et la Chine ont tenu 38 dialogues sur les droits humains. En 2022, les lois à l'origine des détentions demeuraient.", source: "Gouvernement, 2023 ; Nations unies, 2022" }
      contre: { affirmation: "Oui, Pékin a ratifié deux traités.", chiffre: 2 traités, texte: "La Chine a ratifié les deux traités internationaux contre le travail forcé, que Paris exigeait avant un accord d'investissement avec l'Europe.", source: "Gouvernement, 2022 et 2023" }
