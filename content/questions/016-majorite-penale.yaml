cotes:
  - titre: "Pour juger les 16 ans comme des majeurs"
    argument: "À 16 ans, on mesure la portée de ses actes : juger les 16-17 ans comme des adultes protège mieux les victimes et rend la sanction plus dissuasive."
  - titre: "Pour garder l'âge de 18 ans"
    argument: "À 16 ans, on est encore en construction : le droit prévoit une réponse adaptée à l'âge et tournée vers le relèvement éducatif, un principe que le Conseil constitutionnel rattache aux lois fondamentales de la République."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "À 16 ans"
    precision: "comme des majeurs"
  - choix: "À 18 ans"
    precision: "comme aujourd'hui"
