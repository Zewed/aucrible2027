# BROUILLON À VÉRIFIER : rédigé par IA le 26/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/011-fin-de-vie.md (tout ce qui suit y est sourcé).
# La question n'est pas « Faut-il légaliser ? » : la loi a été promulguée le 18/08/2026 (voir l'étude, note de méthode).
numero: 11
date: 2026-10-10
theme: societe
question: Jusqu'où faut-il autoriser l'aide à mourir ?
titreCourt: "L'aide à mourir"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/011-fin-de-vie-WlJkC4PERnR0fIxCaaykxvM13By22Q.mp4", duree: "1 min 50" }
contexte:
  - Depuis 2016, la loi Claeys-Leonetti ouvre le droit à la sédation profonde et continue, mais pas à l'aide à mourir.
  - Une loi promulguée le 18 août 2026 et adoptée par 291 voix contre 241 ouvre l'aide à mourir aux majeurs atteints d'une maladie grave et incurable en phase avancée ou terminale.
  - Le patient s'administre lui-même le produit ; un soignant n'agit que s'il ne le peut pas, et la loi ne s'applique qu'une fois ses décrets publiés.
chiffres:
  - valeur: "291"
    unite: députés
    legende: pour la loi, contre 241, au vote final du 15 juillet 2026
    source: { organisme: Assemblée nationale, document: lecture définitive, annee: 2026 }
  - valeur: "181"
    unite: sénateurs
    legende: "contre le texte, pour 122 : le Sénat l'avait rejeté le 28 janvier 2026"
    source: { organisme: Sénat, document: vote du 28 janvier 2026, annee: 2026 }
  - valeur: "2"
    unite: jours
    legende: de réflexion au minimum avant que le patient confirme sa demande
    source: { organisme: Conseil constitutionnel, document: décision n° 2026-910 DC, annee: 2026 }
  - valeur: "3"
    unite: réserves
    legende: "du Conseil constitutionnel : majeurs sous protection, pharmaciens, établissements privés"
    source: { organisme: Conseil constitutionnel, document: décision n° 2026-910 DC, annee: 2026 }
options:
  - id: A
    libelle: L'abroger
    implique: La loi du 18 août 2026 est abrogée ; on s'en tient à la loi de 2016 (sédation profonde et continue) et au développement des soins palliatifs.
    defenseurs: "La société a besoin de soins palliatifs, pas d'une légalisation de l'euthanasie : il deviendrait plus facile de demander la mort que d'être soigné."
    critiques: Des malades peuvent vouloir arrêter de souffrir et demandent la liberté de choisir leur fin de vie.
    axes: { societe: 2 }
  - id: B
    libelle: La garder telle quelle
    implique: Aide à mourir pour les majeurs, français ou résidents, atteints d'une maladie grave et incurable en phase avancée ou terminale ; le patient s'administre le produit, un soignant n'agit que s'il ne le peut pas.
    defenseurs: "Si nul ne souhaite mourir, certains peuvent vouloir arrêter de souffrir : la loi leur donne ce choix, avec des garde-fous (collège de soignants, délai de réflexion de deux jours)."
    critiques: Les uns y voient un « basculement anthropologique majeur », les autres un texte affaibli par les amendements.
    axes: { societe: -1 }
  - id: C
    libelle: L'étendre à l'euthanasie
    implique: Le patient peut demander qu'un médecin ou un infirmier lui administre le produit, sans devoir d'abord être dans l'incapacité de le faire lui-même.
    defenseurs: Une liberté supplémentaire donnée aux êtres humains pour choisir leur fin de vie.
    critiques: "« L'euthanasie est une boîte de Pandore : une fois ouverte, vous n'arrivez plus à la refermer. »"
    axes: { societe: -2 }
pourAllerPlusLoin:
