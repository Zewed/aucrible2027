    url: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000054706877
  - titre: Conseil constitutionnel, décision n° 2026-910 DC du 14 août 2026
    url: https://www.conseil-constitutionnel.fr/decision/2026/2026910DC.htm
  - titre: Assemblée nationale, texte adopté n° 122 en première lecture, 2025
    url: https://www.assemblee-nationale.fr/dyn/17/textes/l17t0122_texte-adopte-provisoire
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
