# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour en construire davantage"
    argument: "L'éolien est une électricité bas carbone, plus rapide à mettre en service (5 à 8 ans) que de nouveaux réacteurs (2037 au mieux), et il réduit la dépendance aux énergies fossiles importées (64 milliards d'euros en 2024)."
  - titre: "Pour ne plus en construire"
    argument: "Les éoliennes pèsent sur les paysages et la biodiversité, produisent par intermittence et coûtent cher : le nucléaire suffit à décarboner l'électricité."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Davantage"
    precision: "d'éoliennes"
  - choix: "Pas plus"
    precision: "d'éoliennes"
