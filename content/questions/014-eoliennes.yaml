# BROUILLON À VÉRIFIER : rédigé par IA le 26/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/014-eoliennes.md
numero: 14
date: 2026-10-13
theme: ecologie-energie
question: "Faut-il construire davantage d'éoliennes ?"
titreCourt: "Les éoliennes"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/014-eoliennes-SlZFB8j8T8eikBW0BMKgAnSfc8VhNn.mp4", duree: "2 min" }
contexte:
  - "En 2025, l'éolien a produit 9,1 % de l'électricité française, avec 23,9 GW installés à terre et 1,9 GW en mer."
  - "La programmation de l'énergie de février 2026 vise 35 à 40 GW à terre et 15 GW en mer en 2035, en privilégiant le renouvellement des parcs existants."
  - "Cette électricité est bas carbone mais varie avec le vent, et son soutien public comme l'implantation des parcs font débat."
chiffres:
  - valeur: "9,1 %"
    legende: "de l'électricité produite en France en 2025 vient de l'éolien (49,6 TWh)"
    source: { organisme: RTE, document: "Bilan électrique 2025", annee: 2025 }
  - valeur: "23,9"
    unite: GW
    legende: "d'éolien à terre installés fin 2025, auxquels s'ajoutent 1,9 GW en mer"
    source: { organisme: RTE, document: "Bilan électrique 2025", annee: 2025 }
  - valeur: "35 à 40"
    unite: GW
    legende: "d'éolien à terre visés en 2035, contre environ 24 GW en 2025"
    source: { organisme: Gouvernement, document: "Programmation pluriannuelle de l'énergie (décret n° 2026-76)", annee: 2026 }
  - valeur: "15"
    unite: GW
    legende: "d'éolien en mer visés en 2035, contre 1,9 GW fin 2025"
    source: { organisme: Gouvernement, document: "Programmation pluriannuelle de l'énergie (décret n° 2026-76)", annee: 2026 }
options:
  - id: A
    libelle: "Développer davantage l'éolien, à terre et en mer"
    implique: "Rattraper le retard de l'électrification en construisant plus que prévu, en mer comme à terre ; les plus ambitieux visent un mix 100 % renouvelable à terme."
    defenseurs: "L'éolien est une électricité bas carbone, plus rapide à mettre en service (5 à 8 ans) que de nouveaux réacteurs (2037 au mieux), et il réduit la dépendance aux énergies fossiles importées (64 milliards d'euros en 2024)."
    critiques: "Le vent est variable (facteur de charge de 21,4 % à terre en 2025), le soutien public et le réseau coûtent cher (6,2 milliards d'euros de soutien aux renouvelables en métropole en 2025) et les parcs suscitent des oppositions locales."
  - id: B
    libelle: "Poursuivre au rythme de la programmation de l'énergie"
    implique: "35 à 40 GW à terre et 15 GW en mer en 2035, surtout par le renouvellement des parcs existants, en complément d'un nucléaire relancé (six EPR2)."
    defenseurs: "Une trajectoire fixée après consultation, qui donne de la visibilité aux investisseurs et équilibre éolien, solaire et nucléaire sans bouleverser le mix."
    critiques: "Pour les uns, ces objectifs, déjà revus à la baisse, sont insuffisants face au retard d'électrification ; pour les autres, ils engagent trop d'argent public (114 milliards d'euros d'engagements de soutien déjà pris, tous renouvelables confondus)."
  - id: C
    libelle: "Arrêter les aides publiques et ne plus lancer d'appels d'offres"
    implique: "Fin des subventions à l'éolien et au solaire (12 milliards d'euros d'économies annoncées dans un plan), annulation des appels d'offres non attribués, priorité au nucléaire et à l'hydroélectricité."
    defenseurs: "L'électricité éolienne est intermittente et subventionnée : l'argent public doit aller aux sources pilotables comme le nucléaire et l'hydroélectricité, ce qui doit faire baisser la facture."
    critiques: "Arrêter les appels d'offres envoie un signal négatif aux investisseurs et, selon la filière, menacerait 80 000 emplois."
  - id: D
    libelle: "Ne plus construire d'éoliennes et démanteler les parcs en fin de vie"
    implique: "Plus aucun nouveau projet, à terre comme en mer, et démantèlement progressif des parcs existants quand ils arrivent en fin de vie."
    defenseurs: "Les éoliennes pèsent sur les paysages et la biodiversité, produisent par intermittence et coûtent cher : le nucléaire suffit à décarboner l'électricité."
    critiques: "Il faudrait remplacer 9,1 % de l'électricité, alors que les objectifs de 2035 (moins 70 % de pétrole et moins 50 % de gaz) demandent plus d'électricité décarbonée que de nouveaux réacteurs ne pourraient fournir avant 2037 au mieux."
