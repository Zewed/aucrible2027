  # Programme « Travail et salaires » : https://attalpresident.fr/programme/travail-salaires (« la promotion, là où c'est possible, de la semaine en quatre jours ») ; déclaration de politique générale du 30/01/2024 : https://www.lalibre.be/international/europe/2024/01/30/attal-demande-a-ses-ministres-dexperimenter-la-semaine-en-4-jours-dans-leurs-administrations-JPGRGIYUYJDMPKFGSJF4MTOOLQ/
