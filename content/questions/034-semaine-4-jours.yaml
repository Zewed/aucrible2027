# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/034-semaine-4-jours.md (chaque chiffre y a sa source
# numérotée). Le fil : quatre jours, ce n'est pas forcément moins d'heures. Ni mécanisme ni écart : aucun ratio
# « X pour 1 » ni aucune grandeur à deux dates n'éclaire ce débat mieux que les leviers.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.3, [2].
    etapes:
      - { quand: "En 1982", valeur: 39 heures }
      - { quand: "En 2000", valeur: 35 heures }
    chute: "Et demain, quatre jours ?"
  leviers:
    # § 2a et 1.2, [1] [7] : 133 accords sur 150 en 2023 (89 %) gardent les mêmes heures. La chute dit l'année et
    # le périmètre (les accords de semaine de quatre jours, pas tous les accords). Espaces insécables dans « 8 h 45 ».
    titre: "Quatre jours, mais combien d'heures ?"
    choix:
      - { texte: "Laisser chaque entreprise décider", detail: "ni loi, ni aide, ni droit nouveau" }
      - { texte: "4 jours, mêmes heures", detail: "35 heures en journées de 8 h 45" }
      - { texte: Aider les 32 heures, detail: "l'État baisse les cotisations des entreprises qui passent à 32 heures et embauchent" }
      - { texte: 32 heures pour tous, detail: "la loi baisse la durée du travail, sans baisse de salaire" }
    chute: "En 2023, sur 10 accords pour passer à quatre jours, 9 gardaient les mêmes heures."
    source: "Centre d'études de l'emploi et du travail, 2024"
  camps: { pour: POUR, contre: CONTRE, objet: les 32 heures en quatre jours }
  # Chaque réponse compare ce qui se compare : même réforme, même étude ou même année.
  questions:
    # § 2b, [2] [3] [4].
    - question: "Les 35 heures ont-elles créé des emplois ?"
      pour: { affirmation: "Oui, des centaines de milliers.", chiffre: "350 000", texte: "Entre 1998 et 2002, les 35 heures, avec leurs aides, ont ajouté près de 350 000 emplois, selon les estimations de l'Insee.", source: "Insee, 2005" }
      contre: { affirmation: "Moins que promis, et c'est discuté.", chiffre: "700 000", texte: "Le gouvernement en promettait 700 000. Une étude sur l'Alsace-Moselle, où la règle s'appliquait moins, ne trouve pas d'effet mesurable sur l'emploi.", source: "Assemblée nationale, 2014 ; Chemin et Wasmer, 2009" }
    # § 2b, 2e et 3, [2] : les mêmes aides comptées de deux façons, c'est le désaccord lui-même (« brut ou net »).
    # Chaque texte dit son année (2002, 2013) et sa façon de compter, avec les mêmes mots ; le contre parle en premier.
    - question: "Les 35 heures ont-elles coûté cher ?"
      pour: { affirmation: "Moins, une fois les emplois comptés.", chiffre: "2,5 milliards €", texte: "Sur 10,5 milliards d'aides en 2002, il restait 2,5 milliards à payer en comptant les recettes des emplois créés, selon une estimation.", source: "OFCE, 2014" }
      contre: { affirmation: "Oui, des milliards chaque année.", chiffre: "11 à 13 milliards €", texte: "En 2013, les baisses de cotisations des 35 heures coûtaient 11 à 13 milliards par an, avant de compter les emplois créés.", source: "Ministère du Budget, 2014" }
    # § 2c et 2d, [10] : les deux réponses viennent de la même étude, sur un essai à moins d'heures (38 → 34 h).
    # Le contre parle en premier (ABBA) : son texte se lit sans celui du pour.
    - question: "Peut-on faire autant en moins d'heures ?"
      pour: { affirmation: "Oui, dans les essais menés.", chiffre: "56 sur 61", texte: "Au Royaume-Uni, 56 entreprises sur 61 ont poursuivi la semaine de 4 jours après six mois d'essai, sans baisser les salaires.", source: "Autonomy et universités, 2023" }
      contre: { affirmation: "La preuve reste fragile.", chiffre: "23 sur 61", texte: "Au Royaume-Uni, les 61 entreprises de l'essai étaient volontaires, sans groupe de comparaison, et 23 ont fourni leur chiffre d'affaires.", source: "Autonomy et universités, 2023" }
    # § 2j, [17] [19] : deux sondages de 2024, en ligne, auprès d'environ 1 000 personnes, qui ne posent pas la même
    # question : chaque texte dit la sienne, et chaque source nomme qui a commandé le sondage.
    - question: "Les Français veulent-ils travailler moins ?"
      pour: { affirmation: "Oui, si le salaire suit.", chiffre: "70 %", texte: "Dans un sondage, 70 % des Français se disent favorables à 32 heures en quatre jours, payées comme 35 heures.", source: "Ifop pour Politis, 2024" }
      contre: { affirmation: "Pas forcément.", chiffre: "54 %", texte: "Dans un autre sondage, 54 % jugent que la durée moyenne d'un temps plein, 38,7 heures, est juste ce qu'il faut.", source: "Elabe pour Les Échos et l'Institut Montaigne, 2024" }
