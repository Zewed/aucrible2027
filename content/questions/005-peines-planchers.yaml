numero: 5
date: 2026-10-04
theme: securite-justice
question: Faut-il rétablir des peines planchers ?
titreCourt: "Les peines planchers"
contexte:
  - Les peines planchers, créées par la loi du 10 août 2007, fixaient des seuils minimaux de prison pour les récidivistes ; la loi du 15 août 2014 les a abrogées.
  - "Aujourd'hui, aucune peine minimale ne s'impose : le juge choisit la peine en tenant compte des circonstances de l'infraction et de la personnalité de l'auteur."
  - Un texte visant à les rétablir pour certains crimes et délits a été examiné à l'Assemblée en octobre 2024 sans être adopté ; les prisons comptent aujourd'hui 90 020 détenus pour 63 348 places.
chiffres:
  - valeur: 142,1 %
    legende: "densité carcérale au 1er septembre 2026 : 90 020 détenus pour 63 348 places"
    source: { organisme: Ministère de la Justice, document: mesure de l'incarcération, annee: 2026 }
  - valeur: "8 347"
    legende: détenus dorment sur un matelas posé au sol au 1er septembre 2026
    source: { organisme: Ministère de la Justice, document: mesure de l'incarcération, annee: 2026 }
  - valeur: 69 %
    legende: "des récidivistes majeurs étaient condamnés à de la prison ferme en 2016-2020, contre 54 % en 2001-2005"
    source: { organisme: Ministère de la Justice, document: cité à l'Assemblée nationale le 31/10/2024, annee: 2020 }
  - valeur: "9"
    unite: mois
    legende: "de prison ferme en moyenne après l'abrogation de 2014, contre 7,3 à 7,9 mois quand les peines planchers existaient"
    source: { organisme: Ministère de la Justice, document: cité à l'Assemblée nationale le 31/10/2024, annee: 2014 }
options:
  - id: A
    libelle: Non, le juge fixe la peine
    implique: "Le droit actuel est maintenu : aucune peine minimale ne s'impose, et le juge adapte la peine aux faits et à la personne."
    defenseurs: "Chaque situation est différente : le juge doit pouvoir adapter la peine, et le dispositif de 2007-2014 n'a pas réduit la récidive selon la conférence de consensus de 2013."
    critiques: Sans seuil, le système devient imprévisible et inaudible pour les victimes, et la sanction n'est pas assez ferme.
    axes: { societe: -2 }
  - id: B
    libelle: Oui, pour certaines infractions ciblées
    implique: Des peines minimales visent les faits les plus graves, les récidivistes ou les agressions contre les policiers, gendarmes et autres personnes exposées.
    defenseurs: "Un minimum clair pour les faits les plus graves et pour ceux qui récidivent envoie un signal : la société ne tolère pas la récidive."
    critiques: Le dispositif de 2007-2014 n'a pas réduit la récidive selon la conférence de consensus de 2013, et il alourdirait des prisons déjà occupées à 142,1 %.
    axes: { societe: 1 }
  - id: C
    libelle: Oui, pour tous les crimes et délits
    implique: Une peine minimale s'applique à chaque crime et délit.
    defenseurs: Chaque criminel et chaque délinquant doit avoir une sanction certaine, et les victimes doivent être replacées au centre du procès.
    critiques: Un seuil général s'appliquerait aussi aux mineurs sauf précision contraire, un minimum pour les mineurs a déjà été censuré en 2011, et les prisons manqueraient de places.
    axes: { societe: 2 }
