    url: https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/seance/session-ordinaire-de-2024-2025/troisieme-seance-du-jeudi-31-octobre-2024.pdf
  - titre: Ministère de la Justice, personnes détenues au 1er octobre 2026
    url: https://www.justice.gouv.fr/documentation/etudes-et-statistiques/au-1er-octobre-2026-7-personnes-detenues
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour des peines minimales"
    argument: "Un minimum clair pour les faits les plus graves et pour ceux qui récidivent envoie un signal : la société ne tolère pas la récidive."
  - titre: "Pour que le juge décide"
    argument: "Chaque situation est différente : le juge doit pouvoir adapter la peine aux faits et à la personne."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Peines planchers"
    precision: "au moins pour les faits graves"
  - choix: "Pas de minimum"
    precision: "le juge décide"
positions:
  # https://www.edouardphilippe.fr/priorites/pour-une-france-plus-sure (« Mettre en place des peines planchers pour les infractions les plus graves »)
  philippe: { option: B, source: "edouardphilippe.fr, Pour une France plus sûre, 2026", statut: officielle }
  # https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-veut-renverser-la-table-avec-une-profonde-reforme-constitutionnelle (« peines minimales pour certains crimes et délits graves »)
  retailleau: { option: B, source: "Public Sénat, 03/09/2026", statut: officielle }
