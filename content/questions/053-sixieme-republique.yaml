  le-pen: { option: C, source: "Programme 2022 (Public Sénat, 13/04/2022) ; plan du RN pour un référendum constitutionnel par l'article 11 (AFP, Sud Radio, 05/09/2026)", statut: deduite }
  # Proposition de résolution LFI n° 788, 21/01/2025 ; L'Avenir en commun 2027 : https://questions.assemblee-nationale.fr/dyn/17/textes/l17b0788_proposition-resolution.pdf
