# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/053-sixieme-republique.md (chaque chiffre y a sa
# source numérotée ; tableau en annexe de l'étude). Le fil : une Constitution qui dure depuis 1958, révisée 25 fois ;
# depuis 2022, une Assemblée sans majorité ; faut-il la changer, la réviser ou la garder ?
# Pas de mécanisme : aucun rapport « X pour 1 » ne résume le sujet.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1, [2] [3] : décompte du Conseil constitutionnel (14 textes de 1791 à 1946, puis celui de 1958).
    etapes:
      - { quand: "De 1791 à 1946", valeur: "14 Constitutions" }
      - { quand: "Depuis 1958", valeur: "Une seule" }
    chute: "Celle de 1958 a été révisée 25 fois, la dernière en 2024."
  ecart:
    # § 2b, [4] : chiffres officiels par législature (2017-2022 : XVe ; 2022-2024 : XVIe ; 1988-1993 : IXe).
    titre: "Combien de fois le 49.3 ?"
    etapes:
      - { quand: "De 2017 à 2022", valeur: "1 fois" }
      - { quand: "De 2022 à 2024", valeur: "23 fois" }
    # « en cinq ans » : 39 recours sur cinq ans (IXe législature), 23 sur deux ans (XVIe) : on compare à durée connue.
    chute: "Les gouvernements à la majorité étroite l'utilisent le plus : 39 fois en cinq ans, de 1988 à 1993."
    source: "Assemblée nationale, 2024"
  leviers:
    # Les quatre options de la fiche, à égalité et dans l'ordre ; B et C disent « la réviser », pour qu'on voie qu'elles
    # gardent le texte de 1958. § 1.2, 2e et 3 (consensus), [1] [3] : la chute dit l'obstacle de chaque camp, le Sénat
    # pour une révision (article 89), l'absence de constituante dans la Constitution pour une nouvelle.
    titre: "Que faire de la Constitution ? Quatre réponses"
    choix:
      - { texte: "En écrire une nouvelle", detail: "par une assemblée élue ou tirée au sort, puis un référendum" }
      - { texte: "La réviser pour le Parlement", detail: "un président moins puissant, le 49.3 supprimé ou limité" }
      - { texte: "La réviser pour le référendum", detail: "sur tous les sujets, et pour certains un mandat de sept ans" }
      - { texte: "La garder telle qu'elle est", detail: "changer les pratiques, pas le texte" }
    chute: "Pour la réviser, l'Assemblée et le Sénat doivent voter le même texte. La Constitution ne prévoit pas d'assemblée pour en écrire une nouvelle."
    source: "Constitution de 1958, article 89"
  camps: { pour: POUR, contre: CONTRE, objet: "une nouvelle Constitution" }
  # POUR rassemble l'option A, CONTRE les options B, C et D (garder la Constitution de 1958, révisée ou non) : chaque
  # réponse CONTRE vaut pour les trois. Les partisans de B partagent les critiques POUR sur le 49.3, mais pas la
  # réécriture : les questions 2 et 3 demandent donc si le 49.3 et la dissolution sont une raison de changer de
  # Constitution, pas s'ils sont bons. Relu par deux relecteurs, l'un pour une nouvelle Constitution, l'autre contre.
  questions:
    # § 2f, [13] : la même question du même sondage (janvier 2026), ses deux côtés ; « ni le CEVIPOF ni Odoxa ne disent
    # quel régime les sondés mettent derrière changer de Constitution » (§ 2f).
    - question: "Les Français veulent-ils changer de Constitution ?"
      pour: { affirmation: "Oui, plus d'un sur deux.", chiffre: "58 %", texte: "Dans un sondage de janvier 2026, 58 % des Français voulaient changer de Constitution et de régime.", source: "CEVIPOF et OpinionWay, 2026" }
      contre: { affirmation: "Pas tous : près d'un sur trois dit non.", chiffre: "32 %", texte: "Dans le même sondage, 32 % ne voulaient pas en changer. La question ne disait pas quel régime mettre à la place.", source: "CEVIPOF et OpinionWay, 2026" }
    # § 1.2, 1.3 et 2b, [1] [4] : la réponse CONTRE vaut pour B (le réviser) comme pour C et D (le garder) ; la limite
    # de 2008 (budgets sans limite, un autre texte par session) est celle du texte en vigueur.
    - question: "Le 49.3 est-il une raison de changer de Constitution ?"
      pour: { affirmation: "Oui, des textes passent sans vote.", chiffre: "23 fois", texte: "De 2022 à 2024, le gouvernement a utilisé 23 fois le 49.3 pour faire adopter des textes sans vote des députés.", source: "Assemblée nationale, 2024" }
      contre: { affirmation: "Non, une révision peut le changer.", chiffre: "25 révisions", texte: "Révisée 25 fois depuis 1958, la Constitution a limité le 49.3 en 2008 aux budgets et à un autre texte par session.", source: "Assemblée nationale, 2024" }
    # § 2c, [1] [5] [11] [12] : les mêmes six dissolutions des deux côtés. La question porte sur la dissolution, pas
    # sur tous les pouvoirs du président, que B veut réduire par une révision.
    - question: "La dissolution est-elle une raison de changer de Constitution ?"
      pour: { affirmation: "Oui, le président la décide seul.", chiffre: "6 fois", texte: "Le président peut dissoudre l'Assemblée sans l'accord du gouvernement. Il l'a fait six fois depuis 1958.", source: "Constitution ; Sénat, 2026" }
      contre: { affirmation: "Non, les électeurs ont le dernier mot.", chiffre: "2 sur 6", texte: "Après deux des six dissolutions, en 1997 et en 2024, le camp du président n'a pas gagné les élections.", source: "Public Sénat ; ministère de l'Intérieur, 2024" }
    # § 2e et 2g, [34] [35] [36] : deux référendums sur une Constitution écrite par des élus, en part des votants ;
    # chaque texte dit qui l'a écrite (les Cortes élues en 1977, le Parlement espagnol ; une convention élue au Chili).
    - question: "Une nouvelle Constitution peut-elle être adoptée ?"
      pour: { affirmation: "Oui, l'Espagne l'a fait.", chiffre: "88 %", texte: "En 1978, 88 % des votants espagnols ont approuvé la Constitution écrite par le Parlement élu en 1977.", source: "Larousse, 1979" }
      contre: { affirmation: "Pas toujours : le Chili a dit non.", chiffre: "62 %", texte: "En 2022, 62 % des votants chiliens ont rejeté le projet d'une assemblée élue pour l'écrire. Le suivant a été rejeté en 2023.", source: "Service électoral du Chili, 2022-2023" }
