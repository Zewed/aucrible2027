# BROUILLON À VÉRIFIER : rédigé par IA le 28/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/053-sixieme-republique.md (tout ce qui suit y est sourcé).
# Pas de doublon avec les fiches 010 (référendum d'initiative citoyenne) et 021 (proportionnelle) : celle-ci porte sur la
# Constitution elle-même. Aucune note d'axe, comme pour 010 et 021 : la question oppose des façons de répartir le pouvoir
# (président, Parlement, peuple), ni plus de redistribution ou de marché, ni progressiste ou conservateur ; une note
# « société » rangerait la nouvelle Constitution à gauche et le référendum à droite, et dupliquerait le clivage des autres
# fiches sur le plateau.
numero: 53
date: 2026-09-05
theme: institutions-democratie
question: "Faut-il changer de Constitution ?"
titreCourt: "Changer de Constitution"
contexte:
  - "La Constitution du 4 octobre 1958 fonde la Ve République et a été révisée 25 fois. Le président, élu pour cinq ans, nomme le Premier ministre et peut dissoudre l'Assemblée nationale."
  - "Depuis 2022, aucun bloc n'a la majorité absolue à l'Assemblée. Le 49.3, qui fait adopter un texte sans vote sauf si les députés renversent le gouvernement, a servi 23 fois de 2022 à 2024 ; en décembre 2024, un gouvernement a été renversé, pour la première fois depuis 1962."
  - "Les projets vont d'une nouvelle Constitution, écrite par une assemblée constituante, à des révisions ciblées pour renforcer le Parlement ou le référendum."
chiffres:
  - valeur: "25"
    unite: révisions
    legende: "de la Constitution de 1958, la dernière en 2024 pour la liberté de recourir à l'avortement"
    source: { organisme: Assemblée nationale, document: "fiche de synthèse n° 55, La révision de la Constitution", annee: 2024 }
  - valeur: "23"
    unite: fois
    legende: "le 49.3 a été utilisé de 2022 à 2024, sans majorité absolue, contre une fois de 2017 à 2022"
    source: { organisme: Assemblée nationale, document: "fiche de synthèse n° 64, La mise en cause de la responsabilité du Gouvernement", annee: 2024 }
  - valeur: "58 %"
    legende: "des Français estiment qu'il faudrait changer de Constitution et de régime politique, 32 % non (sondage en ligne auprès de 3 166 inscrits)"
    source: { organisme: "CEVIPOF, OpinionWay", document: "Baromètre de la confiance politique, vague 17", annee: 2026 }
options:
  - id: A
    libelle: "Changer de Constitution"
    implique: "Une nouvelle Constitution remplace celle de 1958 : selon les projets, une assemblée constituante, élue, tirée au sort ou les deux, l'écrit, puis le peuple l'approuve par référendum. Le gouvernement dépend de l'Assemblée et le président perd son rôle central."
    defenseurs: "Le pouvoir est trop concentré entre les mains du président : une Constitution écrite avec les citoyens rendrait le premier rôle au Parlement, comme en Allemagne, et pourrait rétablir une confiance au plus bas, 20 % pour l'Assemblée."
    critiques: "Réécrire toute la Constitution ouvre des années d'incertitude quand le pays cherche de la stabilité ; lancer le processus par un référendum, sans le vote du Parlement, est contesté en droit, et au Chili, deux projets écrits par des assemblées élues ont été rejetés."
  - id: B
    libelle: "La réviser pour renforcer le Parlement"
    implique: "La Constitution de 1958 reste, mais elle est révisée : le 49.3 est supprimé ou limité, le Premier ministre est investi par l'Assemblée, et les pouvoirs propres du président, comme les nominations, sont réduits."
    defenseurs: "On peut rééquilibrer les pouvoirs sans tout réécrire : de 2022 à 2024, le 49.3 a fait adopter des textes sans vote 23 fois, et les députés doivent retrouver le dernier mot sur les lois et les nominations."
    critiques: "Sans 49.3 ni majorité stable, un gouvernement peut ne plus réussir à faire voter son budget ; et toute révision doit passer par le Sénat, qui a rejeté en 2026 un texte réduisant les pouvoirs du président."
  - id: C
    libelle: "La réviser pour renforcer le référendum"
    implique: "La Constitution de 1958 reste et le président garde ses pouvoirs, mais le peuple est plus souvent consulté : référendum ouvert à tous les sujets, y compris la Constitution ; selon les projets, mandat de sept ans et référendum pour passer outre une censure du Conseil constitutionnel."
    defenseurs: "« La souveraineté nationale appartient au peuple » : quand l'Assemblée ne parvient plus à trancher, c'est au peuple de décider, alors qu'aucun référendum national n'a eu lieu depuis 2005 et que 79 % des Français veulent y recourir plus souvent."
    critiques: "Passer outre le juge constitutionnel affaiblirait la protection des libertés, selon des constitutionnalistes ; et réviser la Constitution par référendum sans le vote du Sénat est une pratique contestée en droit depuis 1962."
  # Aucun candidat n'y est rangé avec une source (étude, § 4), mais l'option est défendue dans le débat
  # (« moins on la touche, mieux on se porte », J.-P. Raffarin) et 32 % des sondés du CEVIPOF ne veulent pas changer.
  - id: D
    libelle: "La garder telle qu'elle est"
    implique: "L'équilibre des pouvoirs ne change pas : le président, le gouvernement et l'Assemblée gardent leurs règles ; on change les pratiques et les lois ordinaires, comme le mode de scrutin, pas la Constitution."
    defenseurs: "« Moins on la touche, mieux on se porte » : la Constitution de 1958 a tenu face à une Assemblée sans majorité et à la censure d'un gouvernement en 2024 ; la crise vient des divisions politiques, qu'aucun texte ne fera disparaître."
    critiques: "Garder le texte tel quel ne répond pas à une défiance record : 20 % des Français font confiance à l'Assemblée, 22 % à l'institution présidentielle, et 58 % disent qu'il faudrait changer de Constitution."
