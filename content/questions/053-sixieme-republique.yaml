  - titre: "CEVIPOF, Baromètre de la confiance politique, vague 17, 2026"
    url: https://www.sciencespo.fr/cevipof/sites/sciencespo.fr.cevipof/files/Barometre_confiance_CEVIPOFVague17_fev2026_vd1.pdf
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour une nouvelle Constitution"
    argument: "Le pouvoir est trop concentré entre les mains du président : une Constitution écrite avec les citoyens rendrait le premier rôle au Parlement."
  - titre: "Pour garder celle de 1958"
    argument: "Réécrire toute la Constitution ouvre des années d'incertitude : on peut la réviser sur des points précis, ou la garder, sans tout remettre en jeu."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Changer"
    precision: "de Constitution"
  - choix: "Garder"
    precision: "celle de 1958, révisée ou non"
