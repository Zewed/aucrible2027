# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/030-soldats-ukraine.md (chaque chiffre y a sa source
# numérotée). Le fil : la force est prête sur le papier mais attend un cessez-le-feu ; quatre réponses possibles.
# Ni mécanisme (aucun rapport « X pour 1 » ne s'applique) ni écart (aucune grandeur à deux dates n'éclaire le débat).
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.2, [6] [8] [25] [27].
    etapes:
      - { quand: "En septembre 2025", valeur: "26 pays engagés" }
      - { quand: "Aujourd'hui", valeur: "0 soldat déployé" }
    chute: "La force s'entraîne hors d'Ukraine : elle attend un cessez-le-feu."
  leviers:
    # Les quatre options de la fiche, à égalité. § 1.2, 1.3 et 2 (enjeu 1), [2] [4] [18] [19].
    titre: "Envoyer des soldats ? Quatre réponses"
    choix:
      - { texte: "Aucun soldat", detail: "pas de troupes françaises en Ukraine, même après un cessez-le-feu" }
      - { texte: "Des casques bleus", detail: "une force des Nations unies, acceptée par les deux camps" }
      - { texte: "La force européenne", detail: "des soldats loin du front, après un cessez-le-feu" }
      - { texte: "Des soldats tout de suite", detail: "pour déminer ou produire des armes, sans combattre" }
    chute: "Au fond : qui garantit la paix, et à quel risque ?"
    source: "Élysée, 2026 ; Assemblée nationale, 2024 et 2025"
  camps: { pour: POUR, contre: CONTRE, objet: "l'envoi de soldats français" }
  # Chaque réponse compare ce qui se compare ; les deux sondages de la dernière question sont du même mois et le texte
  # dit qu'ils ne posent pas la même question. Relu par IA le 28/10/2026 en deux relectures opposées (pour l'envoi,
  # puis contre), à vérifier par l'auteur.
  questions:
    # Enjeu 2 (« une protection, ou un risque d'entraîner la France dans une guerre »), [1] [3] [4] [10] [11] [34].
    - question: "Nos soldats, une protection ou un danger ?"
      pour: { affirmation: "Une protection, loin des combats.", chiffre: "800 000", texte: "L'armée ukrainienne, prévue à 800 000 soldats, resterait en première ligne. Les soldats alliés, placés loin des combats, dissuaderaient la Russie.", source: "Élysée, janvier 2026" }
      contre: { affirmation: "Un danger : la Russie les viserait.", chiffre: "2 puissances nucléaires", texte: "Pour Moscou, ces soldats seraient des cibles, même après un accord de paix. La France et la Russie ont l'arme nucléaire.", source: "Ministère russe des Affaires étrangères, janvier et juillet 2026" }
    # Enjeu 3, [2] [4] [12]. La position de Donald Trump date de 2025 (IRIS), d'où le passé composé ; la déclaration de
    # Paris de 2026 parle d'un soutien américain « proposé », sans précision, et l'étude range « pas de soldats américains
    # au sol » dans le consensus (§ 3).
    - question: "Les États-Unis seraient-ils à nos côtés ?"
      pour: { affirmation: "Oui, pour surveiller le cessez-le-feu.", chiffre: "35 pays", texte: "Les 35 pays de la coalition ont validé un plan où les États-Unis dirigeraient la surveillance du cessez-le-feu.", source: "Déclaration de Paris, janvier 2026" }
      contre: { affirmation: "Pas avec des soldats sur le terrain.", chiffre: "0 soldat américain", texte: "Donald Trump a exclu d'envoyer des soldats américains au sol. Le plan évoque un soutien « proposé », sans dire lequel.", source: "IRIS, septembre 2025 ; déclaration de Paris, janvier 2026" }
    # § 1.4 et enjeu 8, [16].
    - question: "Le Parlement aura-t-il son mot à dire ?"
      pour: { affirmation: "Oui, au bout de quatre mois.", chiffre: "4 mois", texte: "Si l'opération dure plus de quatre mois, la Constitution oblige le gouvernement à obtenir l'accord du Parlement pour continuer.", source: "Constitution, article 35 (2008)" }
      contre: { affirmation: "Pas avant le départ des soldats.", chiffre: "3 jours", texte: "Le gouvernement informe le Parlement au plus tard trois jours après le début de l'opération. Aucun vote n'est obligatoire.", source: "Constitution, article 35 (2008)" }
    # Enjeu 6, [21] [22].
    - question: "Les Français sont-ils d'accord ?"
      pour: { affirmation: "Oui, une fois la paix signée.", chiffre: "67 %", texte: "Dans un sondage Elabe, 67 % approuvaient l'envoi de soldats pour garantir la paix après un accord avec la Russie.", source: "Elabe, mars 2025" }
      contre: { affirmation: "Non, selon un autre sondage.", chiffre: "65 %", texte: "Le même mois, l'institut CSA posait une autre question : 65 % refusaient l'envoi de militaires français dans la coalition des volontaires.", source: "CSA, mars 2025" }
