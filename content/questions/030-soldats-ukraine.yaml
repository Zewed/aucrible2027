# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour envoyer des soldats"
    argument: "Des soldats alliés sur place dissuadent la Russie de reprendre la guerre : sans eux, un cessez-le-feu reposerait sur l'armée ukrainienne et sur la parole de la Russie."
  - titre: "Contre, ou seulement avec l'ONU"
    argument: "La Russie, puissance nucléaire, dit qu'elle traiterait toute unité occidentale en Ukraine comme une cible : y envoyer des soldats exposerait la France à une guerre."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Oui"
    precision: "envoyer des soldats"
  - choix: "Non"
    precision: "ou seulement avec l'ONU"
