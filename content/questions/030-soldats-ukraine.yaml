# BROUILLON À VÉRIFIER : rédigé par IA le 27/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/030-soldats-ukraine.md (tout ce qui suit y est sourcé).
# Distincte de la fiche 009 (livraisons d'armes) : celle-ci porte sur l'envoi de soldats.
numero: 30
date: 2026-09-25
theme: europe-international
question: "Faut-il envoyer des soldats français en Ukraine pour garantir un cessez-le-feu ?"
titreCourt: "Des soldats en Ukraine"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/030-soldats-ukraine-5FFtogukGvcSnrovTOcC1SSMlxrPc3.mp4", duree: "2 min" }
contexte:
  - "Lancée en 2025 par la France et le Royaume-Uni, la coalition des volontaires prépare une force qui irait en Ukraine après un cessez-le-feu, loin de la ligne de front, si Kiev le demande."
  - "En janvier 2026, ses 35 pays ont validé ce plan : la France pourrait y envoyer « plusieurs milliers » de soldats, et les États-Unis surveilleraient le cessez-le-feu."
  - "La Russie dit qu'elle traiterait ces soldats comme des cibles, et la guerre continue : aucun soldat de cette force n'est déployé."
chiffres:
  - valeur: "26"
    unite: pays
    legende: "se sont engagés en septembre 2025 à contribuer à la force après un cessez-le-feu, sur terre, en mer ou dans les airs"
    source: { organisme: Élysée, document: réunion de la coalition des volontaires, annee: 2025 }
  - valeur: "800 000"
    unite: soldats
    legende: "le format prévu de l'armée ukrainienne, qui resterait la première ligne de défense"
    source: { organisme: Élysée, document: sommet de la coalition des volontaires, annee: 2026 }
  - valeur: "4"
    unite: mois
    legende: "au-delà, le Parlement doit autoriser la prolongation d'une intervention à l'étranger ; avant, aucun vote n'est obligatoire"
    source: { organisme: Constitution, document: article 35, annee: 2008 }
# Aucune note de plateau : la question ne se range ni sur l'axe économique ni sur l'axe sociétal.
options:
  - id: A
    libelle: "Non, aucun soldat en Ukraine"
    implique: "La France n'envoie aucun soldat sur le sol ukrainien, même après un cessez-le-feu, et soutient la paix par d'autres moyens."
    defenseurs: "La Russie, puissance nucléaire, dit qu'elle traiterait toute unité occidentale en Ukraine comme une cible : y envoyer des soldats exposerait la France à une guerre."
    critiques: "Sans force alliée sur place, un cessez-le-feu reposerait sur l'armée ukrainienne et sur la parole de la Russie."
  - id: B
    libelle: "Seulement sous mandat de l'ONU"
    implique: "Des soldats français pourraient partir dans une force de paix des Nations unies, acceptée par les deux camps, mais pas dans la force de la coalition."
    defenseurs: "Une force de l'ONU garantirait la paix sans faire entrer la France dans la guerre, et sans dépendre des promesses de Donald Trump."
    critiques: "La Russie peut bloquer tout mandat au Conseil de sécurité, où elle a un droit de veto, et des forces d'observation, comme au Liban, ont peu garanti la paix."
  - id: C
    libelle: "Oui, après un cessez-le-feu"
    implique: "La France participe à la force de la coalition des volontaires : plusieurs milliers de soldats, loin de la ligne de front, une fois les combats arrêtés."
    defenseurs: "Des soldats alliés sur place dissuadent la Russie de reprendre la guerre : pour garantir un cessez-le-feu, « la seule solution c'est l'envoi de troupes sur le terrain »."
    critiques: "La Russie dit qu'elle en ferait des cibles, et le soutien américain est « proposé », sans précision : sans garantie ferme, des soldats français seraient exposés face à une puissance nucléaire."
  # D garde le pôle de l'échelle ; l'étude ne lui trouve aucun candidat en 2026 et la fonde sur les déclarations
  # gouvernementales de février 2024 (§ 1.2, [19]), d'où la date dans « implique ». À retirer si aucun candidat ne la porte.
  - id: D
    libelle: "Oui, sans attendre un cessez-le-feu"
    implique: "Comme l'évoquait le gouvernement en 2024, des soldats français iraient dès maintenant en Ukraine pour des missions sans combat : déminage, cyberdéfense, production d'armes."
    defenseurs: "Ces missions aideraient l'Ukraine tout de suite sans faire entrer la France en guerre, et laisseraient la Russie dans l'incertitude : « rien ne doit être exclu »."
    critiques: "Selon Vladimir Poutine, toute force occidentale présente pendant les combats serait une « cible légitime » : la France risquerait d'entrer en guerre avec une puissance nucléaire."
