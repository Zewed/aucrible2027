# Les deux choix de l'autocollant « Et toi ? » de la story : A et B d'un côté, C et D de l'autre.
story:
  - choix: "Pas d'obligation en plus"
    precision: "la règle de 2026, ou le libre partage"
  - choix: "Plus de congé obligatoire"
    precision: "pour le père, jusqu'à égaler la mère"
# Positions sourcées seulement (étude, § 4). Inconnues : Lisnard, Arthaud.
# Pistes à vérifier avant tout ajout : Lisnard (déplafonner le quotient familial, selon des comparateurs, non vérifié) ;
# Arthaud (Lutte ouvrière, 12/08/2026, juge les indemnités « bien faibles » sans dire si le congé du père doit être plus long
# ou obligatoire).
