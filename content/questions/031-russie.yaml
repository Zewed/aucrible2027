    url: https://www.touteleurope.eu/l-ue-dans-le-monde/guerre-en-ukraine-quelles-sanctions-de-l-ue-contre-la-russie/
  - titre: "Institut Jacques Delors, soutien de l'UE à l'Ukraine en 2026 : la saga du prêt de réparation, 2026"
    url: https://institutdelors.eu/content/uploads/2026/02/PP320_EU_support_Ukraine_2026_Montoya_FR.pdf
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
  - titre: "Pour maintenir ou durcir les sanctions"
    argument: "Elles gardent la pression sur Moscou et un levier pour négocier la paix."
  - titre: "Pour les alléger ou les lever"
    argument: "Les sanctions coûtent plus cher aux Européens qu'à la Russie, qui vend ailleurs."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Durcir"
    precision: "ou maintenir"
  - choix: "Alléger"
    precision: "ou lever"
positions:
  # Europe 1 avec AFP, 02/08/2022 : https://www.europe1.fr/politique/le-pen-reclame-labandon-des-sanctions-contre-la-russie-qui-ne-servent-a-rien-4126228
  # Aucune déclaration de 2025-2026 sur la levée trouvée ; communiqué du 19/09/2026, sans mot sur les sanctions :
