# BROUILLON À VÉRIFIER : rédigé par IA le 27/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/031-russie.md (tout ce qui suit y est sourcé).
numero: 31
date: 2026-09-26
theme: europe-international
question: "Faut-il durcir, maintenir ou lever les sanctions contre la Russie ?"
titreCourt: "Les sanctions contre la Russie"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/031-russie-10lkKbyqfN8GNxcSrkdnNTKGalBoyW.mp4", duree: "2 min" }
contexte:
  - "Depuis l'invasion de l'Ukraine en 2022, l'Union européenne a décidé 21 séries de sanctions contre la Russie, après de premières mesures en 2014 ; chacune exige l'accord des 27."
  - "Environ 210 milliards d'euros de la banque centrale russe sont bloqués en Europe : leurs intérêts servent déjà à aider l'Ukraine, mais l'argent lui-même n'a pas été saisi."
  - "Les achats de gaz russe livré par bateau doivent cesser d'ici janvier 2027 ; en 2026, la guerre en Iran a fait monter le prix du gaz, et des discussions de paix doivent reprendre en novembre."
chiffres:
  - valeur: "21"
    unite: séries de sanctions
    legende: "décidées par l'Union européenne contre la Russie depuis février 2022"
    source: { organisme: Toute l'Europe, document: les sanctions de l'UE contre la Russie, annee: 2026 }
  - valeur: "210"
    unite: milliards d'euros
    legende: "de la banque centrale russe bloqués dans l'Union européenne, dont 19 en France"
    source: { organisme: Toute l'Europe, document: les avoirs russes gelés en Europe, annee: 2026 }
  - valeur: "3,2"
    unite: milliards d'euros
    legende: "de gaz russe achetés par la France en 2025, plus des trois quarts de ce qu'elle achète à la Russie"
    source: { organisme: DG Trésor, document: relations économiques France-Russie, annee: 2026 }
options:
  - id: A
    libelle: Les lever
    implique: "La France demande la fin des sanctions européennes, y compris sur l'énergie, et relance la coopération avec Moscou."
    defenseurs: "Les sanctions coûtent plus cher aux Européens qu'à la Russie, qui vend ailleurs, et la paix en Europe passe par un partenariat avec elle."
    critiques: "Les lever sans accord de paix rendrait à Moscou ses revenus européens et priverait l'Europe d'un levier pour négocier la paix."
  - id: B
    libelle: "Garder les sanctions ciblées, lever les autres"
    implique: "On lève les sanctions sur l'énergie et le commerce, mais on garde celles qui visent des dirigeants, des proches du pouvoir et le matériel militaire."
    defenseurs: "On vise les responsables de la guerre sans faire payer aux ménages et aux entreprises la hausse de l'énergie et la perte de marchés."
    critiques: "Rouvrir le commerce de l'énergie rendrait à l'État russe des recettes qui, pour ses critiques, financent sa guerre."
  - id: C
    libelle: Les maintenir
    implique: "Les sanctions actuelles restent en place jusqu'à un accord de paix ; l'argent russe reste bloqué et seuls ses intérêts servent à l'Ukraine."
    defenseurs: "Elles gardent la pression sur Moscou et un levier pour négocier la paix, sans le risque juridique et financier d'une saisie de l'argent russe."
    critiques: "Pour les uns, elles pèsent sur l'énergie et les entreprises sans arrêter la guerre ; pour les autres, elles laissent aux Européens la charge de financer l'Ukraine."
  - id: D
    libelle: Les durcir
    implique: "La France demande de nouvelles séries de sanctions, l'arrêt de tout achat d'énergie russe et l'utilisation de l'argent russe bloqué pour financer l'Ukraine."
    defenseurs: "Il faut frapper Moscou au portefeuille : ses ventes de gaz financent sa guerre, et c'est à la Russie, pas aux Européens, de payer pour l'Ukraine."
    critiques: "Saisir l'argent d'un État heurte, pour ses critiques, le droit international, expose les entreprises européennes à des représailles et peut renchérir l'énergie."
