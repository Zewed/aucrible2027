  arthaud: { option: A, source: "Public Sénat, 08/03/2022", statut: deduite }
# Le reportage vidéo : un récit court, tiré de l'étude docs/etudes/031-russie.md (chaque chiffre y a sa source
# numérotée). Le fil : des sanctions toujours plus nombreuses ; l'Europe achète beaucoup moins de gaz russe ;
# quatre choix possibles ; les deux camps s'opposent sur l'effet, le coût, l'argent bloqué et l'énergie.
reportage:
  # Écrit pour que tout le monde comprenne : des phrases complètes, des mots de tous les jours, le chiffre en preuve.
  accroche:
    # § 1.1, [1].
    etapes:
      - { quand: Février 2022, valeur: 1re série }
      - { quand: Juillet 2026, valeur: 21e série }
    chute: Près de 4 600 personnes et organisations sont aujourd'hui sanctionnées.
  # Pas de mécanisme : aucun rapport « X pour 1 » ne résume le sujet.
  ecart:
    # § 1.3 et 2b, [7].
    titre: Quelle part du gaz acheté par l'Europe vient de Russie ?
    etapes:
      - { quand: En 2021, valeur: 45 % }
      - { quand: En 2025, valeur: 12 % }
    chute: L'Union a décidé de s'en passer complètement d'ici fin 2027.
    source: "Toute l'Europe, 2026"
  leviers:
    # § 3 et 4 ; unanimité : [10].
    titre: "Face à la Russie, quatre choix"
    choix:
      - { texte: Lever, detail: "toutes les sanctions, et renouer avec Moscou" }
      - { texte: Alléger, detail: "garder celles qui visent des personnes et l'armement, lever les autres" }
      - { texte: Maintenir, detail: "les sanctions actuelles, avec l'argent russe toujours bloqué" }
      - { texte: Durcir, detail: "plus de sanctions, et l'argent russe bloqué utilisé pour l'Ukraine" }
    # Unanimité pour toute sanction, et donc pour sa prolongation (§ 2f, [10]) : un seul pays peut, en théorie, ne pas la prolonger.
    chute: Chaque série de sanctions et chaque prolongation exigent l'accord des 27.
    source: "Institut Delors, 2026"
  camps: { pour: POUR, contre: CONTRE, objet: des sanctions plus dures }
  # Relu une fois par deux relecteurs, l'un pour des sanctions plus dures, l'autre contre (notes 8,5 et 8). Le camp
  # CONTRE réunit ceux qui veulent maintenir et ceux qui veulent lever : chacune de ses réponses vaut pour les deux.
  questions:
    # § 2a, [4] [5].
    - question: Les sanctions affaiblissent-elles la Russie ?
      pour: { affirmation: "Oui, Moscou le reconnaît lui-même.", chiffre: "0,4 %", texte: "Le gouvernement russe prévoit 0,4 % de croissance en 2026, contre 1,3 % auparavant. Il en accuse notamment les sanctions.", source: "Gouvernement russe, 2026" }
      contre: { affirmation: "Pas son industrie de l'armement.", chiffre: "+3,6 %", texte: "En 2025, l'industrie russe de l'armement a grandi de 3,6 %, plus vite que l'économie du pays.", source: "DG Trésor, 2026" }
    # § 2c, [3].
    - question: Les sanctions coûtent-elles cher à la France ?
      pour: { affirmation: "Le prix pour moins dépendre de Moscou.", chiffre: "4 %", texte: "La Russie fournissait 15 % de l'énergie importée par la France en 2021, et 4 % en 2025.", source: "DG Trésor, 2026" }
      contre: { affirmation: "Oui, nos ventes en Russie ont chuté.", chiffre: "−71 %", texte: "Entre 2021 et 2025, les ventes de la France à la Russie ont baissé de 71 %.", source: "DG Trésor, 2026" }
    # § 1.2 et 2d, [2] [10] [28].
    - question: Faut-il prendre l'argent russe bloqué en Europe ?
      pour: { affirmation: "Oui, sinon c'est l'Europe qui s'endette.", chiffre: "90 milliards €", texte: "Faute d'accord sur l'argent russe, l'Union emprunte elle-même 90 milliards d'euros pour les prêter à l'Ukraine en 2026 et 2027.", source: "Toute l'Europe ; Parlement européen, 2026" }
      contre: { affirmation: "Non, ses intérêts aident déjà l'Ukraine.", chiffre: "50 milliards $", texte: "Les sept pays du G7 prêtent jusqu'à 50 milliards de dollars, remboursés par ces intérêts. Saisir l'argent serait, selon ses opposants, illégal.", source: "Institut Delors ; LCP, 2026" }
    # § 1.3, 1.4 et 2b, [3] [25]. La question de l'étude (§ 2b) : tout achat d'énergie, pas le seul gaz liquéfié déjà
    # interdit en 2027, sinon ceux qui veulent maintenir les sanctions répondraient « oui » avec le camp POUR.
    - question: Faut-il cesser tout achat d'énergie russe dès 2027 ?
      pour: { affirmation: "Oui, cet argent finance la guerre.", chiffre: "3,2 milliards €", texte: "En 2025, la France a acheté à la Russie pour 3,2 milliards d'euros de gaz.", source: "DG Trésor, 2026" }
      contre: { affirmation: "Pas encore, nous en avons besoin.", chiffre: "2e", texte: "En 2025, la Russie restait notre deuxième fournisseur de gaz. En 2026, la guerre en Iran a fait grimper les prix.", source: "DG Trésor ; Commission européenne, 2026" }
