  retailleau: { option: D, source: "Vote des députés Droite républicaine (LR), 12/03/2025", statut: deduite }
  # Débat à l'Assemblée nationale, 03/03/2025 : https://lcp.fr/actualites/situation-en-ukraine-et-securite-en-europe-que-retenir-du-debat-qui-a-eu-lieu-a-l
