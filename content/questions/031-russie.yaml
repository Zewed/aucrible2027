  # Euronews, 17/10/2026 : https://fr.euronews.com/2026/10/17/moins-de-fonds-pour-lukraine-et-budget-de-lue-en-baisse-que-changerait-une-victoire-de-le-
  le-pen: { option: A, source: "Euronews, 17/10/2026", statut: officielle }
  # Le Grand Continent, 06/10/2026 : https://legrandcontinent.eu/fr/2026/10/06/quelle-geopolitique-pour-la-primaire-socialiste/
  glucksmann: { option: D, source: "Le Grand Continent, 06/10/2026", statut: officielle }
