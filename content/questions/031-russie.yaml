# BROUILLON À VÉRIFIER : rédigé par IA le 27/10/2026 à partir de sources publiques.
# Chaque chiffre, chaque position et chaque note de plateau doit être vérifié par l'auteur avant toute mise en ligne.
# Étude des enjeux : docs/etudes/031-russie.md (tout ce qui suit y est sourcé).
numero: 31
date: 2026-09-26
theme: europe-international
question: "Faut-il durcir, maintenir ou lever les sanctions contre la Russie ?"
titreCourt: "Les sanctions contre la Russie"
video: { url: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/videos/031-russie-constat-EUF5NBURohgHqSYwZM3M9EBVvBisFa.mp4", duree: "4 min 01", ecrans: [0, 10.47, 22.34, 35.57, 49.54, 62.8, 75.34, 88.6, 100.47, 114.44, 127.67, 140.24, 152.1, 165.34, 178.6, 191.87, 205.8, 219.77, 233.74], images: "https://kfhyualtffrsrkll.public.blob.vercel-storage.com/ecrans/031-russie-constat-EUF5NBURohgHqSYwZM3M9EBVvBisFa/" }
contexte:
  - "Depuis l'invasion de l'Ukraine en 2022, l'Union européenne a décidé 21 séries de sanctions contre la Russie, après de premières mesures en 2014 ; chacune exige l'accord des 27."
  - "Environ 210 milliards d'euros de la banque centrale russe sont bloqués en Europe : leurs intérêts servent déjà à aider l'Ukraine, mais l'argent lui-même n'a pas été saisi."
  - "Les achats de gaz russe livré par bateau doivent cesser d'ici janvier 2027 ; en 2026, la guerre en Iran a fait monter le prix du gaz, et des discussions de paix doivent reprendre en novembre."
chiffres:
  - valeur: "21"
    unite: séries de sanctions
    legende: "décidées par l'Union européenne contre la Russie depuis 2022"
    source: { organisme: Toute l'Europe, document: les sanctions de l'UE contre la Russie, annee: 2026 }
  - valeur: "210"
    unite: milliards d'euros
    legende: "d'avoirs de la banque centrale russe gelés dans l'Union européenne"
    source: { organisme: Toute l'Europe, document: les avoirs russes gelés en Europe, annee: 2026 }
  - valeur: "3,2"
    unite: milliards d'euros
    legende: "de gaz russe achetés par la France en 2025"
    source: { organisme: DG Trésor, document: relations économiques France-Russie, annee: 2026 }
options:
  - id: A
    libelle: "Lever les sanctions"
    implique: "La France demande la fin des sanctions européennes, y compris sur l'énergie, et relance la coopération avec Moscou."
    defenseurs: "Les sanctions coûtent plus cher aux Européens qu'à la Russie, qui vend ailleurs, et la paix en Europe passe par un partenariat avec elle."
    critiques: "Les lever sans accord de paix rendrait à Moscou ses revenus européens et priverait l'Europe d'un levier pour négocier la paix."
    detail:
      chiffrage:
        texte: "Aucun chiffrage n'a été trouvé de ce que rapporterait une levée. En 2025, la France a vendu 1,89 milliard d'euros de biens à la Russie, 70,9 % de moins qu'en 2021."
        source: { organisme: "Direction générale du Trésor", annee: 2026 }
      defenseurs:
        - texte: "Les sanctions font plus de tort aux Européens qu'à la Russie, qui a trouvé d'autres clients."
        - texte: "Les sanctions n'empêchent pas l'effort de guerre : en 2025, l'industrie russe de l'armement a grandi de 3,6 %, plus vite que l'économie du pays."
          source: { organisme: "Direction générale du Trésor", annee: 2026 }
        - texte: "La paix en Europe passe par un partenariat avec la Russie, tant nos intérêts sont communs."
      critiques:
        - texte: "Même le plan américain de 2025 ne levait les sanctions que par étapes, et prévoyait de les rétablir en cas de nouvelle invasion."
        - texte: "Lever les sanctions rendrait l'Europe de nouveau dépendante : la Russie ne fournit plus que 4 % de l'énergie importée par la France, contre 15 % en 2021."
          source: { organisme: "Direction générale du Trésor", annee: 2026 }
        - texte: "Lever les sanctions rendrait à Moscou l'argent de sa banque centrale bloqué en Europe, dont les intérêts aident aujourd'hui l'Ukraine."
  - id: B
    libelle: "Garder les sanctions ciblées, lever les autres"
    implique: "On lève les sanctions sur l'énergie et le commerce, mais on garde celles qui visent des dirigeants, des proches du pouvoir et le matériel militaire."
    defenseurs: "On vise les responsables de la guerre sans faire payer aux ménages et aux entreprises la hausse de l'énergie et la perte de marchés."
    critiques: "Rouvrir le commerce de l'énergie rendrait à l'État russe des recettes qui, pour ses critiques, financent sa guerre."
    detail:
      chiffrage:
        texte: "Aucun chiffrage n'a été trouvé. En 2023, les produits sanctionnés pesaient environ 6,5 milliards d'euros d'importations, moins de 2 % de ce que la France achète."
        source: { organisme: "Observatoire français des conjonctures économiques", annee: 2023 }
      defenseurs:
        - texte: "Le gaz russe reste utile en pleine crise de l'énergie : en 2025, la Russie était encore le 2e fournisseur de gaz de la France."
          source: { organisme: "Direction générale du Trésor", annee: 2026 }
        - texte: "Les sanctions qui comptent visent les responsables : 1 569 acteurs de l'industrie militaire russe ont encore été ajoutés aux listes en octobre 2026."
          source: { organisme: "Toute l'Europe", annee: 2026 }
        - texte: "On peut faire pression sur Moscou sans prendre des sanctions qui se retournent contre la France."
      critiques:
        - texte: "L'énergie est ce qui rapporte le plus à Moscou : le gaz fait 77,5 % de ce que la France achète à la Russie."
          source: { organisme: "Direction générale du Trésor", annee: 2026 }
        - texte: "La France peut s'en passer : en 2024, 38 % de son gaz liquéfié venait des États-Unis et 17 % d'Algérie."
          source: { organisme: "Institute for Energy Economics and Financial Analysis", annee: 2025 }
        - texte: "Viser seulement des personnes ne suffit pas : pour affaiblir Moscou, il faut le toucher au portefeuille."
  - id: C
    libelle: "Maintenir les sanctions"
    implique: "Les sanctions actuelles restent en place jusqu'à un accord de paix ; l'argent russe reste bloqué et seuls ses intérêts servent à l'Ukraine."
    defenseurs: "Elles gardent la pression sur Moscou et un levier pour négocier la paix, sans le risque juridique et financier d'une saisie de l'argent russe."
    critiques: "Pour les uns, elles pèsent sur l'énergie et les entreprises sans arrêter la guerre ; pour les autres, elles laissent aux Européens la charge de financer l'Ukraine."
    detail:
      chiffrage:
        texte: "Maintenir les sanctions ne change rien au budget : près de 4 600 personnes et organisations restent sanctionnées, et l'argent russe reste bloqué."
        source: { organisme: "Toute l'Europe", annee: 2026 }
      defenseurs:
        - texte: "Les sanctions restent un levier pour négocier : leur levée peut s'échanger contre un accord de paix durable."
        - texte: "Les sanctions pèsent sur la Russie : son gouvernement ne prévoit plus que 0,4 % de croissance en 2026, et en accuse notamment les sanctions."
          source: { organisme: "Gouvernement russe", annee: 2026 }
        - texte: "Les sanctions tiennent dans la durée : l'Europe a adopté 21 séries de sanctions depuis 2022, chacune à l'unanimité des 27."
          source: { organisme: "Toute l'Europe", annee: 2026 }
      critiques:
        - texte: "Les sanctions pèsent sur des entreprises françaises sans avoir arrêté la guerre : une cinquantaine sont directement touchées."
          source: { organisme: "Observatoire français des conjonctures économiques", annee: 2023 }
        - texte: "Les sanctions laissent aux Européens la charge de l'Ukraine : faute d'accord sur l'argent russe, l'Union emprunte elle-même 90 milliards d'euros pour 2026 et 2027."
          source: { organisme: "Toute l'Europe", annee: 2026 }
        - texte: "Les sanctions laissent des brèches : des produits raffinés à partir de pétrole russe arrivent encore en Europe par la Turquie et l'Inde."
  - id: D
    libelle: "Durcir les sanctions"
    implique: "La France demande de nouvelles séries de sanctions, l'arrêt de tout achat d'énergie russe et l'utilisation de l'argent russe bloqué pour financer l'Ukraine."
    defenseurs: "Il faut frapper Moscou au portefeuille : ses ventes de gaz financent sa guerre, et c'est à la Russie, pas aux Européens, de payer pour l'Ukraine."
    critiques: "Saisir l'argent d'un État heurte, pour ses critiques, le droit international, expose les entreprises européennes à des représailles et peut renchérir l'énergie."
    detail:
      chiffrage:
        texte: "Aucun chiffrage n'a été trouvé du coût de nouvelles sanctions. Pour l'argent russe bloqué, la Commission proposait en 2025 de prêter à l'Ukraine environ 165 milliards d'euros adossés à ces fonds."
        source: { organisme: "Toute l'Europe", annee: 2026 }
      defenseurs:
        - texte: "La Russie finance sa guerre avec ses ventes de gaz : en 2025, la France a encore acheté pour 3,17 milliards d'euros de gaz à la Russie."
          source: { organisme: "Direction générale du Trésor", annee: 2026 }
        - texte: "C'est à la Russie de réparer : plus de 86 000 réclamations ukrainiennes ont déjà été déposées auprès de la commission créée par le Conseil de l'Europe."
          source: { organisme: "Institut Jacques Delors", annee: 2026 }
        - texte: "Geler l'argent russe sans s'en servir laisse l'Europe impuissante : seuls ses intérêts aident aujourd'hui l'Ukraine."
      critiques:
        - texte: "Saisir l'argent d'une banque centrale n'a pas de base juridique sûre, faute de décision d'un tribunal international sur ce que doit la Russie."
        - texte: "Une saisie exposerait les Européens à des représailles : Euroclear fait déjà l'objet de plus de 170 procès devant des tribunaux russes."
          source: { organisme: "Institut Jacques Delors", annee: 2026 }
        - texte: "Arrêter tout achat d'énergie russe en pleine crise ferait encore monter les prix : en octobre 2026, le gaz dépassait 93 euros le mégawattheure en Europe, au plus haut depuis 2022."
          source: { organisme: "Trading Economics", annee: 2026 }
