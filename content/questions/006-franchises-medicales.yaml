  - titre: LCP, Franchises médicales, ce qui va changer, 24/07/2026
    url: https://lcp.fr/actualites/franchises-medicales-ce-qui-va-changer-apres-les-annonces-du-gouvernement-439936
# Les deux côtés de l'image 5 du carrousel, chacun avec l'argument que ses défenseurs signeraient (repris des options).
cotes:
