    argument: "Ceux qui en paient le plus sont les plus malades : une hausse peut conduire à renoncer à des soins."
  - titre: "Pour les augmenter"
    argument: "L'assurance maladie doit maîtriser ses dépenses, pour continuer à investir dans l'hôpital."
# Les deux choix de l'autocollant « Et toi ? » de la story.
story:
  - choix: "Ne pas les augmenter"
    precision: "ou les supprimer"
  - choix: "Les augmenter"
    precision: "ou les relever"
positions:
  # https://www.pcf74.fr/2026/07/franchises-medicales-le-gouvernement-choisit-de-faire-payer-les-malades-fabien-roussel.html (« supprimer les franchises médicales et les participations forfaitaires », 23/07/2026)
  roussel: { option: A, source: "Communiqué du PCF signé de Fabien Roussel, 23/07/2026", statut: officielle }
  # https://votons-2027.fr/candidats/melenchon/programme/sante (reprend melenchon2027.fr/programme2025/livre/, mesures 3 et 5 ; page d'origine non lue)
  melenchon: { option: A, source: "L'Avenir en commun, édition 2025, mesures 3 et 5", statut: officielle }
  # https://www.publicsenat.fr/actualites/sante/hausse-des-franchises-medicales-la-methode-bayrou-heurte-egalement-au-senat (« son refus de voir ces franchises médicales relevées », 05/09/2025) ; https://nosparlementaires.fr/actualites/franchises-medicales-decret-plafond-vote-assemblee (vote du groupe DR, 08/11/2025)
